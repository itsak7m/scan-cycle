/* ==== src/selftest/30-ui-ladder.js ==== */
/* Headless tests for the ladder editor model (the DOM exists in the test page). */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const T = SC.test;

  function mk(level) {
    const container = document.createElement('div');
    const host = { program: { v: 1, rungs: [] }, userTags: [], last: null, baseTags: () => SC.levelTags(level), palette: () => level.palette || null,
      setProgram(p, u) { host.last = { p, u }; } };
    const ed = SC.ui.Ladder(container, host);
    return { ed, host, container };
  }

  T.suite('ladder editor: build a seal-in with the editor API', (t) => {
    const level = { tags: ['Start_PB', 'Stop_PB', 'EStop_OK', 'Conveyor_Motor'], palette: ['NO', 'NC', 'OUT', 'BRANCH'], plant: { bottlesPerMin: 20 } };
    const { ed, host, container } = mk(level);
    t.eq(ed.program.rungs.length, 1, 'starts with one empty rung');
    ed.ops.place(0, 0, 0, { t: 'NO', a: 'Start_PB' });
    ed.ops.makeBranch(0, 0, 0);
    t.eq([ed.program.rungs[0].rows, ed.program.rungs[0].vb.length], [2, 2], 'branch around a cell adds a row and two bars');
    const r = SC.ui.resolveTag('Run', 'bitw', ed.ctx);
    t.ok(r.ok && r.created && r.created.addr === 'M0.0', 'a new name becomes memory bit M0.0', JSON.stringify(r));
    ed.ops.place(0, 1, 0, { t: 'NO', a: 'Run' }, [r.created]);
    ed.ops.place(0, 0, 1, { t: 'NO', a: 'Stop_PB' });
    ed.ops.place(0, 0, 2, { t: 'NO', a: 'EStop_OK' });
    ed.ops.place(0, 0, 3, { t: 'OUT', a: 'Run' });
    ed.ops.addRung(1);
    ed.ops.place(1, 0, 0, { t: 'NO', a: 'Run' });
    ed.ops.place(1, 0, 1, { t: 'OUT', a: 'Conveyor_Motor' });
    const chk = ed.check();
    t.eq(chk.compiled.errors.length, 0, 'compiles without errors');
    t.eq(chk.lint.map((x) => x.id), [], 'no lint warnings');
    t.ok(host.last && host.last.u.length === 1, 'host is notified with the user tag table');
    // run it
    const res = SC.scenario.runScenario(Object.assign({}, level, { tags: level.tags.concat(ed.userTags) }), ed.program, {
      id: 'seal', seed: 1, durationMs: 6000,
      events: [{ t: 500, press: 'Start_PB', ms: 300 }, { t: 3000, press: 'Stop_PB', ms: 300 }],
      asserts: [
        { t: 400, expect: { Conveyor_Motor: false } },
        { t: 1500, expect: { Conveyor_Motor: true } },
        { t: 2900, expect: { Conveyor_Motor: true } },
        { t: 3500, expect: { Conveyor_Motor: false } },
        { t: 5500, expect: { Conveyor_Motor: false } },
      ],
    });
    t.ok(res.pass, 'the editor-built program passes a start/stop scenario', JSON.stringify(res.failures[0] || ''));
    // DOM sanity
    t.eq(container.querySelectorAll('.rung').length, 2, 'two rungs rendered');
    t.ok(container.querySelectorAll('.cell.filled').length === 7, 'seven filled cells rendered', String(container.querySelectorAll('.cell.filled').length));
    // undo / redo
    ed.doUndo(); ed.doUndo();
    t.eq(ed.program.rungs[1] ? ed.program.rungs[1].els.length : 0, 0, 'undo removes the last edits');
    ed.doRedo();
    t.eq(ed.program.rungs[1].els.length, 1, 'redo brings one back');
    // palette enforcement
    ed.ops.place(0, 0, 4, { t: 'TON', i: 'DB_X', pt: 'T#1s' });
    t.ok(ed.check().compiled.errors.some((e) => e.code === 'not_allowed'), 'an element outside the level palette is an error');
  });

  T.suite('ladder editor: moves, limits, tags', (t) => {
    const level = { tags: ['Start_PB', 'Conveyor_Motor'], palette: null };
    const { ed } = mk(level);
    ed.ops.place(0, 0, 0, { t: 'NO', a: 'Start_PB' });
    ed.ops.moveEl(0, { r: 0, c: 0 }, { r: 0, c: 3 });
    t.eq(ed.program.rungs[0].els[0].c, 3, 'move an element to another cell');
    ed.ops.place(0, 0, 4, { t: 'OUT', a: 'Conveyor_Motor' });
    ed.ops.moveEl(0, { r: 0, c: 3 }, { r: 0, c: 4 });
    t.eq(ed.program.rungs[0].els.length, 2, 'cannot drop on an occupied cell');
    ed.ops.removeEl(0, 0, 3);
    t.eq(ed.program.rungs[0].els.length, 1, 'delete');
    for (let i = 0; i < 6; i++) ed.ops.toggleBar(0, 1, i);
    t.ok(ed.program.rungs[0].rows <= 4, 'a rung never grows past 4 rows');
    // grid grows with the program
    ed.ops.place(0, 0, 9, { t: 'NO', a: 'Start_PB' });
    t.ok(ed.program.rungs[0].cols >= 11, 'columns grow on demand');
    // tag tools
    let r = SC.ui.resolveTag('2bad', 'bit', ed.ctx);
    t.ok(!r.ok, 'a name starting with a digit is rejected');
    r = SC.ui.resolveTag('Start_PB', 'bitw', ed.ctx);
    t.ok(!r.ok, 'cannot write to an input');
    r = SC.ui.resolveTag('M0.4', 'edge', ed.ctx);
    t.ok(r.ok, 'a raw M address is accepted');
    r = SC.ui.resolveTag('I0.0', 'edge', ed.ctx);
    t.ok(!r.ok, 'edge memory must be M');
    t.eq(SC.ui.normTime('3s').value, 'T#3s', 'time typed as 3s becomes T#3s');
    t.eq(SC.ui.normTime('3').ask, '3', 'a bare 3 asks seconds or milliseconds');
    t.ok(SC.ui.normTime('abc').error, 'garbage time is an error');
    t.eq(SC.ui.normTime('t#500MS').value, 'T#500ms', 'literal is normalised');
    // rename a user tag updates the program
    const c = SC.ui.resolveTag('Seal', 'bitw', ed.ctx);
    ed.ops.place(0, 0, 5, { t: 'OUT', a: 'Seal' }, [c.created]);
    ed.renameTag('Seal', 'Latch');
    t.ok(ed.program.rungs[0].els.some((e) => e.a === 'Latch') && !ed.program.rungs[0].els.some((e) => e.a === 'Seal'), 'rename tag updates every reference');
    t.eq(ed.deleteTag('Latch'), false, 'a tag in use cannot be deleted');
  });
})();

</script>
<script>
/* ==== src/selftest/40-levels.js ==== */
/* Level self-test: structure of every level, then (selftest.html only) every reference solution against every
 * scenario + hidden variants, and every documented wrong solution must FAIL with the right diagnostic. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const T = SC.test;
  const lines = [];

  T.summary = () => lines.join('\n');

  T.suite('levels: structure', (t) => {
    const levels = SC.levels.loadAll();
    const gmap = SC.levels.glossaryMap(levels);
    t.ok(true, `${levels.length} level(s) embedded`);
    const only = new URLSearchParams(location.search).get('only') || '';
    for (const L of levels) {
      if (only && L.id.indexOf(only) < 0 && only !== 'levels') continue;
      const bad = SC.levels.validate(L, gmap);
      t.ok(bad.length === 0, `${L.id} structure`, bad.join('; '));
    }
  });

  const fx = SC.levels.loadFixtures();
  T.suite('levels: reference solutions & wrong solutions', (t) => {
    const levels = SC.levels.loadAll();
    if (!fx) { t.ok(true, 'fixtures are only embedded in selftest.html (skipped here)'); return; }
    const only = new URLSearchParams(location.search).get('only') || '';
    for (const L of levels) {
      if (only && L.id.indexOf(only) < 0 && only !== 'levels') continue;
      const t0 = Date.now();
      const sol = fx.solutions[L.id];
      if (!sol) { t.ok(false, `${L.id} has a reference solution`, `levels/solutions/${L.id}.json is missing`); continue; }
      const ev = SC.fixtures.evaluate(L, sol, { stopAtFirst: false });
      const fails = ev.run.results.filter((r) => !r.pass);
      const first = fails[0];
      t.ok(ev.pass, `${L.id} reference solution passes all ${ev.run.results.length} scenarios (visible + hidden)`,
        first ? `${first.scenario.id}: ${(first.firstFailure.msg.en)} @ ${first.firstFailure.t} ms, expected ${JSON.stringify(first.firstFailure.expected)} got ${JSON.stringify(first.firstFailure.actual)}` : '');
      const cmp = SC.compile(ev.program, { tags: SC.mergeTags(SC.levelTags(L), ev.userTags), palette: L.palette });
      t.ok(cmp.ok, `${L.id} reference solution compiles inside the level palette`, JSON.stringify(cmp.errors.slice(0, 2)));
      const warn = SC.lint(ev.program, SC.mergeTags(SC.levelTags(L), ev.userTags));
      t.ok(warn.length === 0, `${L.id} reference solution has no lint warnings (two-star possible)`, warn.map((w) => w.id).join(','));
      const lean = (L.badges || []).find((b) => b.id === 'lean');
      if (lean) t.ok(ev.program.rungs.length <= lean.maxRungs, `${L.id} reference meets the "lean" badge (${lean.maxRungs} rungs)`, `has ${ev.program.rungs.length}`);

      const wrongs = Object.keys(fx.wrong).filter((k) => fx.wrong[k].level === L.id || k.indexOf(L.id + '-') === 0);
      t.ok(wrongs.length >= 3, `${L.id} has at least 3 documented wrong solutions`, `has ${wrongs.length}`);
      let ok = 0;
      for (const k of wrongs) {
        const w = fx.wrong[k];
        const e2 = SC.fixtures.evaluate(L, w, { stopAtFirst: true });
        const ff = e2.run.firstFail ? e2.run.firstFail.firstFailure : null;
        const diags = SC.diag.run(L, e2.program, { failure: ff, tags: SC.mergeTags(SC.levelTags(L), e2.userTags) });
        const ids = diags.map((d) => d.id);
        const good = !e2.pass && (!w.diag || ids.indexOf(w.diag) >= 0);
        if (good) ok++;
        t.ok(!e2.pass, `${k} fails the FAT (it is a wrong solution)`, w.note || '');
        if (w.diag) t.ok(ids.indexOf(w.diag) >= 0, `${k} is diagnosed as "${w.diag}"`, `got [${ids.join(', ')}]`);
      }
      lines.push(`${L.id}: ${ev.run.results.length} scenarios pass, wrong solutions ${ok}/${wrongs.length} fail as expected  (${Date.now() - t0} ms)`);
    }
  });
})();

</script>
<script>
/* ==== src/selftest/50-ui-share.js ==== */
/* Share link encoding: round trip + size budget. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const T = SC.test;

  T.suite('share: link encoding', (t) => {
    const lines = [
      '[Reset_PB | Ready] EStop_OK Door_Closed (Ready)',
      '[Start_PB | Conveyor_Motor] Stop_PB Ready (Conveyor_Motor)',
      'Conveyor_Motor PE_Fill /Filled Fill_Valve_Req',
      'Fill_Valve_Req TON(DB_Fill,T#3s) (S:Filled)',
      '/PE_Fill (R:Filled)',
      'PE_Exit POS(Edge_1) CTU(DB_Batch,12,Reset_PB) (Batch_Lamp)',
      'Level_OK /Level_OK PE_Reject POS(Edge_2) TP(DB_Rej,T#500ms) (Reject_Pusher)',
      '[Start_PB | Run] Stop_PB (Run)',
      'Run CMP(>=,Step,2) MOVE(3,Step)',
      'Run Tank_LSLL (Alarm_Lamp)',
    ];
    const prog = SC.dsl.parseProgram(lines);
    const tags = [{ name: 'Ready', addr: 'M0.0' }, { name: 'Filled', addr: 'M0.1' }, { name: 'Fill_Valve_Req', addr: 'M0.2' }, { name: 'Run', addr: 'M0.3' }];
    const code = SC.ui.share.encode('L03', prog, tags, true);
    t.ok(code[0] === 'B', 'offline format uses the B (base64url) prefix');
    const dec = SC.ui.share.decode(code);
    t.ok(!dec.error, 'decodes without error', JSON.stringify(dec.error));
    t.eq(dec.level, 'L03', 'level id survives');
    t.eq(dec.program.rungs.map((r) => r.els.length), prog.rungs.map((r) => r.els.length), 'same number of elements per rung');
    t.eq(JSON.stringify(dec.program.rungs.map((r) => r.els.map((e) => [e.r, e.c, e.t, e.a, e.i, e.pt]))), JSON.stringify(prog.rungs.map((r) => r.els.map((e) => [e.r, e.c, e.t, e.a, e.i, e.pt]))), 'element positions and parameters survive');
    t.eq(JSON.stringify(dec.program.rungs[1].vb), JSON.stringify(prog.rungs[1].vb), 'branch bars survive');
    const url = 'https://itsak7m.github.io/scan-cycle/#p=' + code;
    t.ok(url.length < 2000, 'a 10-rung program fits in a 2000 character URL even without LZ-string', 'length ' + url.length);
    t.ok(SC.ui.share.decode('Zgarbage').error, 'garbage is rejected');
    t.ok(SC.ui.share.decode('B' + 'not valid base64 !!').error, 'broken base64 is rejected');
    t.ok(SC.ui.share.decode('B' + btoa('{"l":"L01","r":"x"}').replace(/=/g, '')).error, 'wrong shape is rejected');
    const evil = SC.ui.share.decode('B' + btoa(JSON.stringify({ l: 'L01', r: [{ e: [[0, 0, 'EVAL', 'x']] }] })).replace(/=/g, ''));
    t.ok(evil.error, 'unknown instruction types are rejected');
  });

  T.suite('progress: export / import validation', (t) => {
    const U = SC.ui;
    t.ok(!U.validateImport(null), 'null is not a save');
    t.ok(!U.validateImport({ v: 2, levels: {} }), 'wrong version is rejected');
    t.ok(!U.validateImport({ v: 1, levels: { x: {} } }), 'bad level id is rejected');
    t.ok(!U.validateImport({ v: 1, levels: { L01: { program: { rungs: 5 } } } }), 'bad program shape is rejected');
    t.ok(U.validateImport({ v: 1, levels: { L01: { stars: 2, program: { rungs: [] } } } }), 'a valid save is accepted');
  });
})();

</script>
<script>
/* ==== src/app.js ==== */
/* Boot. ?selftest (or selftest.html) runs the in-browser test suites. */
(function () {
  'use strict';
  const SC = globalThis.SC;

  function boot() {
    const q = new URLSearchParams(location.search);
    const auto = document.body.getAttribute('data-autotest') === '1';
    if (q.has('selftest') || auto) {
      const only = q.get('only') || '';
      const res = SC.test.runAll(only);
      let summary = '';
      if (SC.test.summary) summary = SC.test.summary();
      SC.test.render(res, summary);
      return;
    }
    if (SC.ui && SC.ui.start) { SC.ui.start(); return; }
    document.getElementById('app').innerHTML = '<main class="stub"><h1>Scan Cycle</h1><p>Engine loaded. Game UI coming soon — open <code>?selftest</code> to run the tests.</p></main>';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
