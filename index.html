      const li = h('li', { dataset: { id: s.id } }, h('span', { class: 'fl-ic', 'aria-hidden': 'true' }, '○'), h('span', { class: 'fl-t', lang: U.lang }, U.lang === 'ar' ? h('span', { lang: 'ar', dir: 'rtl', html: U.arHtml(s.title.ar) }) : s.title.en), h('span', { class: 'fl-s sr-only' }, ''));
      list.append(li); items[s.id] = li;
    });
    const hid = h('li', { class: 'fl-hidden' }, h('span', { class: 'fl-ic', 'aria-hidden': 'true' }, '○'), h('span', null, `${L.hidden.count} ` + tr('hidden variants', 'نسخ مخفية') + ' — ' + tr('random timing and seeds', 'توقيت وبذور عشوائية')));
    list.append(hid);
    const runBtn = h('button', { type: 'button', class: 'btn primary fat-btn', onclick: () => api.runFat() }, '▶ ' + tr('Run FAT', 'شغّل فحص FAT'));
    const status = h('p', { class: 'small', role: 'status', 'aria-live': 'polite' });
    card.append(runBtn, status, list);

    // hints
    const hbox = h('div', { class: 'hints' });
    const hshow = h('div', { class: 'hint-show' });
    const hbtns = [0, 1, 2].map((i) => h('button', { type: 'button', class: 'btn small', onclick: () => showHint(i) }, tr('Hint ', 'تلميح ') + (i + 1)));
    function showHint(i) {
      const lv = U.lv(L.id);
      if (i === 2 && lv.fails < 2) { U.toast(tr('Hint 3 unlocks after two failed FAT runs.', 'التلميح 3 بينفتح بعد محاولتين فاشلتين.')); return; }
      const hh = L.hints[i];
      lv.hint = Math.max(lv.hint, i + 1);
      if (i === 2) lv.hint3 = true;
      U.save();
      hshow.innerHTML = '';
      hshow.append(h('p', null, h('b', null, tr('Hint ', 'تلميح ') + (i + 1) + ': '), h('span', { lang: 'en' }, hh.en), h('br'), h('span', { lang: 'ar', dir: 'rtl', html: U.arHtml(hh.ar) })));
      if (hh.lines) { const pr = SC.dsl.parseProgram(hh.lines); pr.rungs.forEach((rg) => hshow.append(U.staticRung(rg, (n) => n, { title: tr('Partial rung', 'rung جزئي') }))); }
      refreshHints();
    }
    function refreshHints() {
      const lv = U.lv(L.id);
      hbtns[2].disabled = lv.fails < 2;
      hbtns[2].title = lv.fails < 2 ? tr('Unlocks after two failed FAT runs', 'بينفتح بعد محاولتين فاشلتين') : '';
      hbtns.forEach((b, i) => { b.classList.toggle('used', lv.hint > i); });
      if (lv.hint3) hint3Note.hidden = false;
    }
    const hint3Note = h('p', { class: 'small muted', hidden: true }, tr('Hint 3 used: the second star is no longer possible on this level.', 'استخدمت التلميح 3: النجمة الثانية ما عاد ممكنة بهالمستوى.'));
    hbox.append(h('h4', null, U.tEl('hints')), h('div', { class: 'hint-btns' }, hbtns), hshow, hint3Note);
    card.append(hbox);

    // glossary chips
    const gl = h('div', { class: 'gl' }, h('h4', null, tr('Terms in this level', 'مصطلحات هالمستوى')));
    const chips = h('div', { class: 'chips' });
    L.glossary.forEach((id) => { const d = U.glossary.get(id); if (d) chips.append(U.glossary.termBtn(id, d.en.replace(/\s*\(.*?\)\s*/g, ' ').trim())); });
    gl.append(chips);
    card.append(gl);

    // stars
    const starBox = h('div', { class: 'starbox' });
    card.append(starBox);
    function refreshStars() {
      const lv = U.lv(L.id);
      starBox.innerHTML = '';
      const lean = (L.badges || []).find((b) => b.id === 'lean');
      starBox.append(h('p', null, h('b', { class: 'stars', 'aria-label': lv.stars + ' of 3 stars' }, stars(lv.stars)), ' ',
        h('span', { class: 'small muted' }, tr('★ all tests pass · ★★ no lint warnings and no hint 3 · ★★★ + explain your logic', '★ كل الفحوصات نجحت · ★★ بدون تحذيرات وبدون تلميح 3 · ★★★ + اشرح منطقك'))));
      const b = [];
      if (lv.best && lean && lv.best.rungs <= lean.maxRungs) b.push('🏅 ' + tr('Lean: ≤ ' + lean.maxRungs + ' rungs', 'مختصر: ≤ ' + lean.maxRungs + ' rungs'));
      if (lv.best && lv.best.lint === 0) b.push('🏅 ' + tr('Clean: no lint warnings', 'نظيف: بدون تحذيرات'));
      if (lv.solved && !lv.hint) b.push('🏅 ' + tr('Solved without hints', 'محلول بدون تلميحات'));
      if (b.length) starBox.append(h('p', { class: 'small' }, b.join('  ')));
    }

    return {
      el: card, refreshHints, refreshStars,
      setStatus(t, cls) { status.textContent = t; status.className = 'small ' + (cls || ''); },
      setBusy(b) { runBtn.disabled = b; },
      mark(id, state) { // 'pass' | 'fail' | 'run' | null
        const li = id === '__hidden' ? hid : items[id];
        if (!li) return;
        const ic = li.querySelector('.fl-ic');
        ic.textContent = state === 'pass' ? '✔' : state === 'fail' ? '✖' : state === 'run' ? '…' : '○';
        li.classList.toggle('pass', state === 'pass'); li.classList.toggle('fail', state === 'fail');
        const sr = li.querySelector('.fl-s'); if (sr) sr.textContent = state === 'pass' ? 'passed' : state === 'fail' ? 'failed' : '';
      },
      resetMarks() { Object.keys(items).forEach((k) => this.mark(k, null)); this.mark('__hidden', null); },
    };
  }

  U.buildLevelPanels = function (L, api) {
    const wo = workOrderCard(L);
    const ds = datasheetCard(L);
    const fat = fatCard(L, api);
    fat.refreshHints(); fat.refreshStars();
    return { wo, ds, fat };
  };
  U.starsText = stars;
})();

<script>
/* ==== src/ui/fat.js ==== */
/* Running the FAT, awarding stars, and the "explain your logic in English" step. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const tr = (en, ar) => (U.lang === 'ar' ? ar : en);
  const tick = () => new Promise((r) => setTimeout(r, 0));

  const starsOf = (lv) => (lv.solved ? (lv.cleanPass ? (lv.explained ? 3 : 2) : 1) : 0);

  // env: {L, ladder, sim (live sim), panels, reportBox, replay(fn), onStars()}
  U.runFat = async function (env) {
    const { L, ladder, panels, reportBox } = env;
    const fat = panels.fat;
    if (env.sim().forcesActive()) {
      fat.setStatus('⚠ ' + tr('A level cannot pass while forces are active. Clear all forces first.', 'المستوى ما بينجح والـ forces شغّالة. امسحها أول.'), 'warn');
      const b = document.getElementById('forces-banner');
      if (b) { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 1200); }
      return;
    }
    const chk = ladder.check();
    if (!chk.compiled.ok) {
      fat.setStatus('✖ ' + tr(`Fix the ${chk.compiled.errors.length} compile error(s) first.`, `صلّح ${chk.compiled.errors.length} خطأ تجميع أول.`), 'warn');
      const e = chk.compiled.errors[0];
      if (e && e.rung >= 0) ladder.focus(e.rung, e.r || 0, e.c || 0);
      return;
    }
    fat.setBusy(true); fat.resetMarks(); reportBox.innerHTML = '';
    fat.setStatus(tr('Running tests…', 'عم بشغّل الفحوصات…'), '');
    const lv = U.lv(L.id);
    lv.attempts++;
    const program = ladder.program, userTags = ladder.userTags;
    const lvx = Object.assign({}, L, { tags: (L.tags || []).concat(userTags) });
    let firstFail = null, ran = 0, bpm = 0;
    for (const sc of L.scenarios) {
      fat.mark(sc.id, 'run'); await tick();
      const r = SC.scenario.runScenario(lvx, program, sc, { failFast: true, userTags });
      ran++;
      if (r.pass && r.metrics) bpm = Math.max(bpm, r.metrics.bottlesPerMin || 0);
      fat.mark(sc.id, r.pass ? 'pass' : 'fail');
      if (!r.pass && !firstFail) firstFail = { r, sc, hidden: false };
    }
    if (!firstFail) {
      fat.mark('__hidden', 'run'); await tick();
      for (let k = 0; k < L.hidden.count; k++) {
        const sc = SC.scenario.makeHidden(L, k);
        if (!sc) continue;
        const r = SC.scenario.runScenario(lvx, program, sc, { failFast: true, userTags });
        ran++;
        if (!r.pass) { firstFail = { r, sc, hidden: true }; break; }
        if (k % 2 === 1) await tick();
      }
      fat.mark('__hidden', firstFail ? 'fail' : 'pass');
    }
    fat.setBusy(false);
    if (firstFail) {
      lv.fails++; U.save();
      fat.setStatus('✖ ' + tr('Not yet. Read the report below, then fix your program.', 'لسا. اقرا التقرير تحت وبعدين صلّح برنامجك.'), 'warn');
      U.renderReport(reportBox, { level: L, program, userTags, scenario: firstFail.sc, failure: firstFail.r.firstFailure, hidden: firstFail.hidden, replay: env.replay });
      fat.refreshHints();
      return;
    }
    // pass
    const lint = SC.lint(program, SC.mergeTags(SC.levelTags(L), userTags));
    const wasSolved = lv.solved;
    lv.solved = true;
    const clean = lint.length === 0 && !lv.hint3;
    if (clean) lv.cleanPass = true;
    const rungs = program.rungs.filter((r) => r.els.length).length;
    if (!lv.best || rungs < lv.best.rungs || (lint.length === 0 && lv.best.lint !== 0)) lv.best = { rungs: Math.min(rungs, lv.best ? lv.best.rungs : rungs), lint: lint.length === 0 ? 0 : (lv.best ? lv.best.lint : lint.length) };
    if (bpm > 0 && lv.best) lv.best.bpm = Math.max(lv.best.bpm || 0, bpm);
    lv.program = program; lv.userTags = userTags;
    lv.stars = Math.max(lv.stars || 0, starsOf(lv));
    U.save(true);
    fat.setStatus('✔ ' + tr(`All ${ran} tests passed (visible + hidden).`, `نجحت كل الـ ${ran} فحوصات (الظاهرة والمخفية).`), 'ok');
    fat.refreshStars();
    if (env.onStars) env.onStars();
    reportBox.append(successCard(env, lint, !wasSolved));
  };

  function successCard(env, lint, firstTime) {
    const { L, ladder } = env;
    const lv = U.lv(L.id);
    const card = h('div', { class: 'report success' });
    card.append(h('h3', { class: 'ok' }, '✔ ' + tr('FAT passed', 'نجح فحص FAT'), ' ', h('span', { class: 'stars' }, U.starsText(lv.stars))));
    const msgs = [];
    if (lint.length) msgs.push(tr(`⚠ ${lint.length} lint warning(s) left — fix them for the second star.`, `⚠ بقي ${lint.length} تحذير — صلّحهم للنجمة الثانية.`));
    if (lv.hint3) msgs.push(tr('Hint 3 was used, so the second star is not possible on this level.', 'استخدمت التلميح 3 فما في نجمة ثانية بهالمستوى.'));
    msgs.forEach((m) => card.append(h('p', { class: 'warn small' }, m)));
    if (lv.solved && !lv.explained) card.append(explainPanel(env));
    else if (lv.explained) card.append(h('p', { class: 'ok' }, '✔ ' + tr('You explained your logic in English.', 'شرحت منطقك بالإنجليزي.')));
    const levels = U.state.levels;
    const idx = levels.findIndex((x) => x.id === L.id);
    const next = levels[idx + 1];
    card.append(h('div', { class: 'rp-btns' },
      next ? h('button', { type: 'button', class: 'btn primary', onclick: () => U.openLevel(next) }, tr('Next level', 'المستوى التالي') + ' → ' + next.id) : null,
      h('button', { type: 'button', class: 'btn', onclick: () => U.showMap() }, tr('Station map', 'خريطة المحطات'))));
    return card;
  }

  // ---------------------------------------------------------------- explain your logic
  function explainPanel(env) {
    const { L, ladder } = env;
    const lv = U.lv(L.id);
    const names = SC.levelTags(L).map((t) => t.name).concat(ladder.userTags.map((t) => t.name));
    const used = ladder.usedTags();
    const dropdown = L.order <= 6;
    const wrap = h('div', { class: 'explain' }, h('h4', null, '★★★ ' + tr('Explain your logic in English', 'اشرح منطقك بالإنجليزي')),
      h('p', { class: 'small muted' }, dropdown ? tr('Complete each sentence with the dropdown lists.', 'كمّل كل جملة بالقوائم.') : tr('Write one or two sentences for each prompt, in your own words.', 'اكتب جملة أو جملتين لكل سؤال بكلماتك.')));
    const parts = [];
    L.explain.frames.forEach((f, i) => {
      const box = h('div', { class: 'ex-frame' });
      const getters = [];
      if (dropdown) {
        const line = h('p', { class: 'ex-line', lang: 'en' });
        const re = /\{(\w+)\}/g;
        let last = 0, m;
        while ((m = re.exec(f.en))) {
          line.append(f.en.slice(last, m.index));
          const key = m[1];
          if (/^(time|count|value)$/.test(key)) {
            const inp = h('input', { type: 'text', class: 'ex-in', 'aria-label': key, placeholder: key, size: 8 });
            line.append(inp); getters.push(() => inp.value.trim());
          } else {
            const sel = h('select', { class: 'ex-in', 'aria-label': key }, h('option', { value: '' }, '— ' + key + ' —'), names.map((n) => h('option', { value: n }, n)));
            line.append(sel); getters.push(() => sel.value);
          }
          last = m.index + m[0].length;
        }
        line.append(f.en.slice(last));
        box.append(line);
        parts.push({
          compose: () => { let k = 0; return f.en.replace(/\{(\w+)\}/g, () => getters[k++]() || '…'); },
          ok: () => getters.every((g) => g()),
          tagsOk: () => { const picked = getters.map((g) => g()).filter((v) => names.indexOf(v) >= 0); return !picked.length || picked.filter((v) => used.has(v)).length * 2 >= picked.length; },
        });
      } else {
        const prompt = f.en.replace(/\{(\w+)\}/g, '…');
        const ta = h('textarea', { class: 'ex-ta', rows: 2, lang: 'en', 'aria-label': prompt, placeholder: prompt });
        box.append(h('p', { class: 'ex-line', lang: 'en' }, prompt), ta);
        parts.push({ ok: () => ta.value.trim().split(/\s+/).filter(Boolean).length >= 4, compose: () => ta.value.trim(), tagsOk: () => true });
      }
      wrap.append(box);
    });
    const msg = h('p', { class: 'small', role: 'status' });
    const speak = U.glossary.canSpeak ? h('button', { type: 'button', class: 'btn small ghost', onclick: () => U.glossary.speak(parts.map((p) => p.compose()).join('. ')) }, '🔊 ' + tr('Read it back', 'اسمعها')) : null;
    const done = h('button', { type: 'button', class: 'btn primary', onclick: () => {
      const bad = parts.findIndex((p) => !p.ok());
      if (bad >= 0) { msg.className = 'small warn'; msg.textContent = tr(`Sentence ${bad + 1} is not finished.`, `الجملة ${bad + 1} مش مكتملة.`); return; }
      const wrong = parts.findIndex((p) => !p.tagsOk());
      if (wrong >= 0) { msg.className = 'small warn'; msg.textContent = tr(`Sentence ${wrong + 1}: some chosen tags are not in your program. Check them.`, `الجملة ${wrong + 1}: بعض الـ tags اللي اخترتها مش ببرنامجك. راجعها.`); return; }
      parts.forEach((p, i) => { lv.explain[i] = p.compose(); });
      lv.explained = true;
      lv.stars = Math.max(lv.stars || 0, starsOf(lv));
      U.save(true);
      msg.className = 'small ok'; msg.textContent = '✔ ' + tr('Saved. Nice English!', 'انحفظت. إنجليزيتك حلوة!');
      done.disabled = true;
      if (env.onStars) env.onStars();
      const sb = document.querySelector('.starbox'); if (sb && env.panels) env.panels.fat.refreshStars();
    } }, tr('Done', 'تم'));
    wrap.append(h('div', { class: 'rp-btns' }, done, speak), msg);
    return wrap;
  }
})();

</script>
<script>
/* ==== src/ui/share.js ==== */
/* Share a program as a URL (#p=...) and as a 1200x627 share-card PNG. Solutions are never part of this: only the player's own program. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const tr = (en, ar) => (U.lang === 'ar' ? ar : en);

  // ---------------------------------------------------------------- compact encoding
  // element -> [r, c, type, ...params in DSL order]
  function pack(level, program, userTags) {
    const rungs = program.rungs.map((rg) => {
      const o = { e: rg.els.map((e) => [e.r, e.c, e.t].concat((SC.dsl.PARAMS[e.t] || []).map((k) => (e[k] === undefined ? '' : e[k])))) };
      if (rg.vb && rg.vb.length) o.v = rg.vb;
      if (rg.note) o.n = rg.note;
      return o;
    });
    const o = { l: level, r: rungs };
    if (userTags && userTags.length) o.u = userTags.map((t) => [t.name, t.addr]);
    return o;
  }

  function unpack(o) {
    if (!o || typeof o.l !== 'string' || !Array.isArray(o.r)) return null;
    const rungs = o.r.map((rg) => {
      const els = (rg.e || []).map((a) => {
        const el = { r: a[0], c: a[1], t: a[2] };
        const keys = SC.dsl.PARAMS[a[2]];
        if (!keys) throw new Error('bad element');
        keys.forEach((k, i) => { if (a[3 + i] !== '' && a[3 + i] !== undefined) el[k] = a[3 + i]; });
        return el;
      });
      const rung = { rows: 1, cols: 8, els, vb: rg.v || [] };
      if (rg.n) rung.note = rg.n;
      return U.ladderNorm(rung);
    });
    const userTags = (o.u || []).map((x) => ({ name: x[0], addr: x[1], type: /^MW|^QW|^IW/.test(x[1]) ? 'Int' : 'Bool', user: true, src: 'mem', desc: { en: '', ar: '' } }));
    return { level: o.l, program: { v: 1, rungs }, userTags };
  }

  const b64u = {
    enc(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    },
    dec(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
      const bin = atob(s); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    },
  };

  // format byte: 'L' = LZ-string, 'B' = base64url (works offline)
  function encode(level, program, userTags, forceB64) {
    const json = JSON.stringify(pack(level, program, userTags));
    if (!forceB64 && globalThis.LZString) return 'L' + globalThis.LZString.compressToEncodedURIComponent(json);
    return 'B' + b64u.enc(json);
  }
  function decode(code) {
    try {
      const f = code[0], body = code.slice(1);
      let json;
      if (f === 'L') { if (!globalThis.LZString) return { error: 'needs-lz' }; json = globalThis.LZString.decompressFromEncodedURIComponent(body); }
      else if (f === 'B') json = b64u.dec(body);
      else return { error: 'format' };
      if (!json) return { error: 'empty' };
      const r = unpack(JSON.parse(json));
      if (!r) return { error: 'shape' };
      // validate: compiles structurally (unknown tags are fine, they come from user tags)
      for (const rg of r.program.rungs) for (const e of rg.els) if (SC.compile.ELEMENTS.indexOf(e.t) < 0) return { error: 'element' };
      return r;
    } catch (e) { return { error: 'parse' }; }
  }
  U.share = { pack, unpack, encode, decode, MAX_URL: 2000 };

  U.shareUrl = function (levelId, program, userTags, forceB64) {
    const base = location.href.split('#')[0].split('?')[0];
    return base + '#p=' + encode(levelId, program, userTags, forceB64);
  };

  // read #p= on load; returns {level, program, userTags} or null
  U.readShareHash = function () {
    const m = /^#p=(.+)$/.exec(location.hash);
    if (!m) return null;
    const r = decode(m[1]);
    return r && !r.error ? r : r;
  };

  // ---------------------------------------------------------------- share card
  function ladderThumb(c, program, x0, y0, w, hMax) {
    const rungs = program.rungs.filter((r) => r.els.length).slice(0, 6);
    if (!rungs.length) return;
    const rowH = Math.min(46, hMax / Math.max(1, rungs.reduce((n, r) => n + r.rows, 0) + rungs.length * 0.3));
    let y = y0;
    const colW = Math.min(52, (w - 20) / 10);
    c.lineWidth = 2;
    for (const rg of rungs) {
      const hgt = rg.rows * rowH;
      c.strokeStyle = '#14262D'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(x0, y); c.lineTo(x0, y + hgt); c.moveTo(x0 + w, y); c.lineTo(x0 + w, y + hgt); c.stroke();
      c.lineWidth = 1.5;
      for (let r = 0; r < rg.rows; r++) {
        const yy = y + r * rowH + rowH / 2;
        c.strokeStyle = '#5E7279';
        c.beginPath(); c.moveTo(x0, yy); c.lineTo(x0 + (r === 0 ? w : 0), yy); c.stroke();
      }
      for (const e of rg.els) {
        const cx = x0 + 14 + e.c * colW + colW / 2, cy = y + e.r * rowH + rowH / 2;
        c.strokeStyle = '#14262D'; c.fillStyle = '#14262D'; c.lineWidth = 2;
        if (e.t === 'NO' || e.t === 'NC' || e.t === 'POS' || e.t === 'NEG') {
          c.beginPath(); c.moveTo(cx - 6, cy - 9); c.lineTo(cx - 6, cy + 9); c.moveTo(cx + 6, cy - 9); c.lineTo(cx + 6, cy + 9); if (e.t === 'NC') { c.moveTo(cx - 9, cy + 10); c.lineTo(cx + 9, cy - 10); } c.stroke();
        } else if (e.t === 'OUT' || e.t === 'SET' || e.t === 'RST') {
          c.beginPath(); c.arc(cx - 10, cy, 10, -1.2, 1.2); c.moveTo(cx + 10 + 4, cy - 9); c.arc(cx + 10, cy, 10, 3.14 - 1.2, 3.14 + 1.2, false); c.stroke();
          if (e.t !== 'OUT') { c.font = '700 12px monospace'; c.textAlign = 'center'; c.fillText(e.t === 'SET' ? 'S' : 'R', cx, cy + 4); }
        } else {
          c.fillStyle = '#F7F8F8'; c.fillRect(cx - colW / 2 + 3, cy - rowH / 2 + 4, colW - 6, rowH - 8);
          c.strokeRect(cx - colW / 2 + 3, cy - rowH / 2 + 4, colW - 6, rowH - 8);
          c.fillStyle = '#14262D'; c.font = '700 11px monospace'; c.textAlign = 'center'; c.fillText(e.t, cx, cy + 4);
        }
      }
      for (const [b, g] of rg.vb || []) { c.strokeStyle = '#5E7279'; c.lineWidth = 2; const bx = x0 + 14 + b * colW; c.beginPath(); c.moveTo(bx, y + g * rowH + rowH / 2); c.lineTo(bx, y + (g + 1) * rowH + rowH / 2); c.stroke(); }
      y += hgt + rowH * 0.3;
    }
  }

  U.drawShareCard = function (canvas, L, lv, program) {
    const W = 1200, H = 627;
    canvas.width = W; canvas.height = H;
    const c = canvas.getContext('2d');
    c.fillStyle = '#E9ECEC'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#F7F8F8'; c.fillRect(30, 30, W - 60, H - 60);
    c.strokeStyle = '#C6D0D2'; c.lineWidth = 2; c.strokeRect(30, 30, W - 60, H - 60);
    c.fillStyle = '#0B6E78'; c.fillRect(30, 30, 14, H - 60);
    c.fillStyle = '#14262D'; c.textAlign = 'left';
    c.font = '700 54px system-ui, "Segoe UI", sans-serif'; c.fillText('Scan Cycle', 76, 110);
    c.font = '500 24px system-ui, sans-serif'; c.fillStyle = '#5E7279'; c.fillText('Real PLC ladder logic on a bottling line', 76, 148);
    c.fillStyle = '#14262D'; c.font = '700 40px system-ui, sans-serif'; c.fillText(`${L.id} · ${L.title.en}`, 76, 230);
    c.direction = 'rtl'; c.textAlign = 'right'; c.font = '600 40px "IBM Plex Sans Arabic", "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif';
    c.fillText(L.title.ar, W - 76, 290); c.direction = 'ltr'; c.textAlign = 'left';
    const n = lv ? lv.stars : 0;
    c.font = '700 72px system-ui, sans-serif'; c.fillStyle = '#9A6B12'; c.fillText('★'.repeat(n) + '☆'.repeat(3 - n), 76, 380);
    c.font = '600 28px system-ui, sans-serif'; c.fillStyle = '#14262D';
    const rungs = program.rungs.filter((r) => r.els.length).length;
    const bpm = lv && lv.best && lv.best.bpm ? lv.best.bpm.toFixed(1) : '—';
    c.fillText(`Bottles/min: ${bpm}`, 76, 450);
    c.fillText(`Rungs: ${rungs}`, 76, 494);
    c.font = '500 22px system-ui, sans-serif'; c.fillStyle = '#5E7279';
    c.fillText('Verified by hidden FAT scenarios — my logic, my test log.', 76, 560);
    ladderThumb(c, program, 560, 330, 560, 230);
    c.fillStyle = '#5E7279'; c.font = '500 18px system-ui, sans-serif'; c.textAlign = 'right';
    c.fillText('itsak7m.github.io/scan-cycle', W - 60, H - 48);
  };

  // ---------------------------------------------------------------- share dialog
  U.openShare = function (L, program, userTags) {
    const lv = L.sandbox ? { stars: 0 } : U.lv(L.id);
    const url = U.shareUrl(L.id, program, userTags, !globalThis.LZString);
    const tooLong = url.length > U.share.MAX_URL;
    const json = JSON.stringify({ level: L.id, program, userTags });
    const canvas = h('canvas', { class: 'share-canvas', width: 1200, height: 627, 'aria-label': 'Share card preview' });
    U.drawShareCard(canvas, L, lv, program);
    const urlBox = h('input', { type: 'text', readonly: true, value: tooLong ? '' : url, 'aria-label': 'Share link' });
    const copy = (text, msg) => { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => U.toast(msg), () => { try { urlBox.value = text; urlBox.select(); document.execCommand('copy'); U.toast(msg); } catch (e) { U.toast(tr('Copy failed — select the text and copy it.', 'فشل النسخ — حدد النص وانسخه.')); } }); };
    const body = h('div', { class: 'share' },

      h('div', { class: 'maptools' },

        h('button', { class: 'btn', type: 'button', onclick: () => copy(json, tr('JSON copied', 'اننسخ الـ JSON')) }, '{ } ' + tr('Copy JSON', 'انسخ JSON'))),
      tooLong ? null : urlBox,
      h('div', { class: 'canvas-wrap' }, canvas),
      h('div', { class: 'maptools' },
        h('button', { class: 'btn primary', type: 'button', onclick: () => canvas.toBlob((b) => {
          const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `scan-cycle-${L.id}.png`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        }, 'image/png') }, '⬇ ' + tr('Download PNG', 'نزّل PNG')),
        (navigator.canShare && typeof File !== 'undefined') ? h('button', { class: 'btn', type: 'button', onclick: () => canvas.toBlob(async (b) => {
          try { const f = new File([b], `scan-cycle-${L.id}.png`, { type: 'image/png' }); if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: 'Scan Cycle ' + L.id }); else U.toast(tr('Sharing files is not supported here.', 'مشاركة الملفات غير مدعومة هون.')); } catch (e) { /* cancelled */ }
        }, 'image/png') }, '↗ ' + tr('Share…', 'شارك…')) : null));
    U.modal(tr('Share your program', 'شارك برنامجك'), body, (close) => [h('button', { class: 'btn', type: 'button', onclick: () => close(null) }, tr('Close', 'سكّر'))], { enterSubmits: false });
  };
})();

<script>
/* ==== src/ui/app-ui.js ==== */
/* Application shell: station map, level screen, game loop, operator panel, I/O strip, forces, replay. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const tr = (en, ar) => (U.lang === 'ar' ? ar : en);

  const ST = {
    levels: [], level: null, sim: null, view: null, speed: 1, paused: false, acc: 0, last: 0,
    program: { v: 1, rungs: [] }, userTags: [], root: null, raf: 0, ladder: null, replay: null, panels: null, lastPaint: 0,
  };
  U.state = ST;
  let ledEls = null, lastIO = 0;

  // ---------------------------------------------------------------- levels
  function sandboxLevel() {
    return {
      id: 'SBX', order: 0, sandbox: true, concept: 'free play',
      title: { en: 'Sandbox', ar: 'ساحة التجربة' },
      workOrder: {
        en: 'Free play. All instructions are unlocked and the whole line is installed. Build anything, force inputs, press the E-stop.',
        ar: 'لعب حر. كل التعليمات مفتوحة والخط كامل. ابني أي شي، اعمل {{force}} للمداخل، واضغط زر الطوارئ.',
      },
      palette: null,
      tags: SC.IO.map((t) => t.name).concat(SC.demo.tags.filter((t) => typeof t === 'object')),
      plant: { stations: ['infeed', 'filler', 'stopper', 'capper', 'sealer', 'labeler', 'reject', 'exit', 'tank', 'backup'], bottlesPerMin: 24, startLevelPct: 80 },
      starter: SC.dsl.parseProgram(SC.demo.lines),
      scenarios: [], datasheets: [], glossary: [], hints: [],

  }

  // ---------------------------------------------------------------- sim lifecycle
  function levelWithTags() { return Object.assign({}, ST.level, { tags: (ST.level.tags || []).concat(ST.userTags.filter((t) => !(ST.level.tags || []).some((x) => x.name === t.name))) }); }

  function newSim() {
    ST.sim = SC.sim.create({ level: ST.level, program: ST.program, seed: 1, scenario: {}, userTags: ST.userTags });
    ST.acc = 0; ST.replay = null;
    if (ST.view) ST.view.setSim(ST.sim);
    const bar = document.getElementById('replay-bar'); if (bar) bar.hidden = true;
    document.body.classList.remove('replaying');
  }

  // hot-swap the program into the running sim (memory kept)
  U.setProgram = function (program, userTags) {
    ST.program = program;
    if (userTags) ST.userTags = userTags;
    if (!ST.sim) return;
    const tags = SC.mergeTags(SC.levelTags(ST.level), ST.userTags);
    ST.sim.compiled = SC.compile(ST.program, { tags, palette: ST.level.palette || null });
    for (const t of ST.userTags) if (!ST.sim.tagByName[t.name]) ST.sim.tagByName[t.name] = Object.assign({ _a: SC.addr.parseAddr(t.addr) }, t);
  };

  function persistProgram(p, u) {
    if (!ST.level) return;
    if (ST.level.sandbox) { U.data.sandbox = { program: p, userTags: u }; }
    else { const lv = U.lv(ST.level.id); lv.program = p; lv.userTags = u; }
    U.save();
  }

  // ---------------------------------------------------------------- replay
  function startReplay(sc, tFail) {
    const ed = ST.ladder;
    const sim = SC.sim.create({ level: levelWithTags(), program: ed.program, scenario: sc, seed: sc.seed, userTags: ed.userTags });
    sim.runUntil(Math.max(0, tFail - 2000));
    sim.replayInfo = { title: sc.title ? (U.lang === 'ar' ? sc.title.ar : sc.title.en) : sc.id, tFail };
    ST.sim = sim; ST.view.setSim(sim);
    ST.replay = { sc, tFail, tEnd: tFail + 1500 };
    ST.paused = false; ST.speed = 1; ST.acc = 0;
    document.body.classList.add('replaying');
    const bar = document.getElementById('replay-bar');
    bar.hidden = false;
    bar.querySelector('.rb-t').textContent = tr('REPLAY: ', 'إعادة: ') + sim.replayInfo.title + ' — ' + tr('failure at', 'الفشل عند') + ' t = ' + (tFail / 1000).toFixed(2) + ' s';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function stopReplay() { newSim(); ST.paused = false; }

  // ---------------------------------------------------------------- main loop
  function frame(ts) {
    ST.raf = requestAnimationFrame(frame);
    if (!ST.sim) return;
    const dt = Math.min(250, ts - (ST.last || ts));
    ST.last = ts;
    if (!ST.paused) {
      ST.acc += dt * ST.speed;
      const n = Math.min(400, Math.floor(ST.acc / SC.SCAN_MS));
      for (let i = 0; i < n; i++) ST.sim.step(i === n - 1);
      ST.acc -= n * SC.SCAN_MS;
      if (n >= 400) ST.acc = 0;
      if (ST.replay && ST.sim.t >= ST.replay.tEnd) { ST.paused = true; const t = document.querySelector('#replay-bar .rb-t'); if (t) t.textContent += ' — ' + tr('replay finished', 'انتهت الإعادة'); }
    }
    ST.view.draw(ST.paused ? 0 : ST.acc / SC.SCAN_MS);
    updateIO(ts);
    if (ST.ladder && ts - ST.lastPaint > 90) { ST.lastPaint = ts; ST.ladder.paint(ST.sim); }
  }

  // ---------------------------------------------------------------- I/O strip + panel
  function buildIO(box) {
    ledEls = [];
    const tags = SC.levelTags(ST.level);
    const ins = tags.filter((t) => /^I/.test(t.addr)), outs = tags.filter((t) => /^Q/.test(t.addr));
    const mk = (t) => {
      const b = h('button', { class: 'led' + (/^I/.test(t.addr) ? '' : ' led-out'), type: 'button', title: `${t.name} (${t.addr}) — ${t.desc ? t.desc.en : ''}`, 'aria-label': t.name, onclick: () => cycleForce(t) },
        h('span', { class: 'led-dot', 'aria-hidden': 'true' }), h('span', { class: 'led-name' }, t.name),
        h('span', { class: 'led-addr' }, U.useCodesys ? SC.addr.toCodesys(t.addr) : t.addr), h('span', { class: 'led-val' }, '0'), h('span', { class: 'led-lock', 'aria-hidden': 'true' }, '🔒'));
      ledEls.push({ tag: t, el: b, val: null, forced: null });
      return b;
    };
    box.append(
      h('div', { class: 'io-group' }, h('h4', null, U.tEl('inputs')), h('div', { class: 'leds' }, ins.map(mk))),
      h('div', { class: 'io-group' }, h('h4', null, U.tEl('outputs')), h('div', { class: 'leds' }, outs.map(mk))),
      h('p', { class: 'muted small' }, U.tEl('forceHint')));
  }

  function cycleForce(t) {
    if (!/^I/.test(t.addr) || ST.replay) return;
    const a = SC.addr.parseAddr(t.addr);
    if (a.kind === 'word') return;
    const cur = ST.sim.forces[a.canon];
    if (cur === undefined) ST.sim.force(t.name, 1); else if (cur === 1) ST.sim.force(t.name, 0); else ST.sim.force(t.name, null);
    updateForcesBanner();
  }

  function updateForcesBanner() {
    const n = Object.keys(ST.sim.forces).length;
    const b = document.getElementById('forces-banner');
    if (b) { b.hidden = n === 0; b.querySelector('.fb-n').textContent = n; }
  }

  function updateIO(ts) {
    if (!ledEls || ts - lastIO < 90) return;
    lastIO = ts;
    const sim = ST.sim;
    for (const L of ledEls) {
      const a = SC.addr.parseAddr(L.tag.addr);
      const v = sim.st[a.arr][a.idx];
      const f = a.arr === 'I' || a.arr === 'IW' ? sim.forces[a.canon] : undefined;
      if (L.val !== v || L.forced !== f) {
        L.val = v; L.forced = f;
        L.el.classList.toggle('on', !!v); L.el.classList.toggle('forced', f !== undefined);
        L.el.querySelector('.led-val').textContent = a.kind === 'word' ? String(v) : (v ? '1' : '0');
      }
    }
  }

  function buildPanel(box) {
    const tags = SC.levelTags(ST.level).filter((t) => t.src === 'panel' && !/^IW/.test(t.addr));
    const btns = [];
    for (const t of tags) {
      const io = SC.ioByName[t.name];
      const idle = io ? io.def : 0;
      const momentary = io && ['start', 'stop', 'ack', 'reset', 'release', 'setpoint'].indexOf(io.role) >= 0;
      const btn = h('button', { class: 'pbtn' + (t.name === 'Stop_PB' ? ' pb-stop' : ''), type: 'button', 'aria-pressed': 'false', title: `${t.name} (${t.addr}) — ${t.desc ? t.desc.en : ''}` },
        h('span', { class: 'pb-name' }, t.name.replace(/_/g, ' ')), h('span', { class: 'pb-sub' }, momentary ? (idle ? 'NC · hold' : 'NO · hold') : 'switch'));
      const setP = (pressed) => {
        ST.sim.setPanel(t.name, momentary ? (pressed ? (idle ? 0 : 1) : idle) : pressed);
        btn.setAttribute('aria-pressed', String(!!pressed)); btn.classList.toggle('down', !!pressed);
      };
      if (momentary) {
        let startSteps = 0, releasing = false;
        const down = () => { if (btn.classList.contains('down') && !releasing) return; releasing = false; startSteps = ST.sim.steps; setP(true); };
        // a quick tap must still be seen by the PLC: keep the button down for at least 4 scans (unless paused)
        const up = () => {
          if (!btn.classList.contains('down')) return;
          releasing = true;
          const wait = () => {
            if (!releasing) return;
            if (ST.paused || !ST.sim || ST.sim.steps - startSteps >= 4) { releasing = false; setP(false); return; }
            requestAnimationFrame(wait);
          };
          wait();
        };
        btn.addEventListener('pointerdown', (e) => { btn.setPointerCapture && btn.setPointerCapture(e.pointerId); down(); });
        btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up);
        btn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); down(); } });
        btn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') up(); });
      } else {
        let on = !!idle;
        btn.addEventListener('click', () => { on = !on; setP(on); });
        if (idle) setP(true);

      btns.push(btn);
    }

    estop.addEventListener('click', () => { const on = !ST.sim.P.hw.estop; ST.sim.P.hw.estop = on; estop.setAttribute('aria-pressed', String(on)); estop.classList.toggle('down', on); });
    const door = h('button', { class: 'pbtn', type: 'button', 'aria-pressed': 'false', title: 'Guard door' }, h('span', { class: 'pb-name' }, U.t('door')), h('span', { class: 'pb-sub' }, U.t('doorClosed')));
    door.addEventListener('click', () => { const open = !ST.sim.P.hw.doorOpen; ST.sim.P.hw.doorOpen = open; door.setAttribute('aria-pressed', String(open)); door.classList.toggle('down', open); door.querySelector('.pb-sub').textContent = open ? U.t('doorOpen') : U.t('doorClosed'); });
    box.append(h('div', { class: 'pbtns' }, btns, estop, door), h('p', { class: 'muted small' }, U.tEl('estopNote')));
  }

  // ---------------------------------------------------------------- level screen
  function openLevel(L, override) {
    cancelAnimationFrame(ST.raf);
    ST.level = L; ST.ladder = null; ST.replay = null;
    ST.paused = false; ST.speed = 1;
    let saved = null, savedTags = null;
    if (L.sandbox) { saved = U.data.sandbox && U.data.sandbox.program; savedTags = U.data.sandbox && U.data.sandbox.userTags; }
    else { const lv = U.lv(L.id); saved = lv.program; savedTags = lv.userTags; }
    ST.userTags = savedTags && savedTags.length ? SC.util.clone(savedTags) : (L.tags || []).filter((t) => typeof t === 'object' && t.user).map((t) => SC.util.clone(t));
    ST.program = saved && saved.rungs ? SC.util.clone(saved) : SC.util.clone(SC.dsl.programFrom(L.starter) || { v: 1, rungs: [] });
    if (override) { ST.program = override.program; ST.userTags = override.userTags; persistProgram(ST.program, ST.userTags); }
    renderLevel();
  }

  function renderLevel() {
    const L = ST.level;
    const root = ST.root;
    root.innerHTML = '';

    const canvas = h('canvas', { id: 'plant', class: 'plant', role: 'img', 'aria-label': 'Side view of the bottling line' });
    const speedBtns = [0.25, 0.5, 1, 2, 4, 8].map((s) => h('button', { type: 'button', class: 'spd' + (s === ST.speed ? ' sel' : ''), 'aria-pressed': String(s === ST.speed),
      onclick: (e) => { ST.speed = s; speedBtns.forEach((b) => { const on = b === e.currentTarget; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', String(on)); }); document.getElementById('fastwarn').hidden = s < 8; } }, '×' + s));
    const runBtn = h('button', { type: 'button', class: 'btn', onclick: () => { ST.paused = !ST.paused; runBtn.textContent = ST.paused ? '▶ ' + U.t('run') : '⏸ ' + U.t('pause'); stepBtn.disabled = !ST.paused; } }, '⏸ ' + U.t('pause'));
    const stepBtn = h('button', { type: 'button', class: 'btn', disabled: true, onclick: () => { ST.sim.step(true); if (ST.ladder) ST.ladder.paint(ST.sim); } }, '⏭ ' + U.t('step'));
    const restartBtn = h('button', { type: 'button', class: 'btn', onclick: () => { newSim(); buildAll(); } }, '↻ ' + U.t('restart'));
    const ioBox = h('div', { class: 'io' }), panelBox = h('div', { class: 'panelbox' }), ladderBox = h('div', { id: 'ladder-mount', class: 'ladder-mount' });
    const reportBox = h('div', { id: 'report-mount', class: 'o-report' });
    const lv = L.sandbox ? null : U.lv(L.id);

    const header = h('header', { class: 'top' },
      h('button', { class: 'btn ghost', type: 'button', onclick: () => showMap() }, U.t('back')),
      h('div', { class: 'ttl' }, h('b', null, L.sandbox ? '' : L.id + ' · '), U.lang === 'ar' ? U.arEl(L.title.ar) : U.enEl(L.title.en)),
      lv ? h('span', { class: 'stars hstars', id: 'hdr-stars', 'aria-label': lv.stars + ' of 3 stars' }, U.starsText(lv.stars)) : null,
      h('div', { class: 'grow' }),
      h('div', { id: 'forces-banner', class: 'forces', hidden: true, role: 'status' }, '⚠ ', U.tEl('forcesActive'), ' (', h('span', { class: 'fb-n' }, '0'), ') ',
        h('button', { class: 'btn small', type: 'button', onclick: () => { ST.sim.clearForces(); updateForcesBanner(); } }, U.t('clearForces'))),
      langBtn(), themeBtn());

    const replayBar = h('div', { id: 'replay-bar', class: 'replay-bar', hidden: true, role: 'status' }, h('span', { class: 'rb-t' }), h('button', { class: 'btn small', type: 'button', onclick: stopReplay }, '■ ' + tr('Stop replay', 'أوقف الإعادة')));

    const plantCard = h('section', { class: 'card o-plant' }, canvas,
      h('div', { class: 'ctrls' }, runBtn, stepBtn, restartBtn, h('span', { class: 'sp' }), h('span', { class: 'muted small' }, U.t('speed') + ':'), speedBtns),
      h('p', { id: 'fastwarn', class: 'warn small', hidden: true }, '⚠ ', U.tEl('fastWarn')));
    const panelCard = h('section', { class: 'card o-panel' }, h('h3', null, U.tEl('panel')), panelBox);
    const ioCard = h('section', { class: 'card o-io' }, h('h3', null, 'I/O'), ioBox);
    const ladderCard = h('section', { class: 'card o-ladder' }, h('div', { class: 'card-h' }, h('h3', null, U.tEl('ladder')), h('button', { class: 'btn small', type: 'button', onclick: () => U.openShare(L, ST.ladder.program, ST.ladder.userTags) }, '↗ ' + tr('Share', 'شارك'))), ladderBox, h('p', { id: 'autosave-note', class: 'warn small', hidden: U.autosaveOk !== false }, tr('Autosave is unavailable in this browser — use Export on the map.', 'الحفظ التلقائي مش متاح بهالمتصفح — استخدم التصدير من الخريطة.')));
    const tagsCard = h('section', { class: 'card o-tags' }, h('h3', null, U.tEl('tags')), h('div', { id: 'tags-mount' }));
    const xferCard = h('details', { class: 'card o-xfer', ontoggle: (e) => { if (e.target.open) U.mountTransfer(document.getElementById('xfer-mount')); } }, h('summary', null, h('b', null, U.tEl('transfer'))), h('div', { id: 'xfer-mount' }));

    let left;
    if (L.sandbox) {
      left = [h('section', { class: 'card o-wo' }, h('h3', null, U.tEl('workOrder')), h('p', { lang: 'en' }, L.workOrder.en), h('section', { lang: 'ar', dir: 'rtl', class: 'ar-block', html: U.arHtml(L.workOrder.ar) }))];
      ST.panels = null;
    } else {
      const env = { L, ladder: null, panels: null, reportBox, sim: () => ST.sim, replay: startReplay, onStars: () => { const s = document.getElementById('hdr-stars'); if (s) s.textContent = U.starsText(U.lv(L.id).stars); } };
      const panels = U.buildLevelPanels(L, { runFat: () => { env.ladder = ST.ladder; U.runFat(env); } });
      env.panels = panels; ST.panels = panels; ST.env = env;
      left = [panels.wo, panels.ds, panels.fat.el];
    }

    root.append(header, replayBar, h('div', { class: 'level-grid' },
      h('div', { class: 'col-left' }, left),
      h('div', { class: 'col-right' }, plantCard, panelCard, ioCard, ladderCard, reportBox, tagsCard, xferCard)));

    ST.view = SC.ui.PlantView(canvas);
    function buildAll() {
      ioBox.innerHTML = ''; panelBox.innerHTML = '';
      buildIO(ioBox); buildPanel(panelBox);
      mountLadder(ladderBox);
      U.mountTags(document.getElementById('tags-mount'));
    }
    newSim();
    buildAll();
    ST.last = 0;
    ST.raf = requestAnimationFrame(frame);
  }

  function mountLadder(box) {
    box.innerHTML = '';
    const L = ST.level;
    const host = {
      program: ST.program, userTags: ST.userTags,
      baseTags: () => SC.levelTags(L).filter((t) => !t.user),
      palette: () => (L.palette ? L.palette : null),
      setProgram: (p, u, initial) => { U.setProgram(p, u); if (!initial) { persistProgram(p, u); U.onProgramChanged(p, u); } },
    };
    ST.ladder = U.Ladder(box, host);
  }

  function langBtn() { return h('button', { class: 'btn ghost', type: 'button', onclick: () => { U.setLang(U.lang === 'ar' ? 'en' : 'ar'); rerender(); } }, U.t('langBtn')); }
  function themeBtn() {
    return h('button', { class: 'btn ghost', type: 'button', 'aria-label': 'Toggle dark mode', onclick: () => {
      const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next); U.store.set('theme', next);
      if (ST.view) ST.view.refreshTheme();
    } }, '◐');
  }
  function rerender() { if (ST.level) { const keep = ST.level; openLevel(keep); } else showMap(); }

  // ---------------------------------------------------------------- map
  function showMap() {
    cancelAnimationFrame(ST.raf);
    ST.level = null; ST.sim = null; ST.ladder = null; ledEls = null; ST.replay = null;
    document.body.classList.remove('replaying');
    const root = ST.root;
    root.innerHTML = '';
    const nextIdx = ST.levels.findIndex((L) => !U.lv(L.id).solved);
    const cards = ST.levels.map((L, i) => {
      const lv = U.lv(L.id);
      return h('button', { class: 'lvl' + (i === nextIdx ? ' next' : '') + (lv.solved ? ' done' : ''), type: 'button', onclick: () => openLevel(L), 'aria-label': `${L.id} ${L.title.en}, ${lv.stars} stars` },
        h('b', null, L.id), h('span', null, U.lang === 'ar' ? L.title.ar : L.title.en),
        h('span', { class: 'stars small' }, U.starsText(lv.stars)), i === nextIdx ? h('small', { class: 'nextmark' }, '▶ ' + tr('next', 'التالي')) : null);
    });
    cards.unshift(h('button', { class: 'lvl sbx', type: 'button', onclick: () => openLevel(sandboxLevel()) }, h('b', null, '∞'), h('span', null, U.t('sandbox')), h('small', null, U.t('sandboxDesc'))));
    const due = U.glossary.dueIds().length;
    const importInput = h('input', { type: 'file', accept: 'application/json', hidden: true, onchange: async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const ok = U.importData(await f.text());
      U.toast(ok ? tr('Progress imported.', 'انستوردت البيانات.') : tr('That file is not a valid Scan Cycle save.', 'الملف هاد مش حفظ صالح.'));
      if (ok) showMap();
    } });
    const review = h('div', { id: 'review-mount' });
    root.append(
      h('header', { class: 'top' }, h('div', { class: 'ttl' }, h('b', null, 'Scan Cycle')), h('div', { class: 'grow' }), langBtn(), themeBtn()),
      h('main', { class: 'mapwrap' },
        h('h1', null, U.tEl('app')), h('p', { class: 'lead' }, U.tEl('tagline')),
        h('div', { class: 'maptools' },
          h('button', { class: 'btn', type: 'button', onclick: () => { review.innerHTML = ''; U.glossary.review(review, showMap); review.scrollIntoView({ behavior: 'smooth' }); } }, '🔤 ' + tr('Term review', 'مراجعة المصطلحات') + (due ? ` (${due} ${tr('due', 'مستحق')})` : '')),
          h('span', { class: 'stars' }, '★ ' + U.totalStars() + '/' + (ST.levels.length * 3))),
        review,
        h('div', { class: 'levelmap' }, cards),
        h('details', { class: 'card' }, h('summary', null, tr('Save, share and reset', 'حفظ ومشاركة وتصفير')),
          h('div', { class: 'maptools' },
            h('button', { class: 'btn', type: 'button', onclick: () => U.exportData() }, '⬇ ' + tr('Export progress', 'صدّر التقدم')),
            h('button', { class: 'btn', type: 'button', onclick: () => importInput.click() }, '⬆ ' + tr('Import progress', 'استورد التقدم')), importInput,
            h('button', { class: 'btn', type: 'button', onclick: () => { if (confirm(tr('Delete ALL progress in this browser?', 'تحذف كل التقدم بهالمتصفح؟'))) { U.resetData(); showMap(); } } }, tr('Reset progress', 'صفّر التقدم'))),
          h('p', { class: 'muted small', hidden: U.autosaveOk !== false }, tr('Autosave is unavailable — use Export.', 'الحفظ التلقائي مش متاح — استخدم التصدير.'))),
        h('p', { class: 'muted small' }, U.tEl('offlineNote'))));
  }

  // ---------------------------------------------------------------- boot
  U.start = function () {
    ST.root = document.getElementById('app');
    ST.levels = SC.levels.loadAll();
    U.glossary.init(ST.levels);
    U.useCodesys = !!U.store.get('codesys', false);
    const th = U.store.get('theme', null);
    if (th) document.documentElement.setAttribute('data-theme', th);
    const q = new URLSearchParams(location.search);
    const open = q.get('level') || (location.hash.indexOf('#level=') === 0 ? location.hash.slice(7) : '');
    const sh = U.readShareHash();
    if (sh && sh.error) U.toast(tr('Could not read the shared link.', 'ما قدرت أقرا الرابط المشارك.'));
    if (sh && !sh.error) {
      const L = sh.level === 'SBX' ? sandboxLevel() : ST.levels.find((l) => l.id === sh.level);
      if (L) { openLevel(L, { program: sh.program, userTags: sh.userTags }); U.toast(tr('Shared program loaded.', 'انحمّل البرنامج المشارك.')); history.replaceState(null, '', location.href.split('#')[0]); return; }
    }
    if (location.hash === '#sandbox') openLevel(sandboxLevel());
    else if (open && ST.levels.find((l) => l.id === open)) openLevel(ST.levels.find((l) => l.id === open));
    else showMap();
  };
  U.onProgramChanged = () => { clearTimeout(U._refT); U._refT = setTimeout(() => { U.refreshTags(); U.refreshTransfer(); }, 150); };
  U.openLevel = openLevel;
  U.showMap = showMap;
  U.rerender = rerender;
})();

<script>
/* ==== src/selftest/00-framework.js ==== */
/* Tiny in-browser test framework. Results are rendered as a table and exposed as JSON for tools/selftest.py. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const suites = [];
  const T = {
    suites,
    suite(name, fn) { suites.push({ name, fn }); },
  };

  function mkCtx(rows, suite) {
    let cur = '';
    const row = (ok, name, detail) => rows.push({ suite, name: name || cur, ok: !!ok, detail: ok ? '' : String(detail || '') });
    const show = (x) => { try { return typeof x === 'string' ? x : JSON.stringify(x); } catch (e) { return String(x); } };
    return {
      test(name, fn) {
        cur = name;
        try { fn(); } catch (e) { row(false, name, 'threw: ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e)); }
      },
      ok(cond, name, detail) { row(cond, name, detail); },
      eq(actual, expected, name) {
        const a = show(actual), b = show(expected);
        row(a === b, name, `expected ${b}, got ${a}`);
      },
    };
  }

  T.runAll = function (only) {
    const t0 = Date.now();
    const rows = [];
    for (const s of suites) {
      if (only && !s.name.includes(only) && s.name.indexOf('levels') !== 0) continue;
      const ctx = mkCtx(rows, s.name);
      try { s.fn(ctx); } catch (e) { rows.push({ suite: s.name, name: '(suite crashed)', ok: false, detail: String(e && e.stack || e) }); }
    }
    return { rows, ms: Date.now() - t0 };
  };

  T.render = function (res, summary) {
    const bad = res.rows.filter((r) => !r.ok);
    const root = document.getElementById('app');
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    let h = `<main class="selftest"><h1>Scan Cycle — self-test</h1>`;
    h += `<p class="${bad.length ? 'st-bad' : 'st-good'}"><b>${res.rows.length - bad.length}/${res.rows.length} passed</b> — ${bad.length} failed — ${res.ms} ms</p>`;
    if (summary) h += `<pre>${esc(summary)}</pre>`;
    h += '<table><thead><tr><th>Result</th><th>Suite</th><th>Test</th><th>Detail</th></tr></thead><tbody>';
    for (const r of res.rows) h += `<tr class="${r.ok ? 'ok' : 'bad'}"><td>${r.ok ? '✔ PASS' : '✖ FAIL'}</td><td>${esc(r.suite)}</td><td>${esc(r.name)}</td><td>${esc(r.detail || '')}</td></tr>`;
    h += '</tbody></table>';
    const json = JSON.stringify({ rows: res.rows, ms: res.ms, summary: summary || '' });
    h += `<pre id="sc-selftest-json" hidden>${esc(json)}</pre></main>`;
    root.innerHTML = h;
  };

  SC.test = T;
})();

</script>
<script>
/* ==== src/selftest/10-unit-core.js ==== */
/* Unit tests for the PLC engine: one timing diagram per instruction. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const T = SC.test;

  const TAGS = [
    { name: 'A', addr: 'I0.0', type: 'Bool' }, { name: 'B', addr: 'I0.1', type: 'Bool' }, { name: 'C', addr: 'I0.2', type: 'Bool' },
    { name: 'Stop', addr: 'I0.3', type: 'Bool', wiring: 'NC', role: 'stop' },
    { name: 'Y', addr: 'Q0.0', type: 'Bool' }, { name: 'Z', addr: 'Q0.1', type: 'Bool' }, { name: 'X', addr: 'Q0.2', type: 'Bool' },
    { name: 'M1', addr: 'M0.0', type: 'Bool' }, { name: 'M2', addr: 'M0.1', type: 'Bool' }, { name: 'M3', addr: 'M0.2', type: 'Bool' },
    { name: 'W1', addr: 'MW10', type: 'Int' }, { name: 'W2', addr: 'MW12', type: 'Int' }, { name: 'W3', addr: 'MW14', type: 'Int' },
  ];

  // test harness: build from ladder text
  function kit(lines, opts) {
    const prog = Array.isArray(lines) ? SC.dsl.parseProgram(lines) : lines;
    const c = SC.compile(prog, Object.assign({ tags: TAGS }, opts || {}));
    if (!c.ok) throw new Error('compile: ' + JSON.stringify(c.errors));
    const st = SC.newState();
    const addrOf = (n) => SC.addr.parseAddr((TAGS.find((t) => t.name === n) || { addr: n }).addr);
    const h = {
      c, st, prog,
      set(n, v) { const a = addrOf(n); if (a.kind === 'bit') st[a.arr][a.idx] = v ? 1 : 0; else st[a.arr][a.idx] = v; },
      get(n) { const a = addrOf(n); return st[a.arr][a.idx]; },
      scan(k) { for (let i = 0; i < (k || 1); i++) SC.scanMut(c, st); },
      ms(ms) { h.scan(Math.round(ms / 10)); },
      inst: (n) => st.inst[n],
    };
    return h;
  }
  SC.testkit = { kit, TAGS };

  T.suite('time literals & addresses', (t) => {
    const P = SC.addr.parseTime, F = SC.addr.formatTime;
    t.eq(P('T#3s'), 3000, 'T#3s = 3000 ms');
    t.eq(P('T#500ms'), 500, 'T#500ms');
    t.eq(P('T#1m30s'), 90000, 'T#1m30s');
    t.eq(P('T#1.5s'), 1500, 'T#1.5s');
    t.eq(P('t#2s'), 2000, 'lower case ok');
    t.eq(P('3s'), null, '"3s" is not a literal');
    t.eq(P('T#'), null, 'T# alone is invalid');
    t.eq(P('T#3x'), null, 'unknown unit');
    t.eq(P(3), null, 'a number is not a literal');
    t.eq(F(3000), 'T#3s', 'format 3000');
    t.eq(F(90500), 'T#1m30s500ms', 'format 90500');
    t.eq(F(0), 'T#0ms', 'format 0');
    t.eq(F(P('T#2m5s20ms')), 'T#2m5s20ms', 'round trip');
    const a = SC.addr.parseAddr('I0.5');
    t.eq([a.kind, a.arr, a.idx], ['bit', 'I', 5], 'I0.5');
    t.eq(SC.addr.parseAddr('%QX1.2').canon, 'Q1.2', 'CODESYS %QX1.2');
    t.eq(SC.addr.parseAddr('MW10').idx, 10, 'MW10');
    t.eq(SC.addr.parseAddr('I0.8'), null, 'I0.8 invalid bit');
    t.eq(SC.addr.parseAddr('Start'), null, 'name is not an address');
    t.eq(SC.addr.toCodesys('Q0.6'), '%QX0.6', 'to CODESYS');
  });

  T.suite('ladder text layout', (t) => {
    const r = SC.dsl.parseRung('[Start_PB | Motor] /Stop_PB (Motor)');
    t.eq([r.rows, r.cols], [2, 3], 'seal-in is 2 rows x 3 cols');
    t.eq(r.els.map((e) => `${e.t}@${e.r},${e.c}`).join(' '), 'NO@0,0 NO@1,0 NC@0,1 OUT@0,2', 'seal-in elements');
    t.eq(JSON.stringify(r.vb), '[[0,0],[1,0]]', 'seal-in bars');
    let threw = false;
    try { SC.dsl.parseRung('[a | [b | c]]'); } catch (e) { threw = true; }
    t.ok(threw, 'nested groups rejected');
    const r2 = SC.dsl.parseRung('TON(DB_T,T#3s) CMP(>=,MW10,5) (S:Y) (R:Z)');
    t.eq(r2.els[0], { r: 0, c: 0, t: 'TON', i: 'DB_T', pt: 'T#3s' }, 'TON args');
    t.eq(r2.els[1], { r: 0, c: 1, t: 'CMP', op: '>=', a: 'MW10', b: 5 }, 'CMP args');
    t.eq(r2.els[2].t + r2.els[3].t, 'SETRST', 'S/R coils');
  });

  T.suite('contacts, coils, rung evaluation', (t) => {
    let h = kit(['A (Y)']);
    h.scan(); t.eq(h.get('Y'), 0, 'NO contact, input off -> coil off');
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 1, 'input on -> coil on within 1 scan');
    h.set('A', 0); h.scan(); t.eq(h.get('Y'), 0, 'input off -> coil off within 1 scan');

    h = kit(['/A (Y)']);
    h.scan(); t.eq(h.get('Y'), 1, 'NC contact passes when bit = 0');
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 0, 'NC contact blocks when bit = 1');

    h = kit(['A B (Y)']);
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 0, 'series AND: one input -> off');
    h.set('B', 1); h.scan(); t.eq(h.get('Y'), 1, 'series AND: both -> on');

    h = kit(['[A | B] (Y)']);
    h.scan(); t.eq(h.get('Y'), 0, 'parallel OR: none -> off');
    h.set('B', 1); h.scan(); t.eq(h.get('Y'), 1, 'parallel OR: B -> on');
    h.set('B', 0); h.set('A', 1); h.scan(); t.eq(h.get('Y'), 1, 'parallel OR: A -> on');

    h = kit(['[A B | C] (Y)']);
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 0, 'A and no B, no C -> off');
    h.set('C', 1); h.scan(); t.eq(h.get('Y'), 1, 'C branch -> on');

    h = kit(['A (Y) (Z)']);
    h.set('A', 1); h.scan(); t.eq([h.get('Y'), h.get('Z')], [1, 1], 'two coils in series both follow');

    h = kit(['[A | B] [C | Stop] (Y)']);
    h.set('A', 1); h.set('Stop', 1); h.scan(); t.eq(h.get('Y'), 1, 'two groups in series (A, Stop)');
    h.set('Stop', 0); h.scan(); t.eq(h.get('Y'), 0, 'second group opens');
  });

  T.suite('seal-in (latch with feedback)', (t) => {
    const h = kit(['[A | Y] Stop (Y)']);
    h.set('Stop', 1);
    h.scan(); t.eq(h.get('Y'), 0, 'idle');
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 1, 'start pressed');
    h.set('A', 0); h.scan(3); t.eq(h.get('Y'), 1, 'stays on after release');
    h.set('Stop', 0); h.scan(); t.eq(h.get('Y'), 0, 'stop (NC wired, bit 0) drops it');
    h.set('Stop', 1); h.scan(5); t.eq(h.get('Y'), 0, 'stays off');
    h.set('A', 1); h.set('Stop', 0); h.scan(); t.eq(h.get('Y'), 0, 'stop wins over start');
  });

  T.suite('scan order and double coil', (t) => {
    let h = kit(['A (Y)', '/B (Y)']);
    h.set('A', 1); h.set('B', 1); h.scan();
    t.eq(h.get('Y'), 0, 'double coil: the last write wins (rung 2 writes 0)');
    h = kit(['Y (Z)', 'A (Y)']);
    h.set('A', 1); h.scan();
    t.eq([h.get('Y'), h.get('Z')], [1, 0], 'rung 1 reads Y before rung 2 sets it (1 scan old)');
    h.scan(); t.eq(h.get('Z'), 1, 'one scan later Z follows');
    h = kit(['A (Y)', 'Y (Z)']);
    h.set('A', 1); h.scan();
    t.eq([h.get('Y'), h.get('Z')], [1, 1], 'rung 2 sees the write of rung 1 in the same scan');
    h = kit(['A (S:Y)', 'B (R:Y)']);
    h.set('A', 1); h.scan(); h.set('A', 0); h.scan(4); t.eq(h.get('Y'), 1, 'Set holds');
    h.set('B', 1); h.scan(); t.eq(h.get('Y'), 0, 'Reset clears');
    h = kit(['A (S:Y)', 'A (R:Y)']);
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 0, 'S then R in same scan: last executed wins (R)');
  });

  T.suite('edge contacts (POS / NEG)', (t) => {
    let h = kit(['POS(M1) (Y)'].map((s) => s), {});
    // POS needs power on its left: use A in front
    h = kit(['A POS(M1) (Y)']);
    h.scan(); t.eq(h.get('Y'), 0, 'no edge when input idle');
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 1, 'rising edge -> 1 scan pulse');
    h.scan(); t.eq(h.get('Y'), 0, 'next scan Y is 0 again (one scan only)');
    h.scan(20); t.eq(h.get('Y'), 0, 'held input does not retrigger');
    h.set('A', 0); h.scan(); h.set('A', 1); h.scan(); t.eq(h.get('Y'), 1, 'second press gives a second pulse');
    h = kit(['A NEG(M1) (Y)']);
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 0, 'NEG: no pulse on rising edge');
    h.set('A', 0); h.scan(); t.eq(h.get('Y'), 1, 'NEG: falling edge of the left power -> 1 scan pulse');
    h.scan(); t.eq(h.get('Y'), 0, 'NEG: only one scan');
    // NEG used inside a branch: edge on the contact itself
    h = kit(['[A | M1] NEG(M2) (Y)']);
    t.ok(true, 'NEG layout compiles');
    // pulse shorter than one scan is missed (input image is a snapshot)
    h = kit(['A (Y)']);
    h.set('A', 0); h.scan(); h.scan();
    t.eq(h.get('Y'), 0, 'a pulse that is never present at scan time is never seen');
  });

  T.suite('TON on-delay', (t) => {
    const h = kit(['A TON(DB_T,T#3s) (Y)']);
    h.set('A', 1);
    h.scan(299); t.eq(h.get('Y'), 0, 'Q still 0 after 299 scans (2.99 s)');
    h.scan(); t.eq([h.get('Y'), h.inst('DB_T').ET], [1, 3000], 'Q = 1 on scan 300, ET = PT');
    h.scan(50); t.eq(h.inst('DB_T').ET, 3000, 'ET stops at PT');
    h.set('A', 0); h.scan(); t.eq([h.get('Y'), h.inst('DB_T').ET], [0, 0], 'IN false resets ET and Q at once');
    h.set('A', 1); h.scan(100); h.set('A', 0); h.scan(); h.set('A', 1); h.scan(299);
    t.eq(h.get('Y'), 0, 'a drop of IN restarts the timing');
    h.scan(); t.eq(h.get('Y'), 1, 'and it fires 3 s after the new rising edge');
    const g = kit(['TON(DB_T,T#0ms) (Y)']);
    g.scan(); t.eq(g.get('Y'), 1, 'PT = 0 fires at once');
  });

  T.suite('TOF off-delay', (t) => {
    const h = kit(['A TOF(DB_T,T#2s) (Y)']);
    h.scan(); t.eq(h.get('Y'), 0, 'idle');
    h.set('A', 1); h.scan(); t.eq(h.get('Y'), 1, 'Q follows IN at once');
    h.set('A', 0); h.scan(); t.eq(h.get('Y'), 1, 'Q holds after IN falls');
    h.scan(198); t.eq(h.get('Y'), 1, 'still on at 1.99 s');
    h.scan(); t.eq(h.get('Y'), 0, 'off after PT (2.0 s)');
    h.set('A', 1); h.scan(); h.set('A', 0); h.scan(100); h.set('A', 1); h.scan(); h.set('A', 0); h.scan(199);
    t.eq(h.get('Y'), 1, 'IN rising during the delay restarts it');
  });

  T.suite('TP pulse', (t) => {
    const h = kit(['A TP(DB_T,T#500ms) (Y)']);
    h.scan(); t.eq(h.get('Y'), 0, 'idle');
    h.set('A', 1); h.scan();
    t.eq(h.get('Y'), 1, 'pulse starts on the rising edge scan');
    let on = 1;
    for (let i = 0; i < 80; i++) { h.scan(); on += h.get('Y'); }
    t.eq(on, 50, 'pulse is exactly PT long (50 scans = 500 ms) even though IN stays high');
    t.eq(h.get('Y'), 0, 'and ends');
    const g = kit(['A TP(DB_T,T#500ms) (Y)']);
    g.set('A', 1); g.scan(); g.set('A', 0); g.scan(10);
    t.eq(g.get('Y'), 1, 'a short IN pulse still gives the full pulse');
    g.set('A', 1); g.scan(); g.set('A', 0); g.scan(5);
    let n = 0; for (let i = 0; i < 80; i++) { g.scan(); n += g.get('Y'); }
    t.ok(n < 40, 'not retriggerable while running (pulse ends 500 ms after the first edge)', 'n=' + n);
    g.scan(20); g.set('A', 1); g.scan(); t.eq(g.get('Y'), 1, 'a new edge after the pulse starts a new pulse');
  });

  T.suite('TONR retentive timer', (t) => {
    const h = kit(['A TONR(DB_T,T#3s,B) (Y)']);
    h.set('A', 1); h.scan(100);
    t.eq(h.inst('DB_T').ET, 1000, 'accumulates 1 s');
    h.set('A', 0); h.scan(50);
    t.eq(h.inst('DB_T').ET, 1000, 'ET is kept while IN is false');
    h.set('A', 1); h.scan(199); t.eq(h.get('Y'), 0, '1.99 s more is not enough');
    h.scan(); t.eq(h.get('Y'), 1, 'total 3 s reached -> Q');
    h.set('B', 1); h.scan(); t.eq([h.get('Y'), h.inst('DB_T').ET], [0, 0], 'R resets ET and Q');
    h.scan(5); t.eq(h.get('Y'), 0, 'R wins while IN is still high');
  });

  T.suite('counters', (t) => {
    let h = kit(['A CTU(DB_C,3,B) (Y)']);
    for (let i = 0; i < 2; i++) { h.set('A', 1); h.scan(); h.set('A', 0); h.scan(); }
    t.eq([h.inst('DB_C').CV, h.get('Y')], [2, 0], 'two pulses -> CV 2, Q off');
    h.set('A', 1); h.scan(50);
    t.eq([h.inst('DB_C').CV, h.get('Y')], [3, 1], 'third pulse (long) counts once -> Q');
    h.set('A', 0); h.scan(); h.set('A', 1); h.scan();
    t.eq(h.inst('DB_C').CV, 4, 'counts beyond PV');
    h.set('B', 1); h.scan(); t.eq([h.inst('DB_C').CV, h.get('Y')], [0, 0], 'R zeroes CV and Q');
    h.set('A', 0); h.scan(); h.set('A', 1); h.scan(); t.eq(h.inst('DB_C').CV, 0, 'R has priority over the count');
    h.set('B', 0); h.scan(); h.set('A', 0); h.scan(); h.set('A', 1); h.scan(); t.eq(h.inst('DB_C').CV, 1, 'counting resumes after R released');

    h = kit(['A CTD(DB_D,2,B) (Y)']);
    h.scan(); t.eq(h.get('Y'), 1, 'CTD: CV = 0 -> Q = 1 before load');
    h.set('B', 1); h.scan(); h.set('B', 0); h.scan();
    t.eq([h.inst('DB_D').CV, h.get('Y')], [2, 0], 'LD loads PV, Q off');
    h.set('A', 1); h.scan(); h.set('A', 0); h.scan(); h.set('A', 1); h.scan();
    t.eq([h.inst('DB_D').CV, h.get('Y')], [0, 1], 'two edges count down to 0, Q on');

    h = kit(['A CTUD(DB_U,3,B) (Y)']);
    h.set('A', 1); h.set('B', 1); h.scan();
    t.eq(h.inst('DB_U').CV, 0, 'up and down edge in the same scan -> no change');
    h.set('B', 0); h.scan(); h.set('A', 0); h.scan(); h.set('A', 1); h.scan();
    t.eq(h.inst('DB_U').CV, 1, 'up edge alone -> +1');
    h.set('A', 0); h.scan(); h.set('B', 1); h.scan();
    t.eq(h.inst('DB_U').CV, 0, 'down edge alone -> -1');
  });

  T.suite('compare, move, math, shift', (t) => {
    let h = kit(['CMP(>=,W1,5) (Y)']);
    h.set('W1', 4); h.scan(); t.eq(h.get('Y'), 0, '4 >= 5 false');
    h.set('W1', 5); h.scan(); t.eq(h.get('Y'), 1, '5 >= 5 true');
    for (const [op, a, b, exp] of [['==', 3, 3, 1], ['<>', 3, 3, 0], ['>', 4, 3, 1], ['<', 4, 3, 0], ['<=', 3, 3, 1]]) {
      h = kit([`CMP(${op},W1,W2) (Y)`]);
      h.set('W1', a); h.set('W2', b); h.scan(); t.eq(h.get('Y'), exp, `CMP ${a} ${op} ${b}`);
    }
    h = kit(['A MOVE(7,W1)']);
    h.scan(); t.eq(h.get('W1'), 0, 'MOVE needs power');
    h.set('A', 1); h.scan(); t.eq(h.get('W1'), 7, 'MOVE const -> tag');
    h = kit(['A ADD(W1,1,W1)']);
    h.set('A', 1); h.scan(10); t.eq(h.get('W1'), 10, 'ADD without an edge runs every scan (10 scans -> 10)');
    h = kit(['A POS(M1) ADD(W1,1,W1)']);
    h.set('A', 1); h.scan(10); t.eq(h.get('W1'), 1, 'ADD behind an edge runs once');
    h = kit(['A SUB(W1,2,W2)']);
    h.set('W1', 9); h.set('A', 1); h.scan(); t.eq(h.get('W2'), 7, 'SUB');
    h = kit(['A SHL(W1,B)']);
    h.set('A', 1); h.set('B', 1); h.scan(); t.eq(h.get('W1'), 1, 'SHL: bit0 := IN');
    h.set('B', 0); h.scan(); t.eq(h.get('W1'), 2, 'SHL shifts left');
    h.scan(); t.eq(h.get('W1'), 4, 'SHL again');
    h = kit(['A CMP(>,DB_T.ET,T#1s) TON(DB_T,T#5s)']);
    t.ok(true, 'instance field operand compiles');
  });

  T.suite('compile errors', (t) => {
    const c = (lines) => SC.compile(SC.dsl.parseProgram(lines), { tags: TAGS });
    let r = c(['Nope (Y)']);
    t.eq(r.errors[0] && r.errors[0].code, 'unknown_tag', 'unknown tag');
    r = c(['A (A)']);
    t.eq(r.errors[0] && r.errors[0].code, 'write_to_input', 'coil on an input');
    r = c(['A TON(DB_T,3) (Y)']);
    t.eq(r.errors[0] && r.errors[0].code, 'bad_time', 'PT = 3 is not a time literal');
    r = c(['A TON(DB_T,T#3s) (Y)']);
    t.ok(r.ok, 'valid program compiles');
    r = SC.compile(SC.dsl.parseProgram(['A TON(DB_T,T#3s) (Y)']), { tags: TAGS, palette: ['NO', 'OUT'] });
    t.eq(r.errors[0] && r.errors[0].code, 'not_allowed', 'palette is enforced');
    r = c(['A POS(W1) (Y)']);
    t.ok(r.errors.length > 0, 'edge memory must be an M bit');
    r = c(['A TON(DB_T,T#3s) (Y)', 'A CTU(DB_T,3) (Z)']);
    t.eq(r.errors[0] && r.errors[0].code, 'inst_type_clash', 'one instance cannot be TON and CTU');
  });

  T.suite('lint', (t) => {
    const L = (lines) => SC.lint(SC.dsl.parseProgram(lines), TAGS).map((x) => x.id);
    t.ok(L(['A (Y)', 'B (Y)']).includes('double_coil'), 'double coil');
    t.ok(!L(['A (S:Y)', 'B (R:Y)']).includes('double_coil'), 'S/R pair is not a double coil');
    t.ok(L(['A TON(DB_T,T#1s) (Y)', 'B TON(DB_T,T#1s) (Z)']).includes('shared_instance'), 'shared timer instance');
    t.ok(L(['A POS(M1) (Y)', 'B POS(M1) (Z)']).includes('edge_bit_reused'), 'edge bit reused');
    t.ok(L(['Stop /Stop (Y)']).includes('nc_on_nc_stop'), 'NC contact on an NC-wired stop');
    t.ok(!L(['Stop (Y)']).includes('nc_on_nc_stop'), 'NO contact on stop is fine');
    t.ok(L(['A ADD(W1,1,W1)']).includes('add_without_edge'), 'ADD without edge');
    t.ok(!L(['A POS(M1) ADD(W1,1,W1)']).includes('add_without_edge'), 'ADD behind edge');
    const p = SC.dsl.parseProgram(['[A | B] (Y)']);
    p.rungs[0].vb.pop();
    t.ok(SC.lint(p, TAGS).some((x) => x.id === 'branch_open'), 'branch opened but not closed');
    t.eq(L(['[A | Y] /Stop (Y)']).join(','), 'nc_on_nc_stop', 'only the expected lint on a seal-in');
  });

  T.suite('determinism and purity', (t) => {
    const prog = SC.dsl.parseProgram([
      '[A | Y] Stop TON(DB_T,T#300ms) (Y)', 'B POS(M1) ADD(W1,1,W1)', 'C CTU(DB_C,5,Stop) (Z)', 'A TP(DB_P,T#200ms) (X)',
    ]);
    const c = SC.compile(prog, { tags: TAGS });
    function run(seed) {
      const o = { rng: SC.prng.seedOf(seed) };
      let st = SC.newState();
      for (let i = 0; i < 3000; i++) {
        st = SC.cloneState(st);
        st.I[0] = SC.prng.next(o) < 0.2 ? 1 : 0;
        st.I[1] = SC.prng.next(o) < 0.2 ? 1 : 0;
        st.I[2] = SC.prng.next(o) < 0.2 ? 1 : 0;
        st.I[3] = SC.prng.next(o) < 0.9 ? 1 : 0;
        st = SC.scan(c, st);
      }
      return SC.fingerprint(st);
    }
    t.eq(run(7), run(7), 'same seed, same inputs -> identical state after 3000 scans');
    t.ok(run(7) !== run(8), 'different seed gives a different run');
    const st = SC.newState(); st.I[0] = 1;
    const before = SC.fingerprint(st);
    SC.scan(c, st);
    t.eq(SC.fingerprint(st), before, 'scan() does not touch its input state');
    const a = SC.prng.next({ rng: SC.prng.seedOf(1) }), b = SC.prng.next({ rng: SC.prng.seedOf(1) });
    t.eq(a, b, 'PRNG is deterministic');
  });
})();

<script>
/* ==== src/selftest/20-unit-plant.js ==== */
/* Unit tests for the plant model, the sim and the scenario runner. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const T = SC.test;

  const DEMO = SC.demo.lines, DEMO_TAGS = SC.demo.tags;

  function mkSim(lines, plant, tags, extra) {
    const level = Object.assign({ tags: tags || DEMO_TAGS, plant: plant || {} }, extra || {});
    return SC.sim.create({ level, program: SC.dsl.parseProgram(lines), seed: 5, scenario: {} });
  }

  T.suite('plant: conveyor, accumulation, hardwired safety', (t) => {
    let s = mkSim(['(Conveyor_Motor)'], { bottlesPerMin: 60 });
    s.runUntil(3000);
    t.ok(s.P.bottles.length > 0 && s.P.bottles[0].x > 300, 'motor on: bottles move down the line', JSON.stringify(s.P.bottles.map((b) => Math.round(b.x))));
    s = mkSim(['(Conveyor_Motor)'], { bottlesPerMin: 60 });
    s.runUntil(1000);
    const x0 = s.P.bottles[0].x;
    s.step(); s.step();
    t.ok(s.P.bottles[0].x > x0, 'moves 1.5 mm per scan');
    t.ok(Math.abs((s.P.bottles[0].x - x0) - 3) < 0.01, 'speed is 150 mm/s', String(s.P.bottles[0].x - x0));

    s = mkSim(['Run (Conveyor_Motor)'], { bottlesPerMin: 60 }, DEMO_TAGS);
    s.runUntil(500);
    t.eq(s.P.counts.dist, 0, 'motor off: nothing moves');

    // queue never overlaps
    s = mkSim(['/Busy (Conveyor_Motor)', 'PE_Fill (Busy)'], { bottlesPerMin: 90, jitterMs: 0 });
    s.runUntil(20000);
    const xs = s.P.bottles.map((b) => b.x).sort((a, b) => a - b);
    let minGap = 1e9; for (let i = 1; i < xs.length; i++) minGap = Math.min(minGap, xs[i] - xs[i - 1]);
    t.ok(xs.length > 3 && minGap >= 99.9, 'bottles queue up without overlapping (min gap 100 mm)', 'minGap=' + minGap);

    // E-stop cuts motor power even if the ladder keeps the output on
    s = mkSim(['(Conveyor_Motor)'], { bottlesPerMin: 60 });
    s.runUntil(2000);
    SC.plant.applyEvent(s.P, { estop: true });
    s.step();
    const d = s.P.counts.dist;
    s.runUntil(4000);
    t.eq(s.P.counts.dist, d, 'E-stop: motor power is cut by the safety relay, bad program or not');
    t.eq(s.read('Conveyor_Motor'), 1, 'the PLC output bit itself is still 1 (the PLC is graded on its own logic)');
    t.eq(s.read('EStop_OK'), 0, 'EStop_OK = 0');
    SC.plant.applyEvent(s.P, { estop: false });
    s.step(); s.step();
    t.eq(s.read('EStop_OK'), 1, 'released: relay closes again (auto reset) — the PLC must prevent the restart');
    SC.plant.applyEvent(s.P, { door: 'open' });
    s.step(); s.step();
    t.eq([s.read('Door_Closed'), s.read('EStop_OK'), s.P.relayOpen], [0, 1, true], 'door open: Door_Closed = 0, EStop_OK stays 1, but the relay still cuts motor power');
  });

  T.suite('plant: stopper, filler, level', (t) => {
    // forced start: Start_PB forced on -> demo program runs the line
    let s = mkSim(DEMO, { bottlesPerMin: 30, convLen: 800 });
    s.force('Start_PB', 1);
    s.runUntil(40000);
    t.ok(s.P.counts.filled >= 6, 'demo program fills bottles (forcing Start_PB moves the line)', 'filled=' + s.P.counts.filled);
    t.eq(s.P.counts.spills, 0, 'no spills with a 3.0 s fill');
    t.ok(s.P.counts.out >= 1, 'bottles leave the line');
    t.eq(s.P.counts.badShipped, 0, 'every shipped bottle was filled');

    // timed fill levels
    function fillFor(ms, mul) {
      const lv = { tags: ['Fill_Valve', 'PE_Fill', 'Conveyor_Motor'], plant: { bottlesPerMin: 30, preload: [{ x: 500 }], genOn: false } };
      const q = SC.sim.create({ level: lv, program: SC.dsl.parseProgram([]), seed: 1, scenario: {} });
      q.P.bottles[0].flowMul = mul || 1;
      const out = { Fill_Valve: 1 };
      for (let i = 0; i < ms / 10; i++) SC.plant.stepMut(q.P, out, 10);
      out.Fill_Valve = 0; SC.plant.stepMut(q.P, out, 10);
      return q;
    }
    let q = fillFor(3000);
    t.ok(Math.abs(q.P.bottles[0].level - 0.9) < 0.005, '3.0 s of fill valve = 90 % level', String(q.P.bottles[0].level));
    t.eq(q.P.sens.Level_OK, 1, 'Level_OK = 1 at 90 %');
    t.eq(q.P.counts.spills, 0, 'no overflow');
    q = fillFor(2500);
    t.eq(q.P.sens.Level_OK, 0, '2.5 s: underfilled, Level_OK = 0');
    q = fillFor(3600);
    t.eq(q.P.counts.spills, 1, '3.6 s: overflow counted once');
    t.eq(q.P.bottles[0].level, 1, 'level clamps at capacity');

    // valve open without bottle = spill
    q = fillFor(100);
    q.P.bottles.length = 0;
    SC.plant.stepMut(q.P, { Fill_Valve: 1 }, 10);
    t.eq(q.P.counts.spills, 1, 'valve open with no bottle under the nozzle counts a spill');

    // stopper holds a bottle at the filler
    s = mkSim(['(Conveyor_Motor)', '(Stopper_SOL)'], { bottlesPerMin: 60 }, ['Conveyor_Motor', 'Stopper_SOL', 'PE_Fill', 'Stopper_Ext', 'Stopper_Ret']);
    s.runUntil(6000);
    const lead = s.P.bottles[0];
    t.ok(Math.abs(lead.x - 500) < 0.01, 'extended stopper holds the first bottle at the nozzle (x = 500)', String(lead.x));
    t.eq([s.read('PE_Fill'), s.read('Stopper_Ext'), s.read('Stopper_Ret')], [1, 1, 0], 'PE_Fill on, Stopper_Ext on, Stopper_Ret off');
    t.ok(s.P.bottles.length >= 3, 'the others queue behind it');
  });

  T.suite('plant: cylinders, faults, reject, encoder', (t) => {
    const tags = ['Conveyor_Motor', 'Stopper_SOL', 'Stopper_Ext', 'Stopper_Ret', 'Air_OK', 'Reject_Pusher', 'PE_Reject', 'Conv_Encoder', 'PE_Fill'];
    function sim(lines, plant) { return mkSim(lines, plant, tags); }
    let s = sim(['(Stopper_SOL)'], { genOn: false });
    s.runUntil(380);
    t.eq(s.read('Stopper_Ext'), 0, 'stopper still travelling at 380 ms');
    s.runUntil(420);
    t.eq(s.read('Stopper_Ext'), 1, 'stopper extended after about 400 ms');
    s = sim(['(Stopper_SOL)'], { genOn: false });
    SC.plant.setFault(s.P, 'airLow', null, true);
    s.runUntil(900);
    t.eq(s.read('Stopper_Ext'), 0, 'airLow: travel time x3 (not yet at 0.9 s)');
    s.runUntil(1300);
    t.eq(s.read('Stopper_Ext'), 1, 'airLow: extended by 1.3 s');
    s = sim(['(Stopper_SOL)'], { genOn: false });
    s.runUntil(200);
    SC.plant.setFault(s.P, 'airLost', null, true);
    s.runUntil(1500);
    t.eq([s.read('Stopper_Ext'), s.read('Air_OK')], [0, 0], 'airLost: cylinder frozen, Air_OK = 0');

    // reject pusher removes a bottle standing at the reject station; neighbours untouched
    s = sim(['(Reject_Pusher)'], { genOn: false, preload: [{ x: 1320, level: 0.9 }, { x: 1220, level: 0.9 }, { x: 1420, level: 0.9 }] });
    s.runUntil(300);
    t.eq(s.P.counts.rejected, 1, 'pusher pulse rejects exactly one bottle');
    t.eq(s.P.bottles.map((b) => Math.round(b.x)).sort().join(','), '1220,1420', 'the neighbours stay on the line');
    t.eq(s.P.counts.goodLost, 1, 'pushing a good (filled) bottle counts goodLost');

    // encoder: one rising edge per 50 mm
    s = sim(['(Conveyor_Motor)'], { genOn: false });
    let edges = 0, prev = s.read('Conv_Encoder');
    for (let i = 0; i < 400; i++) { s.step(); const v = s.read('Conv_Encoder'); if (v && !prev) edges++; prev = v; }
    // 400 scans * 1.5 mm = 600 mm -> 12 pitches
    t.ok(edges === 11 || edges === 12, 'encoder gives one rising edge per pitch (600 mm = 12 edges)', 'edges=' + edges);

    // photo-eye faults
    s = sim(['(Conveyor_Motor)'], { genOn: false });
    SC.plant.setFault(s.P, 'peStuckOn', 'PE_Fill', true);
    s.step(); s.step();
    t.eq(s.read('PE_Fill'), 1, 'peStuckOn: PE_Fill = 1 with no bottle');
  });

  T.suite('plant: capper, sealer, labeler', (t) => {
    const lv = (extra) => Object.assign({ tags: ['Capper_Run', 'Sealer_Enable', 'Labeler_Trig', 'Cap_Present', 'Foil_Present'], plant: { stations: ['infeed', 'filler', 'capper', 'sealer', 'labeler', 'exit'], genOn: false } }, extra || {});
    const mk = (plant, lines) => SC.sim.create({ level: lv({ plant: Object.assign({ stations: ['infeed', 'filler', 'capper', 'sealer', 'labeler', 'exit'], genOn: false }, plant) }), program: SC.dsl.parseProgram(lines), seed: 1, scenario: {} });
    let s = mk({ preload: [{ x: 760, level: 0.9 }] }, ['(Capper_Run)']);
    s.runUntil(600);
    t.eq(s.P.bottles[0].capped, true, 'capper stroke caps the bottle at the capper');
    s = mk({ preload: [{ x: 300 }] }, ['(Capper_Run)']);
    s.runUntil(600);
    t.eq(s.P.counts.wastedCaps, 1, 'capper stroke with no bottle wastes a cap');
    s = mk({ preload: [{ x: 1000, capped: true }] }, ['(Sealer_Enable)']);
    s.runUntil(500);
    t.eq(s.P.bottles[0].sealed, true, 'sealer seals a capped bottle');
    s.runUntil(2600);
    t.eq([s.P.counts.melted, s.P.bottles[0].sealed], [1, false], 'a bottle stalled under the coil for > 2 s melts');
    s = mk({ preload: [{ x: 1180, level: 0.9 }] }, ['(Labeler_Trig)']);
    s.runUntil(100);
    t.eq(s.P.bottles[0].labeled, true, 'labeler trigger labels the bottle in front of it');
  });

  T.suite('scenario runner', (t) => {
    const level = { tags: DEMO_TAGS.concat(['Level_OK']), plant: { bottlesPerMin: 30 } };
    const prog = SC.dsl.parseProgram(DEMO);
    let r = SC.scenario.runScenario(level, prog, {
      id: 'x', seed: 1, durationMs: 4000,
      events: [{ t: 0, press: 'Start_PB', ms: 500 }],
      asserts: [
        { t: 1000, expect: { Run: true }, msg: { en: 'run', ar: 'تشغيل' } },
        { t: 1000, expect: { Conveyor_Motor: true } },
        { window: [0, 4000], never: { spills: { gte: 1 } } },
      ],
    });
    t.ok(r.pass, 'passing scenario passes', JSON.stringify(r.failures[0] || ''));
    r = SC.scenario.runScenario(level, prog, {
      id: 'y', seed: 1, durationMs: 3000,
      events: [{ t: 0, press: 'Start_PB', ms: 500 }],
      asserts: [{ t: 1000, expect: { Conveyor_Motor: false }, msg: { en: 'must be off', ar: 'لازم off' } }],
    });
    t.ok(!r.pass && r.firstFailure.msg.en === 'must be off', 'failing assertion is reported with its message');
    t.eq(r.firstFailure.actual, { Conveyor_Motor: 1 }, 'failure carries the actual value');
    r = SC.scenario.runScenario(level, prog, {
      id: 'z', seed: 1, durationMs: 3000, events: [{ t: 0, press: 'Start_PB', ms: 500 }],
      asserts: [{ when: { Run: true }, within: 100, expect: { Conveyor_Motor: true } }, { when: { Run: true }, within: 1, expect: { Fill_Valve: true }, tol: 0 }],
    });
    t.eq(r.failures.length, 1, 'when/within: second obligation fails, first passes');
    r = SC.scenario.runScenario(level, prog, { id: 'k', seed: 1, durationMs: 100, events: [], asserts: [{ t: 10, expect: { NoSuchTag: true } }] });
    t.ok(!r.pass && r.failures[0].kind === 'bad_scenario', 'unknown keys in a scenario are flagged');
    // determinism of whole runs
    const sc = { id: 'd', seed: 77, durationMs: 15000, events: [{ t: 0, press: 'Start_PB', ms: 300 }], asserts: [] };
    const a = SC.scenario.runScenario(level, prog, sc, { keepSim: true }), b = SC.scenario.runScenario(level, prog, sc, { keepSim: true });
    t.eq(SC.fingerprint(a.sim.st) + JSON.stringify(a.sim.P), SC.fingerprint(b.sim.st) + JSON.stringify(b.sim.P), 'same seed -> identical plant and PLC state after a 15 s run');
    // forces block passing
    const lv2 = Object.assign({ scenarios: [{ id: 'q', seed: 1, durationMs: 500, events: [], asserts: [] }] }, level);
    const rl = SC.scenario.runLevel(lv2, prog, { forces: { Start_PB: 1 } });
    t.ok(!rl.pass, 'a level cannot pass while forces are active');
  });
})();
