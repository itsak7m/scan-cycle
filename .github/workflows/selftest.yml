name: self-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the self-test (headless Chrome)
        run: python tools/selftest.py
      - name: index.html is up to date
        run: |
          python tools/build.py
          git diff --exit-code index.html || (echo "index.html is stale: run python tools/build.py and commit" && exit 1)
