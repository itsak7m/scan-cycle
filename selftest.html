<!doctype html>
<html lang="en" dir="ltr">
<head>

<meta name="description" content="Scan Cycle — a game that teaches PLC ladder logic on a bottling line.">
<title>Scan Cycle — self-test</title>
<style>
[hidden] { display: none !important; }
/* ---------- layout ---------- */
button { font: inherit; color: inherit; }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
.top .ttl { font-size: 1.05rem; }
.grow { flex: 1; }
.btn { min-height: 44px; min-width: 44px; padding: 0 14px; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { background: var(--ground); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn.small { min-height: 32px; padding: 0 10px; font-size: .85rem; }
.btn.primary { background: var(--power); color: var(--surface); border-color: var(--power); }
:focus-visible { outline: 3px solid var(--power); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 8px; font-size: .95rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card h4 { margin: 8px 0 6px; font-size: .85rem; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: .82rem; } .warn { color: var(--alarm); }
.level-grid { display: grid; grid-template-columns: minmax(270px, 340px) 1fr; gap: 12px; padding: 12px; max-width: 1500px; margin: 0 auto; align-items: start; }
.workorder { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
.ar-block { margin-top: 10px; padding: 10px; background: var(--ground); border-radius: 6px; line-height: 1.7; }
@media (max-width: 920px) {
  .level-grid { grid-template-columns: 1fr; padding: 8px; }
  .workorder { position: static; max-height: none; order: 2; }
  .stage { order: 1; }
}
.plant { width: 100%; aspect-ratio: 960 / 280; display: block; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.ctrls { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.ctrls .sp { flex: 1; }
.spd { min-height: 44px; min-width: 44px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-family: var(--mono); }
.spd.sel { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.forces { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--alarm); color: #fff; border-radius: 6px; font-weight: 700; }
.forces .btn { color: var(--ink); }

/* ---------- operator panel ---------- */
.pbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.pbtn { min-height: 52px; min-width: 96px; padding: 4px 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; user-select: none; }
.pbtn .pb-name { font-weight: 700; font-size: .9rem; }
.pbtn .pb-sub { font-size: .7rem; color: var(--muted); font-family: var(--mono); }
.pbtn.down { background: var(--ink); color: var(--surface); }
.pbtn.down .pb-sub { color: var(--surface); }
.pb-estop { border-color: var(--alarm); border-width: 3px; }
.pb-estop.down { background: var(--alarm); border-color: var(--alarm); }

/* ---------- I/O LED strip ---------- */
.leds { display: flex; flex-wrap: wrap; gap: 6px; }
.led { position: relative; min-height: 44px; padding: 2px 8px 2px 26px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); cursor: default; display: grid; grid-template-columns: auto auto; column-gap: 8px; align-items: center; text-align: left; font-family: var(--mono); font-size: .74rem; }
.led:not(.led-out) { cursor: pointer; }
.led .led-dot { position: absolute; left: 7px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border: 2px solid var(--muted); border-radius: 2px; }
.led .led-name { font-weight: 700; grid-column: 1; }
.led .led-addr { color: var(--muted); grid-column: 1; font-size: .66rem; }
.led .led-val { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; font-size: .9rem; }
.led.on { border-color: var(--power); }
.led.on .led-dot { background: var(--power); border-color: var(--power); }
.led.on .led-val { color: var(--power); }
.led .led-lock { display: none; position: absolute; right: 2px; top: 0; font-size: .7rem; }
.led.forced { border-width: 3px; border-color: var(--alarm); }
.led.forced .led-lock { display: block; }
.io-group { margin-bottom: 6px; }

/* ---------- map ---------- */
.mapwrap { max-width: 1000px; margin: 0 auto; padding: 18px 14px 40px; }
.mapwrap h1 { margin: 6px 0 4px; }
.lead { margin: 0 0 18px; font-size: 1.05rem; color: var(--muted); }
.levelmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 18px; }
.lvl { min-height: 92px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.lvl:hover { border-color: var(--ink); }
.lvl b { font-family: var(--mono); font-size: 1.1rem; }
.lvl.sbx { border-style: dashed; }
.prog-text { font-family: var(--mono); font-size: .8rem; white-space: pre-wrap; margin: 0; }

/* ---------- tag table / transfer ---------- */
.tbl-wrap { overflow-x: auto; }
table.tags { border-collapse: collapse; width: 100%; font-size: .82rem; }
table.tags th, table.tags td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: middle; }
table.tags th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; }
table.tags input { width: 100%; min-height: 34px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); padding: 0 6px; font: inherit; }
table.tags tr.user td:first-child input { font-family: var(--mono); font-weight: 700; }
.mono { font-family: var(--mono); }
.code { background: var(--ground); padding: 10px; border-radius: 6px; overflow: auto; font-size: .8rem; }
.tabs { display: flex; gap: 6px; margin: 8px 0; }
.tab { min-height: 40px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 600; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
details > summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.rung-grid.static .cell { cursor: default; }
.rung-grid.static .cell:hover { background: none; }

:root {
  --ground: #E9ECEC; --surface: #F7F8F8; --ink: #14262D; --muted: #5E7279; --line: #C6D0D2;
  --power: #0B6E78; --alarm: #B3461E; --ok: #2F6B4C; --amber: #9A6B12;
  --font: system-ui, "Segoe UI", "SF Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  --mono: ui-monospace, Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101A1E; --surface: #17252A; --ink: #E3ECEE; --muted: #9DB1B7; --line: #2C4249;
    --power: #3FC1CE; --alarm: #FF8A5C; --ok: #6FCB98; --amber: #E0B04A;
  }
}
:root[data-theme="dark"] {
  --ground: #101A1E; --surface: #17252A; --ink: #E3ECEE; --muted: #9DB1B7; --line: #2C4249;
  --power: #3FC1CE; --alarm: #FF8A5C; --ok: #6FCB98; --amber: #E0B04A;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
code, pre { font-family: var(--mono); }
.stub, .selftest { max-width: 1100px; margin: 1rem auto; padding: 1rem 1.25rem; }
.selftest table { border-collapse: collapse; width: 100%; font-size: 13px; }
.selftest th, .selftest td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
.selftest tr.bad td { background: color-mix(in srgb, var(--alarm) 18%, transparent); }
.selftest tr.ok td:first-child { color: var(--ok); font-weight: 600; }
.selftest tr.bad td:first-child { color: var(--alarm); font-weight: 700; }
.st-good { color: var(--ok); } .st-bad { color: var(--alarm); }

/* ---------- ladder editor ---------- */
.ladder-mount { min-height: 80px; }
.ld-tb { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.chip-st { padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; border: 1.5px solid currentColor; }
.chip-st.ok { color: var(--ok); } .chip-st.warn { color: var(--amber); } .chip-st.bad { color: var(--alarm); }
.rung { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; background: var(--ground); }
.rung-head { display: flex; gap: 6px; padding: 4px 8px; align-items: center; }
.rung-n { font-weight: 700; font-family: var(--mono); font-size: .8rem; white-space: nowrap; }
.rung-note { flex: 1; min-width: 60px; min-height: 36px; border: 1px solid transparent; background: transparent; color: var(--ink); padding: 0 6px; border-radius: 4px; font: inherit; }
.rung-note:hover, .rung-note:focus { border-color: var(--line); background: var(--surface); }
.rung-scroll { overflow-x: auto; padding: 4px 8px 10px; }
.rung-grid { position: relative; }
.rowwrap { display: contents; }
.rail { position: absolute; top: 0; bottom: 0; width: 5px; background: var(--ink); border-radius: 2px; }
.rail.left { left: 4px; } .rail.right { right: 4px; }
.cell { position: absolute; cursor: pointer; border-radius: 4px; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.cell.filled { touch-action: none; }
.cell:hover { background: color-mix(in srgb, var(--power) 9%, transparent); }
.cell.sel { outline: 2px solid var(--power); outline-offset: -2px; }
.cell:focus-visible { outline: 3px solid var(--power); outline-offset: -2px; }
.cell.dragging { opacity: .35; }
.cell.drop { outline: 3px dashed var(--power); outline-offset: -3px; }
.cell svg { display: block; overflow: visible; pointer-events: none; }
:is(.cell, .ico, .drag-ghost) .w-in, :is(.cell, .ico, .drag-ghost) .w-out { stroke: var(--muted); stroke-width: 1.6; fill: none; }
:is(.cell, .ico, .drag-ghost) .sym { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; }
:is(.cell, .ico, .drag-ghost) .sym.blk { fill: var(--surface); }
:is(.cell, .ico, .drag-ghost) .sym-fill { fill: none; stroke: none; }
:is(.cell, .ico, .drag-ghost) text { fill: var(--ink); font-family: var(--mono); }
.c-tag { font-size: 9.5px; font-weight: 700; }
.c-addr, .c-state { font-size: 8.5px; fill: var(--muted) !important; }
.sym-t { font-size: 11px; font-weight: 700; }
.blk-h { font-size: 11px; font-weight: 700; }
.blk-p { font-size: 9px; }
.blk-live { font-size: 9px; font-weight: 700; fill: var(--power) !important; }
.c-warn { font-size: 11px; fill: var(--amber) !important; } .c-warn.err { fill: var(--alarm) !important; }
.cell.has-msg { background: color-mix(in srgb, var(--amber) 10%, transparent); }
/* power flow: bold line + filled symbol + ON text  vs  thin + hollow + OFF text */
.cell[data-pin="1"] .w-in { stroke: var(--power); stroke-width: 4.5; }
.cell[data-pout="1"] .w-out { stroke: var(--power); stroke-width: 4.5; }
.cell[data-pout="1"] .sym { stroke: var(--power); stroke-width: 3; }
.cell[data-pout="1"] .sym-fill { fill: var(--power); opacity: .85; }
.cell[data-pout="1"] .c-state { fill: var(--power) !important; font-weight: 700; }
.cell[data-pout="1"] .sym.blk { fill: color-mix(in srgb, var(--power) 14%, var(--surface)); }
.vbar { position: absolute; width: 4px; background: var(--muted); border-radius: 2px; pointer-events: none; }
.vbar[data-on="1"] { background: var(--power); width: 7px; margin-left: -1.5px; }
.bh { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; line-height: 1; padding: 0; opacity: 0; cursor: pointer; z-index: 3; }
.bh::after { content: ''; position: absolute; inset: -11px; }
.bh.on { opacity: .0; }
.rung:hover .bh, .rung:focus-within .bh { opacity: .75; }
@media (hover: none) { .bh { opacity: .6; } }
.ld-issues { margin-top: 6px; }
.iss { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 6px; cursor: pointer; font-size: .85rem; border-radius: 4px; }
.iss:hover { background: var(--ground); }
.iss.error { color: var(--alarm); } .iss.warn { color: var(--amber); }
.ld-keys { margin-top: 8px; }
.drag-ghost { position: fixed; z-index: 90; pointer-events: none; opacity: .9; background: var(--surface); border: 1px solid var(--power); border-radius: 4px; }

/* ---------- palette popover / dialogs ---------- */
.pal { position: absolute; z-index: 60; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 8px; padding: 8px 10px; width: min(540px, 94vw); box-shadow: 0 8px 28px rgba(0, 0, 0, .25); max-height: 80vh; overflow: auto; }
.pal.sheet { position: fixed; left: 0; right: 0; bottom: 0; top: auto !important; width: auto; border-radius: 14px 14px 0 0; max-height: 72vh; }
.pal-head { display: flex; justify-content: space-between; align-items: center; }
.pal h5 { margin: 8px 0 4px; font-size: .78rem; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.pal-btn { min-height: 66px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 2px; font-family: var(--mono); font-size: .72rem; }
.pal-btn:hover, .pal-btn:focus-visible { border-color: var(--power); background: var(--ground); }
.pal-btn kbd { font-size: .62rem; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; color: var(--muted); }
.pal-actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
.modal-back { position: fixed; inset: 0; background: rgba(10, 20, 24, .5); display: grid; place-items: center; z-index: 100; padding: 10px; }
.modal { background: var(--surface); border-radius: 10px; padding: 16px 18px; width: min(540px, 100%); max-height: 92vh; overflow: auto; border: 1.5px solid var(--ink); }
.modal-t { margin: 0 0 6px; }
.modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.frow { display: block; margin: 12px 0; }
.flab { display: block; font-weight: 700; font-size: .85rem; margin-bottom: 3px; }
.frow input, .frow select { width: 100%; min-height: 44px; padding: 0 10px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--surface); color: var(--ink); font-family: var(--mono); font-size: 1rem; }
.err { color: var(--alarm); min-height: 1em; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { min-height: 36px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-family: var(--mono); }
.ask { padding: 8px; background: var(--ground); border-radius: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; max-width: 90vw; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

</style>

<script>
/* ==== src/core/prng.js ==== */
/* Namespace + seeded PRNG (mulberry32). No Math.random anywhere in core. */
(function () {
  'use strict';
  const SC = (globalThis.SC = globalThis.SC || {});
  SC.SCAN_MS = 10;

  // The generator state lives in the owner object as an int field `rng`,
  // so a state object stays a plain, clonable value (pure functions stay pure).
  function next(o) {
    o.rng = (o.rng + 0x6D2B79F5) | 0;
    let t = o.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const range = (o, lo, hi) => lo + (hi - lo) * next(o);
  const int = (o, lo, hi) => lo + Math.floor(next(o) * (hi - lo + 1));
  const seedOf = (n) => (Math.imul(n | 0, 0x9E3779B1) ^ 0x85EBCA6B) | 0;

  SC.prng = { next, range, int, seedOf };

  // small shared helpers (pure)
  SC.util = {
    clone: (x) => JSON.parse(JSON.stringify(x)),
    isObj: (x) => x !== null && typeof x === 'object' && !Array.isArray(x),
    clamp: (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x),
  };
})();

</script>
<script>
/* ==== src/core/addr.js ==== */
/* Time literals (T#3s), addresses (Siemens I0.0 / CODESYS %IX0.0), tag tables. Pure. */
(function () {
  'use strict';
  const SC = globalThis.SC;

  // ---------------------------------------------------------------- time
  const UNIT_MS = { ms: 1, s: 1000, m: 60000, h: 3600000, d: 86400000 };

  // "T#3s", "T#500ms", "T#1m30s", "T#1.5s" -> ms ; anything else -> null
  function parseTime(x) {
    if (typeof x !== 'string') return null;
    const m = /^T#(.+)$/i.exec(x.trim());
    if (!m) return null;
    const body = m[1].toLowerCase().replace(/_/g, '');
    const re = /(\d+(?:\.\d+)?)(ms|s|m|h|d)/y;
    let i = 0, total = 0, n = 0;
    while (i < body.length) {
      re.lastIndex = i;
      const k = re.exec(body);
      if (!k) return null;
      total += parseFloat(k[1]) * UNIT_MS[k[2]];
      i = re.lastIndex;
      n++;
    }
    return n ? Math.round(total) : null;
  }

  function formatTime(ms) {
    ms = Math.max(0, Math.round(ms));
    if (ms === 0) return 'T#0ms';
    let out = 'T#';
    const parts = [['d', 86400000], ['h', 3600000], ['m', 60000], ['s', 1000], ['ms', 1]];
    for (const [u, f] of parts) {
      const q = Math.floor(ms / f);
      if (q > 0) { out += q + u; ms -= q * f; }
    }
    return out;
  }

  // ---------------------------------------------------------------- addresses
  const N_BITS = 256, N_WORDS = 256;

  // returns {kind:'bit',arr,byte,bit,idx,canon} | {kind:'word',arr,idx,canon} | null
  function parseAddr(s) {
    if (typeof s !== 'string') return null;
    s = s.trim();
    let m = /^%?([IQM])X?(\d{1,2})\.([0-7])$/i.exec(s);
    if (m) {
      const arr = m[1].toUpperCase(), byte = +m[2], bit = +m[3];
      if (byte > 31) return null;
      return { kind: 'bit', arr, byte, bit, idx: byte * 8 + bit, canon: arr + byte + '.' + bit };
    }
    m = /^%?(IW|QW|MW)(\d{1,3})$/i.exec(s);
    if (m) {
      const arr = m[1].toUpperCase(), n = +m[2];
      if (n >= N_WORDS) return null;
      return { kind: 'word', arr, idx: n, canon: arr + n };
    }
    return null;
  }

  // canonical (Siemens) -> CODESYS display
  function toCodesys(canon) {
    const a = parseAddr(canon);
    if (!a) return canon;
    return a.kind === 'bit' ? `%${a.arr}X${a.byte}.${a.bit}` : `%${a.arr}${a.idx}`;
  }

  // ---------------------------------------------------------------- tags
  // tag: {name, addr, type:'Bool'|'Int', wiring?:'NO'|'NC', role?, desc?:{en,ar}, user?:bool}
  function makeTagMap(tags) {
    const byName = Object.create(null), byAddr = Object.create(null);
    for (const t of tags || []) {
      byName[t.name] = t;
      const a = parseAddr(t.addr);
      if (a) byAddr[a.canon] = t;
    }
    return { byName, byAddr };
  }

  // Next free memory bit / word for auto-created user tags.
  function nextFreeAddr(tags, kind) {
    const used = new Set((tags || []).map((t) => (parseAddr(t.addr) || {}).canon));
    if (kind === 'word') {
      for (let n = 10; n <= 40; n += 2) if (!used.has('MW' + n)) return 'MW' + n;
      return null;
    }
    for (let byte = 0; byte <= 9; byte++) for (let bit = 0; bit < 8; bit++) {
      const c = `M${byte}.${bit}`;
      if (!used.has(c)) return c;
    }
    return null;
  }

  SC.addr = { parseTime, formatTime, parseAddr, toCodesys, makeTagMap, nextFreeAddr, N_BITS, N_WORDS };
})();

</script>
<script>
/* ==== src/core/dsl.js ==== */
/* Ladder text notation -> program JSON. Used for fixtures, examples and hints.
 *
 *   rung    :=  item*
 *   item    :=  element | '[' branch ('|' branch)+ ']'        (groups are not nested)
 *   element :=  tag            NO contact          /tag   NC contact
 *               (tag)          coil                (S:tag) set    (R:tag) reset
 *               NAME(a,b,..)   TON(DB_T,T#3s) CTU(DB_C,12,Reset_PB) CMP(>=,MW10,5) MOVE(5,MW10) POS(M0.0) ...
 *
 * Example (seal-in):  "[Start_PB | Motor] /Stop_PB (Motor)"   (NC contact = /tag)
 *
 * Program JSON:  {v:1, rungs:[{rows, cols, els:[{r,c,t,...params}], vb:[[boundary,gap],...], note?}]}
 */
(function () {
  'use strict';
  const SC = globalThis.SC;

  // instruction name -> ordered parameter keys
  const PARAMS = {
    NO: ['a'], NC: ['a'], OUT: ['a'], SET: ['a'], RST: ['a'], POS: ['a'], NEG: ['a'],
    TON: ['i', 'pt'], TOF: ['i', 'pt'], TP: ['i', 'pt'], TONR: ['i', 'pt', 'rs'],
    CTU: ['i', 'pv', 'rs'], CTD: ['i', 'pv', 'ld'], CTUD: ['i', 'pv', 'cd', 'rs', 'ld'],
    CMP: ['op', 'a', 'b'], MOVE: ['a', 'o'], ADD: ['a', 'b', 'o'], SUB: ['a', 'b', 'o'],
    SHL: ['w', 'b'], SHR: ['w', 'b'],
  };

  function fail(msg) { throw new Error('ladder text: ' + msg); }

  function tokenize(s) {
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (ch === '[' || ch === ']' || ch === '|') { toks.push({ k: ch }); i++; continue; }
      if (ch === '(') {
        const j = s.indexOf(')', i);
        if (j < 0) fail('missing ) in ' + s);
        toks.push({ k: 'coil', v: s.slice(i + 1, j).trim() });
        i = j + 1;
        continue;
      }
      const m = /^\/?[A-Za-z_%][\w.%]*/.exec(s.slice(i));
      if (!m) fail('unexpected "' + s.slice(i, i + 8) + '"');
      let word = m[0];
      i += word.length;
      if (s[i] === '(') {
        const j = s.indexOf(')', i);
        if (j < 0) fail('missing ) after ' + word);
        toks.push({ k: 'call', name: word, args: s.slice(i + 1, j).split(',').map((x) => x.trim()) });
        i = j + 1;
      } else if (word[0] === '/') {
        toks.push({ k: 'el', el: { t: 'NC', a: word.slice(1) } });
      } else {
        toks.push({ k: 'el', el: { t: 'NO', a: word } });
      }
    }
    return toks;
  }

  const num = (v) => (/^-?\d+$/.test(v) ? parseInt(v, 10) : v);

  function toElement(tok) {
    if (tok.k === 'el') return tok.el;
    if (tok.k === 'coil') {
      const m = /^([SR]):(.+)$/.exec(tok.v);
      if (m) return { t: m[1] === 'S' ? 'SET' : 'RST', a: m[2].trim() };
      return { t: 'OUT', a: tok.v };
    }
    const name = tok.name.toUpperCase();
    const keys = PARAMS[name];
    if (!keys) fail('unknown instruction ' + tok.name);
    const el = { t: name };
    keys.forEach((k, idx) => {
      const v = tok.args[idx];
      if (v === undefined || v === '') return;
      el[k] = (k === 'pv' || k === 'a' || k === 'b') && name !== 'NO' ? num(v) : v;
    });
    // contacts / coils keep strings; CTU/CMP/MOVE/ADD numeric operands become numbers
    if (['NO', 'NC', 'OUT', 'SET', 'RST', 'POS', 'NEG'].includes(name)) el.a = tok.args[0];
    return el;
  }

  // parse into [item], item = {el} | {group:[[el...],[el...]]}
  function parseItems(toks) {
    let p = 0;
    function seq(inGroup) {
      const items = [];
      while (p < toks.length) {
        const t = toks[p];
        if (t.k === '[') {
          if (inGroup) fail('nested [ ] groups are not supported — flatten the branch');
          p++;
          const branches = [];
          let cur = seq(true);
          branches.push(cur);
          while (toks[p] && toks[p].k === '|') { p++; branches.push(seq(true)); }
          if (!toks[p] || toks[p].k !== ']') fail('missing ]');
          p++;
          if (branches.length < 2) fail('a group needs at least two branches');
          items.push({ group: branches.map((b) => b.map((x) => x.el)) });
        } else if (t.k === ']' || t.k === '|') {
          break;
        } else {
          items.push({ el: toElement(t) });
          p++;
        }
      }
      return items;
    }
    const out = seq(false);
    if (p < toks.length) fail('unexpected ' + toks[p].k);
    return out;
  }

  function parseRung(text, note) {
    const items = parseItems(tokenize(text));
    const els = [];
    const vb = [];
    let c = 0, rows = 1, prevGroup = false;
    for (const it of items) {
      if (it.el) {
        els.push(Object.assign({ r: 0, c }, it.el));
        c++;
        prevGroup = false;
      } else {
        if (prevGroup) c++; // spacer column so closing/opening bars never share a boundary
        const W = Math.max(...it.group.map((b) => b.length), 1);
        it.group.forEach((branch, bi) => {
          branch.forEach((el, k) => els.push(Object.assign({ r: bi, c: c + k }, el)));
        });
        for (let g = 0; g < it.group.length - 1; g++) { vb.push([c, g]); vb.push([c + W, g]); }
        rows = Math.max(rows, it.group.length);
        c += W;
        prevGroup = true;
      }
    }
    const rung = { rows, cols: Math.max(c, 1), els, vb };
    if (note) rung.note = note;
    return rung;
  }

  // lines: ["rung text", ...] or [{t:"rung text", note:"..."}]
  function parseProgram(lines) {
    return {
      v: 1,
      rungs: lines.map((l) => (typeof l === 'string' ? parseRung(l) : parseRung(l.t, l.note))),
    };
  }

  SC.dsl = { parseRung, parseProgram, PARAMS };
})();

<script>
/* ==== src/core/compile.js ==== */
/* Program JSON -> runnable form: validates structure, resolves tag names to memory refs.
 *
 * program: {v:1, rungs:[{rows, cols, els:[{r,c,t,...}], vb:[[boundary,gap],...]}]}
 * opts:    {tags:[...], palette:[...]|null, scanMs}
 * result:  {ok, errors:[{code,rung,r,c,msg:{en,ar}}], rungs:[...], insts:{name:{type,rung}}, tagMap, scanMs}
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const A = SC.addr;

  const CONTACTS = ['NO', 'NC'];
  const TIMERS = ['TON', 'TOF', 'TP', 'TONR'];
  const COUNTERS = ['CTU', 'CTD', 'CTUD'];
  const ALL = ['NO', 'NC', 'OUT', 'SET', 'RST', 'POS', 'NEG', 'TON', 'TOF', 'TP', 'TONR',
    'CTU', 'CTD', 'CTUD', 'CMP', 'MOVE', 'ADD', 'SUB', 'SHL', 'SHR'];
  const CMP_OPS = ['==', '<>', '>', '<', '>=', '<='];
  const MAX_ROWS = 6, MAX_COLS = 16;

  // which rows are wire (conducting) when a cell is empty
  function buildWire(rows, cols, barSet) {
    const has = (b, g) => g >= 0 && g <= rows - 2 && barSet.has(b + ',' + g);
    const wire = Array.from({ length: rows }, () => new Array(cols).fill(false));
    wire[0].fill(true);
    const oddRows = [];
    for (let r = 1; r < rows; r++) {
      const att = [];
      for (let b = 0; b <= cols; b++) if (has(b, r - 1) || has(b, r)) att.push(b);
      for (let k = 0; k + 1 < att.length; k += 2) for (let c = att[k]; c < att[k + 1]; c++) wire[r][c] = true;
      if (att.length % 2 === 1) oddRows.push(r);
    }
    return { wire, oddRows };
  }

  // groups of rows joined by bars, per boundary
  function buildComps(rows, cols, barSet) {
    const comps = [];
    for (let b = 0; b <= cols; b++) {
      const list = [];
      let cur = null;
      for (let g = 0; g <= rows - 2; g++) {
        if (barSet.has(b + ',' + g)) {
          if (!cur) { cur = [g]; list.push(cur); }
          cur.push(g + 1);
        } else cur = null;
      }
      comps.push(list);
    }
    return comps;
  }

  function compile(program, opts) {
    opts = opts || {};
    const tags = opts.tags || [];
    const tagMap = A.makeTagMap(tags);
    const palette = opts.palette ? new Set(opts.palette) : null;
    const errors = [];
    const insts = Object.create(null);
    const out = { ok: false, errors, rungs: [], insts, tagMap, scanMs: opts.scanMs || SC.SCAN_MS };
    const E = (code, ri, el, en, ar) => errors.push({ code, rung: ri, r: el ? el.r : undefined, c: el ? el.c : undefined, msg: { en, ar: ar || en } });

    if (!program || !Array.isArray(program.rungs)) {
      E('bad_program', -1, null, 'Program is not valid', 'البرنامج غير صالح');
      return out;
    }

    // pass 1: instance names
    program.rungs.forEach((rg, ri) => {
      for (const e of (rg && rg.els) || []) {
        if ((TIMERS.includes(e.t) || COUNTERS.includes(e.t)) && typeof e.i === 'string' && e.i) {
          const prev = insts[e.i];
          if (!prev) insts[e.i] = { type: e.t, rung: ri, uses: 1 };
          else {
            prev.uses++;
            if (prev.type !== e.t) E('inst_type_clash', ri, e, `Instance ${e.i} is used as ${prev.type} and ${e.t}`, `الاسم ${e.i} مستخدم لنوعين مختلفين`);
          }
        }
      }
    });

    // ---- operand resolution
    function bitRef(tok, ri, el, write) {
      if (typeof tok !== 'string' || !tok) { E('missing_param', ri, el, 'Missing address', 'العنوان ناقص'); return null; }
      let a = null;
      const tag = tagMap.byName[tok];
      if (tag) {
        a = A.parseAddr(tag.addr);
        if (!a || a.kind !== 'bit') { E('type_mismatch', ri, el, `${tok} is not a Bool tag`, `${tok} ليس من نوع Bool`); return null; }
      } else {
        a = A.parseAddr(tok);
        if (a && a.kind !== 'bit') { E('type_mismatch', ri, el, `${tok} is not a bit address`, `${tok} ليس بت`); return null; }
      }
      if (!a) {
        const m = /^([A-Za-z_]\w*)\.(Q|QU|QD)$/.exec(tok);
        if (m && insts[m[1]]) {
          if (write) { E('write_to_output_pin', ri, el, `${tok} cannot be written`, `لا يمكن الكتابة على ${tok}`); return null; }
          return { k: 'iq', name: m[1], f: m[2] };
        }
        E('unknown_tag', ri, el, `Unknown tag "${tok}"`, `الـ tag "${tok}" غير معروف`);
        return null;
      }
      if (write && a.arr === 'I') { E('write_to_input', ri, el, `${tok} is an input — you cannot write to it`, `${tok} مدخل — لا يمكن الكتابة عليه`); return null; }
      return { k: 'b', arr: a.arr, idx: a.idx };
    }

    function intRef(tok, ri, el, write) {
      if (typeof tok === 'number' && !write) return { k: 'c', v: tok | 0 };
      if (typeof tok !== 'string' || !tok) { E('missing_param', ri, el, 'Missing value', 'القيمة ناقصة'); return null; }
      if (!write) {
        if (/^-?\d+$/.test(tok)) return { k: 'c', v: parseInt(tok, 10) };
        if (/^T#/i.test(tok)) {
          const ms = A.parseTime(tok);
          if (ms === null) { E('bad_time', ri, el, `"${tok}" is not a valid time`, `"${tok}" ليس وقتًا صحيحًا`); return null; }
          return { k: 'c', v: ms };
        }
      }
      let a = null;
      const tag = tagMap.byName[tok];
      if (tag) {
        a = A.parseAddr(tag.addr);
        if (!a || a.kind !== 'word') { E('type_mismatch', ri, el, `${tok} is not an Int tag`, `${tok} ليس من نوع Int`); return null; }
      } else {
        a = A.parseAddr(tok);
        if (a && a.kind !== 'word') { E('type_mismatch', ri, el, `${tok} is not a word address`, `${tok} ليس word`); return null; }
      }
      if (!a) {
        const m = /^([A-Za-z_]\w*)\.(ET|CV|PT)$/.exec(tok);
        if (m && insts[m[1]]) {
          if (write) { E('write_to_output_pin', ri, el, `${tok} cannot be written`, `لا يمكن الكتابة على ${tok}`); return null; }
          return { k: 'if', name: m[1], f: m[2] };
        }
        E('unknown_tag', ri, el, `Unknown tag "${tok}"`, `الـ tag "${tok}" غير معروف`);
        return null;
      }
      if (write && a.arr === 'IW') { E('write_to_input', ri, el, `${tok} is an input word`, `${tok} مدخل`); return null; }
      return { k: 'w', arr: a.arr, idx: a.idx };
    }

    function timeParam(e, ri) {
      const ms = typeof e.pt === 'string' ? A.parseTime(e.pt) : null;
      if (ms === null) {
        E('bad_time', ri, e, `PT must be a time literal like T#3s (got ${JSON.stringify(e.pt)})`, `الـ PT لازم يكون وقت مثل T#3s`);
        return 0;
      }
      return ms;
    }

    function optBit(tok, ri, el) { return tok === undefined || tok === null || tok === '' ? null : bitRef(tok, ri, el, false); }

    // ---- per rung
    program.rungs.forEach((rg, ri) => {
      const rows = rg.rows | 0, cols = rg.cols | 0;
      if (rows < 1 || rows > MAX_ROWS || cols < 1 || cols > MAX_COLS) {
        E('bad_rung', ri, null, `Rung ${ri + 1}: bad size`, `الـ rung ${ri + 1} حجمه غير صالح`);
        out.rungs.push(null);
        return;
      }
      const barSet = new Set();
      for (const bg of rg.vb || []) {
        if (bg[0] < 0 || bg[0] > cols || bg[1] < 0 || bg[1] > rows - 2) { E('bad_rung', ri, null, 'Bad vertical bar', 'خط عمودي غير صالح'); continue; }
        barSet.add(bg[0] + ',' + bg[1]);
      }
      if (barSet.size && palette && !palette.has('BRANCH')) E('not_allowed', ri, null, 'Parallel branches are not unlocked yet', 'الفروع المتوازية غير مفعّلة بعد');
      const { wire, oddRows } = buildWire(rows, cols, barSet);
      const grid = Array.from({ length: cols }, () => new Array(rows).fill(null));
      const seen = new Set();
      const list = [];
      for (const e of rg.els || []) {
        if (!ALL.includes(e.t)) { E('bad_element', ri, e, `Unknown element ${e.t}`, `عنصر غير معروف ${e.t}`); continue; }
        if (!(e.r >= 0 && e.r < rows && e.c >= 0 && e.c < cols)) { E('bad_rung', ri, e, 'Element outside the rung grid', 'عنصر خارج الشبكة'); continue; }
        const key = e.r + ',' + e.c;
        if (seen.has(key)) { E('bad_rung', ri, e, 'Two elements in one cell', 'عنصران بنفس الخلية'); continue; }
        seen.add(key);
        if (palette && !palette.has(e.t)) E('not_allowed', ri, e, `${e.t} is not unlocked in this level`, `${e.t} غير مفعّل بهذا المستوى`);
        const x = { t: e.t, r: e.r, c: e.c };
        switch (e.t) {
          case 'NO': case 'NC': x.ra = bitRef(e.a, ri, e, false); break;
          case 'OUT': case 'SET': case 'RST': x.wa = bitRef(e.a, ri, e, true); break;
          case 'POS': case 'NEG': {
            x.ma = bitRef(e.a, ri, e, true);
            if (x.ma && x.ma.arr !== 'M') E('edge_bit_not_m', ri, e, 'Edge memory must be an M bit', 'ذاكرة الـ edge لازم تكون بت M');
            break;
          }
          case 'TON': case 'TOF': case 'TP': case 'TONR':
            x.inst = e.i; x.ptv = timeParam(e, ri);
            if (!e.i) E('missing_param', ri, e, 'Timer needs an instance name', 'المؤقّت يحتاج اسم instance');
            if (e.t === 'TONR') x.rr = optBit(e.rs, ri, e);
            break;
          case 'CTU': case 'CTD': case 'CTUD':
            x.inst = e.i;
            if (!e.i) E('missing_param', ri, e, 'Counter needs an instance name', 'العدّاد يحتاج اسم instance');
            x.pvr = intRef(e.pv === undefined ? 0 : e.pv, ri, e, false);
            if (e.t === 'CTU') x.rr = optBit(e.rs, ri, e);
            if (e.t === 'CTD') x.ldr = optBit(e.ld, ri, e);
            if (e.t === 'CTUD') { x.cdr = optBit(e.cd, ri, e); x.rr = optBit(e.rs, ri, e); x.ldr = optBit(e.ld, ri, e); }
            break;
          case 'CMP':
            if (!CMP_OPS.includes(e.op)) E('bad_op', ri, e, `Bad compare operator ${e.op}`, 'عملية مقارنة غير صالحة');
            x.op = e.op; x.ia = intRef(e.a, ri, e, false); x.ib = intRef(e.b, ri, e, false);
            break;
          case 'MOVE': x.ia = intRef(e.a, ri, e, false); x.ow = intRef(e.o, ri, e, true); break;
          case 'ADD': case 'SUB': x.ia = intRef(e.a, ri, e, false); x.ib = intRef(e.b, ri, e, false); x.ow = intRef(e.o, ri, e, true); break;
          case 'SHL': case 'SHR': x.ww = intRef(e.w, ri, e, true); x.bb = bitRef(e.b, ri, e, false); break;
        }
        grid[e.c][e.r] = x;
        list.push(x);
      }
      out.rungs.push({ rows, cols, grid, wire, comps: buildComps(rows, cols, barSet), oddRows, list, note: rg.note || '', title: rg.title || '' });
    });

    out.ok = errors.length === 0;
    return out;
  }

  SC.compile = compile;
  SC.compile.ELEMENTS = ALL;
  SC.compile.limits = { MAX_ROWS, MAX_COLS };
  SC.compile.buildWire = buildWire;
})();

<script>
/* ==== src/core/blocks.js ==== */
/* IEC 61131-3 function blocks. Each mutates its instance record `s` and returns Q.
 * Instance state lives in runtime memory (st.inst[name]) — never in the program JSON.
 *
 * Timing convention: a scan advances time by dt; a block that sees IN on its Nth consecutive scan
 * has ET = N*dt (TON). Q goes true on the scan where ET reaches PT.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;

  function newInst(type) {
    return { type, ET: 0, Q: 0, QU: 0, QD: 0, CV: 0, prev: 0, prev2: 0, run: 0, PT: 0 };
  }

  function ton(s, inp, dt, pt) {
    s.PT = pt;
    if (inp) { s.ET = Math.min(s.ET + dt, pt); s.Q = s.ET >= pt ? 1 : 0; }
    else { s.ET = 0; s.Q = 0; }
    return s.Q;
  }

  function tof(s, inp, dt, pt) {
    s.PT = pt;
    if (inp) { s.Q = 1; s.ET = 0; }
    else if (s.Q) { s.ET += dt; if (s.ET >= pt) { s.ET = pt; s.Q = 0; } }
    return s.Q;
  }

  // Pulse: Q stays high for exactly PT after a rising edge; not retriggerable while running.
  function tp(s, inp, dt, pt) {
    s.PT = pt;
    const rise = inp && !s.prev;
    s.prev = inp ? 1 : 0;
    if (rise && !s.run) { s.run = 1; s.ET = 0; s.Q = pt > 0 ? 1 : 0; if (pt <= 0) s.run = 0; return s.Q; }
    if (s.run) {
      s.ET += dt;
      if (s.ET >= pt) { s.run = 0; s.Q = 0; s.ET = pt; }
      else s.Q = 1;
    }
    return s.Q;
  }

  // Retentive on-delay: ET is kept when IN drops; R resets ET and Q.
  function tonr(s, inp, dt, pt, reset) {
    s.PT = pt;
    if (reset) { s.ET = 0; s.Q = 0; return 0; }
    if (inp) s.ET = Math.min(s.ET + dt, pt);
    s.Q = s.ET >= pt ? 1 : 0;
    return s.Q;
  }

  function ctu(s, cu, pv, reset) {
    const edge = cu && !s.prev;
    s.prev = cu ? 1 : 0;
    if (reset) s.CV = 0;
    else if (edge) s.CV = Math.min(s.CV + 1, 32767);
    s.Q = s.CV >= pv ? 1 : 0;
    return s.Q;
  }

  function ctd(s, cd, pv, load) {
    const edge = cd && !s.prev;
    s.prev = cd ? 1 : 0;
    if (load) s.CV = pv;
    else if (edge) s.CV = Math.max(s.CV - 1, -32768);
    s.Q = s.CV <= 0 ? 1 : 0;
    return s.Q;
  }

  function ctud(s, cu, cd, pv, reset, load) {
    const eu = cu && !s.prev, ed = cd && !s.prev2;
    s.prev = cu ? 1 : 0; s.prev2 = cd ? 1 : 0;
    if (reset) s.CV = 0;
    else if (load) s.CV = pv;
    else {
      let d = 0;
      if (eu) d++;
      if (ed) d--;
      s.CV = Math.max(-32768, Math.min(32767, s.CV + d));
    }
    s.QU = s.CV >= pv ? 1 : 0;
    s.QD = s.CV <= 0 ? 1 : 0;
    s.Q = s.QU;
    return s.QU;
  }

  const toI16 = (x) => (x << 16) >> 16;

  SC.blocks = { newInst, ton, tof, tp, tonr, ctu, ctd, ctud, toI16 };
})();

<script>
/* ==== src/core/scan.js ==== */
/* The scan cycle. Deterministic: same (compiled, state) in -> same state out, byte for byte.
 *
 * One scan:  (caller wrote the sensor snapshot into st.I)
 *            rungs 1..N evaluated in order; coils/blocks write memory immediately,
 *            so later rungs see earlier writes in the same scan (double coil = last write wins).
 *            (caller then copies st.Q to the plant actuators)
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const B = SC.blocks;
  const { N_BITS, N_WORDS } = SC.addr;

  function newState() {
    return {
      t: 0, scans: 0,
      I: new Uint8Array(N_BITS), Q: new Uint8Array(N_BITS), M: new Uint8Array(N_BITS),
      IW: new Int32Array(N_WORDS), QW: new Int32Array(N_WORDS), MW: new Int32Array(N_WORDS),
      inst: Object.create(null),
    };
  }

  function cloneState(st) {
    const inst = Object.create(null);
    for (const k in st.inst) inst[k] = Object.assign({}, st.inst[k]);
    return {
      t: st.t, scans: st.scans,
      I: st.I.slice(), Q: st.Q.slice(), M: st.M.slice(),
      IW: st.IW.slice(), QW: st.QW.slice(), MW: st.MW.slice(), inst,
    };
  }

  // make sure every instance used by the program has a record
  function ensureInsts(c, st) {
    for (const name in c.insts) if (!st.inst[name]) st.inst[name] = B.newInst(c.insts[name].type);
  }

  const ZERO = { Q: 0, QU: 0, QD: 0, ET: 0, CV: 0, PT: 0 };
  const rb = (st, ref) => (ref.k === 'b' ? st[ref.arr][ref.idx] : ((st.inst[ref.name] || ZERO)[ref.f] ? 1 : 0));
  const wb = (st, ref, v) => { st[ref.arr][ref.idx] = v ? 1 : 0; };
  function ri(st, ref) {
    if (ref.k === 'c') return ref.v;
    if (ref.k === 'w') return st[ref.arr][ref.idx];
    return (st.inst[ref.name] || ZERO)[ref.f] | 0;
  }
  const wi = (st, ref, v) => { st[ref.arr][ref.idx] = B.toI16(v); };

  function cmp(op, a, b) {
    switch (op) {
      case '==': return a === b;
      case '<>': return a !== b;
      case '>': return a > b;
      case '<': return a < b;
      case '>=': return a >= b;
      default: return a <= b;
    }
  }

  function inst(st, e) {
    return st.inst[e.inst] || (st.inst[e.inst] = B.newInst(e.t));
  }

  // evaluate one element; returns power out (0/1)
  function exec(e, pin, st, dt) {
    switch (e.t) {
      case 'NO': return pin && e.ra && rb(st, e.ra) ? 1 : 0;
      case 'NC': return pin && e.ra && !rb(st, e.ra) ? 1 : 0;
      case 'OUT': if (e.wa) wb(st, e.wa, pin); return pin;
      case 'SET': if (pin && e.wa) wb(st, e.wa, 1); return pin;
      case 'RST': if (pin && e.wa) wb(st, e.wa, 0); return pin;
      case 'POS': { if (!e.ma) return 0; const prev = rb(st, e.ma); wb(st, e.ma, pin); return pin && !prev ? 1 : 0; }
      case 'NEG': { if (!e.ma) return 0; const prev = rb(st, e.ma); wb(st, e.ma, pin); return !pin && prev ? 1 : 0; }
      case 'TON': return B.ton(inst(st, e), pin, dt, e.ptv);
      case 'TOF': return B.tof(inst(st, e), pin, dt, e.ptv);
      case 'TP': return B.tp(inst(st, e), pin, dt, e.ptv);
      case 'TONR': return B.tonr(inst(st, e), pin, dt, e.ptv, e.rr ? rb(st, e.rr) : 0);
      case 'CTU': return B.ctu(inst(st, e), pin, ri(st, e.pvr), e.rr ? rb(st, e.rr) : 0);
      case 'CTD': return B.ctd(inst(st, e), pin, ri(st, e.pvr), e.ldr ? rb(st, e.ldr) : 0);
      case 'CTUD': return B.ctud(inst(st, e), pin, e.cdr ? rb(st, e.cdr) : 0, ri(st, e.pvr), e.rr ? rb(st, e.rr) : 0, e.ldr ? rb(st, e.ldr) : 0);
      case 'CMP': return pin && cmp(e.op, ri(st, e.ia), ri(st, e.ib)) ? 1 : 0;
      case 'MOVE': if (pin && e.ow) wi(st, e.ow, ri(st, e.ia)); return pin;
      case 'ADD': if (pin && e.ow) wi(st, e.ow, ri(st, e.ia) + ri(st, e.ib)); return pin;
      case 'SUB': if (pin && e.ow) wi(st, e.ow, ri(st, e.ia) - ri(st, e.ib)); return pin;
      case 'SHL': if (pin && e.ww) { const w = st[e.ww.arr][e.ww.idx] & 0xFFFF; st[e.ww.arr][e.ww.idx] = B.toI16(((w << 1) | (e.bb && rb(st, e.bb) ? 1 : 0)) & 0xFFFF); } return pin;
      case 'SHR': if (pin && e.ww) { const w = st[e.ww.arr][e.ww.idx] & 0xFFFF; st[e.ww.arr][e.ww.idx] = B.toI16((w >> 1) | ((e.bb && rb(st, e.bb) ? 1 : 0) << 15)); } return pin;
    }
    return 0;
  }

  // rec (optional): array; rec[rungIndex] = {pin:[col][row], pout:[col][row]} for power-flow display
  function scanRung(R, st, dt, rec) {
    const { rows, cols, grid, wire, comps } = R;
    let src = new Array(rows).fill(0);
    src[0] = 1;
    let rpin = null, rpout = null;
    if (rec) { rpin = []; rpout = []; }
    for (let c = 0; c < cols; c++) {
      // merge at boundary c
      const p = src.slice();
      for (const comp of comps[c]) {
        let any = 0;
        for (const r of comp) if (src[r]) { any = 1; break; }
        for (const r of comp) p[r] = any;
      }
      const o = new Array(rows).fill(0);
      for (let r = 0; r < rows; r++) {
        const e = grid[c][r];
        o[r] = e ? exec(e, p[r], st, dt) : (wire[r][c] ? p[r] : 0);
      }
      if (rec) { rpin.push(p); rpout.push(o); }
      src = o;
    }
    if (rec) {
      // power at the right edge (boundary `cols`) after closing bars
      const p = src.slice();
      for (const comp of comps[cols]) {
        let any = 0;
        for (const r of comp) if (src[r]) { any = 1; break; }
        for (const r of comp) p[r] = any;
      }
      rec.push({ pin: rpin, pout: rpout, edge: p });
    }
  }

  // in-place scan (game loop, headless runner)
  function scanMut(c, st, dt, rec) {
    dt = dt || c.scanMs;
    ensureInsts(c, st);
    for (const R of c.rungs) {
      if (!R) { if (rec) rec.push(null); continue; }
      scanRung(R, st, dt, rec);
    }
    st.t += dt;
    st.scans++;
  }

  // pure wrapper: returns a new state, input untouched
  function scan(c, st, dt) {
    const n = cloneState(st);
    scanMut(c, n, dt);
    return n;
  }

  // byte-exact fingerprint of a state (for determinism tests)
  function fingerprint(st) {
    const parts = [st.t, st.scans, Array.from(st.I).join(''), Array.from(st.Q).join(''), Array.from(st.M).join('')];
    parts.push(Array.from(st.IW).join(','), Array.from(st.QW).join(','), Array.from(st.MW).join(','));
    parts.push(JSON.stringify(Object.keys(st.inst).sort().map((k) => [k, st.inst[k]])));
    return parts.join('|');
  }

  SC.scan = scan;
  SC.scanMut = scanMut;
  SC.newState = newState;
  SC.cloneState = cloneState;
  SC.fingerprint = fingerprint;
  SC.mem = { rb, wb, ri, wi };
})();

<script>
/* ==== src/core/lint.js ==== */
/* Static lint (runs on every edit). Returns [{id, sev:'warn'|'error', rung, r, c, msg:{en,ar}}]. Pure. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const A = SC.addr;

  function lint(program, tags, opts) {
    const out = [];
    opts = opts || {};
    const tm = A.makeTagMap(tags || []);
    const add = (id, sev, ri, el, en, ar) => out.push({ id, sev, rung: ri, r: el ? el.r : undefined, c: el ? el.c : undefined, msg: { en, ar } });
    if (!program || !Array.isArray(program.rungs)) return out;

    const canon = (tok) => {
      if (typeof tok !== 'string') return null;
      const t = tm.byName[tok];
      const a = A.parseAddr(t ? t.addr : tok);
      return a ? a.canon : null;
    };

    const coils = new Map();   // canon -> [{ri,e}]
    const edges = new Map();
    const insts = new Map();   // name -> [{ri,e}]
    const used = new Set();    // tag names referenced

    program.rungs.forEach((rg, ri) => {
      const els = (rg && rg.els) || [];
      let hasEdge = false;
      for (const e of els) if (e.t === 'POS' || e.t === 'NEG') hasEdge = true;
      for (const e of els) {
        for (const k of ['a', 'b', 'o', 'w', 'rs', 'ld', 'cd']) if (typeof e[k] === 'string') used.add(e[k]);
        if (e.t === 'OUT') {
          const c = canon(e.a);
          if (c) { if (!coils.has(c)) coils.set(c, []); coils.get(c).push({ ri, e }); }
        }
        if (e.t === 'POS' || e.t === 'NEG') {
          const c = canon(e.a);
          if (c) { if (!edges.has(c)) edges.set(c, []); edges.get(c).push({ ri, e }); }
        }
        if (e.i) { if (!insts.has(e.i)) insts.set(e.i, []); insts.get(e.i).push({ ri, e }); }
        if ((e.t === 'ADD' || e.t === 'SUB') && !hasEdge) {
          add('add_without_edge', 'warn', ri, e,
            `${e.t} runs on every scan while powered — put an edge contact before it`,
            `${e.t} ينفّذ كل scan طول ما في power — حط edge contact قبله`);
        }
        if (e.t === 'NC') {
          const t = tm.byName[e.a];
          if (t && t.wiring === 'NC' && (t.role === 'stop' || t.role === 'estop')) {
            add('nc_on_nc_stop', 'warn', ri, e,
              `${e.a} is wired normally closed, so its bit is 1 when idle. An NC contact passes power only when the button is pressed. Use an NO contact.`,
              `${e.a} موصول NC فالبت = 1 وهو مش مضغوط. الـ NC contact بيمرّر فقط لما الزر ينضغط. استخدم NO contact.`);
          }
        }
      }
      // vertical bars that never close
      const cols = rg.cols | 0, rows = rg.rows | 0;
      const bars = new Set((rg.vb || []).map((x) => x[0] + ',' + x[1]));
      const has = (b, g) => bars.has(b + ',' + g);
      for (let r = 1; r < rows; r++) {
        let n = 0;
        for (let b = 0; b <= cols; b++) if (has(b, r - 1) || has(b, r)) n++;
        if (n % 2 === 1) add('branch_open', 'warn', ri, { r, c: 0 }, 'A parallel branch is opened but never closed', 'فرع متوازي انفتح وما انسكّر');
      }
      // elements in branch rows with no power path
      const wire = SC.compile.buildWire(Math.max(1, rows), Math.max(1, cols), bars).wire;
      for (const e of els) {
        if (e.r > 0 && wire[e.r] && !wire[e.r][e.c]) {
          add('unconnected', 'warn', ri, e, 'This element is not connected to the rung', 'العنصر هذا مش موصول بالـ rung');
        }
      }
    });

    for (const [c, list] of coils) {
      if (list.length > 1) {
        const t = tm.byAddr[c];
        const nm = t ? t.name : c;
        for (let k = 1; k < list.length; k++) {
          add('double_coil', 'warn', list[k].ri, list[k].e,
            `Double coil: ${nm} is written by ${list.length} coils — the last one wins every scan`,
            `Double coil: ${nm} مكتوب من ${list.length} coils — الأخير هو اللي بيغلب بكل scan`);
        }
      }
    }
    for (const [c, list] of edges) {
      if (list.length > 1) {
        for (let k = 1; k < list.length; k++) {
          add('edge_bit_reused', 'error', list[k].ri, list[k].e,
            `Edge memory ${c} is used by ${list.length} edge contacts — each edge needs its own M bit`,
            `ذاكرة الـ edge ${c} مستخدمة من ${list.length} edge — كل edge لازم بت M خاص فيه`);
        }
      }
    }
    for (const [name, list] of insts) {
      if (list.length > 1) {
        for (let k = 1; k < list.length; k++) {
          add('shared_instance', 'warn', list[k].ri, list[k].e,
            `Two blocks share ${name} — the second overwrites the first`,
            `بلوكين بيشاركوا ${name} — الثاني بيمسح الأول`);
        }
      }
    }
    for (const t of tags || []) {
      if (t.user && !used.has(t.name)) {
        out.push({ id: 'unused_tag', sev: 'warn', rung: -1, msg: { en: `Tag ${t.name} is never used`, ar: `الـ tag ${t.name} ما انستخدم` } });
      }
    }
    return out;
  }

  SC.lint = lint;
})();

    T('CIP_Done', 'Q2.4', 'Bool', 'out', null, 'signal', 'CIP done', 'انتهى التنظيف'),
  ];

  const byName = Object.create(null);
  IO.forEach((t) => { byName[t.name] = t; });

  // A level lists tags either as a name (-> master entry) or as a full object (override / new).
  function levelTags(level) {
    const out = [];
    for (const t of level.tags || []) {
      if (typeof t === 'string') {
        if (!byName[t]) throw new Error('unknown master tag ' + t);
        out.push(Object.assign({}, byName[t]));
      } else if (byName[t.name]) out.push(Object.assign({}, byName[t.name], t));
      else out.push(Object.assign({ src: 'mem' }, t));
    }
    return out;
  }

  // merge tag lists by name (later entries override earlier ones)
  function mergeTags() {
    const map = new Map();
    for (const list of arguments) for (const t of list || []) map.set(t.name, Object.assign({}, map.get(t.name) || {}, t));
    return Array.from(map.values());
  }

  SC.mergeTags = mergeTags;
  SC.IO = IO;
  SC.ioByName = byName;
  SC.levelTags = levelTags;
})();
