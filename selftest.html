<script>
/* ==== src/core/plant.js ==== */
/* Plant model: the oral-syrup bottling line. Deterministic (seeded PRNG kept in the state), 10 ms steps.
 *
 * Units: mm along the conveyor, ms of simulated time. Numbers are "game values", chosen for playability.
 * Hardwired layer: when the E-stop is pressed or the guard door is open, motor / valve / solenoid power
 * is cut regardless of what the ladder does. The PLC only receives EStop_OK and is graded on its own outputs.
 *
 * Bottle slots are numbered 0,1,2... in generation order (cfg.badIdx etc. refer to those numbers).
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const prng = SC.prng;

  const DEFAULTS = {
    stations: ['infeed', 'filler', 'exit'],
    convLen: 1850, v: 150, speedPct: 100,
    bottlesPerMin: 24, jitterMs: 200, genDelayMs: 0, genOn: true,
    R: 30, minGap: 100, spawnX: 0, beam: 3,
    x: { infeed: 150, nozzle: 500, stopper: 530, fillPE: 530, level: 500, cap: 760, capCheck: 860, foil: 900, seal: 1000, label: 1180, reject: 1320, exit: 1700, backup: 1760, blockX: 1800 },
    capacity: 1.0, target: 0.9, okLevel: 0.88, fillSeconds: 3.0, nozzleTol: 40, fillMode: 'timed',
    stopperTravelMs: 400, pusherTravelMs: 150, pusherReach: 40, pumpTravelMs: 1500,
    capperStrokeMs: 300, capperTol: 35, labelerTol: 40, sealExposureMs: 300, meltMs: 2000,
    encPitch: 50,
    autoCap: 0, outfeedPull: false, // autoCap = x (mm) of a stand-alone capper machine that caps every bottle (0 = off); outfeedPull = downstream conveyor carries away the bottle waiting at blockX when the outfeed is free, even with our motor OFF
    tankPct: 80, tankPerFillPct: 0.5,
    badIdx: [], badFlow: 0.6, missingCapIdx: [], noFoilIdx: [], challengeIdx: [], missingBottleIdx: [], doubleIdx: [], fallenIdx: [],
    preload: [],
  };

  const OUT_NAMES = ['Conveyor_Motor', 'Fill_Valve', 'Stopper_SOL', 'Capper_Run', 'Sealer_Enable', 'Labeler_Trig', 'Reject_Pusher', 'Pump_Fwd', 'Pump_Rev'];

  function makeCfg(over) {
    const cfg = JSON.parse(JSON.stringify(DEFAULTS));
    over = over || {};
    for (const k in over) {
      if (k === 'x' || k === 'layout') Object.assign(cfg.x, over[k]);
      else if (k === 'startLevelPct') cfg.tankPct = over[k];
      else cfg[k] = JSON.parse(JSON.stringify(over[k]));
    }
    return cfg;
  }

  const has = (cfg, s) => cfg.stations.indexOf(s) >= 0;

  function init(over, seed) {
    const cfg = makeCfg(over);
    const P = {
      cfg, t: 0, rng: prng.seedOf(seed | 0), nextId: 1, seq: 0,
      nextSpawn: cfg.genDelayMs, pendingDouble: false,
      bottles: [],
      hw: { estop: false, doorOpen: false }, relayOpen: false,
      stopper: { pos: 0 }, pusher: { pos: 0, hit: false }, pump: { pos: 0 },
      tank: { pct: cfg.tankPct },
      faults: { peStuckOn: {}, peStuckOff: {}, peMisaligned: {}, peChatter: {}, valveWornSeal: false, airLow: false, airLost: false, capFeederEmpty: false, encoderSlip: false },
      flags: { outfeedBlocked: false, genOn: cfg.genOn !== false },
      enc: { acc: cfg.encPitch / 2, n: 0, mute: false },
      capper: { prev: 0, timer: -1, applied: false }, labeler: { prev: 0 }, fill: { dryOpen: false },
      counts: { spawned: 0, out: 0, good: 0, rejected: 0, spills: 0, wastedCaps: 0, wastedLabels: 0, goodLost: 0, melted: 0, badShipped: 0, filled: 0, runMs: 0, stopMs: 0, dist: 0 },
      outs: {}, sens: {},
    };
    for (const pb of cfg.preload) {
      P.bottles.push(newBottle(P, -1, Object.assign({ level: 0 }, pb)));
    }
    P.bottles.sort((a, b) => b.x - a.x);
    P.sens = computeSensors(P);
    return P;
  }

  function newBottle(P, k, over) {
    const c = P.cfg;
    const bad = c.badIdx.indexOf(k) >= 0;
    const b = {
      id: P.nextId++, seq: k, x: c.spawnX, level: 0, capped: false, sealed: false, labeled: false,
      bad, flowMul: bad ? c.badFlow : 1, noCap: c.missingCapIdx.indexOf(k) >= 0, noFoil: c.noFoilIdx.indexOf(k) >= 0,
      challenge: c.challengeIdx.indexOf(k) >= 0, fallen: c.fallenIdx.indexOf(k) >= 0,
      sealMs: 0, melted: false, spilled: false, filledFlag: false, miss: {}, px: c.spawnX,
    };
    if (b.challenge) b.bad = true;
    Object.assign(b, over || {});
    if (over && over.x !== undefined) b.px = over.x;
    return b;
  }

  function isDefective(P, b) {
    const c = P.cfg;
    if (b.challenge || b.fallen || b.melted) return true;
    if (has(c, 'filler') && (b.level < c.okLevel - 1e-9)) return true;
    if (has(c, 'capper') && !b.capped) return true;
    if (has(c, 'sealer') && !b.sealed) return true;
    if (has(c, 'labeler') && !b.labeled) return true;
    return false;
  }

  // ------------------------------------------------------------------ sensors
  function eyeBlocked(P, name, ex) {
    const c = P.cfg;
    const reach = c.R + c.beam;
    let blocked = false;
    for (const b of P.bottles) {
      if (Math.abs(b.x - ex) > reach) continue;
      if (P.faults.peMisaligned[name]) {
        if (b.miss[name] === undefined) b.miss[name] = prng.next(P) < 0.3;
        if (b.miss[name]) continue;
      }
      blocked = true;
      break;
    }
    if (P.faults.peStuckOn[name]) return 1;
    if (P.faults.peStuckOff[name]) return 0;
    if (P.faults.peChatter[name]) return prng.next(P) < 0.5 ? 1 : 0;
    return blocked ? 1 : 0;
  }

  function near(P, x, tol, pred) {
    let best = null, bd = 1e9;
    for (const b of P.bottles) {
      const d = Math.abs(b.x - x);
      if (d <= tol && d < bd && (!pred || pred(b))) { best = b; bd = d; }
    }
    return best;
  }

  function computeSensors(P) {
    const c = P.cfg, x = c.x, s = {};
    s.PE_Infeed = eyeBlocked(P, 'PE_Infeed', x.infeed);
    s.PE_Fill = eyeBlocked(P, 'PE_Fill', x.fillPE);
    s.PE_Cap = eyeBlocked(P, 'PE_Cap', x.cap);
    s.PE_Reject = eyeBlocked(P, 'PE_Reject', x.reject);
    s.PE_Exit = eyeBlocked(P, 'PE_Exit', x.exit);
    s.PE_Backup = eyeBlocked(P, 'PE_Backup', x.backup);
    s.Level_OK = near(P, x.level, 40, (b) => b.level >= c.okLevel) ? 1 : 0;
    s.Cap_Present = near(P, x.capCheck, 35, (b) => b.capped) ? 1 : 0;
    s.Foil_Present = near(P, x.foil, 35, (b) => b.capped && !b.noFoil) ? 1 : 0;
    s.Challenge_Bottle = near(P, x.reject, 40, (b) => b.challenge) ? 1 : 0;
    s.Stopper_Ext = P.stopper.pos >= 0.97 ? 1 : 0;
    s.Stopper_Ret = P.stopper.pos <= 0.03 ? 1 : 0;
    s.Air_OK = P.faults.airLost ? 0 : 1;
    s.Tank_LSL = P.tank.pct < 15 ? 1 : 0;
    s.Tank_LSLL = P.tank.pct < 5 ? 1 : 0;
    s.Tank_Level = Math.round(Math.max(0, Math.min(100, P.tank.pct)) * 276.48);
    s.Pump_Home = P.pump.pos <= 0.02 ? 1 : 0;
    s.Pump_Full = P.pump.pos >= 0.98 ? 1 : 0;
    s.Conv_Encoder = !P.enc.mute && P.enc.acc < c.encPitch / 2 ? 1 : 0;
    s.EStop_OK = P.hw.estop ? 0 : 1; // E-stop chain only; the guard door has its own bit (both open the safety relay)
    s.Door_Closed = P.hw.doorOpen ? 0 : 1;
    return s;
  }

  // ------------------------------------------------------------------ step
  function pushOff(P, b) {
    const i = P.bottles.indexOf(b);
    if (i >= 0) P.bottles.splice(i, 1);
  }

  function addFill(P, b, amount) {
    const c = P.cfg;
    if (b.fallen) { if (!b.spilled) { b.spilled = true; P.counts.spills++; } return; }
    b.level += amount;
    if (b.level > c.capacity) {
      b.level = c.capacity;
      if (!b.spilled) { b.spilled = true; P.counts.spills++; }
    }
    if (!b.filledFlag && b.level >= c.okLevel) {
      b.filledFlag = true;
      P.counts.filled++;
      P.tank.pct = Math.max(0, P.tank.pct - c.tankPerFillPct);
    }
  }

  function stepMut(P, out, dt) {
    const c = P.cfg, x = c.x;
    P.t += dt;
    P.relayOpen = P.hw.estop || P.hw.doorOpen;
    const pw = !P.relayOpen;
    const o = {};
    for (const n of OUT_NAMES) o[n] = pw && out && out[n] ? 1 : 0;
    P.outs = {};
    if (out) for (const k in out) P.outs[k] = out[k] ? 1 : 0;

    // ---- generator
    if (P.flags.genOn !== false) {
      const last = P.bottles.length ? P.bottles[P.bottles.length - 1] : null; // lowest x
      const gapOk = !last || last.x >= c.minGap;
      if (P.pendingDouble && gapOk) {
        P.pendingDouble = false;
        P.bottles.push(newBottle(P, P.seq - 1, { seq: P.seq - 1, double: true }));
        P.counts.spawned++;
      } else if (P.t >= P.nextSpawn && gapOk) {
        const k = P.seq++;
        const period = 60000 / Math.max(1, c.bottlesPerMin);
        P.nextSpawn += Math.max(period * 0.5, period + prng.range(P, -c.jitterMs, c.jitterMs));
        if (c.missingBottleIdx.indexOf(k) < 0) {
          P.bottles.push(newBottle(P, k));
          P.counts.spawned++;
          if (c.doubleIdx.indexOf(k) >= 0) P.pendingDouble = true;
        }
      }
    }

    // ---- air / cylinders
    const air = !P.faults.airLost;
    const slow = P.faults.airLow ? 3 : 1;
    if (air) {
      const sd = dt / (c.stopperTravelMs * slow);
      P.stopper.pos = Math.max(0, Math.min(1, P.stopper.pos + (o.Stopper_SOL ? sd : -sd)));
      const pd = dt / (c.pusherTravelMs * slow);
      P.pusher.pos = Math.max(0, Math.min(1, P.pusher.pos + (o.Reject_Pusher ? pd : -pd)));
    }
    if (P.pusher.pos < 0.2) P.pusher.hit = false;
    if (P.pusher.pos >= 0.8 && !P.pusher.hit) {
      const b = near(P, x.reject, c.pusherReach);
      if (b) {
        P.pusher.hit = true;
        pushOff(P, b);
        P.counts.rejected++;
        if (!isDefective(P, b)) P.counts.goodLost++;
      }
    }

    // ---- conveyor
    const dx = o.Conveyor_Motor ? (c.v * c.speedPct / 100) * dt / 1000 : 0;
    if (o.Conveyor_Motor) { P.counts.runMs += dt; P.counts.dist += dx; } else P.counts.stopMs += dt;
    const holdX = x.stopper - c.R;
    P.bottles.sort((a, b) => b.x - a.x);
    let ahead = null;
    const gone = [];
    for (const b of P.bottles) {
      b.px = b.x; // previous position, for smooth rendering
      let nx = b.x + dx;
      if (c.outfeedPull && !dx && !P.flags.outfeedBlocked && b.x >= x.blockX - 1e-9) nx = b.x + (c.v * c.speedPct / 100) * dt / 1000;
      if (ahead) nx = Math.min(nx, ahead.x - c.minGap);
      if (P.stopper.pos > 0.5 && b.x <= holdX + 1e-9) nx = Math.min(nx, holdX);
      if (P.flags.outfeedBlocked) nx = Math.min(nx, x.blockX);
      b.x = Math.max(b.x, nx);
      ahead = b;
      if (b.x > c.convLen) gone.push(b);
    }
    for (const b of gone) {
      pushOff(P, b);
      P.counts.out++;
      if (isDefective(P, b)) P.counts.badShipped++; else P.counts.good++;
    }

    // ---- stand-alone capper machine (autoCap): caps every bottle that passes its position, unless the bottle is a miss (noCap) or the feeder is empty
    if (c.autoCap) {
      for (const b of P.bottles) {
        if (!b.capDone && b.x >= c.autoCap) { b.capDone = true; if (!(b.noCap || P.faults.capFeederEmpty)) b.capped = true; }
      }
    }

    // ---- encoder
    P.enc.acc += dx;
    while (P.enc.acc >= c.encPitch) {
      P.enc.acc -= c.encPitch;
      P.enc.n++;
      P.enc.mute = P.faults.encoderSlip && P.enc.n % 50 === 49;
    }

    // ---- filling
    const under = near(P, x.nozzle, c.nozzleTol);
    if (c.fillMode === 'timed') {
      if (o.Fill_Valve) {
        if (under) {
          let flow = c.target / c.fillSeconds * under.flowMul * (P.faults.valveWornSeal ? 0.75 : 1);
          if (P.tank.pct <= 0) flow = 0;
          addFill(P, under, flow * dt / 1000);
        } else if (!P.fill.dryOpen) { P.fill.dryOpen = true; P.counts.spills++; }
      } else P.fill.dryOpen = false;
    } else {
      // piston filler: the pump moves the product, the valve routes it to the nozzle
      const pf = o.Pump_Fwd, pr = o.Pump_Rev;
      const pd = dt / c.pumpTravelMs;
      if (pr && !pf) P.pump.pos = Math.min(1, P.pump.pos + pd);
      else if (pf && !pr) {
        const d = Math.min(P.pump.pos, pd);
        P.pump.pos -= d;
        if (o.Fill_Valve && d > 0) {
          if (under) addFill(P, under, d * c.target * under.flowMul);
          else if (!P.fill.dryOpen) { P.fill.dryOpen = true; P.counts.spills++; }
        }
      }
      if (!o.Fill_Valve) P.fill.dryOpen = false;
    }

    // ---- capper (rising edge = one stroke)
    const cr = o.Capper_Run;
    if (cr && !P.capper.prev && P.capper.timer < 0) { P.capper.timer = 0; P.capper.applied = false; }
    P.capper.prev = cr;
    if (P.capper.timer >= 0) {
      P.capper.timer += dt;
      if (!P.capper.applied && P.capper.timer >= c.capperStrokeMs / 2) {
        P.capper.applied = true;
        const b = near(P, x.cap, c.capperTol);
        if (b) { if (!(b.noCap || P.faults.capFeederEmpty)) b.capped = true; }
        else P.counts.wastedCaps++;
      }
      if (P.capper.timer >= c.capperStrokeMs) P.capper.timer = -1;
    }

    // ---- sealer
    for (const b of P.bottles) {
      if (Math.abs(b.x - x.seal) <= 40 && o.Sealer_Enable && b.capped) {
        b.sealMs += dt;
        if (b.sealMs >= c.sealExposureMs && !b.noFoil && !b.melted) b.sealed = true;
        if (b.sealMs > c.meltMs && !b.melted) { b.melted = true; b.sealed = false; P.counts.melted++; }
      }
    }

    // ---- labeler (rising edge)
    const lt = o.Labeler_Trig;
    if (lt && !P.labeler.prev) {
      const b = near(P, x.label, c.labelerTol);
      if (b) b.labeled = true; else P.counts.wastedLabels++;
    }
    P.labeler.prev = lt;

    P.sens = computeSensors(P);
  }

  function clone(P) { return JSON.parse(JSON.stringify(P)); }
  function step(P, out, dt) { const n = clone(P); stepMut(n, out, dt); return n; }

  // ------------------------------------------------------------------ events / faults
  function applyEvent(P, ev) {
    if (ev.estop !== undefined) P.hw.estop = !!ev.estop;
    if (ev.door !== undefined) P.hw.doorOpen = ev.door === 'open' || ev.door === true;
    if (ev.fault) setFault(P, ev.fault, ev.arg, true);
    if (ev.clear) setFault(P, ev.clear, ev.arg, false);
    if (ev.plantSet) {
      for (const k in ev.plantSet) {
        const v = ev.plantSet[k];
        if (k === 'tankPct') P.tank.pct = v;
        else if (k === 'outfeedBlocked') P.flags.outfeedBlocked = !!v;
        else if (k === 'genOn') P.flags.genOn = !!v;
        else if (k === 'bottlesPerMin' || k === 'speedPct' || k === 'jitterMs' || k === 'fillSeconds') P.cfg[k] = v;
        else if (k === 'pumpTravelMs' || k === 'stopperTravelMs') P.cfg[k] = v;
        else if (k === 'spawnBottle') P.bottles.push(newBottle(P, -1, typeof v === 'object' ? v : {}));
        else if (k === 'clearLine') { if (v) P.bottles = []; } // the operator removes every bottle by hand (line clearance)
      }
    }
  }

  function setFault(P, name, arg, on) {
    const f = P.faults;
    if (['peStuckOn', 'peStuckOff', 'peMisaligned', 'peChatter'].indexOf(name) >= 0) {
      if (on) f[name][arg] = true; else delete f[name][arg];
    } else if (name in f) f[name] = !!on;
  }

  // ------------------------------------------------------------------ KPIs
  function kpis(P) {
    const c = P.cfg, n = P.counts;
    const tmin = Math.max(P.t, 1) / 60000;
    const runS = n.runMs / 1000;
    const availability = P.t > 0 ? n.runMs / P.t : 0;
    const performance = runS > 0 ? Math.min(1, n.dist / (c.v * runS)) : 0;
    const total = n.out + n.rejected;
    const quality = total > 0 ? n.good / total : 1;
    return {
      out: n.out, good: n.good, rejected: n.rejected, spills: n.spills, wastedCaps: n.wastedCaps, goodLost: n.goodLost,
      melted: n.melted, badShipped: n.badShipped, filledCount: n.filled, bottlesPerMin: n.out / tmin,
      availability, performance, quality, oee: availability * performance * quality,
      overflow: n.spills > 0,
    };
  }

  function refreshSensors(P) { P.sens = computeSensors(P); }

  SC.plant = { DEFAULTS, makeCfg, init, stepMut, step, clone, applyEvent, setFault, kpis, isDefective, OUT_NAMES, has, refreshSensors };
})();

</script>
<script>
/* ==== src/core/sim.js ==== */
/* Simulation = PLC (compiled program + memory) + plant + operator panel + forces + scenario events.
 * The same object drives the interactive game loop and the headless FAT runner, so replays are identical.
 *
 * One step():  events -> sensor snapshot into the input image -> scan -> outputs to plant -> plant step.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const A = SC.addr;

  const INPUT_IO = SC.IO.filter((t) => t.addr[0] === 'I').map((t) => Object.assign({ _a: A.parseAddr(t.addr) }, t));
  const OUTPUT_IO = SC.IO.filter((t) => t.src === 'out').map((t) => Object.assign({ _a: A.parseAddr(t.addr) }, t));

  // press events -> set events (NC buttons idle at 1)
  function prepareEvents(events) {
    const out = [];
    for (const ev of events || []) {
      if (ev.press) {
        const io = SC.ioByName[ev.press];
        const idle = io ? io.def : 0;
        out.push({ t: ev.t, set: { [ev.press]: idle ? 0 : 1 } });
        out.push({ t: ev.t + (ev.ms || 200), set: { [ev.press]: idle } });
      } else out.push(ev);
    }
    return out.map((e, i) => Object.assign({ _i: i }, e)).sort((a, b) => a.t - b.t || a._i - b._i);
  }

  const METRIC_KEYS = ['out', 'good', 'rejected', 'spills', 'wastedCaps', 'goodLost', 'melted', 'badShipped', 'filledCount', 'overflow', 'bottlesPerMin', 'availability', 'performance', 'quality', 'oee', 'wastedLabels', 'spawned', 'estopTrips', 'auditCount', 'auditUnauthorized'];

  function create(opts) {
    const level = opts.level || {};
    const scenario = opts.scenario || {};
    const seed = opts.seed !== undefined ? opts.seed : (scenario.seed || 1);
    const tags = SC.mergeTags(SC.levelTags(level), opts.userTags || []);
    const allTags = SC.IO.map((t) => t).concat(tags.filter((t) => !SC.ioByName[t.name]));
    const tagByName = Object.create(null);
    for (const t of allTags) tagByName[t.name] = Object.assign({ _a: A.parseAddr(t.addr) }, t);
    for (const t of tags) tagByName[t.name] = Object.assign({ _a: A.parseAddr(t.addr) }, tagByName[t.name] || {}, t);

    const compiled = SC.compile(opts.program || { v: 1, rungs: [] }, { tags, palette: level.palette || null });
    const st = SC.newState();
    for (const addr in level.init || {}) {
      const a = A.parseAddr(addr);
      if (a) st[a.arr][a.idx] = level.init[addr];
    }
    const plantCfg = Object.assign({}, level.plant || {}, scenario.plant || {});
    const P = SC.plant.init(plantCfg, seed);

    const panel = Object.create(null);
    for (const io of INPUT_IO) if (io.src === 'panel') panel[io.name] = io.def | 0;
    const events = prepareEvents(scenario.events);

    const sim = {
      level, scenario, compiled, st, P, panel, forces: Object.create(null), events, evIdx: 0,
      t: 0, dt: SC.SCAN_MS, trace: null, prevVals: null, tagByName, rec: null, steps: 0, audit: [], watch: {},
    };
    if (opts.trace) { sim.trace = []; sim.prevVals = Object.create(null); }
    for (const nm of level.watchLog || []) sim.watch[nm] = undefined;

    function resolveInput(key) {
      if (SC.ioByName[key] && SC.ioByName[key].addr[0] === 'I') return SC.ioByName[key];
      const a = A.parseAddr(key);
      if (a) return INPUT_IO.find((io) => io._a.canon === a.canon) || null;
      return null;
    }
    sim.resolveInput = resolveInput;

    function applyEvent(ev) {
      if (ev.set) {
        for (const k in ev.set) {
          const io = resolveInput(k);
          if (io) panel[io.name] = ev.set[k] === true ? 1 : ev.set[k] === false ? 0 : ev.set[k];
        }
      }
      SC.plant.applyEvent(P, ev);
      if (ev.audit) sim.audit.push({ t: sim.t, note: ev.audit });
    }

    sim.setPanel = (name, v) => {
      const io = resolveInput(name);
      if (io && io.src === 'panel') panel[io.name] = v === true ? 1 : v === false ? 0 : v;
    };

    sim.force = (key, v) => {
      const a = A.parseAddr(SC.ioByName[key] ? SC.ioByName[key].addr : key);
      if (!a || a.arr !== 'I' && a.arr !== 'IW') return false;
      if (v === null || v === undefined) delete sim.forces[a.canon];
      else sim.forces[a.canon] = v === true ? 1 : v === false ? 0 : v;
      return true;
    };
    sim.forcesActive = () => Object.keys(sim.forces).length > 0;
    sim.clearForces = () => { sim.forces = Object.create(null); };

    sim.read = (key) => {
      const t = tagByName[key];
      let a = t ? t._a : A.parseAddr(key);
      if (a) return st[a.arr][a.idx];
      const m = /^([A-Za-z_]\w*)\.(Q|QU|QD|ET|CV|PT)$/.exec(key);
      if (m) { const s = st.inst[m[1]]; return s ? s[m[2]] : 0; }
      return sim.metric(key);
    };

    sim.metric = (key) => {
      const n = P.counts;
      switch (key) {
        case 'out': case 'good': case 'rejected': case 'spills': case 'wastedCaps': case 'goodLost': case 'melted': case 'badShipped': case 'wastedLabels': case 'spawned': return n[key];
        case 'filledCount': return n.filled;
        case 'overflow': return n.spills > 0 ? 1 : 0;
        case 'auditCount': return sim.audit.filter((e) => e.tag !== undefined).length;                 // logged changes of watched tags (level.watchLog)
        case 'auditUnauthorized': return sim.audit.filter((e) => e.tag !== undefined && !e.key).length; // ... made while Supervisor_Key was OFF
        case 'bottlesPerMin': case 'availability': case 'performance': case 'quality': case 'oee': return SC.plant.kpis(P)[key];
      }
      return undefined;
    };
    sim.isKnownKey = (key) => !!(tagByName[key] || A.parseAddr(key) || /^([A-Za-z_]\w*)\.(Q|QU|QD|ET|CV|PT)$/.test(key) || METRIC_KEYS.indexOf(key) >= 0);

    function recordTrace() {
      const cur = sim.prevVals;
      for (const nm in tagByName) {
        const t = tagByName[nm];
        if (!t._a) continue;
        const v = st[t._a.arr][t._a.idx];
        if (cur[nm] !== v) { cur[nm] = v; sim.trace.push({ t: sim.t, tag: nm, v }); }
      }
    }

    sim.step = (withRec) => {
      let applied = false;
      while (sim.evIdx < events.length && events[sim.evIdx].t <= sim.t) { applyEvent(events[sim.evIdx++]); applied = true; }
      if (applied) SC.plant.refreshSensors(P); // a hardwired event (E-stop, door, fault) is visible to this very scan
      // sensor snapshot -> input image
      for (const io of INPUT_IO) {
        const f = sim.forces[io._a.canon];
        let v;
        if (f !== undefined) v = f;
        else if (io.src === 'panel') v = panel[io.name];
        else v = P.sens[io.name];
        if (v === undefined) v = 0;
        if (io._a.kind === 'bit') st.I[io._a.idx] = v ? 1 : 0;
        else st[io._a.arr][io._a.idx] = v | 0;
      }
      if (compiled.ok) {
        if (withRec) { sim.rec = []; SC.scanMut(compiled, st, sim.dt, sim.rec); } else SC.scanMut(compiled, st, sim.dt);
      } else { st.t += sim.dt; st.scans++; }
      const out = {};
      for (const io of OUTPUT_IO) out[io.name] = st.Q[io._a.idx];
      for (const nm in sim.watch) {
        const v = sim.read(nm);
        if (sim.watch[nm] !== undefined && sim.watch[nm] !== v) sim.audit.push({ t: sim.t, tag: nm, from: sim.watch[nm], to: v, key: panel.Supervisor_Key ? 1 : 0 });
        sim.watch[nm] = v;
      }
      if (sim.trace) recordTrace();
      SC.plant.stepMut(P, out, sim.dt);
      sim.t += sim.dt;
      sim.steps++;
    };

    sim.runUntil = (ms) => { while (sim.t < ms) sim.step(); };
    return sim;
  }

  SC.sim = { create, INPUT_IO, OUTPUT_IO, prepareEvents, METRIC_KEYS };
})();

</script>
<script>
/* ==== src/core/scenario.js ==== */
/* FAT scenario runner: runs a scenario against a program and checks the assertions.
 *
 * scenario: {id, seed, durationMs, plant?:{...}, events:[...], asserts:[...], title?:{en,ar}}
 *   events:  {t, set:{tag:value}} | {t, press:"Start_PB", ms} | {t, estop:bool} | {t, door:"open"|"closed"}
 *            {t, fault:name, arg} | {t, clear:name, arg} | {t, plantSet:{...}}
 *   asserts: {t, expect:{key:value}, tol?, msg?}          value must hold at some sample in [t-tol, t+tol]
 *            {window:[a,b], never:{...}} / {window:[a,b], always:{...}}
 *            {when:{...}, within:ms, expect:{...}, tol?}  after every rising edge of `when`
 *   keys: tag names, addresses (Q0.0), instance fields (DB_T.ET), plant metrics (filledCount, spills, ...)
 *   values: true/false/number or {gte,gt,lte,lt,eq,ne}
 * Sample time = the time at which the scan read its inputs; outputs are the result of that scan.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const DEFAULT_TOL = 20;

  function matchVal(v, exp) {
    if (v === undefined) return false;
    if (typeof exp === 'boolean') return (v ? true : false) === exp;
    if (typeof exp === 'number') return v === exp;
    if (exp && typeof exp === 'object') {
      for (const op in exp) {
        const e = exp[op];
        if (op === 'gte' && !(v >= e)) return false;
        if (op === 'gt' && !(v > e)) return false;
        if (op === 'lte' && !(v <= e)) return false;
        if (op === 'lt' && !(v < e)) return false;
        if (op === 'eq' && !(v === e)) return false;
        if (op === 'ne' && !(v !== e)) return false;
        if (['gte', 'gt', 'lte', 'lt', 'eq', 'ne'].indexOf(op) < 0) return false; // unknown operator: never vacuously true
      }
      return true;
    }
    return false;
  }

  function matchCond(sim, cond) {
    for (const k in cond) if (!matchVal(sim.read(k), cond[k])) return false;
    return true;
  }

  function actualOf(sim, cond) {
    const o = {};
    for (const k in cond) { const v = sim.read(k); o[k] = typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 1000) / 1000 : v; }
    return o;
  }

  const fmtVal = (e) => (typeof e === 'boolean' ? (e ? 'ON' : 'OFF') : typeof e === 'object' ? Object.keys(e).map((k) => `${k} ${e[k]}`).join(', ') : String(e));
  const fmtCond = (c) => Object.keys(c).map((k) => `${k} = ${fmtVal(c[k])}`).join(' and ');
  const sec = (ms) => (ms / 1000).toFixed(2) + ' s';

  function defaultMsg(a, kind) {
    if (kind === 'at') return { en: `Expected ${fmtCond(a.expect)} at t = ${sec(a.t)}`, ar: `المتوقع ${fmtCond(a.expect)} عند t = ${sec(a.t)}` };
    if (kind === 'never') return { en: `${fmtCond(a.never)} must never happen between ${sec(a.window[0])} and ${sec(a.window[1])}`, ar: `ممنوع يصير ${fmtCond(a.never)} بين ${sec(a.window[0])} و ${sec(a.window[1])}` };
    if (kind === 'always') return { en: `${fmtCond(a.always)} must hold between ${sec(a.window[0])} and ${sec(a.window[1])}`, ar: `لازم يضل ${fmtCond(a.always)} بين ${sec(a.window[0])} و ${sec(a.window[1])}` };
    return { en: `After ${fmtCond(a.when)}, expected ${fmtCond(a.expect)} within ${a.within} ms`, ar: `بعد ${fmtCond(a.when)} المتوقع ${fmtCond(a.expect)} خلال ${a.within} ms` };
  }

  // opts: {seed, failFast, trace, forces, userTags, upTo (ms, stop early), rec}
  function runScenario(level, program, scenario, opts) {
    opts = opts || {};
    const sim = SC.sim.create({ level, program, scenario, seed: opts.seed !== undefined ? opts.seed : scenario.seed, trace: !!opts.trace, userTags: opts.userTags });
    if (opts.forces) for (const k in opts.forces) sim.force(k, opts.forces[k]);
    const dur = scenario.durationMs || 10000;
    const asserts = (scenario.asserts || []).map((a, i) => {
      const kind = a.never ? 'never' : a.always ? 'always' : a.when ? 'within' : 'at';
      const tol = a.tol === undefined ? DEFAULT_TOL : a.tol;
      const o = { a, i, kind, tol, done: false, ok: false, obligations: [], prevWhen: false };
      if (kind === 'at') { o.from = a.t - tol; o.to = a.t + tol; }
      return o;
    });
    const failures = [];
    const fail = (o, tFail, extra) => {
      const a = o.a;
      const cond = o.kind === 'never' ? a.never : o.kind === 'always' ? a.always : a.expect;
      failures.push(Object.assign({
        idx: o.i, kind: o.kind, t: tFail, at: a.t !== undefined ? a.t : (a.window ? a.window[0] : tFail),
        msg: a.msg || defaultMsg(a, o.kind), expected: cond, actual: actualOf(sim, cond), assertId: a.id || ('#' + (o.i + 1)),
      }, extra || {}));
    };
    const unknownKeys = [];
    for (const o of asserts) {
      const a = o.a;
      for (const c of [a.expect, a.never, a.always, a.when]) if (c) for (const k in c) if (!sim.isKnownKey(k)) unknownKeys.push(k);
    }
    for (const o of asserts) if (o.kind === 'at' && o.a.t > dur + 1) unknownKeys.push('(assert at ' + o.a.t + ' ms is after the end of the run)');
    if (unknownKeys.length) failures.push({ idx: -1, kind: 'bad_scenario', t: 0, at: 0, msg: { en: 'Scenario problem: ' + unknownKeys[0], ar: 'مشكلة بالسيناريو: ' + unknownKeys[0] }, expected: {}, actual: {}, assertId: 'scenario' });

    const stopAt = opts.upTo !== undefined ? opts.upTo : dur;
    while (sim.t < stopAt) {
      sim.step();
      const ts = sim.t - sim.dt;
      for (const o of asserts) {
        if (o.done) continue;
        const a = o.a;
        if (o.kind === 'at') {
          if (ts >= o.from && ts <= o.to) {
            if (!o.ok && matchCond(sim, a.expect)) o.ok = true;
            if (ts >= o.to && !o.ok) { o.done = true; fail(o, ts); }
          }
          if (ts >= o.to) o.done = true;
        } else if (o.kind === 'never' || o.kind === 'always') {
          if (ts >= a.window[0] && ts <= a.window[1]) {
            const m = matchCond(sim, o.kind === 'never' ? a.never : a.always);
            if ((o.kind === 'never' && m) || (o.kind === 'always' && !m)) { o.done = true; fail(o, ts); }
          }
          if (ts > a.window[1]) o.done = true;
        } else {
          const w = matchCond(sim, a.when);
          if (w && !o.prevWhen) o.obligations.push({ t0: ts, deadline: ts + (a.within || 0) + o.tol });
          o.prevWhen = w;
          if (o.obligations.length) {
            const ok = matchCond(sim, a.expect);
            const keep = [];
            for (const ob of o.obligations) {
              if (ok) continue;
              if (ts >= ob.deadline) { fail(o, ts, { at: ob.t0 }); o.done = true; break; }
              keep.push(ob);
            }
            o.obligations = keep;
          }
        }
      }
      if (opts.failFast && failures.length) break;
    }
    // flush obligations whose deadline is inside the run but never evaluated (end of run)
    if (stopAt >= dur) {
      for (const o of asserts) {
        if (o.done) continue;
        if (o.kind === 'at' && !o.ok && o.from <= dur) fail(o, dur);
        if (o.kind === 'within') for (const ob of o.obligations) if (ob.deadline <= dur) { fail(o, dur, { at: ob.t0 }); break; }
      }
    }
    failures.sort((x, y) => x.t - y.t || x.idx - y.idx);
    return {
      id: scenario.id, pass: failures.length === 0, failures, firstFailure: failures[0] || null,
      metrics: SC.plant.kpis(sim.P), audit: sim.audit, sim: opts.keepSim ? sim : null, forcesActive: sim.forcesActive(),
    };
  }

  // ------------------------------------------------------------------ hidden variants
  // level.hidden = {count, seedBase, base?:[scenarioIds], vary:{plant:{key:[loPct,hiPct]}, jitterMs:[lo,hi], shiftMs:[lo,hi], bottlesPerMinPct:[lo,hi]}}
  function makeHidden(level, k) {
    const h = level.hidden || {};
    const vis = (level.scenarios || []).filter((s) => !h.base || h.base.indexOf(s.id) >= 0);
    if (!vis.length) return null;
    const base = vis[k % vis.length];
    const seed = (h.seedBase || 1000) + k;
    const o = { rng: SC.prng.seedOf(seed * 7919 + 13) };
    const sc = SC.util.clone(base);
    sc.id = `${base.id}~h${k}`;
    sc.seed = seed;
    sc.hidden = true;
    const v = h.vary || {};
    sc.plant = sc.plant || {};
    if (v.jitterMs) sc.plant.jitterMs = Math.round(SC.prng.range(o, v.jitterMs[0], v.jitterMs[1]));
    if (v.genDelayMs) sc.plant.genDelayMs = Math.round(SC.prng.range(o, v.genDelayMs[0], v.genDelayMs[1]));
    if (v.bottlesPerMinPct) {
      const b = sc.plant.bottlesPerMin || (level.plant && level.plant.bottlesPerMin) || SC.plant.DEFAULTS.bottlesPerMin;
      sc.plant.bottlesPerMin = Math.round(b * (1 + SC.prng.range(o, v.bottlesPerMinPct[0], v.bottlesPerMinPct[1]) / 100) * 10) / 10;
    }
    for (const key in v.plant || {}) {
      const range = v.plant[key];
      const baseV = sc.plant[key] !== undefined ? sc.plant[key] : (level.plant && level.plant[key] !== undefined ? level.plant[key] : SC.plant.DEFAULTS[key]);
      if (typeof baseV === 'number') sc.plant[key] = Math.round(baseV * (1 + SC.prng.range(o, range[0], range[1]) / 100) * 1000) / 1000;
    }
    if (v.shiftMs) {
      const sh = Math.round(SC.prng.range(o, v.shiftMs[0], v.shiftMs[1]) / 10) * 10;
      for (const e of sc.events || []) e.t += sh;
      for (const a of sc.asserts || []) {
        if (a.t !== undefined) a.t += sh;
        if (a.window) a.window = [a.window[0] + sh, a.window[1] + sh];
      }
      sc.durationMs = (sc.durationMs || 0) + sh;
    }
    return sc;
  }

  // runs visible scenarios, then hidden variants. opts: {failFast, skipHidden, userTags, forces}
  function runLevel(level, program, opts) {
    opts = opts || {};
    const results = [];
    let firstFail = null;
    const push = (sc, hidden) => {
      const r = runScenario(level, program, sc, { failFast: true, userTags: opts.userTags, forces: opts.forces });
      r.hidden = !!hidden;
      r.scenario = sc;
      results.push(r);
      if (!r.pass && !firstFail) firstFail = r;
      return r.pass;
    };
    for (const sc of level.scenarios || []) { if (!push(sc, false) && opts.stopAtFirst) break; }
    if (!opts.skipHidden && !(opts.stopAtFirst && firstFail)) {
      const n = (level.hidden && level.hidden.count) || 0;
      for (let k = 0; k < n; k++) {
        const sc = makeHidden(level, k);
        if (sc && !push(sc, true) && opts.stopAtFirst) break;
      }
    }
    return { pass: results.every((r) => r.pass) && !(opts.forces && Object.keys(opts.forces).length), results, firstFail };
  }

  SC.scenario = { runScenario, runLevel, makeHidden, matchCond, DEFAULT_TOL };
})();

</script>
<script>
/* ==== src/core/fixtures.js ==== */
/* Helpers for hidden fixtures (reference + wrong solutions) and for any program written as ladder text:
 * unknown names are auto-declared as memory bits / words so authors can write  "[Start | Run] /Stop (Run)"  directly.
 *
 * fixture: {lines:[...]} | program JSON, plus optional {userTags:[{name,addr,type}], level, diag, note}
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const A = SC.addr;

  const BIT_FIELDS = { NO: ['a'], NC: ['a'], OUT: ['a'], SET: ['a'], RST: ['a'], POS: ['a'], NEG: ['a'], TONR: ['rs'], CTU: ['rs'], CTD: ['ld'], CTUD: ['rs', 'ld', 'cd'], SHL: ['b'], SHR: ['b'] };
  const INT_FIELDS = { CMP: ['a', 'b'], MOVE: ['a', 'o'], ADD: ['a', 'b', 'o'], SUB: ['a', 'b', 'o'], CTU: ['pv'], CTD: ['pv'], CTUD: ['pv'], SHL: ['w'], SHR: ['w'] };

  function kindOf(el, tok) {
    if ((INT_FIELDS[el.t] || []).some((f) => el[f] === tok)) return 'word';
    return 'bit';
  }

  // returns the extra user tags needed so that `program` compiles (names -> M bits / MW words)
  function autoTags(program, level, given) {
    let tags = SC.mergeTags(SC.levelTags(level), given || []);
    const made = [];
    for (let pass = 0; pass < 4; pass++) {
      const c = SC.compile(program, { tags, palette: null });
      const unk = c.errors.filter((e) => e.code === 'unknown_tag' && e.tok);
      if (!unk.length) break;
      let progress = false;
      for (const e of unk) {
        const rg = program.rungs[e.rung];
        const el = rg && rg.els.find((x) => x.r === e.r && x.c === e.c);
        if (!el || tags.some((t) => t.name === e.tok)) continue;
        const kind = kindOf(el, e.tok);
        const addr = A.nextFreeAddr(tags, kind);
        if (!addr) continue;
        const t = { name: e.tok, addr, type: kind === 'bit' ? 'Bool' : 'Int', user: true, src: 'mem' };
        tags = tags.concat([t]); made.push(t); progress = true;
      }
      if (!progress) break;
    }
    return made;
  }

  function prepare(level, fx) {
    const program = SC.dsl.programFrom(fx);
    const userTags = (fx.userTags || []).slice();
    return { program, userTags: userTags.concat(autoTags(program, level, userTags)) };
  }

  // run a level's scenarios against a fixture; returns {pass, run, program, userTags}
  function evaluate(level, fx, opts) {
    opts = opts || {};
    const p = prepare(level, fx);
    const lv = Object.assign({}, level, { tags: (level.tags || []).concat(p.userTags) });
    const run = SC.scenario.runLevel(lv, p.program, { skipHidden: opts.skipHidden, stopAtFirst: opts.stopAtFirst !== false, userTags: p.userTags });
    return { pass: run.pass, run, program: p.program, userTags: p.userTags, level: lv };
  }

  SC.fixtures = { prepare, evaluate, autoTags };
})();

</script>
<script>
/* ==== src/core/diagnostics.js ==== */
/* Diagnostics: recognise classic mistakes from the program (and the failing test) and explain them in one line.
 *
 *   SC.diag.add('id', {msg:{en,ar} | (ctx)=>({en,ar}), test:(ctx)=>bool})
 *   Level files in src/core/diag/Lxx.js add their own. level.diagnostics = [ids] picks which ones to check, in order.
 *
 * ctx: {level, program, tags, tagMap, failure, els:[{ri,r,c,e}], ofType(...t), writers(tag), readers(tag), usesTag(tag),
 *       tag(name), probe(scenario)->result, rungEls(ri), compiled}
 */
(function () {
  'use strict';
  const SC = globalThis.SC;

  const reg = Object.create(null);
  const FIELDS = ['a', 'b', 'o', 'w', 'rs', 'ld', 'cd'];

  function add(id, def) { reg[id] = Object.assign({ id }, def); }

  function buildCtx(level, program, tags, failure) {
    const tagMap = SC.addr.makeTagMap(tags);
    const els = [];
    program.rungs.forEach((rg, ri) => (rg.els || []).forEach((e) => els.push({ ri, r: e.r, c: e.c, e })));
    const ctx = {
      level, program, tags, tagMap, failure: failure || null, els,
      compiled: SC.compile(program, { tags, palette: level.palette || null }),
      tag: (n) => tagMap.byName[n] || null,
      ofType: (...ts) => els.filter((x) => ts.indexOf(x.e.t) >= 0),
      writers: (n) => els.filter((x) => ['OUT', 'SET', 'RST'].indexOf(x.e.t) >= 0 && x.e.a === n),
      readers: (n) => els.filter((x) => ['NO', 'NC', 'POS', 'NEG'].indexOf(x.e.t) >= 0 && x.e.a === n),
      usesTag: (n) => els.some((x) => FIELDS.some((f) => x.e[f] === n)),
      rungEls: (ri) => els.filter((x) => x.ri === ri),
      find: (pred) => els.find(pred) || null,
      roleOf: (n) => (tagMap.byName[n] || {}).role,
      probe: (sc) => SC.scenario.runScenario(level, program, sc, { userTags: tags.filter((t) => t.user) }),
    };
    return ctx;
  }

  // compile-error codes that are themselves a classic mistake
  const CODE_TO_ID = { bad_time: 'pt_not_time_literal' };

  function run(level, program, opts) {
    opts = opts || {};
    const tags = opts.tags || SC.mergeTags(SC.levelTags(level));
    const ctx = buildCtx(level, program, tags, opts.failure);
    const out = [];
    const seen = new Set();
    const push = (id, msg) => { if (!seen.has(id)) { seen.add(id); out.push({ id, msg }); } };
    for (const e of ctx.compiled.errors) {
      const id = CODE_TO_ID[e.code];
      if (id && reg[id]) push(id, typeof reg[id].msg === 'function' ? reg[id].msg(ctx) : reg[id].msg);
    }
    // level.skipGeneric: generic ids that give wrong advice in this level (e.g. nc_on_start when an NC Release contact is the correct latch-clear)
    const ids = (level.diagnostics || []).concat(GENERIC.filter((g) => (level.skipGeneric || []).indexOf(g) < 0));
    for (const id of ids) {
      const d = reg[id];
      if (!d || seen.has(id)) continue;
      let hit = false;
      try { hit = !!d.test(ctx); } catch (er) { hit = false; }
      if (hit) push(id, typeof d.msg === 'function' ? d.msg(ctx) : d.msg);
    }
    return out;
  }

  // ---------------------------------------------------------------- generic diagnostics
  const GENERIC = ['nc_on_start', 'nc_on_nc_stop', 'double_coil', 'edge_bit_reused', 'shared_instance', 'pt_not_time_literal', 'add_without_edge'];

  add('nc_on_start', {
    msg: (ctx) => {
      const x = ctx.find((y) => y.e.t === 'NC' && ['start', 'ack', 'reset', 'release'].indexOf(ctx.roleOf(y.e.a)) >= 0);
      const n = x ? x.e.a : 'the button';
      return { en: `You used an NC contact on ${n}. A button that is not pressed has bit 0, and an NC contact passes power when the bit is 0 — so it acts as if the button is pressed all the time.`,
        ar: `استخدمت NC contact على ${n}. الزر وهو مش مضغوط قيمته 0، والـ NC بيمرّر الـ power لما البت 0 — فبيشتغل وكأن الزر مضغوط طول الوقت.` };
    },
    test: (ctx) => !!ctx.find((y) => y.e.t === 'NC' && ['start', 'ack', 'reset', 'release'].indexOf(ctx.roleOf(y.e.a)) >= 0),
  });
  add('nc_on_nc_stop', {
    msg: (ctx) => {
      const x = ctx.find((y) => y.e.t === 'NC' && ['stop', 'estop', 'guard'].indexOf(ctx.roleOf(y.e.a)) >= 0 && (ctx.tag(y.e.a) || {}).wiring === 'NC');
      const n = x ? x.e.a : 'Stop_PB';
      return { en: `Your Stop contact is NC (-|/|-) but ${n} is wired normally closed. The contact symbol tests the BIT, not the device: the bit is 1 when the button is idle, so use an NO contact.`,
        ar: `الـ contact تبعك NC (-|/|-) بس ${n} موصول NC. رمز الـ contact بيفحص الـ بت مش الجهاز: البت = 1 لما الزر مش مضغوط، فاستخدم NO contact.` };
    },
    test: (ctx) => !!ctx.find((y) => y.e.t === 'NC' && ['stop', 'estop', 'guard'].indexOf(ctx.roleOf(y.e.a)) >= 0 && (ctx.tag(y.e.a) || {}).wiring === 'NC'),
  });
  add('double_coil', {
    msg: { en: 'Double coil: two coils write the same bit. The last one in the scan wins, so the first one is useless. Use ONE coil and put the conditions in parallel.', ar: 'Double coil: ملفين بيكتبوا على نفس البت. الأخير بالـ scan بيغلب، فالأول ما إله فايدة. استخدم ملف واحد وحط الشروط على التوازي.' },
    test: (ctx) => SC.lint(ctx.program, ctx.tags).some((l) => l.id === 'double_coil'),
  });
  add('edge_bit_reused', {
    msg: { en: 'Two edge contacts share one memory bit. Every edge contact needs its OWN M bit to remember the last state.', ar: 'اتنين edge contacts بيشاركوا نفس بت الذاكرة. كل edge لازم بت M خاص فيه عشان يتذكر الحالة السابقة.' },
    test: (ctx) => SC.lint(ctx.program, ctx.tags).some((l) => l.id === 'edge_bit_reused'),
  });
  add('shared_instance', {
    msg: { en: 'Two blocks use the same instance name, so the second one overwrites the first. Give each timer or counter its own name.', ar: 'بلوكين بنفس اسم الـ instance فالثاني بيمسح الأول. اعطي كل مؤقت أو عدّاد اسمه الخاص.' },
    test: (ctx) => SC.lint(ctx.program, ctx.tags).some((l) => l.id === 'shared_instance'),
  });
  add('pt_not_time_literal', {
    msg: { en: 'The preset time must be a time literal like T#3s. A plain number is not a time.', ar: 'الوقت المحدد لازم يكون بصيغة وقت مثل T#3s. الرقم العادي مش وقت.' },
    test: (ctx) => ctx.compiled.errors.some((e) => e.code === 'bad_time'),
  });
  add('add_without_edge', {
    msg: { en: 'ADD runs on EVERY scan while it has power, so the value jumps by 100 per second. Put a positive-edge contact in front of it.', ar: 'الـ ADD بينفّذ بكل scan طول ما في power، فالقيمة بتزيد 100 بالثانية. حط positive-edge contact قبله.' },
    test: (ctx) => SC.lint(ctx.program, ctx.tags).some((l) => l.id === 'add_without_edge'),
  });

  SC.diag = { add, run, registry: reg, buildCtx, GENERIC };
})();

</script>
<script>
/* ==== src/core/levels.js ==== */
/* Level loading + structural validation (used by the game, the build checks and the self-test). */
(function () {
  'use strict';
  const SC = globalThis.SC;

  function loadAll() {
    try { return JSON.parse(document.getElementById('levels').textContent) || []; } catch (e) { return []; }
  }
  function loadFixtures() {
    const el = typeof document !== 'undefined' && document.getElementById('fixtures');
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch (e) { return null; }
  }

  // glossary: levels define the terms they introduce in `glossaryDefs`; `glossary` lists ids shown in the level.
  function glossaryMap(levels) {
    const map = Object.create(null);
    for (const L of levels) for (const d of L.glossaryDefs || []) if (!map[d.id]) map[d.id] = Object.assign({ firstLevel: L.id }, d);
    return map;
  }

  const wordCount = (s) => (String(s || '').trim().match(/\S+/g) || []).length;
  const PALETTE_OK = SC.compile.ELEMENTS.concat(['BRANCH']);

  // returns an array of problem strings (empty = structurally fine)
  function validate(level, gmap) {
    const bad = [];
    const need = (cond, msg) => { if (!cond) bad.push(msg); };
    need(/^L\d\d$/.test(level.id || ''), 'id must look like L05');
    need(Number.isInteger(level.order), 'order must be an integer');
    need(level.title && level.title.en && level.title.ar, 'title needs en and ar');
    need(level.concept, 'concept is missing');
    need(level.workOrder && level.workOrder.en && level.workOrder.ar, 'workOrder needs en and ar');
    if (level.workOrder && level.workOrder.en) need(wordCount(level.workOrder.en) <= 60, `work order is ${wordCount(level.workOrder.en)} words (max 60)`);
    need(Array.isArray(level.palette) && level.palette.every((p) => PALETTE_OK.indexOf(p) >= 0), 'palette must list known instruction ids');
    try {
      const tags = SC.levelTags(level);
      need(tags.length > 0, 'level has no tags');
      for (const t of tags) need(SC.addr.parseAddr(t.addr), `tag ${t.name} has a bad address ${t.addr}`);
    } catch (e) { bad.push('tags: ' + e.message); }
    need(level.plant && typeof level.plant === 'object', 'plant config missing');
    const scen = level.scenarios || [];
    need(scen.length >= 3, `needs at least 3 visible scenarios (has ${scen.length})`);
    const ids = new Set();
    scen.forEach((s) => {
      need(s.id && !ids.has(s.id), 'scenario ids must be unique: ' + s.id); ids.add(s.id);
      need(s.durationMs > 0, `scenario ${s.id}: durationMs`);
      need((s.asserts || []).length > 0, `scenario ${s.id}: no asserts`);
      need(s.title && s.title.en && s.title.ar, `scenario ${s.id}: needs a title {en,ar} (shown in the FAT list)`);
    });
    need(level.hidden && level.hidden.count >= 3, 'hidden.count must be at least 3');
    const OPS = ['gte', 'gt', 'lte', 'lt', 'eq', 'ne'];
    const okInput = (k) => !!(SC.ioByName[k] && SC.ioByName[k].addr[0] === 'I') || !!(SC.addr.parseAddr(k) && /^I/.test(SC.addr.parseAddr(k).arr));
    scen.forEach((s) => {
      need(typeof s.durationMs === 'number', `scenario ${s.id}: durationMs must be a number`);
      for (const ev of s.events || []) {
        if (ev.press) need(SC.ioByName[ev.press] && SC.ioByName[ev.press].src === 'panel', `scenario ${s.id}: press "${ev.press}" is not an operator input`);
        if (ev.set) for (const k in ev.set) need(okInput(k), `scenario ${s.id}: set "${k}" is not an input`);
      }
      for (const a of s.asserts || []) {
        for (const cond of [a.expect, a.never, a.always, a.when]) {
          if (!cond) continue;
          for (const k in cond) if (cond[k] && typeof cond[k] === 'object') for (const op in cond[k]) need(OPS.indexOf(op) >= 0, `scenario ${s.id}: unknown operator "${op}" on ${k}`);
        }
        const last = a.t !== undefined ? a.t : (a.window ? a.window[1] : 0);
        need(last <= s.durationMs + 1, `scenario ${s.id}: an assert at ${last} ms is after durationMs ${s.durationMs}`);
      }
    });
    if (level.hidden && level.hidden.base) level.hidden.base.forEach((id) => need(scen.some((s) => s.id === id), 'hidden.base unknown scenario ' + id));
    need(Array.isArray(level.hints) && level.hints.length === 3 && level.hints.every((x) => x.en && x.ar), 'needs exactly 3 hints with en and ar');
    need(Array.isArray(level.datasheets) && level.datasheets.length >= 1 && level.datasheets.every((d) => d.id && d.title && d.title.en), 'needs at least one datasheet card');
    need(Array.isArray(level.glossary) && level.glossary.length >= 6 && level.glossary.length <= 14, 'glossary should list 6-14 term ids');
    if (gmap) for (const id of level.glossary || []) need(gmap[id], 'glossary term not defined anywhere: ' + id);
    for (const d of level.glossaryDefs || []) need(d.id && d.en && d.ar && d.ex && d.ex.en, 'glossaryDefs entry needs id, en, ar and ex.en: ' + (d.id || '?'));
    for (const id of level.diagnostics || []) need(SC.diag.registry[id], 'diagnostic not registered: ' + id);
    need(level.explain && Array.isArray(level.explain.frames) && level.explain.frames.length >= 1, 'explain.frames missing');
    need(level.example && ['full', 'completion', 'none'].indexOf(level.example.mode) >= 0, 'example.mode must be full, completion or none');
    return bad;
  }

  SC.levels = { loadAll, loadFixtures, glossaryMap, validate, wordCount };
})();

</script>

<script>
/* ==== src/core/diag/L02.js ==== */
/* L02 diagnostics */
(function () {
  'use strict';
  const D = globalThis.SC.diag;

  D.add('no_seal_in', {
    msg: { en: 'Nothing keeps the motor on after Start is released. Add a contact of the motor itself in parallel with Start (a seal-in).', ar: 'ما في شي بيخلّي المحرك شغّال بعد ما تفلت {{Start}}. زيد contact للمحرك نفسه على التوازي مع {{Start}} (seal-in).'.replace(/\{\{|\}\}/g, '') },
    test: (ctx) => ctx.writers('Conveyor_Motor').length > 0 && ctx.readers('Conveyor_Motor').length === 0,
  });

  // The holding contact (motor NO contact in a lower row) sits in the same parallel span as the Stop contact: Stop is bypassed.
  D.add('seal_bypasses_stop', {
    msg: { en: 'The seal-in branch skips the Stop contact. Once the motor runs, Stop has no effect. Put Stop in series AFTER the branch.', ar: 'فرع الـ seal-in بيتجاوز {{Stop}}. بعد ما المحرك يشتغل، {{Stop}} ما بيأثّر. حط {{Stop}} على التوالي بعد الفرع.'.replace(/\{\{|\}\}/g, '') },
    test: (ctx) => {
      for (let ri = 0; ri < ctx.program.rungs.length; ri++) {
        const rg = ctx.program.rungs[ri];
        const seal = ctx.rungEls(ri).find((x) => x.e.t === 'NO' && x.e.a === 'Conveyor_Motor' && x.r > 0);
        if (!seal) continue;
        const bars = Array.from(new Set((rg.vb || []).map((b) => b[0]))).sort((a, b) => a - b);
        const b0 = Math.max(...bars.filter((b) => b <= seal.c), 0);
        const after = bars.filter((b) => b > seal.c);
        const b1 = after.length ? Math.min(...after) : rg.cols;
        const stop = ctx.rungEls(ri).find((x) => (x.e.t === 'NO' || x.e.t === 'NC') && ctx.roleOf(x.e.a) === 'stop');
        if (stop && stop.c >= b0 && stop.c < b1) return true;
      }
      return false;
    },
  });
})();

</script>

      // Reset reaches only a coil whose result is used by the motor rung?  (a quick structural test: is the motor rung dependent on anything Reset drives?)
      const resetCoils = [];
      ctx.rungEls(ri).forEach((x) => { if (x.e.t === 'OUT' && ctx.rungEls(ri).some((y) => y.e.t === 'NO' && y.e.a === 'Reset_PB')) resetCoils.push(x.e.a); });
      return resetCoils.some((n) => n !== 'Conveyor_Motor' && ctx.readers(n).length > 0);
    })),
  });

  // the latch (a seal-in) exists, but the safety bits are only in a different rung that gates the motor output
  D.add('auto_restart_latch_not_cleared', {
    msg: { en: 'The safety bits only block the output. The run latch is still ON, so the motor restarts by itself when the E-stop is released. The E-stop and the door must also clear the latch.', ar: 'بتات السلامة بس بتحجب المخرج. الـ {{latch}} لسا شغّال، فالمحرك بيرجع يشتغل لحاله لما تفلت الطوارئ. الطوارئ والباب لازم يمسحوا الـ {{latch}} كمان.'.replace(/\{\{|\}\}/g, '') },
    test: (ctx) => {
      const latchCoils = ctx.program.rungs.map((rg, ri) => ri).filter((ri) => {
        const els = ctx.rungEls(ri);
        const out = els.find((x) => x.e.t === 'OUT');
        return out && els.some((x) => x.e.t === 'NO' && x.e.a === out.e.a) && out.e.a !== 'Conveyor_Motor' && !els.some((x) => (x.e.t === 'NO') && (x.e.a === 'EStop_OK' || x.e.a === 'Door_Closed'));
      });
      return latchCoils.length > 0 && ctx.usesTag('EStop_OK');
    },
  });

  D.add('reset_starts_motor', {
    msg: { en: 'Reset_PB is in the start branch of the motor, so pressing Reset alone starts the conveyor. Reset only makes the line ready. Start still has to be pressed.', ar: '{{Reset_PB}} موجود بفرع التشغيل للمحرك، فضغط {{Reset}} لحاله بيشغّل الناقل. {{Reset}} بس بيجهّز الخط. لسا لازم تضغط {{Start}}.'.replace(/\{\{|\}\}/g, '') },
    test: (ctx) => ctx.program.rungs.some((rg, ri) => {
      const els = ctx.rungEls(ri);
      const motor = els.find((x) => x.e.t === 'OUT' && x.e.a === 'Conveyor_Motor');
      return !!motor && els.some((x) => x.e.t === 'NO' && x.e.a === 'Reset_PB' && x.r > 0 || (x.e.t === 'NO' && x.e.a === 'Reset_PB' && x.c === 0));
    }),
  });

  D.add('door_not_checked', {
    msg: { en: 'The door switch (Door_Closed) is never used. An open door must stop the line and block the restart until Reset.', ar: 'مفتاح الباب ({{Door_Closed}}) ما انستخدم. الباب المفتوح لازم يوقف الخط ويمنع التشغيل لحد {{Reset}}.'.replace(/\{\{|\}\}/g, '') },
    test: (ctx) => !ctx.usesTag('Door_Closed'),

<script>

(function () {

  const D = globalThis.SC.diag;

  // any coil that is a memory bit (not the conveyor itself) or a seal-in on its own contact
  function hasMemory(ctx) {
    return ctx.program.rungs.some((rg, ri) => {
      const els = ctx.rungEls(ri);
      return els.some((x) => (x.e.t === 'OUT' || x.e.t === 'SET') && ctx.roleOf(x.e.a) !== 'actuator') ||

  // bottle at the filler at power-up, Release tapped for 0.1 s: the conveyor must run while the bottle is still in the beam
  const RESTOP = {
    id: 'diag-L04-restop', seed: 7, durationMs: 2500, plant: { genOn: false, preload: [{ x: 500 }] },
    events: [{ t: 1000, press: 'Release_PB', ms: 100 }],
    asserts: [{ window: [1020, 1350], always: { Conveyor_Motor: true } }],

      ar: 'الـ {{Release}} موصول مباشرة بالناقل بدون ذاكرة، فالناقل بيشتغل بس طول ما الزر مضغوط. بعدين القنينة لسا بالشعاع وبتوقف مرة ثانية. زيد بت ذاكرة بيتذكّر إنه هاي القنينة انحرّرت.',

  D.add('release_latch_not_cleared', {
    msg: {
      en: 'The "released" memory is never cleared. After the first Release it stays ON, so the next bottles do not stop. Let PE_Fill = 0 clear it: put PE_Fill in series with the memory.',
      ar: 'ذاكرة "انحرّرت" ما بتنمسح أبدًا. بعد أول {{Release}} بتضل شغّالة، فالقناني الجاية ما بتوقف. خلّي {{PE_Fill}} = 0 يمسحها: حط {{PE_Fill}} على التوالي مع الذاكرة.',

  D.add('powerup_bottle_ignored', {
