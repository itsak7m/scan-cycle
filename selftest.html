    events: [], asserts: [{ t: 4250, expect: { Conveyor_Motor: true }, tol: 1750 }],
  };

  D.add('conveyor_runs_while_filling', {
    msg: {
      en: 'The conveyor does not stop while the bottle is being filled, so the bottle moves away from the nozzle. Stop the conveyor while a bottle is at the filler (PE_Fill = 1) and the fill is running.',
      ar: 'الناقل ما بيوقف طول ما القنينة عم تنعبّى، فالقنينة بتبعد عن الفوهة. وقّف الناقل طول ما في قنينة عند الحشّاء ({{PE_Fill}} = 1) والتعبئة شغّالة.',
    },
    test: (ctx) => ctx.compiled.ok && ctx.usesTag('PE_Fill') && !ctx.probe(HOLD).pass,
  });

  D.add('bottle_not_released', {
    msg: {
      en: 'The bottle is never released after the fill. When the timer is done (its output Q), the conveyor must run by itself: use Q (or a "filled" memory) in the conveyor rung.',
      ar: 'القنينة ما بتنحرّر أبدًا بعد التعبئة. لما المؤقّت يخلص (مخرجه {{Q}})، الناقل لازم يشتغل لحاله: استخدم {{Q}} (أو ذاكرة "انعبّت") بدرجة الناقل.',
    },
    test: (ctx) => ctx.compiled.ok && ctx.writers('Conveyor_Motor').length > 0 && ctx.probe(HOLD).pass && !ctx.probe(RELEASE).pass,
  });
})();

</script>
<script>
/* ==== src/core/diag/L06.js ==== */
/* L06 diagnostics: pneumatic stopper, reed-switch feedback, air pressure */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const D = SC.diag;

  const NEVER_FILL_BEFORE_EXT = { window: [0, 99999], never: { Fill_Valve: true, Stopper_Ext: false } };
  const NEVER_CONV_IN_TRANSIT = { window: [0, 99999], never: { Conveyor_Motor: true, Stopper_SOL: false, Stopper_Ext: false, Stopper_Ret: false } };
  const preloaded = (id, durationMs, events, asserts) => ({ id, seed: 11, durationMs, plant: { genOn: false, preload: [{ x: 500 }] }, events, asserts });

  // bottle at the filler at power-up, stopper retracted, normal air
  const P_EXT = preloaded('diag-L06-ext', 4000, [], [NEVER_FILL_BEFORE_EXT]);
  const P_RET = preloaded('diag-L06-ret', 9000, [], [NEVER_CONV_IN_TRANSIT]);
  // the same with a slow cylinder (low air)
  const P_SLOW = preloaded('diag-L06-slow', 15000, [{ t: 0, fault: 'airLow' }], [NEVER_FILL_BEFORE_EXT, NEVER_CONV_IN_TRANSIT]);
  // air lost during the fill: valve and conveyor must be OFF
  const P_AIRFILL = preloaded('diag-L06-airfill', 4500, [{ t: 2000, fault: 'airLost' }], [
    { window: [2020, 4500], always: { Fill_Valve: false } }, { window: [2020, 4500], always: { Conveyor_Motor: false } }]);

  const shortTimer = (ctx) => ctx.ofType('TON', 'TP').some((x) => { const ms = SC.addr.parseTime(x.e.pt); return ms !== null && ms <= 2000; });

  D.add('fill_before_extended', {
    msg: {
      en: 'The fill started before Stopper_Ext said the stopper is extended. Put Stopper_Ext (the reed switch) in series with the valve, and with the timer input.',
      ar: 'التعبئة بدأت قبل ما {{Stopper_Ext}} يقول إنه الـ {{stopper}} ممدود. حط {{Stopper_Ext}} (الـ {{reed switch}}) على التوالي مع الصمام ومع مدخل المؤقّت.',
    },
    test: (ctx) => ctx.compiled.ok && ctx.writers('Fill_Valve').length > 0 && !ctx.probe(P_EXT).pass,
  });

  D.add('conveyor_before_retracted', {
    msg: {
      en: 'The conveyor started while the stopper was still retracting. After the fill, the conveyor needs Stopper_Ret = 1 (the reed switch says retracted).',
      ar: 'الناقل اشتغل والـ {{stopper}} لسا عم ينسحب. بعد التعبئة، الناقل بده {{Stopper_Ret}} = 1 (الـ {{reed switch}} بيقول مسحوب).',
    },
    test: (ctx) => ctx.compiled.ok && ctx.writers('Conveyor_Motor').length > 0 && !ctx.probe(P_RET).pass,
  });

  D.add('delay_instead_of_feedback', {
    msg: {
      en: 'A fixed delay is used where the reed switch should be. With low air or a longer travel time the cylinder is still moving when your time is up. Wait for Stopper_Ext and Stopper_Ret instead of a timer.',
      ar: 'استخدمت تأخير ثابت مكان الـ {{reed switch}}. لما الهوا منخفض أو زمن الحركة أطول، الأسطوانة لسا بتتحرك لما وقتك يخلص. استنى {{Stopper_Ext}} و{{Stopper_Ret}} بدل المؤقّت.',
    },
    test: (ctx) => ctx.compiled.ok && shortTimer(ctx) && !ctx.probe(P_SLOW).pass,
  });

  D.add('air_not_checked', {
    msg: {
      en: 'Air_OK is never used. When the air pressure is lost, the conveyor and the valve must stop: put Air_OK in series with them.',
      ar: '{{Air_OK}} ما انستخدم أبدًا. لما يروح ضغط الهوا، الناقل والصمام لازم يوقفوا: حط {{Air_OK}} على التوالي معهم.',
    },
    test: (ctx) => !ctx.usesTag('Air_OK') && (ctx.writers('Conveyor_Motor').length > 0 || ctx.writers('Fill_Valve').length > 0),
  });

  D.add('tp_ignores_air_loss', {
    msg: {
      en: 'A TP pulse keeps running when its input drops, so the valve stayed open after the air was lost. Put an Air_OK contact AFTER the TP block, in front of the valve coil.',
      ar: 'نبضة الـ {{TP}} بتضل شغّالة لما مدخلها ينطفي، فالصمام ضل مفتوح بعد ما راح الهوا. حط {{Air_OK}} بعد بلوك الـ {{TP}}، قبل ملف الصمام.',
    },
    test: (ctx) => ctx.compiled.ok && ctx.ofType('TP').length > 0 && ctx.usesTag('Air_OK') && !ctx.probe(P_AIRFILL).pass,
  });

  D.add('valve_ignores_air', {
    msg: {
      en: 'The fill valve stayed open after the air was lost. "Hold everything" includes the valve: put Air_OK in series with the valve and with the timer input.',
      ar: 'صمام التعبئة ضل مفتوح بعد ما راح الهوا. "وقّف كل شي" يعني الصمام كمان: حط {{Air_OK}} على التوالي مع الصمام ومع مدخل المؤقّت.',
    },
    test: (ctx) => ctx.compiled.ok && ctx.ofType('TP').length === 0 && ctx.usesTag('Air_OK') && ctx.writers('Fill_Valve').length > 0 && !ctx.probe(P_AIRFILL).pass,
  });

  // one bottle at power-up: exactly one fill, no overflow (a timer that restarts when the stopper moves refills the bottle)
  const P_ONCE = preloaded('diag-L06-once', 9000, [], [{ window: [0, 9000], never: { overflow: true } }]);
  // the fill is done: the stopper must retract (Stopper_Ret = 1)
  const P_RETRACT = preloaded('diag-L06-retract', 9000, [], [{ when: { Fill_Valve: true }, within: 6000, tol: 0, expect: { Stopper_Ret: true } }]);
  // a bottle is on its way and the filler is empty: the conveyor must run to bring it
  const P_BRING = { id: 'diag-L06-bring', seed: 14, durationMs: 700, plant: { genOn: false, preload: [{ x: 150 }] }, events: [], asserts: [{ window: [10, 500], always: { Conveyor_Motor: true } }] };

  D.add('fill_restarts_when_stopper_moves', {
    msg: {
      en: 'The timer input includes Stopper_Ext. When the stopper starts to retract, Stopper_Ext drops, the timer resets and the valve opens again: the bottle is filled twice. Keep a "filled" memory that stays ON until the bottle has left (PE_Fill = 0).',
      ar: 'مدخل المؤقّت فيه {{Stopper_Ext}}. لما الـ {{stopper}} يبدأ ينسحب، {{Stopper_Ext}} بينزل، المؤقّت بيرجع للصفر والصمام بيفتح من جديد: القنينة بتنعبّى مرتين. استخدم ذاكرة "انعبّت" بتضل شغّالة لحد ما القنينة تروح ({{PE_Fill}} = 0).',
    },
    test: (ctx) => ctx.compiled.ok && ctx.ofType('TON', 'TP').some((x) => ctx.rungEls(x.ri).some((y) => y.e.t === 'NO' && y.e.a === 'Stopper_Ext')) && !ctx.probe(P_ONCE).pass,
  });

  D.add('stopper_not_retracted', {
    msg: {
      en: 'The stopper never retracts after the fill, so the bottle cannot leave. Stopper_SOL must go OFF when the fill is done.',
      ar: 'الـ {{stopper}} ما بينسحب أبدًا بعد التعبئة، فالقنينة ما بتقدر تمشي. {{Stopper_SOL}} لازم ينطفي لما تخلص التعبئة.',
    },
    test: (ctx) => ctx.compiled.ok && ctx.writers('Stopper_SOL').length > 0 && ctx.probe(P_ONCE).pass && !ctx.probe(P_RETRACT).pass,
  });

  D.add('conveyor_blocked_when_empty', {
    msg: {
      en: 'The conveyor does not run to bring the next bottle. When the filler is empty (PE_Fill = 0) the conveyor runs. Stopper_Ret is needed only AFTER the fill, to release the bottle.',
      ar: 'الناقل ما بيشتغل عشان يجيب القنينة الجاية. لما الحشّاء فاضية ({{PE_Fill}} = 0) الناقل بيشتغل. {{Stopper_Ret}} بس لازم بعد التعبئة، عشان تتحرّر القنينة.',
    },
    test: (ctx) => ctx.compiled.ok && ctx.writers('Conveyor_Motor').length > 0 && !ctx.probe(P_BRING).pass,
  });
})();

</script>
<script>
/* ==== src/core/diag/L07.js ==== */
/* L07 diagnostics: CTU batch counter */
(function () {
  'use strict';
  const D = globalThis.SC.diag;
  const plain = (s) => s.replace(/\{\{|\}\}/g, '');

  // the R input of a CTU: a bit tag name (or undefined)
  const resetOf = (x) => (typeof x.e.rs === 'string' ? x.e.rs : '');

  // names that carry the counter's "done" state: inst.Q and the bits written in rungs that use it (two hops)
  function doneNames(ctx) {
    const names = new Set();
    ctx.ofType('CTU').forEach((x) => { if (x.e.i) names.add(x.e.i + '.Q'); });
    for (let pass = 0; pass < 2; pass++) {
      ctx.program.rungs.forEach((rg, ri) => {
        const els = ctx.rungEls(ri);
        const feeds = els.some((y) => y.e.t === 'CTU') || els.some((y) => (y.e.t === 'NO' || y.e.t === 'NC') && names.has(y.e.a));
        if (feeds) els.forEach((y) => { if ((y.e.t === 'OUT' || y.e.t === 'SET') && typeof y.e.a === 'string') names.add(y.e.a); });
      });
    }
    return names;
  }

  // R is ON all the time: wired to a bit that is 1 when idle (NC-wired stop / E-stop / door)
  D.add('reset_held_high', {
    msg: { en: 'The R (reset) pin of the counter is ON almost all the time, so the count is held at 0 and the counter never counts. R must read the Reset button (Reset_PB): its bit is 0 until the operator presses it. A Stop button is wired normally closed, so its bit is 1 when idle.', ar: plain('رجل R (التصفير) للعدّاد شغّالة تقريبًا طول الوقت، فالعدّ محبوس على 0 والعدّاد ما بيعدّ أبدًا. R لازم تقرا زر {{Reset}} (Reset_PB): بتّه 0 لحد ما المشغّل يضغطه. زر {{Stop}} موصول NC، فبتّه 1 وهو مش مضغوط.') },
    test: (ctx) => ctx.ofType('CTU').some((x) => {
      const t = ctx.tag(resetOf(x));
      return !!t && (t.wiring === 'NC' || ['stop', 'estop', 'guard'].indexOf(t.role) >= 0);
    }),
  });

  // R reads a bit that the same counter drives (its own done bit or the lamp)
  D.add('counter_resets_itself', {
    msg: { en: 'The R pin reads the lamp, and the counter itself drives the lamp. At 12 the lamp turns ON, that clears the count, and the lamp turns OFF again: it is ON for only ONE scan. R must read the Reset button.', ar: plain('رجل R بتقرا المصباح، والعدّاد نفسه هو اللي بيشغّل المصباح. عند 12 المصباح بيشتغل، هاد بيمسح العدّ، والمصباح بينطفي من جديد: بيضل شغّال {{scan}} واحد بس. R لازم تقرا زر {{Reset}}.') },
    test: (ctx) => ctx.ofType('CTU').some((x) => {
      const r = resetOf(x);
      if (!r) return false;
      return ctx.writers(r).some((w) => w.ri === x.ri || ctx.rungEls(w.ri).some((y) => (y.e.t === 'NO' || y.e.t === 'NC') && y.e.a === x.e.i + '.Q'));
    }),
  });

  // the counter exists but nothing in the conveyor rung(s) reads its done state
  D.add('batch_no_stop', {
    msg: { en: 'The batch is complete, but nothing stops the conveyor. Put a contact of the counter output Q (or of the batch lamp) in series with the conveyor rung, so the conveyor stops at 12 bottles.', ar: plain('الدفعة كاملة، بس ما في شي بيوقّف الناقل. حط {{contact}} من مخرج العدّاد Q (أو من مصباح الدفعة) على التوالي مع rung الناقل، عشان الناقل يوقف عند 12 قارورة.') },
    test: (ctx) => {
      if (!ctx.ofType('CTU').length) return false;
      const motor = ctx.writers('Conveyor_Motor');
      if (!motor.length) return false;
      const done = doneNames(ctx);
      return !motor.some((w) => ctx.rungEls(w.ri).some((y) => (y.e.t === 'NO' || y.e.t === 'NC') && done.has(y.e.a)));
    },
  });

  D.add('wrong_preset', {
    msg: { en: 'The preset value (PV) is not 12. The counter output Q turns ON when the count reaches PV, so PV must be exactly the size of the batch: 12.', ar: plain('القيمة المحددة (PV) مش 12. مخرج العدّاد Q بيشتغل لما العدّ يوصل PV، فلازم PV تكون بالضبط حجم الدفعة: 12.') },
    test: (ctx) => ctx.ofType('CTU').some((x) => typeof x.e.pv === 'number' && x.e.pv !== 12),
  });

  // the lamp keeps itself ON (seal-in or SET without RST): Reset cannot clear it
  D.add('lamp_latched_no_reset', {
    msg: { en: 'The lamp holds itself ON (a latch) and Reset does not clear it. The lamp must follow the counter output Q: when Reset sets the count to 0, Q goes to 0 and the lamp goes OFF.', ar: plain('المصباح بيثبّت حاله شغّال ({{latch}}) و{{Reset}} ما بيمسحه. المصباح لازم يتبع مخرج العدّاد Q: لما {{Reset}} يرجّع العدّ إلى 0، Q بيروح 0 والمصباح بينطفي.') },
    test: (ctx) => ctx.writers('Batch_Lamp').some((w) => (w.e.t === 'OUT' && ctx.rungEls(w.ri).some((y) => y.e.t === 'NO' && y.e.a === 'Batch_Lamp') && !ctx.rungEls(w.ri).some((y) => y.e.a === 'Reset_PB'))
      || (w.e.t === 'SET' && !ctx.writers('Batch_Lamp').some((v) => v.e.t === 'RST'))),
  });

  // R wired to Start: every Start clears the count
  D.add('reset_on_start', {
    msg: { en: 'The counter R pin is wired to Start. Every Start clears the count and the Reset button does nothing. Stop and Start must keep the count. Wire R to Reset_PB.', ar: plain('رجل R للعدّاد موصولة على {{Start}}. كل {{Start}} بيمسح العدّ وزر {{Reset}} ما بيعمل شي. {{Stop}} و{{Start}} لازم يحافظوا على العدّ. وصّل R على Reset_PB.') },
    test: (ctx) => ctx.ofType('CTU').some((x) => ctx.roleOf(resetOf(x)) === 'start'),
  });
})();

</script>
<script>
/* ==== src/core/diag/L08.js ==== */
/* L08 diagnostics: reject station, one-shot pulse, SET / RESET */
(function () {
  'use strict';
  const D = globalThis.SC.diag;
  const plain = (s) => s.replace(/\{\{|\}\}/g, '');

  const TIMERS = ['TON', 'TOF', 'TP', 'TONR'];
  const EDGES = ['POS', 'NEG'];
  const pusherWriters = (ctx) => ctx.writers('Reject_Pusher');

  D.add('level_not_checked', {
    msg: { en: 'Level_OK is never used, so the pusher pushes EVERY bottle, good ones too. Push only when a bottle is at the photo-eye AND Level_OK = 0.', ar: plain('الـ {{Level_OK}} ما انستخدم، فالدافع بيزيح كل القوارير حتى السليمة. ادفع بس لما في قارورة عند العين الضوئية و {{Level_OK}} = 0.') },
    test: (ctx) => !ctx.usesTag('Level_OK'),
  });

  // Level_OK read only through NO contacts: the GOOD bottles start the pusher
  D.add('level_ok_wrong_polarity', {
    msg: { en: 'You use Level_OK as a normal (NO) contact. It is ON for GOOD bottles, so the good bottles are pushed off and the bad ones pass. A bad bottle is a bottle at the photo-eye AND Level_OK = 0: use an NC contact on Level_OK.', ar: plain('استخدمت {{Level_OK}} كـ {{contact}} عادي (NO). هو شغّال للقوارير السليمة، فالسليمة بتنزاح والسيئة بتمرّ. القارورة السيئة هي قارورة عند العين الضوئية و {{Level_OK}} = 0: استخدم NC contact على {{Level_OK}}.') },
    test: (ctx) => ctx.readers('Level_OK').some((x) => x.e.t === 'NO') && !ctx.readers('Level_OK').some((x) => x.e.t === 'NC'),
  });

  D.add('ton_instead_of_tp', {
    msg: { en: 'A TON waits 500 ms and only THEN switches ON. The bad bottle is in the beam for less than 500 ms, so the timer never finishes (and if it did, the bottle would have moved on). The pusher must start at once and stay ON for 500 ms: use a TP pulse timer.', ar: plain('الـ {{TON}} بيستنى 500 ms وبعدين بس بيشتغل. القارورة السيئة بتضل بالشعاع أقل من 500 ms، فالمؤقّت ما بيخلص أبدًا (ولو خلص، القارورة بتكون راحت). الدافع لازم يبدأ فورًا ويضل شغّال 500 ms: استخدم مؤقّت النبضة {{TP}}.') },
    test: (ctx) => ctx.ofType('TON').some((x) => ctx.rungEls(x.ri).some((y) => (y.e.t === 'OUT' || y.e.t === 'SET') && y.e.a === 'Reject_Pusher')),
  });

  // an edge contact in the pusher rung and no timer: a one-scan pulse
  D.add('edge_pulse_too_short', {
    msg: { en: 'An edge contact gives a pulse of only ONE scan (10 ms). The pusher needs more than 150 ms to move out, so it never pushes anything. Let a TP timer (or a SET / RESET with a timer) make the 500 ms pulse.', ar: plain('الـ edge contact بيعطي نبضة {{scan}} واحد بس (10 ms). الدافع بده أكتر من 150 ms ليطلع، فما بيزيح أي شي. خلّي مؤقّت {{TP}} (أو {{SET}} / {{RESET}} مع مؤقّت) هو اللي يعمل نبضة 500 ms.') },
    test: (ctx) => pusherWriters(ctx).some((w) => ctx.rungEls(w.ri).some((y) => EDGES.indexOf(y.e.t) >= 0) && !ctx.rungEls(w.ri).some((y) => TIMERS.indexOf(y.e.t) >= 0)),
  });

  // the pusher coil reads only sensors: it follows the photo-eye, so the pulse lasts until the pushed bottle is gone
  D.add('pusher_follows_eye', {
    msg: { en: 'The pusher coil follows the photo-eye: it is ON only while the bad bottle is in the beam. The pusher moves the bottle away in about 140 ms and the beam is empty again, so the pulse is much shorter than 500 ms. Use a TP timer: it keeps its output ON for the full 500 ms.', ar: plain('ملف الدافع بيتبع العين الضوئية: هو شغّال بس طول ما القارورة السيئة بالشعاع. الدافع بيبعد القارورة بحوالي 140 ms والشعاع بيرجع فاضي، فالنبضة أقصر بكتير من 500 ms. استخدم مؤقّت {{TP}}: بيخلّي مخرجه شغّال 500 ms كاملة.') },
    test: (ctx) => pusherWriters(ctx).some((w) => w.e.t === 'OUT' && ctx.rungEls(w.ri).every((y) => y.e.t === 'OUT'
      || ((y.e.t === 'NO' || y.e.t === 'NC') && !!ctx.tag(y.e.a) && !ctx.tag(y.e.a).user && y.e.a.indexOf('.') < 0))),
  });

  // SET without RESET: the bit stays ON for ever
  D.add('bad_latch_not_cleared', {
    msg: { en: 'A bit is SET but never RESET. After the first bad bottle it stays ON, so EVERY bottle after it is pushed off, good ones too. RESET the bit after the pusher has pushed the bad bottle.', ar: plain('في بت بيتعمله {{SET}} وما بيتعمله {{RESET}} أبدًا. بعد أول قارورة سيئة بيضل شغّال، فكل قارورة بعدها بتنزاح حتى السليمة. اعمل {{RESET}} للبت بعد ما الدافع يزيح القارورة السيئة.') },
    test: (ctx) => ctx.ofType('SET').some((x) => !ctx.ofType('RST').some((y) => y.e.a === x.e.a)),
  });
})();

</script>
<script>
/* ==== src/core/diag/L09.js ==== */
/* L09 diagnostics: piston filler sequencer with an Int step variable */
(function () {
  'use strict';
  const D = globalThis.SC.diag;
  const plain = (s) => s.replace(/\{\{|\}\}/g, '');

  const STEP = 'Step';
  const moves = (ctx) => ctx.ofType('MOVE').filter((x) => x.e.o === STEP);
  // CMP(==, Step, n) contacts of a rung -> n
  const stepTests = (ctx, ri) => ctx.rungEls(ri).filter((y) => y.e.t === 'CMP' && y.e.op === '==' && y.e.a === STEP).map((y) => y.e.b);
  const failedOn = (ctx, key) => !!(ctx.failure && ctx.failure.expected && Object.prototype.hasOwnProperty.call(ctx.failure.expected, key));

  // nothing puts Step back to 0 outside the normal 3 -> 0 transition
  D.add('step_not_reset_by_estop', {
    msg: { en: 'Nothing puts Step back to 0 when the line stops. After an E-stop the sequence would go on from the old step. Add a rung that is true when the line is not running (NC contact of your run bit, which needs EStop_OK) and does MOVE(0, Step).', ar: plain('ما في شي بيرجّع {{Step}} إلى 0 لما الخط بيوقف. بعد الطوارئ التتابع بيكمل من الخطوة القديمة. زيد rung بيكون صحيح لما الخط مش شغّال (NC contact لبت التشغيل، اللي بده {{EStop_OK}}) وبيعمل MOVE(0, Step).') },
    test: (ctx) => moves(ctx).length > 0
      && !moves(ctx).some((x) => x.e.a === 0 && !ctx.rungEls(x.ri).some((y) => y.e.t === 'CMP'))
      && (!ctx.failure || failedOn(ctx, STEP)),
  });

  // a rung that tests Step = n and moves on with no other condition, placed after the rung that moves to n
  D.add('step_fall_through', {
    msg: { en: 'Fall-through: a rung moves Step to n, and a LATER rung in the same scan tests Step = n and moves on with no other condition. Step n lasts for zero scans, so its outputs never run (here: the stopper never retracts). Every step must wait for its own sensor.', ar: plain('{{fall-through}}: rung بينقل {{Step}} إلى n، و rung بعده بنفس الـ {{scan}} بيفحص Step = n وبيكمل بدون أي شرط ثاني. الخطوة n بتدوم صفر {{scan}}، فمخارجها ما بتشتغل أبدًا (هون: المصدّ ما بيرجع). كل خطوة لازم تستنى حساسها.') },
    test: (ctx) => {
      const mv = moves(ctx);
      return mv.some((later) => {
        const els = ctx.rungEls(later.ri);
        const onlyCmpMove = els.every((y) => y.e.t === 'CMP' || y.e.t === 'MOVE');
        if (!onlyCmpMove) return false;
        const tests = stepTests(ctx, later.ri);
        return mv.some((early) => early.ri < later.ri && tests.indexOf(early.e.a) >= 0);
      });
    },
  });

  // the rung order output - transition - output: two pump outputs overlap for a scan
  D.add('pump_outputs_overlap', {
    msg: { en: 'Pump_Fwd and Pump_Rev were ON in the same scan. A transition rung sits between the two output rungs: in the scan where step 1 ends, the draw output still sees step 1 and the dispense output already sees step 2. Put ALL transition rungs first, then ALL output rungs (or stop each output with its own sensor).', ar: plain('{{Pump_Fwd}} و{{Pump_Rev}} اشتغلوا بنفس الـ {{scan}}. rung انتقال موجود بين rungي المخرجين: بالـ {{scan}} اللي بتنتهي فيه الخطوة 1، مخرج السحب لسا بيشوف الخطوة 1 ومخرج التعبئة صار بيشوف الخطوة 2. حط كل rungs الانتقالات أول، وبعدين كل rungs المخارج (أو وقّف كل مخرج بحساسه).') },
    test: (ctx) => {
      if (ctx.failure && ctx.failure.assertId === 'pumps-exclusive') return true;
      const rev = ctx.writers('Pump_Rev').filter((w) => !ctx.rungEls(w.ri).some((y) => y.e.t === 'NC' && y.e.a === 'Pump_Full'));
      const fwd = ctx.writers('Pump_Fwd');
      const mv = moves(ctx).filter((x) => x.e.a !== 0);
      return rev.some((r) => fwd.some((f) => mv.some((m) => r.ri < m.ri && m.ri < f.ri)));
    },
  });

  // time instead of feedback: Pump_Full / Pump_Home are not both used
  D.add('pump_time_not_feedback', {
    msg: { en: 'The draw or the dispense ends by a TIME, not by the sensor. A slower pump then only draws part of the stroke and the bottle is underfilled. Step 1 must end when Pump_Full = 1, step 2 when Pump_Home = 1.', ar: plain('السحب أو التعبئة بينتهوا بـ وقت مش بالحساس. المضخة الأبطأ بتسحب جزء من الشوط بس والقارورة بتطلع ناقصة. الخطوة 1 لازم تنتهي لما {{Pump_Full}} = 1، والخطوة 2 لما {{Pump_Home}} = 1.') },
    test: (ctx) => ctx.ofType('TON', 'TONR', 'TP').some((x) => ctx.rungEls(x.ri).some((y) => y.e.t === 'CMP' && y.e.a === STEP)) && (!ctx.usesTag('Pump_Full') || !ctx.usesTag('Pump_Home')),
  });

  // step 1 starts without a stable "bottle stopped" check
  D.add('start_on_moving_bottle', {
    msg: { en: 'Step 1 starts as soon as PE_Fill and Stopper_Ext are ON together. After a restart the old bottle is still in the beam while the stopper extends, so both are ON for a moment and a cycle starts with no bottle under the nozzle. A stopped bottle stays in the beam: let a TON of 0.3 s check it before MOVE(1, Step).', ar: plain('الخطوة 1 بتبدأ أول ما {{PE_Fill}} و{{Stopper_Ext}} يكونوا ON مع بعض. بعد إعادة التشغيل القارورة القديمة لسا بالشعاع وقت ما المصدّ بيمدّ، فبيكونوا ON لحظة وبتبدأ دورة بدون قارورة تحت الفوّهة. القارورة الواقفة بتضل بالشعاع: خلّي {{TON}} مدته 0.3 ثانية يفحصها قبل MOVE(1, Step).') },
    test: (ctx) => ctx.ofType('MOVE').some((x) => x.e.o === STEP && x.e.a === 1)
      && !ctx.ofType('TON', 'TONR').some((x) => ctx.rungEls(x.ri).some((y) => y.e.a === 'PE_Fill')),
  });

  // SET on an actuator that no E-stop / run bit can RESET
  D.add('output_latched_estop', {
    msg: { en: 'An output is SET and only a sensor RESETs it. When the E-stop puts Step back to 0, the latched output stays ON in the PLC (the plant cuts the power, but the PLC output must be OFF too). Put your run bit or EStop_OK in the RESET condition, or drive the output with a plain coil from the step number.', ar: plain('في مخرج بيتعمله {{SET}} وبس حساس بيعمله {{RESET}}. لما الطوارئ بترجّع {{Step}} إلى 0، المخرج المثبّت بيضل ON بالـ {{PLC}} (المصنع بيقطع الكهربا، بس مخرج الـ {{PLC}} لازم ينطفي كمان). حط بت التشغيل أو {{EStop_OK}} بشرط الـ {{RESET}}، أو شغّل المخرج بـ coil عادي من رقم الخطوة.') },
    test: (ctx) => ctx.ofType('SET').some((x) => ctx.roleOf(x.e.a) === 'actuator'
      && !ctx.ofType('RST').some((y) => y.e.a === x.e.a && ctx.rungEls(y.ri).some((z) => z.e.t === 'NC' || z.e.a === 'EStop_OK'))),
  });
})();

</script>
<script>
/* ==== src/core/diag/L10.js ==== */
/* L10 diagnostics: tracking missing caps with a shift word */
(function () {
  'use strict';
  const D = globalThis.SC.diag;
  const plain = (s) => s.replace(/\{\{|\}\}/g, '');

  const hasEdge = (ctx, ri) => ctx.rungEls(ri).some((y) => y.e.t === 'POS' || y.e.t === 'NEG');
  const shiftWords = (ctx) => ctx.ofType('SHL').map((x) => x.e.w);

  // timers and no shift register: the bottle is followed by time, not by belt distance
  D.add('time_based_tracking', {
    msg: { en: 'You follow the bad bottle with a timer. A timer only knows the time, not the belt distance: when the belt speed changes, or two bad bottles come close together, the pusher fires at the wrong moment. Count encoder pulses with a shift word instead.', ar: plain('بتتبّع القنينة السيئة بمؤقّت. المؤقّت بيعرف الوقت بس مش مسافة السير: لما سرعة السير بتتغيّر، أو بتيجي قنينتين سيئتين قريبتين، الدافع بيشتغل بوقت غلط. عدّ نبضات {{encoder}} بكلمة إزاحة بدل المؤقّت.') },
    test: (ctx) => ctx.ofType('TON', 'TONR', 'TOF').length > 0 && ctx.ofType('SHL').length === 0,
  });

  // SHL on a rung without an edge contact
  D.add('shift_without_edge', {
    msg: { en: 'SHL runs on EVERY scan while its rung has power, and the encoder pulse stays ON for about 100 ms (10 scans). So the word shifts about 10 places per pulse and the mark runs off the end too early. Put an edge contact (-|P|-) in front of SHL: one pulse = one shift.', ar: plain('الـ SHL بينفّذ بكل {{scan}} طول ما في power بالـ rung، ونبضة الـ {{encoder}} بتضل شغّالة حوالي 100 ms (10 scans). فالكلمة بتتزحزح حوالي 10 أماكن بالنبضة والعلامة بتطلع من الآخر بدري. حط edge contact (-|P|-) قبل SHL: نبضة = إزاحة وحدة.') },
    test: (ctx) => ctx.ofType('SHL').some((x) => !hasEdge(ctx, x.ri)),
  });

  // the missing-cap mark does not depend on PE_Cap: an empty place also has Cap_Present = 0
  D.add('no_bottle_check', {
    msg: { en: 'Cap_Present = 0 does NOT mean "bottle without a cap": an empty place (a gap, or the space between bottles) gives 0 too. Mark a bottle only when PE_Cap sees a bottle AND Cap_Present does not see a cap.', ar: plain('{{Cap_Present}} = 0 ما بتعني "قنينة بدون غطاء": المكان الفاضي (فراغ أو المسافة بين القناني) بيعطي 0 كمان. علّم القنينة بس لما {{PE_Cap}} يشوف قنينة و{{Cap_Present}} ما يشوف غطاء.') },
    test: (ctx) => ctx.usesTag('Cap_Present') && !ctx.usesTag('PE_Cap'),
  });

  // a latched mark (SET) that nothing resets
  D.add('mark_not_cleared', {
    msg: { en: 'The mark bit is SET but nothing resets it. After the first bad bottle it stays 1, so every pulse shifts a 1 into the word and good bottles are pushed off. Reset the mark after it is shifted in (or use a plain coil).', ar: plain('بت العلامة بيتعمله SET وما في شي بيعمله RESET. بعد أول قنينة سيئة بيضل 1، فكل نبضة بتدخّل 1 على الكلمة والقناني السليمة بتنزاح. اعمل RESET للعلامة بعد ما تنزاح داخل الكلمة (أو استخدم coil عادي).') },
    test: (ctx) => ctx.ofType('SET').some((x) => !ctx.ofType('RST').some((y) => y.e.a === x.e.a)) && shiftWords(ctx).length > 0,
  });

  // the pusher is not driven by "sign bit of the shifted word" (Track < 0)
  D.add('reject_position_wrong', {
    msg: { en: 'The pusher does not fire when the mark reaches the LAST bit. The reject eye is 15 pulses after the cap check, so the mark must be at bit 15. Bit 15 is the sign bit: CMP(<, Track, 0) is TRUE exactly when bit 15 = 1.', ar: plain('الدافع ما بيشتغل لما العلامة بتوصل للبت الأخير. عين الرفض بعد 15 نبضة من فحص الغطاء، فالعلامة لازم تكون عند البت 15. البت 15 هو بت الإشارة: CMP(<, Track, 0) صحيح بالضبط لما البت 15 = 1.') },
    test: (ctx) => {
      const words = shiftWords(ctx);
      if (!words.length) return false;
      return !ctx.ofType('CMP').some((x) => words.indexOf(x.e.a) >= 0 && x.e.op === '<' && Number(x.e.b) === 0);
    },
  });

  // an edge contact straight in front of the pusher coil (no TP): a one-scan pulse
  D.add('pusher_pulse_too_short', {
    msg: { en: 'An edge contact in front of the pusher coil gives a pulse of only ONE scan (10 ms). The pusher needs more than 150 ms to move. Let the sign-bit compare drive the pusher (it lasts one encoder pitch), or use a TP pulse timer.', ar: plain('edge contact قبل ملف الدافع بيعطي نبضة {{scan}} واحد بس (10 ms). الدافع بده أكتر من 150 ms ليتحرك. خلّي مقارنة بت الإشارة هي اللي تشغّل الدافع (بتدوم خطوة {{encoder}} كاملة)، أو استخدم مؤقّت نبضة TP.') },
    test: (ctx) => ctx.writers('Reject_Pusher').some((x) => ctx.rungEls(x.ri).some((y) => y.e.t === 'POS' || y.e.t === 'NEG') && !ctx.rungEls(x.ri).some((y) => y.e.t === 'TP')),
  });
})();

</script>
<script>
/* ==== src/core/diag/L11.js ==== */
/* L11 diagnostics: latched alarms, Ack, flashing lamp, debounce, priority.
 * They are behavioural: each one runs a tiny extra scenario against the player's program (ctx.probe). */
(function () {
  'use strict';
  const D = globalThis.SC.diag;
  const plain = (s) => s.replace(/\{\{|\}\}/g, '');
  const ack = (t) => ({ t, set: { Ack_PB: true } });
  const ackEnd = (t) => ({ t, set: { Ack_PB: false } });
  const sc = (id, durationMs, events, asserts) => ({ id: 'diag-' + id, seed: 7, durationMs, events, asserts });

  // the alarm comes and goes, nobody presses Ack: the horn must still be ON afterwards
  D.add('alarm_not_latched', {
    msg: { en: 'The alarm disappears when the input goes OFF. An alarm must LATCH (SET or seal-in): it stays until it is acknowledged, even if the cause is already gone.', ar: plain('الإنذار بيختفي لما المدخل ينطفي. الإنذار لازم يتثبّت ({{latch}}) بـ SET أو seal-in: بيضل لحد ما ينعمله {{Ack}}، حتى لو السبب راح.') },
    test: (ctx) => !ctx.probe(sc('latched', 4000, [{ t: 500, plantSet: { tankPct: 4 } }, { t: 1000, plantSet: { tankPct: 50 } }], [{ window: [1100, 3900], always: { Horn: true } }])).pass,
  });

  // Ack while the alarm is still active: the horn must go OFF
  D.add('horn_not_silenced', {
    msg: { en: 'Ack does not silence the horn while the alarm is still active. Ack means "I saw it": the horn stops at once, and the lamp turns steady while the alarm is active.', ar: plain('{{Ack}} ما بيسكّت البوق والإنذار لسا موجود. {{Ack}} معناه "شفته": البوق بيوقف فورًا، والمصباح بيصير ثابت طول ما الإنذار موجود.') },
    test: (ctx) => !ctx.probe(sc('silence', 5000, [{ t: 500, plantSet: { tankPct: 4 } }, ack(2000), ackEnd(2300)], [{ window: [2100, 4900], always: { Horn: false } }])).pass,
  });

  // the lamp must flash while the alarm is not acknowledged
  D.add('lamp_never_flashes', {
    msg: { en: 'The lamp does not flash. A new, unacknowledged alarm must FLASH the lamp (steady means "acknowledged"). Build a flasher with two timers: each one starts the other.', ar: plain('المصباح ما بيومض. الإنذار الجديد اللي ما انعمله {{Ack}} لازم يخلّي المصباح يومض (الثابت معناه "تم الإقرار"). ابنِ {{flasher}} بمؤقّتين: كل واحد بيشغّل التاني.') },
    test: (ctx) => !ctx.probe(sc('flash', 5000, [{ t: 500, plantSet: { tankPct: 4 } }], [{ t: 3000, expect: { Alarm_Lamp: true }, tol: 1500 }, { t: 3000, expect: { Alarm_Lamp: false }, tol: 1500 }])).pass,
  });

  // LSL only: filling must go on
  D.add('lsl_stops_fill', {
    msg: { en: 'LSL (low level) only WARNS. Your program stops filling when LSL is ON. Only LSLL (low-low level) may stop the filler.', ar: plain('{{LSL}} (مستوى منخفض) تحذير بس. برنامجك بيوقف التعبئة لما {{LSL}} شغّال. بس {{LSLL}} (مستوى منخفض جدًا) من حقه يوقف الحشّاء.') },
    test: (ctx) => !ctx.probe(sc('lsl', 4000, [{ t: 500, plantSet: { tankPct: 12 } }], [{ window: [600, 3900], always: { Fill_Valve: true } }])).pass,
  });

  // a 2 s blockage, or a chattering eye, must not raise the jam alarm
  D.add('jam_no_debounce', {
    msg: { en: 'A jam alarm comes too early. A bottle that only passes the back-up eye, or a chattering eye, is not a jam. Wait with a TON timer (5 s) that restarts every time PE_Backup drops.', ar: plain('إنذار الانحشار بيجي بدري. القنينة اللي بتمرّ بس من عين التراكم، أو العين المرتعشة، مش انحشار. استنى بمؤقّت {{TON}} (5 ثواني) بيبدأ من جديد كل ما {{PE_Backup}} ينزل.') },
    test: (ctx) => !ctx.probe(sc('jam2s', 5000, [{ t: 500, fault: 'peStuckOn', arg: 'PE_Backup' }, { t: 2500, clear: 'peStuckOn', arg: 'PE_Backup' }], [{ window: [0, 4900], always: { Horn: false } }])).pass
      || !ctx.probe(sc('chatter', 7000, [{ t: 500, fault: 'peChatter', arg: 'PE_Backup' }], [{ window: [0, 6900], always: { Horn: false } }])).pass,
  });

  // LSL acknowledged, then LSLL comes: the horn must sound again (each alarm has its own Ack state)
  D.add('alarm_not_new_after_ack', {
    msg: { en: 'A new alarm does not sound the horn when an older alarm was already acknowledged. Every alarm needs its own "new" event: use a rising edge (-|P|-) on EACH alarm to set the not-acknowledged bit again.', ar: plain('إنذار جديد ما شغّل البوق لأنه إنذار أقدم كان انعمله {{Ack}}. كل إنذار بده حدثه "الجديد": استخدم {{rising edge}} (-|P|-) على كل إنذار لتشغّل بت (لسا ما انعمل {{Ack}}) من جديد.') },
    test: (ctx) => !ctx.probe(sc('escalate', 6000, [{ t: 500, plantSet: { tankPct: 12 } }, ack(1500), ackEnd(1800), { t: 3000, plantSet: { tankPct: 4 } }], [{ t: 3000, expect: { Horn: true }, tol: 50 }])).pass,
  });
})();

</script>
<script>
/* ==== src/core/diag/L12.js ==== */
/* L12 diagnostics: PackML states on the stack light. Behavioural: each one runs a tiny extra scenario (ctx.probe). */
(function () {
  'use strict';
  const D = globalThis.SC.diag;
  const plain = (s) => s.replace(/\{\{|\}\}/g, '');
  const press = (name, t, ms) => ({ t, press: name, ms: ms || 300 });
  const sc = (id, durationMs, events, asserts, plant) => ({ id: 'diag-' + id, seed: 9, durationMs, events, asserts, plant: plant || {} });

  // a bottle that waits ~1 s at the end must not pause the conveyor
  D.add('blocked_no_debounce', {
    msg: { en: 'The conveyor pauses too early. A bottle that only waits a moment at the end of the line is not a blockage. Pause only after PE_Backup was ON for 2 s without a break (TON, 2 s).', ar: plain('الناقل بيوقف بدري. القنينة اللي بتستنى لحظة بس بآخر الخط مش انسداد. أوقف الناقل بس بعد ما {{PE_Backup}} يكون شغّال ثانيتين متواصلتين ({{TON}}، 2 ثانية).') },
    test: (ctx) => !ctx.probe(sc('block-short', 5000, [press('Start_PB', 500), { t: 300, plantSet: { outfeedBlocked: true } }, { t: 2500, plantSet: { outfeedBlocked: false } }], [{ window: [700, 4500], always: { Conveyor_Motor: true } }], { preload: [{ x: 1550 }] })).pass,
  });

  // the blockage is gone: the conveyor must resume by itself
  D.add('blocked_not_resumed', {
    msg: { en: 'The line does not resume after the blockage is gone. Suspended-Blocked is not latched: it lasts only while PE_Backup is ON for 2 s. When PE_Backup drops, the conveyor must run again by itself.', ar: plain('الخط ما رجع اشتغل بعد ما الانسداد راح. {{Suspended-Blocked}} مش مثبّت ({{latched}}): بيضل بس طول ما {{PE_Backup}} شغّال ثانيتين. لما {{PE_Backup}} ينزل، الناقل لازم يرجع يشتغل لحاله.') },
    test: (ctx) => !ctx.probe(sc('block-resume', 9000, [press('Start_PB', 500), { t: 300, plantSet: { outfeedBlocked: true } }, { t: 6000, plantSet: { outfeedBlocked: false } }], [{ t: 7500, expect: { Conveyor_Motor: true }, tol: 700 }], { preload: [{ x: 1700 }] })).pass,
  });

  // air lost: Held = steady amber, stays held after the air returns
  D.add('held_like_suspended', {
    msg: { en: 'Held and Suspended are mixed up. A fault INSIDE the line (air lost) is Held: STEADY amber, conveyor stopped, and it stays held after the air comes back until the operator presses Start. Suspended (flashing amber) is only for things OUTSIDE the line and clears by itself.', ar: plain('{{Held}} و{{Suspended}} متلخبطين. العطل جوّا الخط (ضغط الهواء راح) هو {{Held}}: أصفر ثابت، الناقل واقف، وبيضل محتجز بعد ما يرجع الهواء لحد ما المشغّل يضغط {{Start}}. {{Suspended}} (أصفر وامض) بس للأشياء اللي من برا الخط وبيروح لحاله.') },
    test: (ctx) => !ctx.probe(sc('held', 8000, [press('Start_PB', 500), { t: 2000, fault: 'airLost' }, { t: 4000, clear: 'airLost' }], [{ window: [4200, 7900], always: { Conveyor_Motor: false, Stack_Amber: true } }])).pass,
  });

  // a gap between bottles must not flash the amber light
  D.add('starved_no_debounce', {
    msg: { en: 'The amber light reacts to every gap between two bottles. Starved means NO bottle at the infeed for more than 3 s. Use a TON (3 s) that restarts every time PE_Infeed sees a bottle.', ar: plain('الضوء الأصفر بيتفاعل مع كل فراغ بين قنينتين. {{Starved}} معناه ما في أي قنينة عند المدخل أكتر من 3 ثواني. استخدم {{TON}} (3 ثواني) بيبدأ من جديد كل ما {{PE_Infeed}} يشوف قنينة.') },
    test: (ctx) => !ctx.probe(sc('gaps', 9000, [press('Start_PB', 500)], [{ window: [3000, 8900], always: { Stack_Amber: false } }])).pass,
  });

  // Starved only changes the light; the conveyor keeps running
  D.add('starved_stops_conveyor', {
    msg: { en: 'The conveyor stops when no bottles arrive. Starved only changes the light: the conveyor must keep running (otherwise no bottle can ever arrive). Only Blocked pauses the conveyor.', ar: plain('الناقل بيوقف لما ما في قناني بتوصل. {{Starved}} بيغيّر الضوء بس: الناقل لازم يضل شغّال (غير هيك ما رح توصل ولا قنينة). بس {{Blocked}} بيوقف الناقل.') },
    test: (ctx) => !ctx.probe(sc('starve-run', 10000, [press('Start_PB', 500), { t: 1000, plantSet: { genOn: false } }], [{ window: [6500, 9900], always: { Conveyor_Motor: true } }])).pass,
  });

  D.add('mode_ignored', {
    msg: { en: 'Mode_Auto is never used. The line must run only in Auto mode: in Manual mode (Mode_Auto = 0) it is Stopped (red).', ar: plain('{{Mode_Auto}} ما انستخدم. الخط لازم يشتغل بس بالوضع الأوتوماتيكي: بالوضع اليدوي ({{Mode_Auto}} = 0) هو {{Stopped}} (أحمر).') },
    test: (ctx) => !ctx.usesTag('Mode_Auto'),
  });
})();

</script>
<script>
/* ==== src/core/diag/L13.js ==== */
/* L13 diagnostics: line clearance (two different sign-offs), reject challenge, key-protected setpoint */
(function () {
  'use strict';
  const D = globalThis.SC.diag;

  // does rung `ri` depend on `tag`? (the tag is a contact in the rung, or a contact whose bit is written by a rung that depends on it)
  function rungUses(ctx, ri, tag, seen) {
    for (const y of ctx.rungEls(ri)) {
      if (y.e.a === tag) return true;
      if (['NO', 'NC', 'POS', 'NEG'].indexOf(y.e.t) >= 0 && y.e.a && !seen.has(y.e.a)) {
        seen.add(y.e.a);
        for (const w of ctx.writers(y.e.a)) if (rungUses(ctx, w.ri, tag, seen)) return true;
      }
    }
    return false;
  }

  // a bit is latched when a SET writes it, or a rung holds it with its own contact
  const isLatched = (ctx, tag) => ctx.writers(tag).some((w) => w.e.t === 'SET' || ctx.rungEls(w.ri).some((y) => y.e.t === 'NO' && y.e.a === tag));

  // probe: press events -> the conveyor must never run
  function neverRuns(ctx, events) {
    const r = ctx.probe({ id: 'probe', seed: 1, durationMs: 8000, plant: { genOn: false }, events, asserts: [{ window: [0, 8000], always: { Conveyor_Motor: false } }] });
    return r.pass;
  }
  const one = (key) => [{ t: 1000, press: key, ms: 400 }, { t: 2000, press: key, ms: 400 }, { t: 3500, press: 'Start_PB', ms: 300 }];
  const together = [{ t: 1000, press: 'Clear_Sign1', ms: 500 }, { t: 1000, press: 'Clear_Sign2', ms: 500 }, { t: 3000, press: 'Start_PB', ms: 300 }];
  const usesSign = (ctx) => ctx.usesTag('Clear_Sign1') || ctx.usesTag('Clear_Sign2');

  D.add('same_key_twice', {
    msg: { en: 'One key was enough to start. Sign 1 and Sign 2 must be two different keys: pressing the same key twice must not count as two sign-offs. Check which key feeds each sign latch.', ar: 'مفتاح واحد كفى للتشغيل. لازم Sign 1 و Sign 2 يكونوا مفتاحين مختلفين: ضغط نفس المفتاح مرتين ما لازم ينحسب توقيعين. افحص أي مفتاح بيغذّي كل latch تبع التوقيع.' },
    test: (ctx) => usesSign(ctx) && (!neverRuns(ctx, one('Clear_Sign1')) || !neverRuns(ctx, one('Clear_Sign2'))),
  });

  D.add('signs_not_separate', {
    msg: { en: 'Both keys pressed at the same moment were accepted. That looks like one person with two keys. Set each sign latch only while the OTHER key is not pressed.', ar: 'المفتاحين انضغطوا بنفس اللحظة وانقبلوا. هاد شكله شخص واحد معه مفتاحين. شغّل كل latch تبع التوقيع بس لما المفتاح التاني مش مضغوط.' },
    test: (ctx) => ctx.usesTag('Clear_Sign1') && ctx.usesTag('Clear_Sign2') && !neverRuns(ctx, together),
  });

  D.add('challenge_ignored', {
    msg: { en: 'Challenge_Bottle is never used. The marked bottle must stop the conveyor, be pushed off by Reject_Pusher and be checked. Bottles are counted only after that.', ar: 'ما استخدمت Challenge_Bottle. القنينة المعلّمة لازم توقّف الناقل وتنرفض بـ Reject_Pusher وتنفحص. والقناني بتنعدّ بس بعد هيك.' },
    test: (ctx) => !ctx.usesTag('Challenge_Bottle'),
  });

  D.add('conveyor_not_stopped', {
    msg: { en: 'The conveyor did not stop for the marked bottle, so the bottle moved on before the pusher could check it. Put an NC contact of Challenge_Bottle in the conveyor rung.', ar: 'الناقل ما وقف للقنينة المعلّمة، فالقنينة كملت قبل ما الدافع يفحصها. حط NC contact تبع Challenge_Bottle برونغ الناقل.' },
    test: (ctx) => !!ctx.failure && ctx.failure.assertId === 'chal-stop',
  });

  D.add('conveyor_no_restart', {
    msg: { en: 'The conveyor did not run again after the challenge passed. The marked bottle clears your Start latch when it stops the conveyor. Use a separate Run latch, and put Challenge_Bottle only in the rung of Conveyor_Motor.', ar: 'الناقل ما رجع اشتغل بعد ما نجح الاختبار. القنينة المعلّمة مسحت الـ latch تبع Start لما وقّفت الناقل. استخدم latch Run منفصل، وحط Challenge_Bottle بس برونغ Conveyor_Motor.' },
    test: (ctx) => !!ctx.failure && ctx.failure.assertId === 'chal-restart',
  });

  D.add('reset_incomplete', {
    msg: { en: 'Reset must start a NEW batch: it clears the lock, the alarm and both sign-offs, so Start needs two new signs. Something is still ON after Reset.', ar: 'الـ Reset لازم يبدأ دفعة جديدة: بيمسح القفل والإنذار والتوقيعين، فـ Start بده توقيعين جداد. في إشي لسا شغّال بعد Reset.' },
    test: (ctx) => !!ctx.failure && (ctx.failure.assertId === 'reset-alarm' || ctx.failure.assertId === 'new-batch-signs'),
  });

  D.add('count_before_challenge', {
    msg: { en: 'The counter counts PE_Exit with no "challenge passed" condition, so bottles that pass before the test are counted. Set a bit when the challenge passes and put it in front of the counter.', ar: 'العدّاد بيعدّ PE_Exit بدون شرط "الاختبار نجح"، فالقناني اللي بتعدّي قبل الاختبار بتنعدّ. فعّل بت لما الاختبار ينجح وحطه قبل العدّاد.' },
    test: (ctx) => ctx.ofType('CTU').some((x) => !ctx.rungEls(x.ri).some((y) => (y.e.t === 'NO' || y.e.t === 'NC') && y.e.a !== 'PE_Exit')),
  });

  D.add('batch_alarm_not_latched', {
    msg: { en: 'The alarm is a plain coil. It goes OFF when the bottle is removed or the timer drops. Latch it with SET and clear it only with Reset.', ar: 'الإنذار ملف عادي. بينطفي لما القنينة تنشال أو المؤقت يرجع صفر. ثبّته بـ SET ولا تمسحه إلا بـ Reset.' },
    test: (ctx) => {
      const w = ctx.writers('Alarm_Lamp');
      if (!w.length) return false;
      if (isLatched(ctx, 'Alarm_Lamp')) return false;
      const feeders = [];
      w.forEach((x) => ctx.rungEls(x.ri).forEach((y) => { if (['NO', 'NC'].indexOf(y.e.t) >= 0 && y.e.a) feeders.push(y.e.a); }));
      return !feeders.some((n) => isLatched(ctx, n));
    },
  });

  D.add('setpoint_without_key', {
    msg: { en: 'The MOVE to Fill_Time_SP does not need Supervisor_Key, so anyone can change the fill time. Put the key contact in series with the request.', ar: 'الـ MOVE على Fill_Time_SP ما بيحتاج Supervisor_Key، فأي شخص بيقدر يغيّر زمن التعبئة. حط contact المفتاح على التوالي مع الطلب.' },
    test: (ctx) => ctx.ofType('MOVE').some((x) => x.e.o === 'Fill_Time_SP' && !rungUses(ctx, x.ri, 'Supervisor_Key', new Set())),
  });

  D.add('setpoint_without_request', {
    msg: { en: 'The MOVE has no SP_Request contact, so it copies SP_Entry all the time and the fill time changes without a request. Put SP_Request in series.', ar: 'الـ MOVE ما فيه contact لـ SP_Request، فبينسخ SP_Entry طول الوقت وزمن التعبئة بيتغيّر بدون طلب. حط SP_Request على التوالي.' },
    test: (ctx) => ctx.ofType('MOVE').some((x) => x.e.o === 'Fill_Time_SP' && !rungUses(ctx, x.ri, 'SP_Request', new Set())),
  });
})();

</script>

/* L14 diagnostics: CIP sequence (TONR with hold, continuous-condition timer, reset of retentive timers) */
(function () {
  'use strict';
  const D = globalThis.SC.diag;

  const inRung = (ctx, x, names) => ctx.rungEls(x.ri).some((y) => names.indexOf(y.e.a) >= 0);

  D.add('ton_instead_of_tonr', {
    msg: { en: 'A TON sets its time back to 0 every time its signal drops. In the pre-rinse and the caustic step the time must be KEPT while the flow or the temperature is lost. Use TONR.', ar: 'الـ TON بيرجّع وقته 0 كل ما إشارته تسقط. بالشطف الأولي وخطوة القلوي الوقت لازم يتحفظ لما التدفق أو الحرارة تروح. استخدم TONR.' },
    test: (ctx) => ctx.ofType('TON').some((x) => inRung(ctx, x, ['CIP_Temp_OK', 'CIP_Flow_OK'])),
  });

  D.add('cond_momentary', {
    msg: { en: 'CIP_Cond_OK is used without a 10 s timer, so one moment of good conductivity is enough. The final rinse needs CIP_Cond_OK = 1 for 10 s without a break. Use a TON.', ar: 'استخدمت CIP_Cond_OK بدون مؤقّت 10 ثواني، فلحظة وحدة موصلية سليمة كفت. الشطف الأخير بده CIP_Cond_OK = 1 لمدة 10 ثواني بدون انقطاع. استخدم TON.' },
    test: (ctx) => ctx.usesTag('CIP_Cond_OK') && !ctx.ofType('TON', 'TONR').some((x) => inRung(ctx, x, ['CIP_Cond_OK'])),
  });

  D.add('cond_timer_retentive', {
    msg: { en: 'A TONR keeps its time when CIP_Cond_OK drops, so short good moments add up. The 10 s must be CONTINUOUS: they start again from 0 after every drop. Use a TON here.', ar: 'الـ TONR بيحتفظ بوقته لما CIP_Cond_OK يسقط، فاللحظات السليمة القصيرة بتتجمّع. الـ 10 ثواني لازم تكون متواصلة: بتبدأ من 0 بعد كل سقوط. استخدم TON هون.' },
    test: (ctx) => ctx.ofType('TONR').some((x) => inRung(ctx, x, ['CIP_Cond_OK'])),

  D.add('phase_skipped', {
    msg: (ctx) => {

    },

  });

  D.add('flow_not_checked', {
    msg: { en: 'CIP_Flow_OK is never used. The pre-rinse must count its 30 s only while the flow is OK, and hold when the flow is lost.', ar: 'ما استخدمت CIP_Flow_OK. الشطف الأولي لازم يعدّ الـ 30 ثانية بس لما التدفق سليم، وينتظر لما التدفق يروح.' },
    test: (ctx) => !ctx.usesTag('CIP_Flow_OK'),

    test: (ctx) => ctx.ofType('TONR').some((x) => !x.e.rs),
  });

<script>
/* ==== src/ui/dom.js ==== */
/* Tiny DOM helpers + bilingual text helpers + safe storage. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  SC.ui = SC.ui || {};

  // h('div', {class:'a', onclick:fn, dataset:{x:1}}, child, 'text', [more])
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'dataset') for (const d in v) el.dataset[d] = v[d];
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) c.forEach((x) => add(el, x));
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Arabic text may contain {{English terms}} -> <bdi lang="en">
  function arHtml(s) { return esc(s).replace(/\{\{(.+?)\}\}/g, '<bdi lang="en">$1</bdi>'); }
  function arEl(s, tag) { return h(tag || 'span', { lang: 'ar', dir: 'rtl', html: arHtml(s) }); }
  function enEl(s, tag) { return h(tag || 'span', { lang: 'en', dir: 'ltr' }, s); }

  // storage that never throws
  const store = {
    mem: Object.create(null),
    get(k, def) {
      try { const v = globalThis.localStorage.getItem('scancycle.' + k); return v === null ? (k in store.mem ? store.mem[k] : def) : JSON.parse(v); } catch (e) { return k in store.mem ? store.mem[k] : def; }
    },
    set(k, v) {
      store.mem[k] = v;
      try { globalThis.localStorage.setItem('scancycle.' + k, JSON.stringify(v)); return true; } catch (e) { store.failed = true; return false; }
    },
    failed: false,
  };

  SC.ui.motion = () => (globalThis.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth');
  SC.ui.h = h;
  SC.ui.esc = esc;
  SC.ui.arHtml = arHtml;
  SC.ui.arEl = arEl;
  SC.ui.enEl = enEl;
  SC.ui.store = store;
})();

</script>

<script>
/* ==== src/ui/progress.js ==== */
/* Progress, autosave, glossary boxes (Leitner), explanations. One versioned payload, saved with safe wrappers.
 * No streaks, no daily rewards, nothing decays: the map just remembers what you did. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;

  const fresh = () => ({ v: 1, savedAt: 0, levels: {}, gloss: {}, session: 0, seenWO: {}, settings: {} });
  // fill in any missing / wrongly-typed key so an old save never bricks the app
  function normalise(d) {
    const f = fresh();
    if (!d || typeof d !== 'object' || d.v !== 1) return f;
    const out = Object.assign(f, d);
    for (const k of ['levels', 'gloss', 'seenWO', 'settings']) if (!out[k] || typeof out[k] !== 'object' || Array.isArray(out[k])) out[k] = {};
    delete out.levels.__proto__;
    for (const id of Object.keys(out.levels)) {
      const l = out.levels[id];
      if (!/^L\d\d$/.test(id) || !l || typeof l !== 'object') { delete out.levels[id]; continue; }
      if (l.program) { const sp = SC.sanitizeProgram(l.program); if (sp) l.program = sp; else l.program = null; }
      if (!Array.isArray(l.userTags)) l.userTags = [];
    }
    if (out.sandbox && out.sandbox.program) { const sp = SC.sanitizeProgram(out.sandbox.program); out.sandbox = sp ? { program: sp, userTags: Array.isArray(out.sandbox.userTags) ? out.sandbox.userTags : [] } : undefined; }
    out.session = Number.isFinite(out.session) ? out.session : 0;
    return out;
  }
  let data = normalise(U.store.get('data', null));
  data.session = (data.session || 0) + 1;
  U.data = data;
  // never lose the last edit when the tab is closed
  const flush = () => U.save(true);
  globalThis.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

  let timer = 0;
  U.save = function (now) {
    clearTimeout(timer);
    const doSave = () => {
      data.savedAt = Date.now();
      const ok = U.store.set('data', data);
      U.autosaveOk = ok;
      const n = document.getElementById('autosave-note');
      if (n) n.hidden = ok;
    };
    if (now) doSave(); else timer = setTimeout(doSave, 500);
  };

  const LV_DEF = () => ({ stars: 0, solved: false, attempts: 0, fails: 0, hint: 0, hint3: false, explained: false, program: null, userTags: [], explain: {}, best: null, wo: 0 });
  U.lv = function (id) {
    if (!data.levels[id]) data.levels[id] = LV_DEF();
    else for (const k in LV_DEF()) if (!(k in data.levels[id])) data.levels[id][k] = LV_DEF()[k];
    return data.levels[id];
  };
  U.totalStars = () => Object.keys(data.levels).reduce((n, k) => n + (data.levels[k].stars || 0), 0);

  // ---------------------------------------------------------------- export / import
  U.exportData = function () {
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'scan-cycle-progress.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  U.validateImport = function (o) {
    if (!o || typeof o !== 'object' || o.v !== 1 || typeof o.levels !== 'object' || o.levels === null) return false;
    for (const id of Object.keys(o.levels)) {
      if (!/^L\d\d$/.test(id)) return false;
      const l = o.levels[id];
      if (typeof l !== 'object' || l === null) return false;
      if (l.program && !SC.sanitizeProgram(l.program)) return false;
    }
    return true;
  };
  U.importData = function (text) {
    let o;
    try { o = JSON.parse(text); } catch (e) { return false; }
    if (!U.validateImport(o)) return false;
    const keepSession = data.session;
    for (const k of Object.keys(data)) delete data[k];
    Object.assign(data, normalise(o));
    data.session = keepSession;
    U.save(true);
    return true;
  };
  U.resetData = function () {
    for (const k of Object.keys(data)) delete data[k];
    Object.assign(data, fresh(), { session: 1 });
    U.save(true);
  };
})();

</script>
<script>
/* ==== src/ui/glossary.js ==== */
/* Glossary: tappable terms with an Arabic gloss, a 3-choice question on the 2nd encounter, Leitner review. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const tr = (en, ar) => (U.lang === 'ar' ? ar : en);
  const INTERVALS = [1, 2, 4, 8, 16]; // sessions, boxes 1..5

  const G = { map: Object.create(null), loaded: false };
  U.glossary = G;

  G.init = function (levels) {
    G.map = SC.levels.glossaryMap(levels);
    G.loaded = true;
  };
  G.get = (id) => G.map[id] || null;

  const surfaceForms = (def) => {
    const forms = new Set();
    const main = def.en.replace(/\s*\(.*?\)\s*/g, ' ').trim();
    forms.add(main);
    const m = /\(([^)]+)\)/.exec(def.en);
    if (m && m[1].length >= 2) forms.add(m[1].trim());
    if (def.forms) def.forms.forEach((f) => forms.add(f));
    return Array.from(forms).filter(Boolean);
  };

  // append `text` to `el`, wrapping glossary terms (limited to `ids`) in tappable buttons
  G.linkText = function (el, text, ids) {
    const forms = [];
    (ids || []).forEach((id) => { const d = G.get(id); if (d) surfaceForms(d).forEach((f) => forms.push({ id, f })); });
    forms.sort((a, b) => b.f.length - a.f.length);
    if (!forms.length) { el.append(text); return; }
    const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(?<![A-Za-z0-9_])(' + forms.map((x) => esc(x.f)).join('|') + ')(?![A-Za-z0-9_])', 'gi');
    let last = 0, m;
    const seen = new Set();
    while ((m = re.exec(text))) {
      const hit = forms.find((x) => x.f.toLowerCase() === m[1].toLowerCase());
      if (!hit) continue;
      if (m.index > last) el.append(text.slice(last, m.index));
      if (seen.has(hit.id)) el.append(m[1]);
      else { seen.add(hit.id); el.append(termBtn(hit.id, m[1])); }
      last = m.index + m[1].length;
    }
    if (last < text.length) el.append(text.slice(last));
  };

  function termBtn(id, label) {
    const b = h('button', { type: 'button', class: 'term', dataset: { term: id }, 'aria-label': 'Term: ' + label }, label);
    b.addEventListener('click', (e) => { e.preventDefault(); G.popover(id, b); });
    return b;
  }
  G.termBtn = termBtn;

  // ---------------------------------------------------------------- Leitner
  const rec = (id) => {
    const g = U.data.gloss;
    if (!g[id]) g[id] = { seen: 0, quizzed: false, box: 0, due: 0 };
    return g[id];
  };
  function grade(id, ok) {
    const r = rec(id);
    r.quizzed = true;
    if (ok) { r.box = Math.min(5, (r.box || 0) + 1); } else r.box = 1;
    r.due = U.data.session + INTERVALS[r.box - 1];
    U.save();
  }
  G.dueIds = function (all) {
    const ids = Object.keys(U.data.gloss).filter((id) => G.map[id] && U.data.gloss[id].box > 0 && U.data.gloss[id].due <= U.data.session);
    return ids;
  };

  function distractors(id, n) {
    const others = Object.keys(G.map).filter((k) => k !== id && G.map[k].ar !== G.map[id].ar);
    const out = [];
    while (out.length < n && others.length) out.push(others.splice(Math.floor(Math.random() * others.length), 1)[0]);
    return out;
  }
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // 3-choice question: returns an element; onAnswer(ok) after the player picked
  function quizEl(id, onAnswer) {
    const d = G.map[id];
    const opts = shuffle([id].concat(distractors(id, 2)));
    const box = h('div', { class: 'quiz' }, h('p', null, h('b', null, tr('Pick the Arabic meaning of', 'اختار المعنى العربي لـ') + ' '), h('span', { lang: 'en' }, d.en)));
    const row = h('div', { class: 'quiz-opts' });
    opts.forEach((o) => {
      const b = h('button', { type: 'button', class: 'btn', lang: 'ar', dir: 'rtl' }, G.map[o].ar);
      b.addEventListener('click', () => {
        const ok = o === id;
        row.querySelectorAll('button').forEach((x) => { x.disabled = true; });
        b.classList.add(ok ? 'right' : 'wrong');
        if (!ok) row.querySelectorAll('button').forEach((x) => { if (x.textContent === d.ar) x.classList.add('right'); });
        box.append(h('p', { class: ok ? 'ok' : 'warn', role: 'status' }, ok ? '✔ ' + tr('Correct', 'صح') : '✖ ' + tr('Not this one. It means:', 'مش هاد. معناه:') + ' ' + d.ar));
        grade(id, ok);
        setTimeout(() => onAnswer(ok), ok ? 500 : 1400);
      });
      row.append(b);
    });
    box.append(row);
    return box;
  }

  // ---------------------------------------------------------------- speech
  const canSpeak = typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined';
  let voices = [];
  if (canSpeak) { const lv = () => { voices = speechSynthesis.getVoices(); }; lv(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', lv); }
  G.speak = function (text) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = voices.find((x) => /^en[-_]US/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
      if (v) u.voice = v;
      u.lang = (v && v.lang) || 'en-US'; u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  };
  G.canSpeak = canSpeak;
  G.speakBtn = (text) => (canSpeak ? h('button', { type: 'button', class: 'btn small ghost', 'aria-label': 'Listen', title: 'Listen', onclick: () => G.speak(text) }, '🔊') : null);

  // ---------------------------------------------------------------- popover
  G.popover = function (id, anchor) {
    closePop();
    const d = G.get(id);
    if (!d) return;
    const r = rec(id);
    r.seen++;
    const needQuiz = r.seen >= 2 && !r.quizzed;
    const pop = h('div', { class: 'termpop', role: 'dialog', 'aria-label': d.en });
    const reveal = () => {
      pop.innerHTML = '';
      pop.append(h('div', { class: 'pal-head' }, h('b', { lang: 'en', class: 'tp-en' }, d.en), h('span', null, G.speakBtn(d.en), h('button', { class: 'btn small ghost', type: 'button', 'aria-label': 'Close', onclick: closePop }, '✕'))),
        h('p', { class: 'tp-ar', lang: 'ar', dir: 'rtl' }, d.ar),
        h('p', { class: 'small' }, h('i', { lang: 'en' }, d.ex.en)),
        d.ex.ar ? h('p', { class: 'small', lang: 'ar', dir: 'rtl', html: U.arHtml(d.ex.ar) }) : null);
      place();
    };
    function place() {
      const rc = anchor.getBoundingClientRect();
      const w = pop.offsetWidth, hh = pop.offsetHeight;
      if (window.innerWidth < 700) { pop.classList.add('sheet'); return; }
      pop.style.left = Math.min(Math.max(8, rc.left), window.innerWidth - w - 8) + window.scrollX + 'px';
      let top = rc.bottom + 6;
      if (top + hh > window.innerHeight - 8) top = Math.max(8, rc.top - hh - 6);
      pop.style.top = top + window.scrollY + 'px';
    }
    document.body.append(pop);
    if (needQuiz) { pop.append(quizEl(id, () => { U.save(); reveal(); })); place(); }
    else { reveal(); if (!r.box) { r.box = 1; r.due = U.data.session + INTERVALS[0]; } }
    U.save();
    U._termpop = { pop, anchor };
    pop.setAttribute('tabindex', '-1');
    const f0 = pop.querySelector('button'); if (f0) f0.focus(); else pop.focus();
    setTimeout(() => { document.addEventListener('pointerdown', out, true); document.addEventListener('keydown', esc, true); }, 0);
    function out(e) { if (!pop.contains(e.target) && e.target !== anchor) closePop(); }
    function esc(e) { if (e.key === 'Escape') closePop(); }
    pop._cleanup = () => { document.removeEventListener('pointerdown', out, true); document.removeEventListener('keydown', esc, true); };
  };
  function closePop() {
    const p = U._termpop;
    if (!p) return;
    p.pop._cleanup && p.pop._cleanup();
    p.pop.remove();
    U._termpop = null;
    if (p.anchor && p.anchor.isConnected && p.anchor.focus) p.anchor.focus();
  }
  G.closePop = closePop;

  // ---------------------------------------------------------------- review screen (5-8 due terms)
  G.review = function (root, onDone) {
    let ids = G.dueIds();
    let practice = false;
    if (!ids.length) {
      practice = true;
      ids = Object.keys(U.data.gloss).filter((id) => G.map[id]);
    }
    shuffle(ids);
    ids = ids.slice(0, 8);
    const wrap = h('div', { class: 'card review' });
    root.append(wrap);
    let i = 0, right = 0;
    function next() {
      wrap.innerHTML = '';
      if (i >= ids.length) {
        wrap.append(h('h3', null, tr('Review finished', 'خلصت المراجعة')), h('p', null, `${right}/${ids.length} ` + tr('correct', 'صح')),
          h('button', { type: 'button', class: 'btn primary', onclick: () => { wrap.remove(); onDone && onDone(); } }, tr('Back to the map', 'رجوع للخريطة')));
        return;
      }
      wrap.append(h('h3', null, tr('Term review', 'مراجعة المصطلحات') + ` (${i + 1}/${ids.length})`),
        practice ? h('p', { class: 'muted small' }, tr('Nothing is due. Practice a few terms you met.', 'ما في شي مستحق. تمرّن على كم مصطلح شفتهم.')) : null,
        quizEl(ids[i], (ok) => { if (ok) right++; i++; next(); }));
    }
    if (!ids.length) { wrap.append(h('p', null, tr('You have not met any terms yet. Open a level first.', 'لسا ما شفت أي مصطلح. افتح مستوى أول.')), h('button', { type: 'button', class: 'btn', onclick: () => { wrap.remove(); onDone && onDone(); } }, 'OK')); return; }
    next();
  };
})();

</script>
<script>
/* ==== src/ui/symbols.js ==== */
/* Ladder symbols (IEC conventions) as inline SVG, plus element metadata. Cell box: 84 x 68, wire at y = 40. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;

  const CELL_W = 84, CELL_H = 68, WIRE_Y = 40;

  // t: element type, key: keyboard shortcut in the editor, group: palette group
  const EL = [
    { t: 'NO', group: 'contacts', key: 'n', en: 'NO contact', ar: 'ملامس {{NO}}', tip: { en: 'Normally open contact: passes power when its bit is 1.', ar: 'ملامس مفتوح عادةً: بيمرّر الـ power لما البت = 1.' } },
    { t: 'NC', group: 'contacts', key: 'c', en: 'NC contact', ar: 'ملامس {{NC}}', tip: { en: 'Normally closed contact: passes power when its bit is 0.', ar: 'ملامس مغلق عادةً: بيمرّر الـ power لما البت = 0.' } },
    { t: 'POS', group: 'contacts', key: 'p', en: 'Positive edge', ar: 'حافة صاعدة', tip: { en: 'Passes power for exactly one scan when the power on its left goes 0 → 1. Needs its own M bit.', ar: 'بيمرّر الـ power لـ scan واحد بالضبط لما الـ power قبله ينتقل 0 ← 1. بده بت M خاص فيه.' } },
    { t: 'NEG', group: 'contacts', key: '', en: 'Negative edge', ar: 'حافة هابطة', tip: { en: 'Passes power for one scan when the power on its left goes 1 → 0. Needs its own M bit.', ar: 'بيمرّر الـ power لـ scan واحد لما الـ power قبله ينتقل 1 ← 0. بده بت M خاص فيه.' } },
    { t: 'CMP', group: 'contacts', key: '=', en: 'Compare', ar: 'مقارنة', tip: { en: 'Passes power when IN1 op IN2 is true.', ar: 'بيمرّر الـ power لما IN1 op IN2 تكون صح.' } },
    { t: 'OUT', group: 'outputs', key: 'o', en: 'Coil', ar: 'ملف {{Coil}}', tip: { en: 'Writes the rung power into its bit on every scan.', ar: 'بيكتب الـ power بالبت كل {{scan}}.' } },
    { t: 'SET', group: 'outputs', key: 's', en: 'Set coil', ar: 'ملف {{Set}}', tip: { en: 'If power: bit := 1. Otherwise it does nothing (the bit keeps its value).', ar: 'إذا في power: البت := 1. غير هيك ما بيعمل شي (البت بيضل زي ما هو).' } },
    { t: 'RST', group: 'outputs', key: 'r', en: 'Reset coil', ar: 'ملف {{Reset}}', tip: { en: 'If power: bit := 0. Otherwise it does nothing.', ar: 'إذا في power: البت := 0. غير هيك ما بيعمل شي.' } },
    { t: 'MOVE', group: 'outputs', key: 'm', en: 'Move', ar: 'نقل {{Move}}', tip: { en: 'When powered: OUT := IN.', ar: 'لما في power: OUT := IN.' } },
    { t: 'ADD', group: 'outputs', key: '', en: 'Add', ar: 'جمع {{Add}}', tip: { en: 'When powered, on EVERY scan: OUT := IN1 + IN2. Put an edge contact before it!', ar: 'لما في power، بكل {{scan}}: OUT := IN1 + IN2. حط {{edge}} قبله!' } },
    { t: 'SUB', group: 'outputs', key: '', en: 'Subtract', ar: 'طرح {{Sub}}', tip: { en: 'When powered, on EVERY scan: OUT := IN1 - IN2.', ar: 'لما في power، بكل {{scan}}: OUT := IN1 - IN2.' } },
    { t: 'SHL', group: 'outputs', key: '', en: 'Shift left', ar: 'إزاحة يسار', tip: { en: 'When powered: shift the word left by 1, bit 0 := the IN bit.', ar: 'لما في power: إزاحة الـ {{word}} لليسار بمقدار 1، والبت 0 := بت الـ IN.' } },
    { t: 'SHR', group: 'outputs', key: '', en: 'Shift right', ar: 'إزاحة يمين', tip: { en: 'When powered: shift the word right by 1, bit 15 := the IN bit.', ar: 'لما في power: إزاحة الـ {{word}} لليمين بمقدار 1، والبت 15 := بت الـ IN.' } },
    { t: 'TON', group: 'blocks', key: 't', en: 'TON on-delay', ar: 'مؤقّت {{TON}}', tip: { en: 'Q turns on after IN has been on for PT. IN off resets it.', ar: 'الـ Q بيشتغل بعد ما الـ IN يضل شغّال مدة PT. لما الـ IN ينطفي بيرجع للصفر.' } },
    { t: 'TOF', group: 'blocks', key: '', en: 'TOF off-delay', ar: 'مؤقّت {{TOF}}', tip: { en: 'Q follows IN on; after IN drops, Q stays on for PT.', ar: 'الـ Q بيتبع الـ IN؛ بعد ما الـ IN ينطفي، الـ Q بيضل شغّال مدة PT.' } },
    { t: 'TP', group: 'blocks', key: '', en: 'TP pulse', ar: 'مؤقّت {{TP}} نبضة', tip: { en: 'A rising edge on IN gives a pulse of exactly PT. Not retriggerable while running.', ar: 'حافة صاعدة على IN بتعطي نبضة مدتها PT بالضبط. ما بتنعاد وهي شغّالة.' } },
    { t: 'TONR', group: 'blocks', key: '', en: 'TONR retentive', ar: 'مؤقّت {{TONR}} محتفظ', tip: { en: 'Like TON, but the elapsed time is kept when IN drops. R resets it.', ar: 'زي {{TON}} بس بيحتفظ بالوقت لما الـ IN ينطفي. الـ R بيصفّره.' } },
    { t: 'CTU', group: 'blocks', key: 'u', en: 'CTU count up', ar: 'عدّاد {{CTU}}', tip: { en: 'Counts rising edges on CU. Q = CV ≥ PV. R resets.', ar: 'بيعدّ الحواف الصاعدة على CU. الـ Q = CV ≥ PV. الـ R بيصفّر.' } },
    { t: 'CTD', group: 'blocks', key: '', en: 'CTD count down', ar: 'عدّاد {{CTD}}', tip: { en: 'LD loads PV; counts down on rising edges. Q = CV ≤ 0.', ar: 'الـ LD بيحمّل PV؛ بيعدّ تنازليًا. الـ Q = CV ≤ 0.' } },
    { t: 'CTUD', group: 'blocks', key: '', en: 'CTUD up/down', ar: 'عدّاد {{CTUD}}', tip: { en: 'Up on CU edges, down on CD edges.', ar: 'بيزيد على حواف CU وبينقص على حواف CD.' } },
  ];
  const ELMAP = Object.create(null);
  EL.forEach((e) => { ELMAP[e.t] = e; });

  const trunc = (s, n) => { s = String(s === undefined ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const X = (s) => U.esc(s);

  // label shown above the symbol and small text below it
  function labels(el, addrOf) {
    switch (el.t) {
      case 'NO': case 'NC': case 'OUT': case 'SET': case 'RST': case 'POS': case 'NEG':
        return { top: el.a || '?', bottom: el.a ? addrOf(el.a) : '' };
      case 'TON': case 'TOF': case 'TP': case 'TONR': case 'CTU': case 'CTD': case 'CTUD':
        return { top: el.i || '?', bottom: '' };
      default: return { top: '', bottom: '' };
    }
  }

  // inner SVG markup for a cell. `el` null = empty wire cell (only when `wire`)
  function symbolSvg(el, wire) {
    const w = '<path class="w-in" d="M0 40 H%a"/><path class="w-out" d="M%b 40 H84"/>';
    const wires = (a, b) => `<path class="w-in" d="M0 ${WIRE_Y} H${a}"/><path class="w-out" d="M${b} ${WIRE_Y} H${CELL_W}"/>`;
    if (!el) return wire ? `<path class="w-in" d="M0 ${WIRE_Y} H42"/><path class="w-out" d="M42 ${WIRE_Y} H${CELL_W}"/>` : '';
    switch (el.t) {
      case 'NO': return wires(33, 51) + '<path class="sym" d="M33 26 V54 M51 26 V54"/><rect class="sym-fill" x="34.5" y="27" width="15" height="26"/>';
      case 'NC': return wires(33, 51) + '<path class="sym" d="M33 26 V54 M51 26 V54"/><rect class="sym-fill" x="34.5" y="27" width="15" height="26"/><path class="sym" d="M30 55 L54 25"/>';
      case 'POS': case 'NEG': return wires(33, 51) + '<path class="sym" d="M33 26 V54 M51 26 V54"/><rect class="sym-fill" x="34.5" y="27" width="15" height="26"/>' + `<text class="sym-t" x="42" y="45" text-anchor="middle">${el.t === 'POS' ? 'P' : 'N'}</text>`;
      case 'OUT': return wires(30, 54) + '<path class="sym" d="M34 26 Q25 40 34 54 M50 26 Q59 40 50 54"/><ellipse class="sym-fill" cx="42" cy="40" rx="8" ry="12"/>';
      case 'SET': case 'RST': return wires(30, 54) + '<path class="sym" d="M34 26 Q25 40 34 54 M50 26 Q59 40 50 54"/><ellipse class="sym-fill" cx="42" cy="40" rx="8" ry="12"/>' + `<text class="sym-t" x="42" y="45" text-anchor="middle">${el.t === 'SET' ? 'S' : 'R'}</text>`;
      case 'TON': case 'TOF': case 'TP': case 'TONR':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="15" width="72" height="50" rx="3"/>'
          + `<text class="blk-h" x="42" y="29" text-anchor="middle">${el.t}</text>`
          + `<text class="blk-p" x="10" y="43">IN</text><text class="blk-p" x="74" y="43" text-anchor="end">Q</text>`
          + `<text class="blk-p blk-pt" x="10" y="58">${X(trunc(el.pt, 8))}</text>`
          + '<text class="blk-live" x="74" y="58" text-anchor="end"></text>';
      case 'CTU': case 'CTD': case 'CTUD':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="15" width="72" height="50" rx="3"/>'
          + `<text class="blk-h" x="42" y="29" text-anchor="middle">${el.t}</text>`
          + `<text class="blk-p" x="10" y="43">${el.t === 'CTD' ? 'CD' : 'CU'}</text><text class="blk-p" x="74" y="43" text-anchor="end">Q</text>`
          + `<text class="blk-p blk-pt" x="10" y="58">PV ${X(trunc(el.pv, 5))}</text>`
          + '<text class="blk-live" x="74" y="58" text-anchor="end"></text>';
      case 'CMP':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="20" width="72" height="42" rx="3"/>'
          + `<text class="blk-p" x="42" y="34" text-anchor="middle">${X(trunc(el.a, 10))}</text>`
          + `<text class="blk-h" x="42" y="47" text-anchor="middle">${X(el.op === '<>' ? '≠' : el.op === '>=' ? '≥' : el.op === '<=' ? '≤' : el.op || '?')}</text>`
          + `<text class="blk-p" x="42" y="59" text-anchor="middle">${X(trunc(el.b, 10))}</text>`;
      case 'MOVE': case 'ADD': case 'SUB':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="15" width="72" height="50" rx="3"/>'
          + `<text class="blk-h" x="42" y="29" text-anchor="middle">${el.t}</text>`
          + (el.t === 'MOVE'
            ? `<text class="blk-p" x="42" y="44" text-anchor="middle">${X(trunc(el.a, 10))}</text><text class="blk-p" x="42" y="58" text-anchor="middle">→ ${X(trunc(el.o, 8))}</text>`
            : `<text class="blk-p" x="42" y="43" text-anchor="middle">${X(trunc(el.a, 5))} ${el.t === 'ADD' ? '+' : '−'} ${X(trunc(el.b, 5))}</text><text class="blk-p" x="42" y="58" text-anchor="middle">→ ${X(trunc(el.o, 8))}</text>`);
      case 'SHL': case 'SHR':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="15" width="72" height="50" rx="3"/>'
          + `<text class="blk-h" x="42" y="29" text-anchor="middle">${el.t}</text>`
          + `<text class="blk-p" x="42" y="44" text-anchor="middle">${X(trunc(el.w, 10))}</text><text class="blk-p" x="42" y="58" text-anchor="middle">in: ${X(trunc(el.b, 7))}</text>`;
    }
    return '';
  }

  // palette icon (smaller, no wire power classes)
  function iconSvg(t) {
    const demo = { NO: { t: 'NO' }, NC: { t: 'NC' }, POS: { t: 'POS' }, NEG: { t: 'NEG' }, OUT: { t: 'OUT' }, SET: { t: 'SET' }, RST: { t: 'RST' } }[t];
    const el = demo || { t, pt: 'T#3s', pv: 5, op: '>=', a: 'A', b: 'B', o: 'O', w: 'W', i: '' };
    return `<svg class="ico" viewBox="0 0 ${CELL_W} ${CELL_H}" width="56" height="45" aria-hidden="true">${symbolSvg(el, false)}</svg>`;
  }

  U.CELL_W = CELL_W; U.CELL_H = CELL_H; U.WIRE_Y = WIRE_Y;
  U.EL = EL; U.ELMAP = ELMAP;
  U.symbolSvg = symbolSvg; U.iconSvg = iconSvg; U.cellLabels = labels;
})();

</script>
<script>
/* ==== src/ui/plantView.js ==== */
/* Canvas 2D side view of the bottling line. Reads sim.P, never changes it. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  SC.ui = SC.ui || {};

  const W = 960, H = 280, X0 = 10, K = 0.5;       // px = X0 + mm * K
  const BELT_Y = 206, BELT_H = 12;               // top of the belt = bottle base
  const BW = 28, BH = 40, NECK_H = 11;           // bottle drawing size (px)
  const px = (x) => X0 + x * K;

  function PlantView(canvas) {
    const ctx = canvas.getContext('2d');
    const stat = document.createElement('canvas');
    const view = { canvas, sim: null, colors: {}, reduced: false, ghosts: [], seen: Object.create(null), lastReject: 0, dpr: 1 };
    const mq = globalThis.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
    view.reduced = !!(mq && mq.matches);

    function cssVar(n, fb) { const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v || fb; }
    view.refreshTheme = function () {
      view.colors = {
        ground: cssVar('--ground', '#E9ECEC'), surface: cssVar('--surface', '#F7F8F8'), ink: cssVar('--ink', '#14262D'),
        muted: cssVar('--muted', '#5E7279'), line: cssVar('--line', '#C6D0D2'), power: cssVar('--power', '#0B6E78'),
        alarm: cssVar('--alarm', '#B3461E'), ok: cssVar('--ok', '#2F6B4C'), amber: cssVar('--amber', '#9A6B12'),
      };
      view.staticDirty = true;
    };
    view.setSim = function (sim) { view.sim = sim; view.ghosts = []; view.seen = Object.create(null); view.staticDirty = true; };

    view.resize = function () {
      const cssW = Math.max(320, canvas.clientWidth || W);
      const dpr = Math.min(3, globalThis.devicePixelRatio || 1);
      view.dpr = dpr;
      view.scale = cssW / W;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssW * (H / W) * dpr);
      stat.width = canvas.width; stat.height = canvas.height;
      view.staticDirty = true;
    };

    // ---------------------------------------------------------------- helpers
    function rr(c, x, y, w, h, r) {
      c.beginPath();
      if (c.roundRect) c.roundRect(x, y, w, h, r);
      else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
    }
    function text(c, s, x, y, size, color, align, weight) {
      c.font = `${weight || 500} ${size}px ui-monospace, Consolas, Menlo, monospace`;
      c.fillStyle = color; c.textAlign = align || 'center'; c.textBaseline = 'alphabetic';
      c.fillText(s, x, y);
    }
    const has = (s) => view.sim.P.cfg.stations.indexOf(s) >= 0;

    // ---------------------------------------------------------------- static layer
    function drawStatic() {
      const c = stat.getContext('2d');
      const k = view.scale * view.dpr;
      c.setTransform(k, 0, 0, k, 0, 0);
      c.clearRect(0, 0, W, H);
      const col = view.colors, P = view.sim.P, cfg = P.cfg, x = cfg.x;
      c.fillStyle = col.surface; c.fillRect(0, 0, W, H);
      // belt
      const bx0 = px(0) - 6, bx1 = px(cfg.convLen) + 6;
      c.fillStyle = col.line; rr(c, bx0, BELT_Y, bx1 - bx0, BELT_H, 5); c.fill();
      c.strokeStyle = col.muted; c.lineWidth = 1.5; rr(c, bx0, BELT_Y, bx1 - bx0, BELT_H, 5); c.stroke();
      c.fillStyle = col.muted;
      for (let lx = bx0 + 30; lx < bx1; lx += 150) c.fillRect(lx, BELT_Y + BELT_H, 5, 22);
      c.fillRect(bx0, BELT_Y + BELT_H + 22, bx1 - bx0, 3);
      // infeed funnel
      if (has('infeed')) {
        c.strokeStyle = col.muted; c.lineWidth = 1.5; c.setLineDash([4, 3]);
        c.beginPath(); c.moveTo(X0 - 4, BELT_Y - 60); c.lineTo(X0 - 4, BELT_Y - 1); c.stroke(); c.setLineDash([]);
        text(c, 'INFEED', px(60), BELT_Y + 40, 10, col.muted);
      }
      // filler head + nozzle housing
      if (has('filler')) {
        const fx = px(x.nozzle);
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, fx - 34, 70, 68, 34, 4); c.fill(); c.stroke();
        c.fillStyle = col.ink; c.fillRect(fx - 4, 104, 8, 22);
        text(c, 'FILLER', fx, 62, 11, col.ink, 'center', 700);
      }
      // capper
      if (has('capper')) {
        const cx = px(x.cap);
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, cx - 30, 70, 60, 34, 4); c.fill(); c.stroke();
        text(c, 'CAPPER', cx, 62, 11, col.ink, 'center', 700);
      }
      if (has('sealer')) {
        const sx = px(x.seal);
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, sx - 30, 80, 60, 24, 12); c.fill(); c.stroke();
        c.beginPath(); c.arc(sx, 92, 6, 0, 6.3); c.stroke();
        text(c, 'SEALER', sx, 72, 11, col.ink, 'center', 700);
      }
      if (has('labeler')) {
        const lx = px(x.label);
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, lx - 30, 70, 60, 34, 4); c.fill(); c.stroke();
        text(c, 'LABELER', lx, 62, 11, col.ink, 'center', 700);
      }
      if (has('reject')) {
        const rx = px(x.reject);
        c.strokeStyle = col.ink; c.lineWidth = 1.5; c.fillStyle = col.surface;
        rr(c, rx - 20, 36, 40, 24, 3); c.fill(); c.stroke();
        text(c, 'REJECT', rx, 28, 11, col.ink, 'center', 700);
        // chute below the belt
        c.setLineDash([3, 3]); c.beginPath(); c.moveTo(rx - 18, BELT_Y + BELT_H + 4); c.lineTo(rx - 26, BELT_Y + BELT_H + 40); c.lineTo(rx + 26, BELT_Y + BELT_H + 40); c.lineTo(rx + 18, BELT_Y + BELT_H + 4); c.stroke(); c.setLineDash([]);
      }
      if (has('exit')) text(c, 'OUTFEED →', px(cfg.convLen) - 40, BELT_Y + 40, 10, col.muted);
      // tank
      if (has('tank')) {
        c.strokeStyle = col.ink; c.lineWidth = 1.5; c.fillStyle = col.surface;
        rr(c, 12, 8, 54, 64, 5); c.fill(); c.stroke();
        text(c, 'TANK', 39, 84, 10, col.muted);
      }
      view.staticDirty = false;
    }

    // ---------------------------------------------------------------- dynamic parts
    function drawBottle(c, cx, b, alpha) {
      const col = view.colors, cfg = view.sim.P.cfg;
      const y0 = BELT_Y;
      c.lineWidth = 1.5;
      // glass
      c.fillStyle = 'rgba(201,139,43,0.14)'; c.strokeStyle = col.ink;
      rr(c, cx - BW / 2, y0 - BH, BW, BH, 5); c.fill();
      // liquid
      const lh = Math.max(0, Math.min(1, b.level / cfg.capacity)) * (BH - 4);
      if (lh > 0.5) { c.fillStyle = '#C98B2B'; rr(c, cx - BW / 2 + 1.5, y0 - 2 - lh, BW - 3, lh, 3); c.fill(); }
      c.strokeStyle = col.ink; rr(c, cx - BW / 2, y0 - BH, BW, BH, 5); c.stroke();
      // neck
      c.fillStyle = 'rgba(201,139,43,0.14)'; c.strokeStyle = col.ink;
      rr(c, cx - 6, y0 - BH - NECK_H, 12, NECK_H + 1, 2); c.fill(); c.stroke();
      if (b.capped) { c.fillStyle = col.power; rr(c, cx - 8, y0 - BH - NECK_H - 6, 16, 7, 2); c.fill(); }
      if (b.sealed) { c.strokeStyle = col.surface; c.lineWidth = 2; c.beginPath(); c.moveTo(cx - 6, y0 - BH - NECK_H + 2); c.lineTo(cx + 6, y0 - BH - NECK_H + 2); c.stroke(); }
      if (b.labeled) { c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1; rr(c, cx - 10, y0 - 28, 20, 16, 2); c.fill(); c.stroke(); c.fillStyle = col.ink; c.fillRect(cx - 7, y0 - 23, 14, 1.5); c.fillRect(cx - 7, y0 - 19, 9, 1.5); }
