<style>
[hidden] { display: none !important; }
/* ---------- layout ---------- */
button { font: inherit; color: inherit; }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
.top .ttl { font-size: 1.05rem; }
.grow { flex: 1; }
.btn { min-height: 44px; min-width: 44px; padding: 0 14px; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { background: var(--ground); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn.small { min-height: 32px; padding: 0 10px; font-size: .85rem; }
.btn.primary { background: var(--power); color: var(--surface); border-color: var(--power); }
:focus-visible { outline: 3px solid var(--power); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 8px; font-size: .95rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card h4 { margin: 8px 0 6px; font-size: .85rem; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: .82rem; } .warn { color: var(--alarm); }
.level-grid { display: grid; grid-template-columns: minmax(270px, 340px) 1fr; gap: 12px; padding: 12px; max-width: 1500px; margin: 0 auto; align-items: start; }
.workorder { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
.ar-block { margin-top: 10px; padding: 10px; background: var(--ground); border-radius: 6px; line-height: 1.7; }
@media (max-width: 920px) {
  .level-grid { grid-template-columns: 1fr; padding: 8px; }
  .workorder { position: static; max-height: none; order: 2; }
  .stage { order: 1; }
}
.plant { width: 100%; aspect-ratio: 960 / 280; display: block; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.ctrls { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.ctrls .sp { flex: 1; }
.spd { min-height: 44px; min-width: 44px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-family: var(--mono); }

.forces .btn { color: var(--ink); }

.pbtns { display: flex; flex-wrap: wrap; gap: 8px; }

.pbtn .pb-name { font-weight: 700; font-size: .9rem; }
.pbtn .pb-sub { font-size: .7rem; color: var(--muted); font-family: var(--mono); }
.pbtn.down { background: var(--ink); color: var(--surface); }
.pbtn.down .pb-sub { color: var(--surface); }
.pb-estop { border-color: var(--alarm); border-width: 3px; }

/* ---------- I/O LED strip ---------- */
.leds { display: flex; flex-wrap: wrap; gap: 6px; }
.led { position: relative; min-height: 44px; padding: 2px 8px 2px 26px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); cursor: default; display: grid; grid-template-columns: auto auto; column-gap: 8px; align-items: center; text-align: left; font-family: var(--mono); font-size: .74rem; }
.led:not(.led-out) { cursor: pointer; }
.led .led-dot { position: absolute; left: 7px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border: 2px solid var(--muted); border-radius: 2px; }
.led .led-name { font-weight: 700; grid-column: 1; }
.led .led-addr { color: var(--muted); grid-column: 1; font-size: .66rem; }
.led .led-val { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; font-size: .9rem; }
.led.on { border-color: var(--power); }
.led.on .led-dot { background: var(--power); border-color: var(--power); }
.led.on .led-val { color: var(--power); }
.led .led-lock { display: none; position: absolute; right: 2px; top: 0; font-size: .7rem; }
.led.forced { border-width: 3px; border-color: var(--alarm); }
.led.forced .led-lock { display: block; }
.io-group { margin-bottom: 6px; }

/* ---------- map ---------- */
.mapwrap { max-width: 1000px; margin: 0 auto; padding: 18px 14px 40px; }
.mapwrap h1 { margin: 6px 0 4px; }
.lead { margin: 0 0 18px; font-size: 1.05rem; color: var(--muted); }
.levelmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 18px; }
.lvl { min-height: 92px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.lvl:hover { border-color: var(--ink); }
.lvl b { font-family: var(--mono); font-size: 1.1rem; }
.lvl.sbx { border-style: dashed; }
.prog-text { font-family: var(--mono); font-size: .8rem; white-space: pre-wrap; margin: 0; }

:root {
  --ground: #E9ECEC; --surface: #F7F8F8; --ink: #14262D; --muted: #5E7279; --line: #C6D0D2;
  --power: #0B6E78; --alarm: #B3461E; --ok: #2F6B4C; --amber: #9A6B12;

body { background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }

.st-good { color: var(--ok); } .st-bad { color: var(--alarm); }

<script>
/* ==== src/core/prng.js ==== */
/* Namespace + seeded PRNG (mulberry32). No Math.random anywhere in core. */
(function () {
  'use strict';
  const SC = (globalThis.SC = globalThis.SC || {});
  SC.SCAN_MS = 10;

  // The generator state lives in the owner object as an int field `rng`,
  // so a state object stays a plain, clonable value (pure functions stay pure).
  function next(o) {
    o.rng = (o.rng + 0x6D2B79F5) | 0;
    let t = o.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const range = (o, lo, hi) => lo + (hi - lo) * next(o);
  const int = (o, lo, hi) => lo + Math.floor(next(o) * (hi - lo + 1));
  const seedOf = (n) => (Math.imul(n | 0, 0x9E3779B1) ^ 0x85EBCA6B) | 0;

  SC.prng = { next, range, int, seedOf };

  // small shared helpers (pure)
  SC.util = {
    clone: (x) => JSON.parse(JSON.stringify(x)),
    isObj: (x) => x !== null && typeof x === 'object' && !Array.isArray(x),
    clamp: (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x),
  };
})();

</script>
<script>
/* ==== src/core/addr.js ==== */
/* Time literals (T#3s), addresses (Siemens I0.0 / CODESYS %IX0.0), tag tables. Pure. */
(function () {
  'use strict';
  const SC = globalThis.SC;

  // ---------------------------------------------------------------- time
  const UNIT_MS = { ms: 1, s: 1000, m: 60000, h: 3600000, d: 86400000 };

  // "T#3s", "T#500ms", "T#1m30s", "T#1.5s" -> ms ; anything else -> null
  function parseTime(x) {
    if (typeof x !== 'string') return null;
    const m = /^T#(.+)$/i.exec(x.trim());
    if (!m) return null;
    const body = m[1].toLowerCase().replace(/_/g, '');
    const re = /(\d+(?:\.\d+)?)(ms|s|m|h|d)/y;
    let i = 0, total = 0, n = 0;
    while (i < body.length) {
      re.lastIndex = i;
      const k = re.exec(body);
      if (!k) return null;
      total += parseFloat(k[1]) * UNIT_MS[k[2]];
      i = re.lastIndex;
      n++;
    }
    return n ? Math.round(total) : null;
  }

  function formatTime(ms) {
    ms = Math.max(0, Math.round(ms));
    if (ms === 0) return 'T#0ms';
    let out = 'T#';
    const parts = [['d', 86400000], ['h', 3600000], ['m', 60000], ['s', 1000], ['ms', 1]];
    for (const [u, f] of parts) {
      const q = Math.floor(ms / f);
      if (q > 0) { out += q + u; ms -= q * f; }
    }
    return out;
  }

  // ---------------------------------------------------------------- addresses
  const N_BITS = 256, N_WORDS = 256;

  // returns {kind:'bit',arr,byte,bit,idx,canon} | {kind:'word',arr,idx,canon} | null
  function parseAddr(s) {
    if (typeof s !== 'string') return null;
    s = s.trim();
    let m = /^%?([IQM])X?(\d{1,2})\.([0-7])$/i.exec(s);
    if (m) {
      const arr = m[1].toUpperCase(), byte = +m[2], bit = +m[3];
      if (byte > 31) return null;
      return { kind: 'bit', arr, byte, bit, idx: byte * 8 + bit, canon: arr + byte + '.' + bit };
    }
    m = /^%?(IW|QW|MW)(\d{1,3})$/i.exec(s);
    if (m) {
      const arr = m[1].toUpperCase(), n = +m[2];
      if (n >= N_WORDS) return null;
      return { kind: 'word', arr, idx: n, canon: arr + n };
    }
    return null;
  }

  // canonical (Siemens) -> CODESYS display
  function toCodesys(canon) {
    const a = parseAddr(canon);
    if (!a) return canon;
    return a.kind === 'bit' ? `%${a.arr}X${a.byte}.${a.bit}` : `%${a.arr}${a.idx}`;
  }

  // ---------------------------------------------------------------- tags
  // tag: {name, addr, type:'Bool'|'Int', wiring?:'NO'|'NC', role?, desc?:{en,ar}, user?:bool}
  function makeTagMap(tags) {
    const byName = Object.create(null), byAddr = Object.create(null);
    for (const t of tags || []) {
      byName[t.name] = t;
      const a = parseAddr(t.addr);
      if (a) byAddr[a.canon] = t;
    }
    return { byName, byAddr };
  }

  // Next free memory bit / word for auto-created user tags.
  function nextFreeAddr(tags, kind) {
    const used = new Set((tags || []).map((t) => (parseAddr(t.addr) || {}).canon));
    if (kind === 'word') {
      for (let n = 10; n <= 40; n += 2) if (!used.has('MW' + n)) return 'MW' + n;
      return null;
    }
    for (let byte = 0; byte <= 9; byte++) for (let bit = 0; bit < 8; bit++) {
      const c = `M${byte}.${bit}`;
      if (!used.has(c)) return c;
    }
    return null;
  }

  SC.addr = { parseTime, formatTime, parseAddr, toCodesys, makeTagMap, nextFreeAddr, N_BITS, N_WORDS };
})();

</script>
<script>
/* ==== src/core/dsl.js ==== */
/* Ladder text notation -> program JSON. Used for fixtures, examples and hints.
 *
 *   rung    :=  item*
 *   item    :=  element | '[' branch ('|' branch)+ ']'        (groups are not nested)
 *   element :=  tag            NO contact          /tag   NC contact
 *               (tag)          coil                (S:tag) set    (R:tag) reset
 *               NAME(a,b,..)   TON(DB_T,T#3s) CTU(DB_C,12,Reset_PB) CMP(>=,MW10,5) MOVE(5,MW10) POS(M0.0) ...
 *
 * Example (seal-in):  "[Start_PB | Motor] /Stop_PB (Motor)"   (NC contact = /tag)
 *
 * Program JSON:  {v:1, rungs:[{rows, cols, els:[{r,c,t,...params}], vb:[[boundary,gap],...], note?}]}
 */
(function () {
  'use strict';
  const SC = globalThis.SC;

  // instruction name -> ordered parameter keys
  const PARAMS = {
    NO: ['a'], NC: ['a'], OUT: ['a'], SET: ['a'], RST: ['a'], POS: ['a'], NEG: ['a'],
    TON: ['i', 'pt'], TOF: ['i', 'pt'], TP: ['i', 'pt'], TONR: ['i', 'pt', 'rs'],
    CTU: ['i', 'pv', 'rs'], CTD: ['i', 'pv', 'ld'], CTUD: ['i', 'pv', 'cd', 'rs', 'ld'],
    CMP: ['op', 'a', 'b'], MOVE: ['a', 'o'], ADD: ['a', 'b', 'o'], SUB: ['a', 'b', 'o'],
    SHL: ['w', 'b'], SHR: ['w', 'b'],
  };

  function fail(msg) { throw new Error('ladder text: ' + msg); }

  function tokenize(s) {
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (ch === '[' || ch === ']' || ch === '|') { toks.push({ k: ch }); i++; continue; }
      if (ch === '(') {
        const j = s.indexOf(')', i);
        if (j < 0) fail('missing ) in ' + s);
        toks.push({ k: 'coil', v: s.slice(i + 1, j).trim() });
        i = j + 1;
        continue;
      }
      const m = /^\/?[A-Za-z_%][\w.%]*/.exec(s.slice(i));
      if (!m) fail('unexpected "' + s.slice(i, i + 8) + '"');
      let word = m[0];
      i += word.length;
      if (s[i] === '(') {
        const j = s.indexOf(')', i);
        if (j < 0) fail('missing ) after ' + word);
        toks.push({ k: 'call', name: word, args: s.slice(i + 1, j).split(',').map((x) => x.trim()) });
        i = j + 1;
      } else if (word[0] === '/') {
        toks.push({ k: 'el', el: { t: 'NC', a: word.slice(1) } });
      } else {
        toks.push({ k: 'el', el: { t: 'NO', a: word } });
      }
    }
    return toks;
  }

  const num = (v) => (/^-?\d+$/.test(v) ? parseInt(v, 10) : v);

  function toElement(tok) {
    if (tok.k === 'el') return tok.el;
    if (tok.k === 'coil') {
      const m = /^([SR]):(.+)$/.exec(tok.v);
      if (m) return { t: m[1] === 'S' ? 'SET' : 'RST', a: m[2].trim() };
      return { t: 'OUT', a: tok.v };
    }
    const name = tok.name.toUpperCase();
    const keys = PARAMS[name];
    if (!keys) fail('unknown instruction ' + tok.name);
    const el = { t: name };
    keys.forEach((k, idx) => {
      const v = tok.args[idx];
      if (v === undefined || v === '') return;
      el[k] = (k === 'pv' || k === 'a' || k === 'b') && name !== 'NO' ? num(v) : v;
    });
    // contacts / coils keep strings; CTU/CMP/MOVE/ADD numeric operands become numbers
    if (['NO', 'NC', 'OUT', 'SET', 'RST', 'POS', 'NEG'].includes(name)) el.a = tok.args[0];
    return el;
  }

  // parse into [item], item = {el} | {group:[[el...],[el...]]}
  function parseItems(toks) {
    let p = 0;
    function seq(inGroup) {
      const items = [];
      while (p < toks.length) {
        const t = toks[p];
        if (t.k === '[') {
          if (inGroup) fail('nested [ ] groups are not supported — flatten the branch');
          p++;
          const branches = [];
          let cur = seq(true);
          branches.push(cur);
          while (toks[p] && toks[p].k === '|') { p++; branches.push(seq(true)); }
          if (!toks[p] || toks[p].k !== ']') fail('missing ]');
          p++;
          if (branches.length < 2) fail('a group needs at least two branches');
          items.push({ group: branches.map((b) => b.map((x) => x.el)) });
        } else if (t.k === ']' || t.k === '|') {
          break;
        } else {
          items.push({ el: toElement(t) });
          p++;
        }
      }
      return items;
    }
    const out = seq(false);
    if (p < toks.length) fail('unexpected ' + toks[p].k);
    return out;
  }

  function parseRung(text, note) {
    const items = parseItems(tokenize(text));
    const els = [];
    const vb = [];
    let c = 0, rows = 1, prevGroup = false;
    for (const it of items) {
      if (it.el) {
        els.push(Object.assign({ r: 0, c }, it.el));
        c++;
        prevGroup = false;
      } else {
        if (prevGroup) c++; // spacer column so closing/opening bars never share a boundary
        const W = Math.max(...it.group.map((b) => b.length), 1);
        it.group.forEach((branch, bi) => {
          branch.forEach((el, k) => els.push(Object.assign({ r: bi, c: c + k }, el)));
        });
        for (let g = 0; g < it.group.length - 1; g++) { vb.push([c, g]); vb.push([c + W, g]); }
        rows = Math.max(rows, it.group.length);
        c += W;
        prevGroup = true;
      }
    }
    const rung = { rows, cols: Math.max(c, 1), els, vb };
    if (note) rung.note = note;
    return rung;
  }

  // lines: ["rung text", ...] or [{t:"rung text", note:"..."}]
  function parseProgram(lines) {
    return {
      v: 1,
      rungs: lines.map((l) => (typeof l === 'string' ? parseRung(l) : parseRung(l.t, l.note))),
    };
  }

  SC.dsl = { parseRung, parseProgram, PARAMS };
})();

</script>
<script>
/* ==== src/core/compile.js ==== */
/* Program JSON -> runnable form: validates structure, resolves tag names to memory refs.
 *
 * program: {v:1, rungs:[{rows, cols, els:[{r,c,t,...}], vb:[[boundary,gap],...]}]}
 * opts:    {tags:[...], palette:[...]|null, scanMs}
 * result:  {ok, errors:[{code,rung,r,c,msg:{en,ar}}], rungs:[...], insts:{name:{type,rung}}, tagMap, scanMs}
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const A = SC.addr;

  const CONTACTS = ['NO', 'NC'];
  const TIMERS = ['TON', 'TOF', 'TP', 'TONR'];
  const COUNTERS = ['CTU', 'CTD', 'CTUD'];
  const ALL = ['NO', 'NC', 'OUT', 'SET', 'RST', 'POS', 'NEG', 'TON', 'TOF', 'TP', 'TONR',
    'CTU', 'CTD', 'CTUD', 'CMP', 'MOVE', 'ADD', 'SUB', 'SHL', 'SHR'];
  const CMP_OPS = ['==', '<>', '>', '<', '>=', '<='];
  const MAX_ROWS = 6, MAX_COLS = 16;

  // which rows are wire (conducting) when a cell is empty
  function buildWire(rows, cols, barSet) {
    const has = (b, g) => g >= 0 && g <= rows - 2 && barSet.has(b + ',' + g);
    const wire = Array.from({ length: rows }, () => new Array(cols).fill(false));
    wire[0].fill(true);
    const oddRows = [];
    for (let r = 1; r < rows; r++) {
      const att = [];
      for (let b = 0; b <= cols; b++) if (has(b, r - 1) || has(b, r)) att.push(b);
      for (let k = 0; k + 1 < att.length; k += 2) for (let c = att[k]; c < att[k + 1]; c++) wire[r][c] = true;
      if (att.length % 2 === 1) oddRows.push(r);
    }
    return { wire, oddRows };
  }

  // groups of rows joined by bars, per boundary
  function buildComps(rows, cols, barSet) {
    const comps = [];
    for (let b = 0; b <= cols; b++) {
      const list = [];
      let cur = null;
      for (let g = 0; g <= rows - 2; g++) {
        if (barSet.has(b + ',' + g)) {
          if (!cur) { cur = [g]; list.push(cur); }
          cur.push(g + 1);
        } else cur = null;
      }
      comps.push(list);
    }
    return comps;
  }

  function compile(program, opts) {
    opts = opts || {};
    const tags = opts.tags || [];
    const tagMap = A.makeTagMap(tags);
    const palette = opts.palette ? new Set(opts.palette) : null;
    const errors = [];
    const insts = Object.create(null);
    const out = { ok: false, errors, rungs: [], insts, tagMap, scanMs: opts.scanMs || SC.SCAN_MS };
    const E = (code, ri, el, en, ar) => errors.push({ code, rung: ri, r: el ? el.r : undefined, c: el ? el.c : undefined, msg: { en, ar: ar || en } });

    if (!program || !Array.isArray(program.rungs)) {
      E('bad_program', -1, null, 'Program is not valid', 'البرنامج غير صالح');
      return out;
    }

    // pass 1: instance names
    program.rungs.forEach((rg, ri) => {
      for (const e of (rg && rg.els) || []) {
        if ((TIMERS.includes(e.t) || COUNTERS.includes(e.t)) && typeof e.i === 'string' && e.i) {
          const prev = insts[e.i];
          if (!prev) insts[e.i] = { type: e.t, rung: ri, uses: 1 };
          else {
            prev.uses++;
            if (prev.type !== e.t) E('inst_type_clash', ri, e, `Instance ${e.i} is used as ${prev.type} and ${e.t}`, `الاسم ${e.i} مستخدم لنوعين مختلفين`);
          }
        }
      }
    });

    // ---- operand resolution
    function bitRef(tok, ri, el, write) {
      if (typeof tok !== 'string' || !tok) { E('missing_param', ri, el, 'Missing address', 'العنوان ناقص'); return null; }
      let a = null;
      const tag = tagMap.byName[tok];
      if (tag) {
        a = A.parseAddr(tag.addr);
        if (!a || a.kind !== 'bit') { E('type_mismatch', ri, el, `${tok} is not a Bool tag`, `${tok} ليس من نوع Bool`); return null; }
      } else {
        a = A.parseAddr(tok);
        if (a && a.kind !== 'bit') { E('type_mismatch', ri, el, `${tok} is not a bit address`, `${tok} ليس بت`); return null; }
      }
      if (!a) {
        const m = /^([A-Za-z_]\w*)\.(Q|QU|QD)$/.exec(tok);
        if (m && insts[m[1]]) {
          if (write) { E('write_to_output_pin', ri, el, `${tok} cannot be written`, `لا يمكن الكتابة على ${tok}`); return null; }
          return { k: 'iq', name: m[1], f: m[2] };
        }
        E('unknown_tag', ri, el, `Unknown tag "${tok}"`, `الـ tag "${tok}" غير معروف`);
        return null;
      }
      if (write && a.arr === 'I') { E('write_to_input', ri, el, `${tok} is an input — you cannot write to it`, `${tok} مدخل — لا يمكن الكتابة عليه`); return null; }
      return { k: 'b', arr: a.arr, idx: a.idx };
    }

    function intRef(tok, ri, el, write) {
      if (typeof tok === 'number' && !write) return { k: 'c', v: tok | 0 };
      if (typeof tok !== 'string' || !tok) { E('missing_param', ri, el, 'Missing value', 'القيمة ناقصة'); return null; }
      if (!write) {
        if (/^-?\d+$/.test(tok)) return { k: 'c', v: parseInt(tok, 10) };
        if (/^T#/i.test(tok)) {
          const ms = A.parseTime(tok);
          if (ms === null) { E('bad_time', ri, el, `"${tok}" is not a valid time`, `"${tok}" ليس وقتًا صحيحًا`); return null; }
          return { k: 'c', v: ms };
        }
      }
      let a = null;
      const tag = tagMap.byName[tok];
      if (tag) {
        a = A.parseAddr(tag.addr);
        if (!a || a.kind !== 'word') { E('type_mismatch', ri, el, `${tok} is not an Int tag`, `${tok} ليس من نوع Int`); return null; }
      } else {
        a = A.parseAddr(tok);
        if (a && a.kind !== 'word') { E('type_mismatch', ri, el, `${tok} is not a word address`, `${tok} ليس word`); return null; }
      }
      if (!a) {
        const m = /^([A-Za-z_]\w*)\.(ET|CV|PT)$/.exec(tok);
        if (m && insts[m[1]]) {
          if (write) { E('write_to_output_pin', ri, el, `${tok} cannot be written`, `لا يمكن الكتابة على ${tok}`); return null; }
          return { k: 'if', name: m[1], f: m[2] };
        }
        E('unknown_tag', ri, el, `Unknown tag "${tok}"`, `الـ tag "${tok}" غير معروف`);
        return null;
      }
      if (write && a.arr === 'IW') { E('write_to_input', ri, el, `${tok} is an input word`, `${tok} مدخل`); return null; }
      return { k: 'w', arr: a.arr, idx: a.idx };
    }

    function timeParam(e, ri) {
      const ms = typeof e.pt === 'string' ? A.parseTime(e.pt) : null;
      if (ms === null) {
        E('bad_time', ri, e, `PT must be a time literal like T#3s (got ${JSON.stringify(e.pt)})`, `الـ PT لازم يكون وقت مثل T#3s`);
        return 0;
      }
      return ms;
    }

    function optBit(tok, ri, el) { return tok === undefined || tok === null || tok === '' ? null : bitRef(tok, ri, el, false); }

    // ---- per rung
    program.rungs.forEach((rg, ri) => {
      const rows = rg.rows | 0, cols = rg.cols | 0;
      if (rows < 1 || rows > MAX_ROWS || cols < 1 || cols > MAX_COLS) {
        E('bad_rung', ri, null, `Rung ${ri + 1}: bad size`, `الـ rung ${ri + 1} حجمه غير صالح`);
        out.rungs.push(null);
        return;
      }
      const barSet = new Set();
      for (const bg of rg.vb || []) {
        if (bg[0] < 0 || bg[0] > cols || bg[1] < 0 || bg[1] > rows - 2) { E('bad_rung', ri, null, 'Bad vertical bar', 'خط عمودي غير صالح'); continue; }
        barSet.add(bg[0] + ',' + bg[1]);
      }
      if (barSet.size && palette && !palette.has('BRANCH')) E('not_allowed', ri, null, 'Parallel branches are not unlocked yet', 'الفروع المتوازية غير مفعّلة بعد');
      const { wire, oddRows } = buildWire(rows, cols, barSet);
      const grid = Array.from({ length: cols }, () => new Array(rows).fill(null));
      const seen = new Set();
      const list = [];
      for (const e of rg.els || []) {
        if (!ALL.includes(e.t)) { E('bad_element', ri, e, `Unknown element ${e.t}`, `عنصر غير معروف ${e.t}`); continue; }
        if (!(e.r >= 0 && e.r < rows && e.c >= 0 && e.c < cols)) { E('bad_rung', ri, e, 'Element outside the rung grid', 'عنصر خارج الشبكة'); continue; }
        const key = e.r + ',' + e.c;
        if (seen.has(key)) { E('bad_rung', ri, e, 'Two elements in one cell', 'عنصران بنفس الخلية'); continue; }
        seen.add(key);
        if (palette && !palette.has(e.t)) E('not_allowed', ri, e, `${e.t} is not unlocked in this level`, `${e.t} غير مفعّل بهذا المستوى`);
        const x = { t: e.t, r: e.r, c: e.c };
        switch (e.t) {
          case 'NO': case 'NC': x.ra = bitRef(e.a, ri, e, false); break;
          case 'OUT': case 'SET': case 'RST': x.wa = bitRef(e.a, ri, e, true); break;
          case 'POS': case 'NEG': {
            x.ma = bitRef(e.a, ri, e, true);
            if (x.ma && x.ma.arr !== 'M') E('edge_bit_not_m', ri, e, 'Edge memory must be an M bit', 'ذاكرة الـ edge لازم تكون بت M');
            break;
          }
          case 'TON': case 'TOF': case 'TP': case 'TONR':
            x.inst = e.i; x.ptv = timeParam(e, ri);
            if (!e.i) E('missing_param', ri, e, 'Timer needs an instance name', 'المؤقّت يحتاج اسم instance');
            if (e.t === 'TONR') x.rr = optBit(e.rs, ri, e);
            break;
          case 'CTU': case 'CTD': case 'CTUD':
            x.inst = e.i;
            if (!e.i) E('missing_param', ri, e, 'Counter needs an instance name', 'العدّاد يحتاج اسم instance');
            x.pvr = intRef(e.pv === undefined ? 0 : e.pv, ri, e, false);
            if (e.t === 'CTU') x.rr = optBit(e.rs, ri, e);
            if (e.t === 'CTD') x.ldr = optBit(e.ld, ri, e);
            if (e.t === 'CTUD') { x.cdr = optBit(e.cd, ri, e); x.rr = optBit(e.rs, ri, e); x.ldr = optBit(e.ld, ri, e); }
            break;
          case 'CMP':
            if (!CMP_OPS.includes(e.op)) E('bad_op', ri, e, `Bad compare operator ${e.op}`, 'عملية مقارنة غير صالحة');
            x.op = e.op; x.ia = intRef(e.a, ri, e, false); x.ib = intRef(e.b, ri, e, false);
            break;
          case 'MOVE': x.ia = intRef(e.a, ri, e, false); x.ow = intRef(e.o, ri, e, true); break;
          case 'ADD': case 'SUB': x.ia = intRef(e.a, ri, e, false); x.ib = intRef(e.b, ri, e, false); x.ow = intRef(e.o, ri, e, true); break;
          case 'SHL': case 'SHR': x.ww = intRef(e.w, ri, e, true); x.bb = bitRef(e.b, ri, e, false); break;
        }
        grid[e.c][e.r] = x;
        list.push(x);
      }
      out.rungs.push({ rows, cols, grid, wire, comps: buildComps(rows, cols, barSet), oddRows, list, note: rg.note || '', title: rg.title || '' });
    });

    out.ok = errors.length === 0;
    return out;
  }

  SC.compile = compile;
  SC.compile.ELEMENTS = ALL;
  SC.compile.limits = { MAX_ROWS, MAX_COLS };
  SC.compile.buildWire = buildWire;
})();

<script>
/* ==== src/core/blocks.js ==== */
/* IEC 61131-3 function blocks. Each mutates its instance record `s` and returns Q.
 * Instance state lives in runtime memory (st.inst[name]) — never in the program JSON.
 *
 * Timing convention: a scan advances time by dt; a block that sees IN on its Nth consecutive scan
 * has ET = N*dt (TON). Q goes true on the scan where ET reaches PT.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;

  function newInst(type) {
    return { type, ET: 0, Q: 0, QU: 0, QD: 0, CV: 0, prev: 0, prev2: 0, run: 0, PT: 0 };
  }

  function ton(s, inp, dt, pt) {
    s.PT = pt;
    if (inp) { s.ET = Math.min(s.ET + dt, pt); s.Q = s.ET >= pt ? 1 : 0; }
    else { s.ET = 0; s.Q = 0; }
    return s.Q;
  }

  function tof(s, inp, dt, pt) {
    s.PT = pt;
    if (inp) { s.Q = 1; s.ET = 0; }
    else if (s.Q) { s.ET += dt; if (s.ET >= pt) { s.ET = pt; s.Q = 0; } }
    return s.Q;
  }

  // Pulse: Q stays high for exactly PT after a rising edge; not retriggerable while running.
  function tp(s, inp, dt, pt) {
    s.PT = pt;
    const rise = inp && !s.prev;
    s.prev = inp ? 1 : 0;
    if (rise && !s.run) { s.run = 1; s.ET = 0; s.Q = pt > 0 ? 1 : 0; if (pt <= 0) s.run = 0; return s.Q; }
    if (s.run) {
      s.ET += dt;
      if (s.ET >= pt) { s.run = 0; s.Q = 0; s.ET = pt; }
      else s.Q = 1;
    }
    return s.Q;
  }

  // Retentive on-delay: ET is kept when IN drops; R resets ET and Q.
  function tonr(s, inp, dt, pt, reset) {
    s.PT = pt;
    if (reset) { s.ET = 0; s.Q = 0; return 0; }
    if (inp) s.ET = Math.min(s.ET + dt, pt);
    s.Q = s.ET >= pt ? 1 : 0;
    return s.Q;
  }

  function ctu(s, cu, pv, reset) {
    const edge = cu && !s.prev;
    s.prev = cu ? 1 : 0;
    if (reset) s.CV = 0;
    else if (edge) s.CV = Math.min(s.CV + 1, 32767);
    s.Q = s.CV >= pv ? 1 : 0;
    return s.Q;
  }

  function ctd(s, cd, pv, load) {
    const edge = cd && !s.prev;
    s.prev = cd ? 1 : 0;
    if (load) s.CV = pv;
    else if (edge) s.CV = Math.max(s.CV - 1, -32768);
    s.Q = s.CV <= 0 ? 1 : 0;
    return s.Q;
  }

  function ctud(s, cu, cd, pv, reset, load) {
    const eu = cu && !s.prev, ed = cd && !s.prev2;
    s.prev = cu ? 1 : 0; s.prev2 = cd ? 1 : 0;
    if (reset) s.CV = 0;
    else if (load) s.CV = pv;
    else {
      let d = 0;
      if (eu) d++;
      if (ed) d--;
      s.CV = Math.max(-32768, Math.min(32767, s.CV + d));
    }
    s.QU = s.CV >= pv ? 1 : 0;
    s.QD = s.CV <= 0 ? 1 : 0;
    s.Q = s.QU;
    return s.QU;
  }

  const toI16 = (x) => (x << 16) >> 16;

  SC.blocks = { newInst, ton, tof, tp, tonr, ctu, ctd, ctud, toI16 };
})();

<script>
/* ==== src/core/scan.js ==== */
/* The scan cycle. Deterministic: same (compiled, state) in -> same state out, byte for byte.
 *
 * One scan:  (caller wrote the sensor snapshot into st.I)
 *            rungs 1..N evaluated in order; coils/blocks write memory immediately,
 *            so later rungs see earlier writes in the same scan (double coil = last write wins).
 *            (caller then copies st.Q to the plant actuators)
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const B = SC.blocks;
  const { N_BITS, N_WORDS } = SC.addr;

  function newState() {
    return {
      t: 0, scans: 0,
      I: new Uint8Array(N_BITS), Q: new Uint8Array(N_BITS), M: new Uint8Array(N_BITS),
      IW: new Int32Array(N_WORDS), QW: new Int32Array(N_WORDS), MW: new Int32Array(N_WORDS),
      inst: Object.create(null),
    };
  }

  function cloneState(st) {
    const inst = Object.create(null);
    for (const k in st.inst) inst[k] = Object.assign({}, st.inst[k]);
    return {
      t: st.t, scans: st.scans,
      I: st.I.slice(), Q: st.Q.slice(), M: st.M.slice(),
      IW: st.IW.slice(), QW: st.QW.slice(), MW: st.MW.slice(), inst,
    };
  }

  // make sure every instance used by the program has a record
  function ensureInsts(c, st) {
    for (const name in c.insts) if (!st.inst[name]) st.inst[name] = B.newInst(c.insts[name].type);
  }

  const ZERO = { Q: 0, QU: 0, QD: 0, ET: 0, CV: 0, PT: 0 };
  const rb = (st, ref) => (ref.k === 'b' ? st[ref.arr][ref.idx] : ((st.inst[ref.name] || ZERO)[ref.f] ? 1 : 0));
  const wb = (st, ref, v) => { st[ref.arr][ref.idx] = v ? 1 : 0; };
  function ri(st, ref) {
    if (ref.k === 'c') return ref.v;
    if (ref.k === 'w') return st[ref.arr][ref.idx];
    return (st.inst[ref.name] || ZERO)[ref.f] | 0;
  }
  const wi = (st, ref, v) => { st[ref.arr][ref.idx] = B.toI16(v); };

  function cmp(op, a, b) {
    switch (op) {
      case '==': return a === b;
      case '<>': return a !== b;
      case '>': return a > b;
      case '<': return a < b;
      case '>=': return a >= b;
      default: return a <= b;
    }
  }

  function inst(st, e) {
    return st.inst[e.inst] || (st.inst[e.inst] = B.newInst(e.t));
  }

  // evaluate one element; returns power out (0/1)
  function exec(e, pin, st, dt) {
    switch (e.t) {
      case 'NO': return pin && e.ra && rb(st, e.ra) ? 1 : 0;
      case 'NC': return pin && e.ra && !rb(st, e.ra) ? 1 : 0;
      case 'OUT': if (e.wa) wb(st, e.wa, pin); return pin;
      case 'SET': if (pin && e.wa) wb(st, e.wa, 1); return pin;
      case 'RST': if (pin && e.wa) wb(st, e.wa, 0); return pin;
      case 'POS': { if (!e.ma) return 0; const prev = rb(st, e.ma); wb(st, e.ma, pin); return pin && !prev ? 1 : 0; }
      case 'NEG': { if (!e.ma) return 0; const prev = rb(st, e.ma); wb(st, e.ma, pin); return !pin && prev ? 1 : 0; }
      case 'TON': return B.ton(inst(st, e), pin, dt, e.ptv);
      case 'TOF': return B.tof(inst(st, e), pin, dt, e.ptv);
      case 'TP': return B.tp(inst(st, e), pin, dt, e.ptv);
      case 'TONR': return B.tonr(inst(st, e), pin, dt, e.ptv, e.rr ? rb(st, e.rr) : 0);
      case 'CTU': return B.ctu(inst(st, e), pin, ri(st, e.pvr), e.rr ? rb(st, e.rr) : 0);
      case 'CTD': return B.ctd(inst(st, e), pin, ri(st, e.pvr), e.ldr ? rb(st, e.ldr) : 0);
      case 'CTUD': return B.ctud(inst(st, e), pin, e.cdr ? rb(st, e.cdr) : 0, ri(st, e.pvr), e.rr ? rb(st, e.rr) : 0, e.ldr ? rb(st, e.ldr) : 0);
      case 'CMP': return pin && cmp(e.op, ri(st, e.ia), ri(st, e.ib)) ? 1 : 0;
      case 'MOVE': if (pin && e.ow) wi(st, e.ow, ri(st, e.ia)); return pin;
      case 'ADD': if (pin && e.ow) wi(st, e.ow, ri(st, e.ia) + ri(st, e.ib)); return pin;
      case 'SUB': if (pin && e.ow) wi(st, e.ow, ri(st, e.ia) - ri(st, e.ib)); return pin;
      case 'SHL': if (pin && e.ww) { const w = st[e.ww.arr][e.ww.idx] & 0xFFFF; st[e.ww.arr][e.ww.idx] = B.toI16(((w << 1) | (e.bb && rb(st, e.bb) ? 1 : 0)) & 0xFFFF); } return pin;
      case 'SHR': if (pin && e.ww) { const w = st[e.ww.arr][e.ww.idx] & 0xFFFF; st[e.ww.arr][e.ww.idx] = B.toI16((w >> 1) | ((e.bb && rb(st, e.bb) ? 1 : 0) << 15)); } return pin;
    }
    return 0;
  }

  // rec (optional): array; rec[rungIndex] = {pin:[col][row], pout:[col][row]} for power-flow display
  function scanRung(R, st, dt, rec) {
    const { rows, cols, grid, wire, comps } = R;
    let src = new Array(rows).fill(0);
    src[0] = 1;
    let rpin = null, rpout = null;
    if (rec) { rpin = []; rpout = []; }
    for (let c = 0; c < cols; c++) {
      // merge at boundary c
      const p = src.slice();
      for (const comp of comps[c]) {
        let any = 0;
        for (const r of comp) if (src[r]) { any = 1; break; }
        for (const r of comp) p[r] = any;
      }
      const o = new Array(rows).fill(0);
      for (let r = 0; r < rows; r++) {
        const e = grid[c][r];
        o[r] = e ? exec(e, p[r], st, dt) : (wire[r][c] ? p[r] : 0);
      }
      if (rec) { rpin.push(p); rpout.push(o); }
      src = o;
    }
    if (rec) {
      // power at the right edge (boundary `cols`) after closing bars
      const p = src.slice();
      for (const comp of comps[cols]) {
        let any = 0;
        for (const r of comp) if (src[r]) { any = 1; break; }
        for (const r of comp) p[r] = any;
      }
      rec.push({ pin: rpin, pout: rpout, edge: p });
    }
  }

  // in-place scan (game loop, headless runner)
  function scanMut(c, st, dt, rec) {
    dt = dt || c.scanMs;
    ensureInsts(c, st);
    for (const R of c.rungs) {
      if (!R) { if (rec) rec.push(null); continue; }
      scanRung(R, st, dt, rec);
    }
    st.t += dt;
    st.scans++;
  }

  // pure wrapper: returns a new state, input untouched
  function scan(c, st, dt) {
    const n = cloneState(st);
    scanMut(c, n, dt);
    return n;
  }

  // byte-exact fingerprint of a state (for determinism tests)
  function fingerprint(st) {
    const parts = [st.t, st.scans, Array.from(st.I).join(''), Array.from(st.Q).join(''), Array.from(st.M).join('')];
    parts.push(Array.from(st.IW).join(','), Array.from(st.QW).join(','), Array.from(st.MW).join(','));
    parts.push(JSON.stringify(Object.keys(st.inst).sort().map((k) => [k, st.inst[k]])));
    return parts.join('|');
  }

  SC.scan = scan;
  SC.scanMut = scanMut;
  SC.newState = newState;
  SC.cloneState = cloneState;
  SC.fingerprint = fingerprint;
  SC.mem = { rb, wb, ri, wi };
})();

<script>
/* ==== src/core/lint.js ==== */
/* Static lint (runs on every edit). Returns [{id, sev:'warn'|'error', rung, r, c, msg:{en,ar}}]. Pure. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const A = SC.addr;

  function lint(program, tags, opts) {
    const out = [];
    opts = opts || {};
    const tm = A.makeTagMap(tags || []);
    const add = (id, sev, ri, el, en, ar) => out.push({ id, sev, rung: ri, r: el ? el.r : undefined, c: el ? el.c : undefined, msg: { en, ar } });
    if (!program || !Array.isArray(program.rungs)) return out;

    const canon = (tok) => {
      if (typeof tok !== 'string') return null;
      const t = tm.byName[tok];
      const a = A.parseAddr(t ? t.addr : tok);
      return a ? a.canon : null;
    };

    const coils = new Map();   // canon -> [{ri,e}]
    const edges = new Map();
    const insts = new Map();   // name -> [{ri,e}]
    const used = new Set();    // tag names referenced

    program.rungs.forEach((rg, ri) => {
      const els = (rg && rg.els) || [];
      let hasEdge = false;
      for (const e of els) if (e.t === 'POS' || e.t === 'NEG') hasEdge = true;
      for (const e of els) {
        for (const k of ['a', 'b', 'o', 'w', 'rs', 'ld', 'cd']) if (typeof e[k] === 'string') used.add(e[k]);
        if (e.t === 'OUT') {
          const c = canon(e.a);
          if (c) { if (!coils.has(c)) coils.set(c, []); coils.get(c).push({ ri, e }); }
        }
        if (e.t === 'POS' || e.t === 'NEG') {
          const c = canon(e.a);
          if (c) { if (!edges.has(c)) edges.set(c, []); edges.get(c).push({ ri, e }); }
        }
        if (e.i) { if (!insts.has(e.i)) insts.set(e.i, []); insts.get(e.i).push({ ri, e }); }
        if ((e.t === 'ADD' || e.t === 'SUB') && !hasEdge) {
          add('add_without_edge', 'warn', ri, e,
            `${e.t} runs on every scan while powered — put an edge contact before it`,
            `${e.t} ينفّذ كل scan طول ما في power — حط edge contact قبله`);
        }
        if (e.t === 'NC') {
          const t = tm.byName[e.a];
          if (t && t.wiring === 'NC' && (t.role === 'stop' || t.role === 'estop')) {
            add('nc_on_nc_stop', 'warn', ri, e,
              `${e.a} is wired normally closed, so its bit is 1 when idle. An NC contact passes power only when the button is pressed. Use an NO contact.`,
              `${e.a} موصول NC فالبت = 1 وهو مش مضغوط. الـ NC contact بيمرّر فقط لما الزر ينضغط. استخدم NO contact.`);
          }
        }
      }
      // vertical bars that never close
      const cols = rg.cols | 0, rows = rg.rows | 0;
      const bars = new Set((rg.vb || []).map((x) => x[0] + ',' + x[1]));
      const has = (b, g) => bars.has(b + ',' + g);
      for (let r = 1; r < rows; r++) {
        let n = 0;
        for (let b = 0; b <= cols; b++) if (has(b, r - 1) || has(b, r)) n++;
        if (n % 2 === 1) add('branch_open', 'warn', ri, { r, c: 0 }, 'A parallel branch is opened but never closed', 'فرع متوازي انفتح وما انسكّر');
      }
      // elements in branch rows with no power path
      const wire = SC.compile.buildWire(Math.max(1, rows), Math.max(1, cols), bars).wire;
      for (const e of els) {
        if (e.r > 0 && wire[e.r] && !wire[e.r][e.c]) {
          add('unconnected', 'warn', ri, e, 'This element is not connected to the rung', 'العنصر هذا مش موصول بالـ rung');
        }
      }
    });

    for (const [c, list] of coils) {
      if (list.length > 1) {
        const t = tm.byAddr[c];
        const nm = t ? t.name : c;
        for (let k = 1; k < list.length; k++) {
          add('double_coil', 'warn', list[k].ri, list[k].e,
            `Double coil: ${nm} is written by ${list.length} coils — the last one wins every scan`,
            `Double coil: ${nm} مكتوب من ${list.length} coils — الأخير هو اللي بيغلب بكل scan`);
        }
      }
    }
    for (const [c, list] of edges) {
      if (list.length > 1) {
        for (let k = 1; k < list.length; k++) {
          add('edge_bit_reused', 'error', list[k].ri, list[k].e,
            `Edge memory ${c} is used by ${list.length} edge contacts — each edge needs its own M bit`,
            `ذاكرة الـ edge ${c} مستخدمة من ${list.length} edge — كل edge لازم بت M خاص فيه`);
        }
      }
    }
    for (const [name, list] of insts) {
      if (list.length > 1) {
        for (let k = 1; k < list.length; k++) {
          add('shared_instance', 'warn', list[k].ri, list[k].e,
            `Two blocks share ${name} — the second overwrites the first`,
            `بلوكين بيشاركوا ${name} — الثاني بيمسح الأول`);
        }
      }
    }
    for (const t of tags || []) {
      if (t.user && !used.has(t.name)) {
        out.push({ id: 'unused_tag', sev: 'warn', rung: -1, msg: { en: `Tag ${t.name} is never used`, ar: `الـ tag ${t.name} ما انستخدم` } });
      }
    }
    return out;
  }

  SC.lint = lint;
})();

</script>

  const byName = Object.create(null);
  IO.forEach((t) => { byName[t.name] = t; });

  // A level lists tags either as a name (-> master entry) or as a full object (override / new).
  function levelTags(level) {
    const out = [];
    for (const t of level.tags || []) {
      if (typeof t === 'string') {
        if (!byName[t]) throw new Error('unknown master tag ' + t);
        out.push(Object.assign({}, byName[t]));
      } else if (byName[t.name]) out.push(Object.assign({}, byName[t.name], t));
      else out.push(Object.assign({ src: 'mem' }, t));
    }
    return out;
  }

  SC.IO = IO;
  SC.ioByName = byName;
  SC.levelTags = levelTags;
})();

<script>
/* ==== src/core/plant.js ==== */
/* Plant model: the oral-syrup bottling line. Deterministic (seeded PRNG kept in the state), 10 ms steps.
 *
 * Units: mm along the conveyor, ms of simulated time. Numbers are "game values", chosen for playability.
 * Hardwired layer: when the E-stop is pressed or the guard door is open, motor / valve / solenoid power
 * is cut regardless of what the ladder does. The PLC only receives EStop_OK and is graded on its own outputs.
 *
 * Bottle slots are numbered 0,1,2... in generation order (cfg.badIdx etc. refer to those numbers).
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const prng = SC.prng;

  const DEFAULTS = {
    stations: ['infeed', 'filler', 'exit'],
    convLen: 1850, v: 150, speedPct: 100,
    bottlesPerMin: 24, jitterMs: 200, genDelayMs: 0, genOn: true,
    R: 30, minGap: 100, spawnX: 0, beam: 3,
    x: { infeed: 150, nozzle: 500, stopper: 530, fillPE: 530, level: 500, cap: 760, capCheck: 860, foil: 900, seal: 1000, label: 1180, reject: 1320, exit: 1700, backup: 1760, blockX: 1800 },
    capacity: 1.0, target: 0.9, okLevel: 0.88, fillSeconds: 3.0, nozzleTol: 40, fillMode: 'timed',
    stopperTravelMs: 400, pusherTravelMs: 150, pusherReach: 40, pumpTravelMs: 1500,
    capperStrokeMs: 300, capperTol: 35, labelerTol: 40, sealExposureMs: 300, meltMs: 2000,
    encPitch: 50,
    tankPct: 80, tankPerFillPct: 0.5,
    badIdx: [], badFlow: 0.6, missingCapIdx: [], noFoilIdx: [], challengeIdx: [], missingBottleIdx: [], doubleIdx: [], fallenIdx: [],
    preload: [],
  };

  const OUT_NAMES = ['Conveyor_Motor', 'Fill_Valve', 'Stopper_SOL', 'Capper_Run', 'Sealer_Enable', 'Labeler_Trig', 'Reject_Pusher', 'Pump_Fwd', 'Pump_Rev'];

  function makeCfg(over) {
    const cfg = JSON.parse(JSON.stringify(DEFAULTS));
    over = over || {};
    for (const k in over) {
      if (k === 'x' || k === 'layout') Object.assign(cfg.x, over[k]);
      else if (k === 'startLevelPct') cfg.tankPct = over[k];
      else cfg[k] = JSON.parse(JSON.stringify(over[k]));
    }
    return cfg;
  }

  const has = (cfg, s) => cfg.stations.indexOf(s) >= 0;

  function init(over, seed) {
    const cfg = makeCfg(over);
    const P = {
      cfg, t: 0, rng: prng.seedOf(seed | 0), nextId: 1, seq: 0,
      nextSpawn: cfg.genDelayMs, pendingDouble: false,
      bottles: [],
      hw: { estop: false, doorOpen: false }, relayOpen: false,
      stopper: { pos: 0 }, pusher: { pos: 0, hit: false }, pump: { pos: 0 },
      tank: { pct: cfg.tankPct },
      faults: { peStuckOn: {}, peStuckOff: {}, peMisaligned: {}, peChatter: {}, valveWornSeal: false, airLow: false, airLost: false, capFeederEmpty: false, encoderSlip: false },
      flags: { outfeedBlocked: false, genOn: cfg.genOn !== false },
      enc: { acc: cfg.encPitch / 2, n: 0, mute: false },
      capper: { prev: 0, timer: -1, applied: false }, labeler: { prev: 0 }, fill: { dryOpen: false },
      counts: { spawned: 0, out: 0, good: 0, rejected: 0, spills: 0, wastedCaps: 0, wastedLabels: 0, goodLost: 0, melted: 0, badShipped: 0, filled: 0, runMs: 0, stopMs: 0, dist: 0 },
      outs: {}, sens: {},
    };
    for (const pb of cfg.preload) {
      P.bottles.push(newBottle(P, -1, Object.assign({ level: 0 }, pb)));
    }
    P.bottles.sort((a, b) => b.x - a.x);
    P.sens = computeSensors(P);
    return P;
  }

  function newBottle(P, k, over) {
    const c = P.cfg;
    const bad = c.badIdx.indexOf(k) >= 0;
    const b = {
      id: P.nextId++, seq: k, x: c.spawnX, level: 0, capped: false, sealed: false, labeled: false,
      bad, flowMul: bad ? c.badFlow : 1, noCap: c.missingCapIdx.indexOf(k) >= 0, noFoil: c.noFoilIdx.indexOf(k) >= 0,
      challenge: c.challengeIdx.indexOf(k) >= 0, fallen: c.fallenIdx.indexOf(k) >= 0,
      sealMs: 0, melted: false, spilled: false, filledFlag: false, miss: {}, px: c.spawnX,
    };
    if (b.challenge) b.bad = true;
    Object.assign(b, over || {});
    if (over && over.x !== undefined) b.px = over.x;
    return b;
  }

  function isDefective(P, b) {
    const c = P.cfg;
    if (b.challenge || b.fallen || b.melted) return true;
    if (has(c, 'filler') && (b.level < c.okLevel - 1e-9)) return true;
    if (has(c, 'capper') && !b.capped) return true;
    if (has(c, 'sealer') && !b.sealed) return true;
    if (has(c, 'labeler') && !b.labeled) return true;
    return false;
  }

  // ------------------------------------------------------------------ sensors
  function eyeBlocked(P, name, ex) {
    const c = P.cfg;
    const reach = c.R + c.beam;
    let blocked = false;
    for (const b of P.bottles) {
      if (Math.abs(b.x - ex) > reach) continue;
      if (P.faults.peMisaligned[name]) {
        if (b.miss[name] === undefined) b.miss[name] = prng.next(P) < 0.3;
        if (b.miss[name]) continue;
      }
      blocked = true;
      break;
    }
    if (P.faults.peStuckOn[name]) return 1;
    if (P.faults.peStuckOff[name]) return 0;
    if (P.faults.peChatter[name]) return prng.next(P) < 0.5 ? 1 : 0;
    return blocked ? 1 : 0;
  }

  function near(P, x, tol, pred) {
    let best = null, bd = 1e9;
    for (const b of P.bottles) {
      const d = Math.abs(b.x - x);
      if (d <= tol && d < bd && (!pred || pred(b))) { best = b; bd = d; }
    }
    return best;
  }

  function computeSensors(P) {
    const c = P.cfg, x = c.x, s = {};
    s.PE_Infeed = eyeBlocked(P, 'PE_Infeed', x.infeed);
    s.PE_Fill = eyeBlocked(P, 'PE_Fill', x.fillPE);
    s.PE_Cap = eyeBlocked(P, 'PE_Cap', x.cap);
    s.PE_Reject = eyeBlocked(P, 'PE_Reject', x.reject);
    s.PE_Exit = eyeBlocked(P, 'PE_Exit', x.exit);
    s.PE_Backup = eyeBlocked(P, 'PE_Backup', x.backup);
    s.Level_OK = near(P, x.level, 40, (b) => b.level >= c.okLevel) ? 1 : 0;
    s.Cap_Present = near(P, x.capCheck, 35, (b) => b.capped) ? 1 : 0;
    s.Foil_Present = near(P, x.foil, 35, (b) => b.capped && !b.noFoil) ? 1 : 0;
    s.Challenge_Bottle = near(P, x.reject, 40, (b) => b.challenge) ? 1 : 0;
    s.Stopper_Ext = P.stopper.pos >= 0.97 ? 1 : 0;
    s.Stopper_Ret = P.stopper.pos <= 0.03 ? 1 : 0;
    s.Air_OK = P.faults.airLost ? 0 : 1;
    s.Tank_LSL = P.tank.pct < 15 ? 1 : 0;
    s.Tank_LSLL = P.tank.pct < 5 ? 1 : 0;
    s.Tank_Level = Math.round(Math.max(0, Math.min(100, P.tank.pct)) * 276.48);
    s.Pump_Home = P.pump.pos <= 0.02 ? 1 : 0;
    s.Pump_Full = P.pump.pos >= 0.98 ? 1 : 0;
    s.Conv_Encoder = !P.enc.mute && P.enc.acc < c.encPitch / 2 ? 1 : 0;
    s.EStop_OK = P.hw.estop || P.hw.doorOpen ? 0 : 1;
    s.Door_Closed = P.hw.doorOpen ? 0 : 1;
    return s;
  }

  // ------------------------------------------------------------------ step
  function pushOff(P, b) {
    const i = P.bottles.indexOf(b);
    if (i >= 0) P.bottles.splice(i, 1);
  }

  function addFill(P, b, amount) {
    const c = P.cfg;
    if (b.fallen) { if (!b.spilled) { b.spilled = true; P.counts.spills++; } return; }
    b.level += amount;
    if (b.level > c.capacity) {
      b.level = c.capacity;
      if (!b.spilled) { b.spilled = true; P.counts.spills++; }
    }
    if (!b.filledFlag && b.level >= c.okLevel) {
      b.filledFlag = true;
      P.counts.filled++;
      P.tank.pct = Math.max(0, P.tank.pct - c.tankPerFillPct);
    }
  }

  function stepMut(P, out, dt) {
    const c = P.cfg, x = c.x;
    P.t += dt;
    P.relayOpen = P.hw.estop || P.hw.doorOpen;
    const pw = !P.relayOpen;
    const o = {};
    for (const n of OUT_NAMES) o[n] = pw && out && out[n] ? 1 : 0;
    P.outs = {};
    if (out) for (const k in out) P.outs[k] = out[k] ? 1 : 0;

    // ---- generator
    if (P.flags.genOn !== false) {
      const last = P.bottles.length ? P.bottles[P.bottles.length - 1] : null; // lowest x
      const gapOk = !last || last.x >= c.minGap;
      if (P.pendingDouble && gapOk) {
        P.pendingDouble = false;
        P.bottles.push(newBottle(P, P.seq - 1, { seq: P.seq - 1, double: true }));
        P.counts.spawned++;
      } else if (P.t >= P.nextSpawn && gapOk) {
        const k = P.seq++;
        const period = 60000 / Math.max(1, c.bottlesPerMin);
        P.nextSpawn += Math.max(period * 0.5, period + prng.range(P, -c.jitterMs, c.jitterMs));
        if (c.missingBottleIdx.indexOf(k) < 0) {
          P.bottles.push(newBottle(P, k));
          P.counts.spawned++;
          if (c.doubleIdx.indexOf(k) >= 0) P.pendingDouble = true;
        }
      }
    }

    // ---- air / cylinders
    const air = !P.faults.airLost;
    const slow = P.faults.airLow ? 3 : 1;
    if (air) {
      const sd = dt / (c.stopperTravelMs * slow);
      P.stopper.pos = Math.max(0, Math.min(1, P.stopper.pos + (o.Stopper_SOL ? sd : -sd)));
      const pd = dt / (c.pusherTravelMs * slow);
      P.pusher.pos = Math.max(0, Math.min(1, P.pusher.pos + (o.Reject_Pusher ? pd : -pd)));
    }
    if (P.pusher.pos < 0.2) P.pusher.hit = false;
    if (P.pusher.pos >= 0.8 && !P.pusher.hit) {
      const b = near(P, x.reject, c.pusherReach);
      if (b) {
        P.pusher.hit = true;
        pushOff(P, b);
        P.counts.rejected++;
        if (!isDefective(P, b)) P.counts.goodLost++;
      }
    }

    // ---- conveyor
    const dx = o.Conveyor_Motor ? (c.v * c.speedPct / 100) * dt / 1000 : 0;
    if (o.Conveyor_Motor) { P.counts.runMs += dt; P.counts.dist += dx; } else P.counts.stopMs += dt;
    const holdX = x.stopper - c.R;
    P.bottles.sort((a, b) => b.x - a.x);
    let ahead = null;
    const gone = [];
    for (const b of P.bottles) {
      b.px = b.x; // previous position, for smooth rendering
      let nx = b.x + dx;
      if (ahead) nx = Math.min(nx, ahead.x - c.minGap);
      if (P.stopper.pos > 0.5 && b.x <= holdX + 1e-9) nx = Math.min(nx, holdX);
      if (P.flags.outfeedBlocked) nx = Math.min(nx, x.blockX);
      b.x = Math.max(b.x, nx);
      ahead = b;
      if (b.x > c.convLen) gone.push(b);
    }
    for (const b of gone) {
      pushOff(P, b);
      P.counts.out++;
      if (isDefective(P, b)) P.counts.badShipped++; else P.counts.good++;
    }

    // ---- encoder
    P.enc.acc += dx;
    while (P.enc.acc >= c.encPitch) {
      P.enc.acc -= c.encPitch;
      P.enc.n++;
      P.enc.mute = P.faults.encoderSlip && P.enc.n % 50 === 49;
    }

    // ---- filling
    const under = near(P, x.nozzle, c.nozzleTol);
    if (c.fillMode === 'timed') {
      if (o.Fill_Valve) {
        if (under) {
          let flow = c.target / c.fillSeconds * under.flowMul * (P.faults.valveWornSeal ? 0.75 : 1);
          if (P.tank.pct <= 0) flow = 0;
          addFill(P, under, flow * dt / 1000);
        } else if (!P.fill.dryOpen) { P.fill.dryOpen = true; P.counts.spills++; }
      } else P.fill.dryOpen = false;
    } else {
      // piston filler: the pump moves the product, the valve routes it to the nozzle
      const pf = o.Pump_Fwd, pr = o.Pump_Rev;
      const pd = dt / c.pumpTravelMs;
      if (pr && !pf) P.pump.pos = Math.min(1, P.pump.pos + pd);
      else if (pf && !pr) {
        const d = Math.min(P.pump.pos, pd);
        P.pump.pos -= d;
        if (o.Fill_Valve && d > 0) {
          if (under) addFill(P, under, d * c.target * under.flowMul);
          else if (!P.fill.dryOpen) { P.fill.dryOpen = true; P.counts.spills++; }
        }
      }
      if (!o.Fill_Valve) P.fill.dryOpen = false;
    }

    // ---- capper (rising edge = one stroke)
    const cr = o.Capper_Run;
    if (cr && !P.capper.prev && P.capper.timer < 0) { P.capper.timer = 0; P.capper.applied = false; }
    P.capper.prev = cr;
    if (P.capper.timer >= 0) {
      P.capper.timer += dt;
      if (!P.capper.applied && P.capper.timer >= c.capperStrokeMs / 2) {
        P.capper.applied = true;
        const b = near(P, x.cap, c.capperTol);
        if (b) { if (!(b.noCap || P.faults.capFeederEmpty)) b.capped = true; }
        else P.counts.wastedCaps++;
      }
      if (P.capper.timer >= c.capperStrokeMs) P.capper.timer = -1;
    }

    // ---- sealer
    for (const b of P.bottles) {
      if (Math.abs(b.x - x.seal) <= 40 && o.Sealer_Enable && b.capped) {
        b.sealMs += dt;
        if (b.sealMs >= c.sealExposureMs && !b.noFoil && !b.melted) b.sealed = true;
        if (b.sealMs > c.meltMs && !b.melted) { b.melted = true; b.sealed = false; P.counts.melted++; }
      }
    }

    // ---- labeler (rising edge)
    const lt = o.Labeler_Trig;
    if (lt && !P.labeler.prev) {
      const b = near(P, x.label, c.labelerTol);
      if (b) b.labeled = true; else P.counts.wastedLabels++;
    }
    P.labeler.prev = lt;

    P.sens = computeSensors(P);
  }

  function clone(P) { return JSON.parse(JSON.stringify(P)); }
  function step(P, out, dt) { const n = clone(P); stepMut(n, out, dt); return n; }

  // ------------------------------------------------------------------ events / faults
  function applyEvent(P, ev) {
    if (ev.estop !== undefined) P.hw.estop = !!ev.estop;
    if (ev.door !== undefined) P.hw.doorOpen = ev.door === 'open' || ev.door === true;
    if (ev.fault) setFault(P, ev.fault, ev.arg, true);
    if (ev.clear) setFault(P, ev.clear, ev.arg, false);
    if (ev.plantSet) {
      for (const k in ev.plantSet) {
        const v = ev.plantSet[k];
        if (k === 'tankPct') P.tank.pct = v;
        else if (k === 'outfeedBlocked') P.flags.outfeedBlocked = !!v;
        else if (k === 'genOn') P.flags.genOn = !!v;
        else if (k === 'bottlesPerMin' || k === 'speedPct' || k === 'jitterMs' || k === 'fillSeconds') P.cfg[k] = v;
        else if (k === 'pumpTravelMs' || k === 'stopperTravelMs') P.cfg[k] = v;
        else if (k === 'spawnBottle') P.bottles.push(newBottle(P, -1, typeof v === 'object' ? v : {}));
      }
    }
  }

  function setFault(P, name, arg, on) {
    const f = P.faults;
    if (['peStuckOn', 'peStuckOff', 'peMisaligned', 'peChatter'].indexOf(name) >= 0) {
      if (on) f[name][arg] = true; else delete f[name][arg];
    } else if (name in f) f[name] = !!on;
  }

  // ------------------------------------------------------------------ KPIs
  function kpis(P) {
    const c = P.cfg, n = P.counts;
    const tmin = Math.max(P.t, 1) / 60000;
    const runS = n.runMs / 1000;
    const availability = P.t > 0 ? n.runMs / P.t : 0;
    const performance = runS > 0 ? Math.min(1, n.dist / (c.v * runS)) : 0;
    const total = n.out + n.rejected;
    const quality = total > 0 ? n.good / total : 1;
    return {
      out: n.out, good: n.good, rejected: n.rejected, spills: n.spills, wastedCaps: n.wastedCaps, goodLost: n.goodLost,
      melted: n.melted, badShipped: n.badShipped, filledCount: n.filled, bottlesPerMin: n.out / tmin,
      availability, performance, quality, oee: availability * performance * quality,
      overflow: n.spills > 0,
    };
  }

  SC.plant = { DEFAULTS, makeCfg, init, stepMut, step, clone, applyEvent, setFault, kpis, isDefective, OUT_NAMES, has };
})();

</script>
<script>
/* ==== src/core/sim.js ==== */
/* Simulation = PLC (compiled program + memory) + plant + operator panel + forces + scenario events.
 * The same object drives the interactive game loop and the headless FAT runner, so replays are identical.
 *
 * One step():  events -> sensor snapshot into the input image -> scan -> outputs to plant -> plant step.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const A = SC.addr;

  const INPUT_IO = SC.IO.filter((t) => t.addr[0] === 'I').map((t) => Object.assign({ _a: A.parseAddr(t.addr) }, t));
  const OUTPUT_IO = SC.IO.filter((t) => t.src === 'out').map((t) => Object.assign({ _a: A.parseAddr(t.addr) }, t));

  // press events -> set events (NC buttons idle at 1)
  function prepareEvents(events) {
    const out = [];
    for (const ev of events || []) {
      if (ev.press) {
        const io = SC.ioByName[ev.press];
        const idle = io ? io.def : 0;
        out.push({ t: ev.t, set: { [ev.press]: idle ? 0 : 1 } });
        out.push({ t: ev.t + (ev.ms || 200), set: { [ev.press]: idle } });
      } else out.push(ev);
    }
    return out.map((e, i) => Object.assign({ _i: i }, e)).sort((a, b) => a.t - b.t || a._i - b._i);
  }

  const METRIC_KEYS = ['out', 'good', 'rejected', 'spills', 'wastedCaps', 'goodLost', 'melted', 'badShipped', 'filledCount', 'overflow', 'bottlesPerMin', 'availability', 'performance', 'quality', 'oee', 'wastedLabels', 'spawned', 'estopTrips'];

  function create(opts) {
    const level = opts.level || {};
    const scenario = opts.scenario || {};
    const seed = opts.seed !== undefined ? opts.seed : (scenario.seed || 1);
    const tags = SC.levelTags(level).concat(opts.userTags || []);
    const allTags = SC.IO.map((t) => t).concat(tags.filter((t) => !SC.ioByName[t.name]));
    const tagByName = Object.create(null);
    for (const t of allTags) tagByName[t.name] = Object.assign({ _a: A.parseAddr(t.addr) }, t);
    for (const t of tags) tagByName[t.name] = Object.assign({ _a: A.parseAddr(t.addr) }, tagByName[t.name] || {}, t);

    const compiled = SC.compile(opts.program || { v: 1, rungs: [] }, { tags, palette: level.palette || null });
    const st = SC.newState();
    for (const addr in level.init || {}) {
      const a = A.parseAddr(addr);
      if (a) st[a.arr][a.idx] = level.init[addr];
    }
    const plantCfg = Object.assign({}, level.plant || {}, scenario.plant || {});
    const P = SC.plant.init(plantCfg, seed);

    const panel = Object.create(null);
    for (const io of INPUT_IO) if (io.src === 'panel') panel[io.name] = io.def | 0;
    const events = prepareEvents(scenario.events);

    const sim = {
      level, scenario, compiled, st, P, panel, forces: Object.create(null), events, evIdx: 0,
      t: 0, dt: SC.SCAN_MS, trace: null, prevVals: null, tagByName, rec: null, steps: 0, audit: [], watch: {},
    };
    if (opts.trace) { sim.trace = []; sim.prevVals = Object.create(null); }
    for (const nm of level.watchLog || []) sim.watch[nm] = undefined;

    function resolveInput(key) {
      if (SC.ioByName[key] && SC.ioByName[key].addr[0] === 'I') return SC.ioByName[key];
      const a = A.parseAddr(key);
      if (a) return INPUT_IO.find((io) => io._a.canon === a.canon) || null;
      return null;
    }
    sim.resolveInput = resolveInput;

    function applyEvent(ev) {
      if (ev.set) {
        for (const k in ev.set) {
          const io = resolveInput(k);
          if (io) panel[io.name] = ev.set[k] === true ? 1 : ev.set[k] === false ? 0 : ev.set[k];
        }
      }
      SC.plant.applyEvent(P, ev);
      if (ev.audit) sim.audit.push({ t: sim.t, note: ev.audit });
    }

    sim.setPanel = (name, v) => {
      const io = resolveInput(name);
      if (io && io.src === 'panel') panel[io.name] = v === true ? 1 : v === false ? 0 : v;
    };

    sim.force = (key, v) => {
      const a = A.parseAddr(SC.ioByName[key] ? SC.ioByName[key].addr : key);
      if (!a || a.arr !== 'I' && a.arr !== 'IW') return false;
      if (v === null || v === undefined) delete sim.forces[a.canon];
      else sim.forces[a.canon] = v === true ? 1 : v === false ? 0 : v;
      return true;
    };
    sim.forcesActive = () => Object.keys(sim.forces).length > 0;
    sim.clearForces = () => { sim.forces = Object.create(null); };

    sim.read = (key) => {
      const t = tagByName[key];
      let a = t ? t._a : A.parseAddr(key);
      if (a) return st[a.arr][a.idx];
      const m = /^([A-Za-z_]\w*)\.(Q|QU|QD|ET|CV|PT)$/.exec(key);
      if (m) { const s = st.inst[m[1]]; return s ? s[m[2]] : 0; }
      return sim.metric(key);
    };

    sim.metric = (key) => {
      const n = P.counts;
      switch (key) {
        case 'out': case 'good': case 'rejected': case 'spills': case 'wastedCaps': case 'goodLost': case 'melted': case 'badShipped': case 'wastedLabels': case 'spawned': return n[key];
        case 'filledCount': return n.filled;
        case 'overflow': return n.spills > 0 ? 1 : 0;
        case 'bottlesPerMin': case 'availability': case 'performance': case 'quality': case 'oee': return SC.plant.kpis(P)[key];
      }
      return undefined;
    };
    sim.isKnownKey = (key) => !!(tagByName[key] || A.parseAddr(key) || /^([A-Za-z_]\w*)\.(Q|QU|QD|ET|CV|PT)$/.test(key) || METRIC_KEYS.indexOf(key) >= 0);

    function recordTrace() {
      const cur = sim.prevVals;
      for (const nm in tagByName) {
        const t = tagByName[nm];
        if (!t._a) continue;
        const v = st[t._a.arr][t._a.idx];
        if (cur[nm] !== v) { cur[nm] = v; sim.trace.push({ t: sim.t, tag: nm, v }); }
      }
    }

    sim.step = (withRec) => {
      while (sim.evIdx < events.length && events[sim.evIdx].t <= sim.t) applyEvent(events[sim.evIdx++]);
      // sensor snapshot -> input image
      for (const io of INPUT_IO) {
        const f = sim.forces[io._a.canon];
        let v;
        if (f !== undefined) v = f;
        else if (io.src === 'panel') v = panel[io.name];
        else v = P.sens[io.name];
        if (v === undefined) v = 0;
        if (io._a.kind === 'bit') st.I[io._a.idx] = v ? 1 : 0;
        else st[io._a.arr][io._a.idx] = v | 0;
      }
      if (compiled.ok) {
        if (withRec) { sim.rec = []; SC.scanMut(compiled, st, sim.dt, sim.rec); } else SC.scanMut(compiled, st, sim.dt);
      } else { st.t += sim.dt; st.scans++; }
      const out = {};
      for (const io of OUTPUT_IO) out[io.name] = st.Q[io._a.idx];
      for (const nm in sim.watch) {
        const v = sim.read(nm);
        if (sim.watch[nm] !== undefined && sim.watch[nm] !== v) sim.audit.push({ t: sim.t, tag: nm, from: sim.watch[nm], to: v, key: panel.Supervisor_Key ? 1 : 0 });
        sim.watch[nm] = v;
      }
      if (sim.trace) recordTrace();
      SC.plant.stepMut(P, out, sim.dt);
      sim.t += sim.dt;
      sim.steps++;
    };

    sim.runUntil = (ms) => { while (sim.t < ms) sim.step(); };
    return sim;
  }

  SC.sim = { create, INPUT_IO, OUTPUT_IO, prepareEvents, METRIC_KEYS };
})();

</script>
<script>
/* ==== src/core/scenario.js ==== */
/* FAT scenario runner: runs a scenario against a program and checks the assertions.
 *
 * scenario: {id, seed, durationMs, plant?:{...}, events:[...], asserts:[...], title?:{en,ar}}
 *   events:  {t, set:{tag:value}} | {t, press:"Start_PB", ms} | {t, estop:bool} | {t, door:"open"|"closed"}
 *            {t, fault:name, arg} | {t, clear:name, arg} | {t, plantSet:{...}}
 *   asserts: {t, expect:{key:value}, tol?, msg?}          value must hold at some sample in [t-tol, t+tol]
 *            {window:[a,b], never:{...}} / {window:[a,b], always:{...}}
 *            {when:{...}, within:ms, expect:{...}, tol?}  after every rising edge of `when`
 *   keys: tag names, addresses (Q0.0), instance fields (DB_T.ET), plant metrics (filledCount, spills, ...)
 *   values: true/false/number or {gte,gt,lte,lt,eq,ne}
 * Sample time = the time at which the scan read its inputs; outputs are the result of that scan.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const DEFAULT_TOL = 20;

  function matchVal(v, exp) {
    if (v === undefined) return false;
    if (typeof exp === 'boolean') return (v ? true : false) === exp;
    if (typeof exp === 'number') return v === exp;
    if (exp && typeof exp === 'object') {
      for (const op in exp) {
        const e = exp[op];
        if (op === 'gte' && !(v >= e)) return false;
        if (op === 'gt' && !(v > e)) return false;
        if (op === 'lte' && !(v <= e)) return false;
        if (op === 'lt' && !(v < e)) return false;
        if (op === 'eq' && !(v === e)) return false;
        if (op === 'ne' && !(v !== e)) return false;
      }
      return true;
    }
    return false;
  }

  function matchCond(sim, cond) {
    for (const k in cond) if (!matchVal(sim.read(k), cond[k])) return false;
    return true;
  }

  function actualOf(sim, cond) {
    const o = {};
    for (const k in cond) { const v = sim.read(k); o[k] = typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 1000) / 1000 : v; }
    return o;
  }

  const fmtVal = (e) => (typeof e === 'boolean' ? (e ? 'ON' : 'OFF') : typeof e === 'object' ? Object.keys(e).map((k) => `${k} ${e[k]}`).join(', ') : String(e));
  const fmtCond = (c) => Object.keys(c).map((k) => `${k} = ${fmtVal(c[k])}`).join(' and ');
  const sec = (ms) => (ms / 1000).toFixed(2) + ' s';

  function defaultMsg(a, kind) {
    if (kind === 'at') return { en: `Expected ${fmtCond(a.expect)} at t = ${sec(a.t)}`, ar: `المتوقع ${fmtCond(a.expect)} عند t = ${sec(a.t)}` };
    if (kind === 'never') return { en: `${fmtCond(a.never)} must never happen between ${sec(a.window[0])} and ${sec(a.window[1])}`, ar: `ممنوع يصير ${fmtCond(a.never)} بين ${sec(a.window[0])} و ${sec(a.window[1])}` };
    if (kind === 'always') return { en: `${fmtCond(a.always)} must hold between ${sec(a.window[0])} and ${sec(a.window[1])}`, ar: `لازم يضل ${fmtCond(a.always)} بين ${sec(a.window[0])} و ${sec(a.window[1])}` };
    return { en: `After ${fmtCond(a.when)}, expected ${fmtCond(a.expect)} within ${a.within} ms`, ar: `بعد ${fmtCond(a.when)} المتوقع ${fmtCond(a.expect)} خلال ${a.within} ms` };
  }

  // opts: {seed, failFast, trace, forces, userTags, upTo (ms, stop early), rec}
  function runScenario(level, program, scenario, opts) {
    opts = opts || {};
    const t0 = Date.now();
    const sim = SC.sim.create({ level, program, scenario, seed: opts.seed !== undefined ? opts.seed : scenario.seed, trace: !!opts.trace, userTags: opts.userTags });
    if (opts.forces) for (const k in opts.forces) sim.force(k, opts.forces[k]);
    const dur = scenario.durationMs || 10000;
    const asserts = (scenario.asserts || []).map((a, i) => {
      const kind = a.never ? 'never' : a.always ? 'always' : a.when ? 'within' : 'at';
      const tol = a.tol === undefined ? DEFAULT_TOL : a.tol;
      const o = { a, i, kind, tol, done: false, ok: false, obligations: [], prevWhen: false };
      if (kind === 'at') { o.from = a.t - tol; o.to = a.t + tol; }
      return o;
    });
    const failures = [];
    const fail = (o, tFail, extra) => {
      const a = o.a;
      const cond = o.kind === 'never' ? a.never : o.kind === 'always' ? a.always : a.expect;
      failures.push(Object.assign({
        idx: o.i, kind: o.kind, t: tFail, at: a.t !== undefined ? a.t : (a.window ? a.window[0] : tFail),
        msg: a.msg || defaultMsg(a, o.kind), expected: cond, actual: actualOf(sim, cond), assertId: a.id || ('#' + (o.i + 1)),
      }, extra || {}));
    };
    const unknownKeys = [];
    for (const o of asserts) {
      const a = o.a;
      for (const c of [a.expect, a.never, a.always, a.when]) if (c) for (const k in c) if (!sim.isKnownKey(k)) unknownKeys.push(k);
    }
    if (unknownKeys.length) failures.push({ idx: -1, kind: 'bad_scenario', t: 0, at: 0, msg: { en: 'Scenario uses unknown key ' + unknownKeys[0], ar: 'السيناريو فيه مفتاح غير معروف' }, expected: {}, actual: {}, assertId: 'scenario' });

    const stopAt = opts.upTo !== undefined ? opts.upTo : dur;
    while (sim.t < stopAt) {
      sim.step();
      const ts = sim.t - sim.dt;
      for (const o of asserts) {
        if (o.done) continue;
        const a = o.a;
        if (o.kind === 'at') {
          if (ts >= o.from && ts <= o.to) {
            if (!o.ok && matchCond(sim, a.expect)) o.ok = true;
            if (ts >= o.to && !o.ok) { o.done = true; fail(o, ts); }
          }
          if (ts >= o.to) o.done = true;
        } else if (o.kind === 'never' || o.kind === 'always') {
          if (ts >= a.window[0] && ts <= a.window[1]) {
            const m = matchCond(sim, o.kind === 'never' ? a.never : a.always);
            if ((o.kind === 'never' && m) || (o.kind === 'always' && !m)) { o.done = true; fail(o, ts); }
          }
          if (ts > a.window[1]) o.done = true;
        } else {
          const w = matchCond(sim, a.when);
          if (w && !o.prevWhen) o.obligations.push({ t0: ts, deadline: ts + (a.within || 0) + o.tol });
          o.prevWhen = w;
          if (o.obligations.length) {
            const ok = matchCond(sim, a.expect);
            const keep = [];
            for (const ob of o.obligations) {
              if (ok) continue;
              if (ts >= ob.deadline) { fail(o, ts, { at: ob.t0 }); o.done = true; break; }
              keep.push(ob);
            }
            o.obligations = keep;
          }
        }
      }
      if (opts.failFast && failures.length) break;
    }
    // flush obligations whose deadline is inside the run but never evaluated (end of run)
    if (stopAt >= dur) {
      for (const o of asserts) {
        if (o.done) continue;
        if (o.kind === 'at' && !o.ok && o.to <= dur) fail(o, dur);
        if (o.kind === 'within') for (const ob of o.obligations) if (ob.deadline <= dur) { fail(o, dur, { at: ob.t0 }); break; }
      }
    }
    failures.sort((x, y) => x.t - y.t || x.idx - y.idx);
    return {
      id: scenario.id, pass: failures.length === 0, failures, firstFailure: failures[0] || null,
      metrics: SC.plant.kpis(sim.P), audit: sim.audit, sim: opts.keepSim ? sim : null, ms: Date.now() - t0, forcesActive: sim.forcesActive(),
    };
  }

  // ------------------------------------------------------------------ hidden variants
  // level.hidden = {count, seedBase, base?:[scenarioIds], vary:{plant:{key:[loPct,hiPct]}, jitterMs:[lo,hi], shiftMs:[lo,hi], bottlesPerMinPct:[lo,hi]}}
  function makeHidden(level, k) {
    const h = level.hidden || {};
    const vis = (level.scenarios || []).filter((s) => !h.base || h.base.indexOf(s.id) >= 0);
    if (!vis.length) return null;
    const base = vis[k % vis.length];
    const seed = (h.seedBase || 1000) + k;
    const o = { rng: SC.prng.seedOf(seed * 7919 + 13) };
    const sc = SC.util.clone(base);
    sc.id = `${base.id}~h${k}`;
    sc.seed = seed;
    sc.hidden = true;
    const v = h.vary || {};
    sc.plant = sc.plant || {};
    if (v.jitterMs) sc.plant.jitterMs = Math.round(SC.prng.range(o, v.jitterMs[0], v.jitterMs[1]));
    if (v.genDelayMs) sc.plant.genDelayMs = Math.round(SC.prng.range(o, v.genDelayMs[0], v.genDelayMs[1]));
    if (v.bottlesPerMinPct) {
      const b = sc.plant.bottlesPerMin || (level.plant && level.plant.bottlesPerMin) || SC.plant.DEFAULTS.bottlesPerMin;
      sc.plant.bottlesPerMin = Math.round(b * (1 + SC.prng.range(o, v.bottlesPerMinPct[0], v.bottlesPerMinPct[1]) / 100) * 10) / 10;
    }
    for (const key in v.plant || {}) {
      const range = v.plant[key];
      const baseV = sc.plant[key] !== undefined ? sc.plant[key] : (level.plant && level.plant[key] !== undefined ? level.plant[key] : SC.plant.DEFAULTS[key]);
      if (typeof baseV === 'number') sc.plant[key] = Math.round(baseV * (1 + SC.prng.range(o, range[0], range[1]) / 100) * 1000) / 1000;
    }
    if (v.shiftMs) {
      const sh = Math.round(SC.prng.range(o, v.shiftMs[0], v.shiftMs[1]) / 10) * 10;
      for (const e of sc.events || []) e.t += sh;
      for (const a of sc.asserts || []) {
        if (a.t !== undefined) a.t += sh;
        if (a.window) a.window = [a.window[0] + sh, a.window[1] + sh];
      }
      sc.durationMs += sh;
    }
    return sc;
  }

  // runs visible scenarios, then hidden variants. opts: {failFast, skipHidden, userTags, forces}
  function runLevel(level, program, opts) {
    opts = opts || {};
    const results = [];
    let firstFail = null;
    const push = (sc, hidden) => {
      const r = runScenario(level, program, sc, { failFast: true, userTags: opts.userTags, forces: opts.forces });
      r.hidden = !!hidden;
      r.scenario = sc;
      results.push(r);
      if (!r.pass && !firstFail) firstFail = r;
      return r.pass;
    };
    for (const sc of level.scenarios || []) { if (!push(sc, false) && opts.stopAtFirst) break; }
    if (!opts.skipHidden && !(opts.stopAtFirst && firstFail)) {
      const n = (level.hidden && level.hidden.count) || 0;
      for (let k = 0; k < n; k++) {
        const sc = makeHidden(level, k);
        if (sc && !push(sc, true) && opts.stopAtFirst) break;
      }
    }
    return { pass: results.every((r) => r.pass) && !(opts.forces && Object.keys(opts.forces).length), results, firstFail };
  }

  SC.scenario = { runScenario, runLevel, makeHidden, matchCond, DEFAULT_TOL };
})();

</script>

<script>
/* ==== src/ui/dom.js ==== */
/* Tiny DOM helpers + bilingual text helpers + safe storage. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  SC.ui = SC.ui || {};

  // h('div', {class:'a', onclick:fn, dataset:{x:1}}, child, 'text', [more])
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'dataset') for (const d in v) el.dataset[d] = v[d];
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) c.forEach((x) => add(el, x));
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Arabic text may contain {{English terms}} -> <bdi lang="en">
  function arHtml(s) { return esc(s).replace(/\{\{(.+?)\}\}/g, '<bdi lang="en">$1</bdi>'); }
  function arEl(s, tag) { return h(tag || 'span', { lang: 'ar', dir: 'rtl', html: arHtml(s) }); }
  function enEl(s, tag) { return h(tag || 'span', { lang: 'en', dir: 'ltr' }, s); }

  // storage that never throws
  const store = {
    mem: Object.create(null),
    get(k, def) {
      try { const v = globalThis.localStorage.getItem('scancycle.' + k); return v === null ? (k in store.mem ? store.mem[k] : def) : JSON.parse(v); } catch (e) { return k in store.mem ? store.mem[k] : def; }
    },
    set(k, v) {
      store.mem[k] = v;
      try { globalThis.localStorage.setItem('scancycle.' + k, JSON.stringify(v)); return true; } catch (e) { store.failed = true; return false; }
    },
    failed: false,
  };

  SC.ui.h = h;
  SC.ui.esc = esc;
  SC.ui.arHtml = arHtml;
  SC.ui.arEl = arEl;
  SC.ui.enEl = enEl;
  SC.ui.store = store;
})();

</script>
