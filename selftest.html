      if (b.challenge) { c.fillStyle = col.alarm; c.beginPath(); c.moveTo(cx, y0 - BH - NECK_H - 16); c.lineTo(cx - 6, y0 - BH - NECK_H - 6); c.lineTo(cx + 6, y0 - BH - NECK_H - 6); c.closePath(); c.fill(); text(c, 'T', cx, y0 - BH - NECK_H - 19, 9, col.alarm, 'center', 700); }
      if (b.melted) { c.strokeStyle = col.alarm; c.lineWidth = 2; c.setLineDash([3, 2]); rr(c, cx - BW / 2 - 2, y0 - BH - 2, BW + 4, BH + 4, 6); c.stroke(); c.setLineDash([]); }
    }

    function eyeList(P) {
      const x = P.cfg.x, out = [];
      const add = (name, ex, st) => { if (has(st)) out.push({ name, x: ex }); };
      add('PE_Infeed', x.infeed, 'infeed');
      add('PE_Fill', x.fillPE, 'filler');
      add('PE_Cap', x.cap, 'capper');
      add('PE_Reject', x.reject, 'reject');
      add('PE_Exit', x.exit, 'exit');
      add('PE_Backup', x.backup, 'backup');
      return out;
    }

    function trackRejects(P) {
      // bottles that vanish before reaching the end of the line were pushed off by the reject pusher
      const now = Object.create(null);
      for (const b of P.bottles) now[b.id] = b;
      for (const id in view.seen) {
        if (!now[id]) {
          const b = view.seen[id];
          if (b.x < P.cfg.convLen - 5) view.ghosts.push({ b, t0: P.t, x: b.x });
        }
      }
      view.seen = now;
    }

    view.draw = function (alpha) {
      const sim = view.sim;
      if (!sim) return;
      if (view.staticDirty) drawStatic();
      const k = view.scale * view.dpr;
      const c = ctx;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(stat, 0, 0);
      c.setTransform(k, 0, 0, k, 0, 0);
      const col = view.colors, P = sim.P, cfg = P.cfg, x = cfg.x;
      alpha = alpha || 0;
      trackRejects(P);

      // belt chevrons: they move exactly with the conveyor
      c.strokeStyle = col.muted; c.lineWidth = 1;
      const off = (P.counts.dist % 40) * K;
      for (let lx = X0 + off - 20; lx < px(cfg.convLen); lx += 20) {
        if (lx < X0) continue;
        c.beginPath(); c.moveTo(lx, BELT_Y + 3); c.lineTo(lx + 4, BELT_Y + BELT_H / 2); c.lineTo(lx, BELT_Y + BELT_H - 3); c.stroke();
      }

      // photo-eyes (blocked = thick solid beam + filled receiver + "ON"; clear = thin dashed + hollow)
      for (const e of eyeList(P)) {
        const ex = px(e.x), on = !!P.sens[e.name];
        c.strokeStyle = on ? col.alarm : col.muted; c.lineWidth = on ? 3 : 1;
        c.setLineDash(on ? [] : [3, 3]);
        c.beginPath(); c.moveTo(ex, 128); c.lineTo(ex, BELT_Y - 1); c.stroke(); c.setLineDash([]);
        c.fillStyle = col.surface; c.strokeStyle = on ? col.alarm : col.muted; c.lineWidth = 1.5;
        rr(c, ex - 4, 120, 8, 8, 1); c.fill(); c.stroke();
        if (on) { c.fillStyle = col.alarm; rr(c, ex - 4, 120, 8, 8, 1); c.fill(); }
        text(c, e.name.replace('PE_', 'PE ') + (on ? ' ●' : ' ○'), ex, 118 + ((e.name === 'PE_Fill' || e.name === 'PE_Backup') ? -10 : 0), 9, on ? col.alarm : col.muted, 'center', on ? 700 : 500);
      }

      // stopper rod
      if (has('stopper')) {
        const sx = px(x.stopper), y = 100 + P.stopper.pos * 88;
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, sx - 5, 88, 10, 22, 2); c.fill(); c.stroke();
        c.fillStyle = col.ink; c.fillRect(sx - 2, 108, 4, Math.max(0, y - 108)); c.fillRect(sx - 6, y - 2, 12, 5);
        text(c, P.stopper.pos >= 0.97 ? 'EXT' : P.stopper.pos <= 0.03 ? 'RET' : '…', sx, 84, 9, col.muted);
      }

      // nozzle stream
      const valveOn = P.outs.Fill_Valve && !P.relayOpen || (P.cfg.fillMode === 'piston' && P.outs.Fill_Valve && !P.relayOpen);
      if (has('filler') && valveOn) {
        const fx = px(x.nozzle);
        c.strokeStyle = '#C98B2B'; c.lineWidth = 3; c.beginPath(); c.moveTo(fx, 126); c.lineTo(fx, BELT_Y - 20); c.stroke();
      }
      // piston pump
      if (has('pump')) {
        const fx = px(x.nozzle) - 70;
        c.strokeStyle = col.ink; c.lineWidth = 1.5; c.fillStyle = col.surface;
        rr(c, fx - 12, 70, 24, 56, 3); c.fill(); c.stroke();
        c.fillStyle = col.ink; c.fillRect(fx - 10, 72 + (1 - P.pump.pos) * 40, 20, 5);
        text(c, 'PUMP', fx, 64, 10, col.ink, 'center', 700);
        text(c, P.pump.pos <= 0.02 ? 'HOME' : P.pump.pos >= 0.98 ? 'FULL' : '…', fx, 138, 9, col.muted);
      }
      // reject pusher arm
      if (has('reject')) {
        const rx = px(x.reject), y = 60 + P.pusher.pos * 100;
        c.fillStyle = col.ink; c.fillRect(rx - 3, 60, 6, Math.max(0, y - 60)); c.fillRect(rx - 14, y, 28, 5);
      }
      // capper / sealer / labeler activity flags
      if (has('capper') && P.capper.timer >= 0) { c.fillStyle = col.power; c.fillRect(px(x.cap) - 4, 104, 8, 6 + Math.sin(P.capper.timer / 300 * Math.PI) * 18); }
      if (has('sealer') && P.outs.Sealer_Enable && !P.relayOpen) { c.strokeStyle = col.alarm; c.lineWidth = 2; c.beginPath(); c.arc(px(x.seal), 92, 10, 0, 6.3); c.stroke(); text(c, 'ON', px(x.seal), 120, 9, col.alarm, 'center', 700); }
      if (has('labeler') && P.outs.Labeler_Trig && !P.relayOpen) text(c, 'LABEL', px(x.label), 120, 9, col.power, 'center', 700);

      // tank level
      if (has('tank')) {
        const lh = Math.max(0, Math.min(1, P.tank.pct / 100)) * 52;
        c.fillStyle = '#C98B2B'; c.fillRect(15, 68 - lh, 48, lh);
        c.strokeStyle = col.alarm; c.lineWidth = 1; c.setLineDash([2, 2]);
        const y15 = 68 - 0.15 * 52, y5 = 68 - 0.05 * 52;
        c.beginPath(); c.moveTo(12, y15); c.lineTo(66, y15); c.moveTo(12, y5); c.lineTo(66, y5); c.stroke(); c.setLineDash([]);
        text(c, Math.round(P.tank.pct) + '%', 39, 46, 11, col.ink, 'center', 700);
        if (P.sens.Tank_LSL) text(c, P.sens.Tank_LSLL ? '▲ LSLL' : '▲ LSL', 39, 100, 10, col.alarm, 'center', 700);
      }

      // bottles
      for (const b of P.bottles) {
        const bx = b.x + (b.x - (b.px === undefined ? b.x : b.px)) * alpha;
        drawBottle(c, px(bx), b, alpha);
      }
      // rejected bottles fall off the line
      for (let i = view.ghosts.length - 1; i >= 0; i--) {
        const g = view.ghosts[i], age = P.t - g.t0;
        if (age > 700) { view.ghosts.splice(i, 1); continue; }
        c.save(); c.globalAlpha = 1 - age / 700; c.translate(0, age * 0.12);
        drawBottle(c, px(g.x), g.b, 0); c.restore();
      }

      // stack light + lamps
      const sx = W - 40;
      const lamp = (yy, on, letter, color) => {
        c.fillStyle = on ? color : col.surface; c.strokeStyle = color; c.lineWidth = 2;
        c.beginPath(); c.arc(sx, yy, 10, 0, 6.3); c.fill(); c.stroke();
        text(c, letter, sx, yy + 3.5, 11, on ? col.surface : color, 'center', 700);
      };
      lamp(26, P.outs.Stack_Red, 'R', col.alarm); lamp(52, P.outs.Stack_Amber, 'A', col.amber); lamp(78, P.outs.Stack_Green, 'G', col.ok);
      const lx = W - 92;
      if (P.outs.Alarm_Lamp) { c.fillStyle = col.alarm; c.beginPath(); c.moveTo(lx, 16); c.lineTo(lx - 10, 34); c.lineTo(lx + 10, 34); c.closePath(); c.fill(); text(c, '!', lx, 32, 12, col.surface, 'center', 700); }
      if (P.outs.Horn) text(c, 'HORN', lx, 52, 10, col.alarm, 'center', 700);
      if (P.outs.Batch_Lamp) text(c, 'BATCH ✓', lx, 70, 10, col.ok, 'center', 700);
      if (P.outs.CIP_Done) text(c, 'CIP ✓', lx, 84, 10, col.ok, 'center', 700);

      // hardwired safety relay lamp
      if (P.relayOpen) {
        c.fillStyle = col.alarm; rr(c, W / 2 - 150, 6, 300, 22, 4); c.fill();
        text(c, '⚠ SAFETY RELAY OPEN — power cut (hardwired)', W / 2, 21, 12, col.surface, 'center', 700);
      } else {
        text(c, 'safety relay: closed', 96, 272, 10, col.muted, 'left');
      }
      // line label
      text(c, 't = ' + (sim.t / 1000).toFixed(2) + ' s', W - 10, 272, 10, col.muted, 'right');
      // replay overlay: ghost marker at the failure point
      if (sim.replayInfo) {
        const ri = sim.replayInfo, past = sim.t >= ri.tFail;
        c.fillStyle = col.surface; c.globalAlpha = .88; rr(c, 8, 106, 300, 24, 4); c.fill(); c.globalAlpha = 1;
        c.strokeStyle = past ? col.alarm : col.power; c.lineWidth = 2; rr(c, 8, 106, 300, 24, 4); c.stroke();
        text(c, (past ? '✖ FAILURE POINT PASSED' : '▶ REPLAY') + '  t=' + (sim.t / 1000).toFixed(2) + 's  (fail @ ' + (ri.tFail / 1000).toFixed(2) + 's)', 16, 122, 11, past ? col.alarm : col.power, 'left', 700);
      }
    };

    view.refreshTheme();
    view.resize();
    if (globalThis.ResizeObserver) new ResizeObserver(() => view.resize()).observe(canvas);
    return view;
  }

  SC.ui.PlantView = PlantView;
})();

</script>
<script>
/* ==== src/ui/palette.js ==== */
/* Palette popover, parameter dialogs and tag helpers for the ladder editor. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const A = SC.addr;

  // ---------------------------------------------------------------- modal
  function modal(title, body, buttons, opts) {
    opts = opts || {};
    const back = h('div', { class: 'modal-back' });
    const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
    const opener = document.activeElement;
    const app = document.getElementById('app');
    if (app) app.inert = true; // nothing behind the dialog can be reached
    const close = (v) => {
      back.remove(); document.removeEventListener('keydown', onKey, true);
      if (app) app.inert = false;
      if (opener && opener.isConnected && opener.focus) opener.focus();
      if (opts.onClose) opts.onClose(v);
    };
    function onKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); close(null); return; }
      if (e.key === 'Tab') { // keep focus inside the dialog
        const f = Array.from(box.querySelectorAll('input,select,textarea,button')).filter((x) => !x.disabled && !x.hidden && x.offsetParent !== null);
        if (f.length) { const i = f.indexOf(document.activeElement); const n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1); e.preventDefault(); f[n].focus(); }
        return;
      }
      if (e.key === 'Enter' && box.contains(e.target) && opts.enterSubmits !== false && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); if (opts.onEnter) opts.onEnter(); }
    }
    box.append(h('h3', { class: 'modal-t' }, title), body, h('div', { class: 'modal-btns' }, buttons(close)));
    back.append(box);
    back.addEventListener('pointerdown', (e) => { if (e.target === back) close(null); });
    document.addEventListener('keydown', onKey, true);
    document.body.append(back);
    const first = box.querySelector('input,select,button.primary');
    if (first) setTimeout(() => first.focus(), 0);
    return { close, box };
  }
  U.modal = modal;

  // ---------------------------------------------------------------- tags
  function allTags(ctx) { return ctx.tags(); }
  function tagKind(t) { const a = A.parseAddr(t.addr); return a ? a.kind : null; }

  // Resolve text typed into a tag field. kind: 'bit' | 'bitw' | 'edge' | 'int' | 'intw' | 'intval'
  // returns {ok, value, created?, error?}
  function resolveTag(text, kind, ctx) {
    text = String(text === undefined ? '' : text).trim();
    if (!text) return { ok: false, error: { en: 'Required', ar: 'مطلوب' } };
    const want = kind === 'bit' || kind === 'bitw' || kind === 'edge' ? 'bit' : 'word';
    const write = kind === 'bitw' || kind === 'edge' || kind === 'intw';
    if (kind === 'intval' && /^-?\d+$/.test(text)) return { ok: true, value: text };
    if (kind === 'intval' && /^T#/i.test(text)) return A.parseTime(text) !== null ? { ok: true, value: text } : { ok: false, error: { en: 'Not a valid time literal', ar: 'قيمة وقت غير صالحة' } };
    const tags = allTags(ctx);
    const tm = A.makeTagMap(tags);
    let a = null, tag = tm.byName[text];
    if (tag) a = A.parseAddr(tag.addr);
    else a = A.parseAddr(text);
    if (a) {
      if (a.kind !== want) return { ok: false, error: want === 'bit' ? { en: 'This is not a bit (Bool) tag', ar: 'هاد مش tag من نوع Bool' } : { en: 'This is not an Int (word) tag', ar: 'هاد مش tag من نوع Int' } };
      if (write && (a.arr === 'I' || a.arr === 'IW')) return { ok: false, error: { en: 'Inputs cannot be written', ar: 'ما بصير نكتب على مدخل' } };
      if (kind === 'edge' && a.arr !== 'M') return { ok: false, error: { en: 'Edge memory must be an M bit', ar: 'ذاكرة الـ edge لازم تكون بت M' } };
      return { ok: true, value: text };
    }
    const m = /^([A-Za-z_]\w*)\.(Q|QU|QD|ET|CV|PT)$/.exec(text);
    if (m && ctx.insts().indexOf(m[1]) >= 0) {
      if (write) return { ok: false, error: { en: 'Block outputs cannot be written', ar: 'مخارج البلوكات ما بتنكتب' } };
      if (want === 'bit' && /^Q/.test(m[2])) return { ok: true, value: text };
      if (want === 'word' && !/^Q/.test(m[2])) return { ok: true, value: text };
      return { ok: false, error: { en: 'Wrong type for this field', ar: 'نوع غير مناسب لهالحقل' } };
    }
    if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(text)) {
      if (A.parseAddr(text)) return { ok: false, error: { en: 'Bad name', ar: 'اسم غير صالح' } };
      if (SC.ioByName[text]) return { ok: false, error: { en: 'This name belongs to a machine I/O point that this level does not use. Pick another name.', ar: 'هالاسم تبع نقطة I/O بالماكينة وهالمستوى ما بيستخدمها. اختار اسم ثاني.' } };
      const addr = A.nextFreeAddr(tags.concat((ctx.usedAddrs ? ctx.usedAddrs() : []).map((a) => ({ addr: a }))), want);
      if (!addr) return { ok: false, error: { en: 'No free memory addresses left', ar: 'ما ضل عناوين ذاكرة فاضية' } };
      return { ok: true, value: text, created: { name: text, addr, type: want === 'bit' ? 'Bool' : 'Int', user: true, src: 'mem', desc: { en: '', ar: '' } } };
    }
    return { ok: false, error: { en: 'Use letters, digits and _ (start with a letter)', ar: 'استخدم حروف وأرقام و _ (وابدأ بحرف)' } };
  }

  function describeTag(text, ctx) {
    const t = A.makeTagMap(allTags(ctx)).byName[String(text).trim()];
    if (!t) return null;
    const d = t.desc || {};
    return { name: t.name, addr: U.useCodesys ? A.toCodesys(t.addr) : t.addr, type: t.type, en: d.en || '', ar: d.ar || '', wiring: t.wiring };
  }

  // ---------------------------------------------------------------- field definitions
  const LAB = {
    a: { en: 'Tag', ar: 'الـ {{Tag}}' }, inst: { en: 'Instance name', ar: 'اسم الـ {{instance}}' },
    pt: { en: 'PT (preset time)', ar: 'PT (الوقت المحدد)' }, pv: { en: 'PV (preset value)', ar: 'PV (القيمة المحددة)' },
    rs: { en: 'R (reset) — optional', ar: 'R (تصفير) — اختياري' }, ld: { en: 'LD (load) — optional', ar: 'LD (تحميل) — اختياري' },
    cd: { en: 'CD (count down) — optional', ar: 'CD (عدّ تنازلي) — اختياري' },
    op: { en: 'Operator', ar: 'العملية' }, a1: { en: 'IN1', ar: 'IN1' }, b1: { en: 'IN2', ar: 'IN2' },
    inp: { en: 'IN', ar: 'IN' }, out: { en: 'OUT', ar: 'OUT' }, w: { en: 'Word (Int tag)', ar: 'الـ {{Word}} (Int tag)' }, bit: { en: 'Bit shifted in', ar: 'البت الداخل' },
    edge: { en: 'Edge memory (own M bit)', ar: 'ذاكرة الـ {{edge}} (بت M خاص)' },
  };

  function fieldsFor(t) {
    switch (t) {
      case 'NO': case 'NC': return [{ k: 'a', kind: 'bit', lab: LAB.a }];
      case 'OUT': case 'SET': case 'RST': return [{ k: 'a', kind: 'bitw', lab: LAB.a }];
      case 'POS': case 'NEG': return [{ k: 'a', kind: 'edge', lab: LAB.edge }];
      case 'TON': case 'TOF': case 'TP': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pt', kind: 'time', lab: LAB.pt }];
      case 'TONR': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pt', kind: 'time', lab: LAB.pt }, { k: 'rs', kind: 'bit?', lab: LAB.rs }];
      case 'CTU': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pv', kind: 'intval', lab: LAB.pv }, { k: 'rs', kind: 'bit?', lab: LAB.rs }];
      case 'CTD': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pv', kind: 'intval', lab: LAB.pv }, { k: 'ld', kind: 'bit?', lab: LAB.ld }];
      case 'CTUD': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pv', kind: 'intval', lab: LAB.pv }, { k: 'cd', kind: 'bit?', lab: LAB.cd }, { k: 'rs', kind: 'bit?', lab: LAB.rs }, { k: 'ld', kind: 'bit?', lab: LAB.ld }];
      case 'CMP': return [{ k: 'a', kind: 'intval', lab: LAB.a1 }, { k: 'op', kind: 'op', lab: LAB.op }, { k: 'b', kind: 'intval', lab: LAB.b1 }];
      case 'MOVE': return [{ k: 'a', kind: 'intval', lab: LAB.inp }, { k: 'o', kind: 'intw', lab: LAB.out }];
      case 'ADD': case 'SUB': return [{ k: 'a', kind: 'intval', lab: LAB.a1 }, { k: 'b', kind: 'intval', lab: LAB.b1 }, { k: 'o', kind: 'intw', lab: LAB.out }];
      case 'SHL': case 'SHR': return [{ k: 'w', kind: 'intw', lab: LAB.w }, { k: 'b', kind: 'bit', lab: LAB.bit }];
    }
    return [];
  }

  function suggestInst(t, ctx) {
    const used = ctx.insts();
    for (let n = 1; n < 99; n++) { const nm = `DB_${t}_${n}`; if (used.indexOf(nm) < 0) return nm; }
    return `DB_${t}`;
  }
  function suggestEdge(ctx) {
    const names = allTags(ctx).map((x) => x.name);
    for (let n = 1; n < 99; n++) if (names.indexOf('Edge_' + n) < 0) return 'Edge_' + n;
    return 'Edge';
  }

  // normalise a time typed by the player; returns {value} or {ask:true} / {error}
  function normTime(txt) {
    txt = String(txt).trim();
    if (/^T#/i.test(txt)) return A.parseTime(txt) !== null ? { value: 'T#' + txt.slice(2).toLowerCase() } : { error: { en: 'Not a valid time. Example: T#3s or T#500ms', ar: 'وقت غير صالح. مثال: T#3s أو T#500ms' } };
    if (/^\d+(\.\d+)?\s*(ms|s|m|h)$/i.test(txt)) return { value: 'T#' + txt.replace(/\s+/g, '').toLowerCase(), fixed: true };
    if (/^\d+(\.\d+)?$/.test(txt)) return { ask: txt };
    return { error: { en: 'Not a valid time. Example: T#3s or T#500ms', ar: 'وقت غير صالح. مثال: T#3s أو T#500ms' } };
  }

  // ---------------------------------------------------------------- parameter dialog
  // existing: element object or null.  done(el, createdTags[]) is called on OK.
  function openParams(ctx, type, existing, done) {
    const meta = U.ELMAP[type];
    const fields = fieldsFor(type);
    const inputs = {}, errs = {}, hints = {};
    const lang = U.lang;
    const dlBit = 'dl-bit', dlInt = 'dl-int';
    document.querySelectorAll('#' + dlBit + ',#' + dlInt).forEach((n) => n.remove());
    const tags = allTags(ctx);
    const insts = ctx.instDefs();
    const dl1 = h('datalist', { id: dlBit }), dl2 = h('datalist', { id: dlInt });
    for (const t of tags) {
      const k = tagKind(t);
      (k === 'bit' ? dl1 : dl2).append(h('option', { value: t.name }, t.addr));
    }
    for (const nm in insts) { dl1.append(h('option', { value: nm + '.Q' })); dl2.append(h('option', { value: nm + '.ET' }), h('option', { value: nm + '.CV' })); }
    const body = h('div', { class: 'form' }, dl1, dl2,
      h('p', { class: 'muted small' }, lang === 'ar' ? U.arEl(meta.tip.ar) : U.enEl(meta.tip.en)));
    fields.forEach((f) => {
      let inp;
      const init = existing && existing[f.k] !== undefined ? String(existing[f.k]) : '';
      if (f.kind === 'op') {
        inp = h('select', { id: 'f-' + f.k }, ['>=', '>', '==', '<>', '<', '<='].map((o) => h('option', { value: o, selected: (existing ? existing.op : '>=') === o }, o)));
      } else {
        let val = init;
        if (!existing) {
          if (f.kind === 'inst') val = suggestInst(type, ctx);
          else if (f.kind === 'edge') val = suggestEdge(ctx);
          else if (f.kind === 'time') val = 'T#3s';
          else if (f.k === 'pv') val = '5';
        }
        inp = h('input', { id: 'f-' + f.k, type: 'text', value: val, autocomplete: 'off', spellcheck: 'false', list: f.kind === 'bit' || f.kind === 'bitw' || f.kind === 'bit?' || f.kind === 'edge' ? dlBit : (f.kind === 'intval' || f.kind === 'intw') ? dlInt : null, placeholder: f.kind === 'time' ? 'T#3s' : '' });
      }
      inputs[f.k] = inp;
      errs[f.k] = h('div', { class: 'err small', role: 'alert' });
      hints[f.k] = h('div', { class: 'muted small' });
      const upd = () => {
        if (f.kind === 'op' || f.kind === 'inst' || f.kind === 'time') return;
        const d = describeTag(inp.value, ctx);
        hints[f.k].textContent = d ? `${d.addr} · ${d.type}${d.wiring ? ' · wired ' + d.wiring : ''}${d.en ? ' — ' + d.en : ''}` : '';
      };
      inp.addEventListener('input', upd); upd();
      const row = h('label', { class: 'frow', for: 'f-' + f.k },
        h('span', { class: 'flab' }, lang === 'ar' ? U.arEl(f.lab.ar) : U.enEl(f.lab.en)), inp, hints[f.k], errs[f.k]);
      if (f.kind === 'time') {
        const chips = h('div', { class: 'chips' }, ['T#500ms', 'T#1s', 'T#2s', 'T#3s', 'T#5s', 'T#10s'].map((c) => h('button', { type: 'button', class: 'chip', onclick: () => { inp.value = c; } }, c)));
        row.append(chips);
      }
      body.append(row);
    });
    const askBox = h('div', { class: 'ask', hidden: true });
    body.append(askBox);

    let dlg;
    function submit() {
      Object.values(errs).forEach((e) => { e.textContent = ''; });
      const el = { t: type };
      const created = [];
      let bad = false;
      const setErr = (k, e) => { errs[k].textContent = lang === 'ar' ? e.ar : e.en; bad = true; };
      // work on a ctx that remembers tags created while resolving
      const tmp = { tags: () => ctx.tags().concat(created), insts: ctx.insts };
      for (const f of fields) {
        const raw = inputs[f.k].value;
        if (f.kind === 'op') { el.op = raw; continue; }
        if (f.kind === 'inst') {
          const nm = raw.trim();
          if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(nm)) { setErr(f.k, { en: 'Use letters, digits and _', ar: 'استخدم حروف وأرقام و _' }); continue; }
          const def = insts[nm];
          if (def && def.type !== type && !(existing && existing.i === nm)) { setErr(f.k, { en: `${nm} is already a ${def.type}`, ar: `${nm} مستخدم كـ ${def.type}` }); continue; }
          el.i = nm; continue;
        }
        if (f.kind === 'time') {
          const r = normTime(raw);
          if (r.error) { setErr(f.k, r.error); continue; }
          if (r.ask) {
            askBox.hidden = false; askBox.innerHTML = '';
            askBox.append(h('p', null, lang === 'ar' ? U.arEl(`"${r.ask}" — ثواني ولا ميلي ثانية؟`) : U.enEl(`"${r.ask}" — seconds or milliseconds?`)),
              h('button', { type: 'button', class: 'btn', onclick: () => { inputs[f.k].value = `T#${r.ask}s`; askBox.hidden = true; } }, `T#${r.ask}s`),
              h('button', { type: 'button', class: 'btn', onclick: () => { inputs[f.k].value = `T#${r.ask}ms`; askBox.hidden = true; } }, `T#${r.ask}ms`));
            bad = true; continue;
          }
          el.pt = r.value;
          if (r.fixed) inputs[f.k].value = r.value;
          continue;
        }
        if (f.kind === 'bit?') {
          if (!raw.trim()) continue;
          const r = resolveTag(raw, 'bit', tmp);
          if (!r.ok) { setErr(f.k, r.error); continue; }
          if (r.created) created.push(r.created);
          el[f.k] = r.value; continue;
        }
        const r = resolveTag(raw, f.kind === 'intval' ? 'intval' : f.kind, tmp);
        if (!r.ok && f.kind === 'intval') {
          const r2 = resolveTag(raw, 'int', tmp);
          if (!r2.ok) { setErr(f.k, r2.error); continue; }
          if (r2.created) created.push(r2.created);
          el[f.k] = r2.value; continue;
        }
        if (!r.ok) { setErr(f.k, r.error); continue; }
        if (r.created) created.push(r.created);
        el[f.k] = f.kind === 'intval' && /^-?\d+$/.test(r.value) && (f.k === 'pv' || type === 'CMP' || type === 'MOVE' || type === 'ADD' || type === 'SUB') ? parseInt(r.value, 10) : r.value;
      }
      if (bad) return;
      dlg.close('ok');
      done(el, created);
    }
    dlg = modal((existing ? (lang === 'ar' ? 'تعديل ' : 'Edit ') : '') + (lang === 'ar' ? meta.en : meta.en), body,
      (close) => [h('button', { type: 'button', class: 'btn', onclick: () => close(null) }, lang === 'ar' ? 'إلغاء' : 'Cancel'),
        h('button', { type: 'button', class: 'btn primary', onclick: submit }, 'OK')],
      { onEnter: submit });
    return dlg;
  }

  // ---------------------------------------------------------------- palette popover
  const GROUPS = [
    { id: 'contacts', en: 'Contacts', ar: 'ملامسات' },
    { id: 'outputs', en: 'Outputs & math', ar: 'مخارج وحساب' },
    { id: 'blocks', en: 'Timers & counters', ar: 'مؤقتات وعدّادات' },
  ];

  // actions: {pick(type), edit(), del(), branch(), barLeft(), barRight(), canEdit, hasEl}
  function openPalette(anchor, ctx, info, actions) {
    closePalette();
    const lang = U.lang;
    const allowed = ctx.palette();
    const pop = h('div', { class: 'pal', role: 'dialog', 'aria-label': lang === 'ar' ? 'اختر تعليمة' : 'Choose an instruction' });
    const done = (fn) => (e) => { closePalette(); fn(e); };
    pop.append(h('div', { class: 'pal-head' }, h('span', { class: 'small muted' }, `Rung ${info.ri + 1} · row ${info.r + 1} · col ${info.c + 1}`),
      h('button', { class: 'btn small ghost', type: 'button', 'aria-label': 'Close', onclick: () => closePalette(true) }, '✕')));
    if (info.hasEl) {
      pop.append(h('div', { class: 'pal-actions' },
        h('button', { class: 'btn small', type: 'button', onclick: done(actions.edit) }, '✎ ' + (lang === 'ar' ? 'تعديل' : 'Edit')),
        h('button', { class: 'btn small', type: 'button', onclick: done(actions.del) }, '🗑 ' + (lang === 'ar' ? 'حذف' : 'Delete'))));
    }
    for (const g of GROUPS) {
      const items = U.EL.filter((e) => e.group === g.id && (!allowed || allowed.indexOf(e.t) >= 0));
      if (!items.length) continue;
      pop.append(h('h5', null, lang === 'ar' ? g.ar : g.en),
        h('div', { class: 'pal-grid' }, items.map((e) => h('button', { type: 'button', class: 'pal-btn', title: (lang === 'ar' ? e.tip.ar.replace(/\{\{|\}\}/g, '') : e.tip.en) + (e.key ? ` [${e.key.toUpperCase()}]` : ''), 'aria-label': e.en,
          html: U.iconSvg(e.t) + `<span>${U.esc(e.t)}${e.key ? ` <kbd>${U.esc(e.key.toUpperCase())}</kbd>` : ''}</span>`, onclick: done(() => actions.pick(e.t)) }))));
    }
    if (!allowed || allowed.indexOf('BRANCH') >= 0) {
      pop.append(h('h5', null, lang === 'ar' ? 'فروع متوازية' : 'Parallel branch'),
        h('div', { class: 'pal-actions' },
          h('button', { class: 'btn small', type: 'button', title: 'Open a branch below this cell (OR)', onclick: done(actions.branch) }, '⎇ ' + (lang === 'ar' ? 'فرع حول الخلية' : 'Branch around cell')),
          h('button', { class: 'btn small', type: 'button', onclick: done(actions.barLeft) }, '┃← ' + (lang === 'ar' ? 'خط عمودي يسار' : 'Bar left')),
          h('button', { class: 'btn small', type: 'button', onclick: done(actions.barRight) }, '→┃ ' + (lang === 'ar' ? 'خط عمودي يمين' : 'Bar right'))));
    }
    document.body.append(pop);
    // position
    const r = anchor.getBoundingClientRect();
    const narrow = window.innerWidth < 700;
    if (narrow) { pop.classList.add('sheet'); }
    else {
      const w = pop.offsetWidth, hh = pop.offsetHeight;
      let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
      let top = r.bottom + 6;
      if (top + hh > window.innerHeight - 8) top = Math.max(8, r.top - hh - 6);
      pop.style.left = left + window.scrollX + 'px'; pop.style.top = top + window.scrollY + 'px';
    }
    U._pal = { pop, anchor, onClose: info.onClose };
    const first = pop.querySelector('.pal-btn');
    if (first) first.focus();
    setTimeout(() => { document.addEventListener('pointerdown', outside, true); document.addEventListener('keydown', escKey, true); }, 0);
    function outside(e) { if (!pop.contains(e.target)) closePalette(true); }
    function escKey(e) { if (e.key === 'Escape') { e.stopPropagation(); closePalette(true); } }
    pop._cleanup = () => { document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', escKey, true); };
  }

  function closePalette(refocus) {
    const p = U._pal;
    if (!p) return;
    p.pop._cleanup && p.pop._cleanup();
    p.pop.remove();
    U._pal = null;
    if (refocus && p.anchor && p.anchor.focus) p.anchor.focus();
  }

  U.openPalette = openPalette;
  U.closePalette = closePalette;
  U.openParams = openParams;
  U.resolveTag = resolveTag;
  U.normTime = normTime;
  U.describeTag = describeTag;
})();

</script>
<script>
/* ==== src/ui/grid.js ==== */
/* Ladder editor: grid of focusable cells, parallel branches, undo/redo, power-flow display in run mode.
 *
 * Program JSON (see core/dsl.js):  rung = {rows, cols, els:[{r,c,t,...}], vb:[[boundary,gap],...], note}
 * A vertical bar [b, g] sits on column boundary b between rows g and g+1.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const W = 84, H = 68, RAIL = 12, MAXR = 4, MINC = 8, MAXC = 16;

  const tr = (en, ar) => (U.lang === 'ar' ? ar : en);

  U.toast = U.toast || function (msg) {
    let t = document.getElementById('toast');
    if (!t) { t = h('div', { id: 'toast', class: 'toast', role: 'status', 'aria-live': 'polite' }); document.body.append(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(U._toastT); U._toastT = setTimeout(() => t.classList.remove('show'), 2600);
  };

  function normRung(rg) {
    if (!Array.isArray(rg.els)) rg.els = [];
    if (!Array.isArray(rg.vb)) rg.vb = [];
    let maxR = 0, maxC = 0;
    for (const e of rg.els) { maxR = Math.max(maxR, e.r); maxC = Math.max(maxC, e.c); }
    for (const b of rg.vb) maxR = Math.max(maxR, b[1] + 1);
    rg.rows = Math.max(1, Math.min(MAXR, maxR + 1));
    rg.cols = Math.max(MINC, Math.min(MAXC, maxC + 2));
    const seen = new Set();
    rg.vb = rg.vb.filter((b) => { const k = b[0] + ',' + b[1]; if (seen.has(k) || b[0] > rg.cols || b[1] > rg.rows - 2) return false; seen.add(k); return true; });
    rg.els.sort((a, b) => a.c - b.c || a.r - b.r);
    return rg;
  }
  const emptyRung = () => normRung({ rows: 1, cols: MINC, els: [], vb: [] });
  const findEl = (rg, r, c) => rg.els.find((e) => e.r === r && e.c === c) || null;

  function Ladder(container, host) {
    const ed = { program: SC.util.clone(host.program), userTags: SC.util.clone(host.userTags || []), undo: [], redo: [], sel: { ri: 0, r: 0, c: 0 }, refs: [], drag: null, lastPaint: [] };
    if (!ed.program.rungs.length) ed.program.rungs.push(emptyRung());
    ed.program.rungs.forEach(normRung);

    // ------------------------------------------------------------ context for dialogs
    const ctx = {
      tags: () => host.baseTags().concat(ed.userTags),
      instDefs: () => {
        const o = {};
        ed.program.rungs.forEach((rg) => rg.els.forEach((e) => { if (e.i && !o[e.i]) o[e.i] = { type: e.t }; }));
        return o;
      },
      insts: () => Object.keys(ctx.instDefs()),
      usedAddrs: () => { const out = []; ed.program.rungs.forEach((rg) => rg.els.forEach((e) => ['a', 'b', 'o', 'w', 'rs', 'ld', 'cd'].forEach((k) => { if (typeof e[k] === 'string' && SC.addr.parseAddr(e[k])) out.push(e[k]); }))); return out; },
      palette: () => host.palette(),
    };
    ed.ctx = ctx;
    const addrOf = (name) => {
      const t = ctx.tags().find((x) => x.name === name);
      const a = t ? t.addr : name;
      return U.useCodesys ? SC.addr.toCodesys(a) : a;
    };

    // ------------------------------------------------------------ history
    const snap = () => JSON.stringify({ p: ed.program, u: ed.userTags });
    function commit(prevSnap) {
      ed.undo.push(prevSnap);
      if (ed.undo.length > 100) ed.undo.shift();
      ed.redo = [];
      ed.program.rungs.forEach(normRung);
      afterChange();
    }
    function restore(s) {
      const o = JSON.parse(s);
      ed.program = o.p; ed.userTags = o.u;
      ed.sel.ri = Math.min(ed.sel.ri, ed.program.rungs.length - 1);
      afterChange();
    }
    ed.doUndo = () => { if (!ed.undo.length) return; ed.redo.push(snap()); restore(ed.undo.pop()); };
    ed.doRedo = () => { if (!ed.redo.length) return; ed.undo.push(snap()); restore(ed.redo.pop()); };
    function afterChange() {
      render();
      host.setProgram(ed.program, ed.userTags);
      if (!ed.skipFocus) focusSel();
      ed.skipFocus = false;
    }
    ed.setProgram = (p, u) => {
      ed.program = SC.util.clone(p); ed.userTags = SC.util.clone(u || ed.userTags);
      if (!ed.program.rungs.length) ed.program.rungs.push(emptyRung());
      ed.program.rungs.forEach(normRung);
      ed.undo = []; ed.redo = [];
      render();
    };

    // ------------------------------------------------------------ mutations
    function mutate(fn) {
      const before = snap();
      const ok = fn();
      if (ok === false) return;
      commit(before);
    }
    function place(ri, r, c, el, created) {
      mutate(() => {
        const rg = ed.program.rungs[ri];
        rg.els = rg.els.filter((e) => !(e.r === r && e.c === c));
        rg.els.push(Object.assign({ r, c }, el));
        for (const t of created || []) if (!ed.userTags.some((u) => u.name === t.name)) ed.userTags.push(t);
      });
    }
    function removeEl(ri, r, c) {
      mutate(() => {
        const rg = ed.program.rungs[ri];
        const n = rg.els.length;
        rg.els = rg.els.filter((e) => !(e.r === r && e.c === c));
        if (rg.els.length === n) return false;
      });
    }
    function toggleBar(ri, b, g) {
      const pal = host.palette();
      if (pal && pal.indexOf('BRANCH') < 0) { U.toast(tr('Parallel branches are not unlocked in this level yet.', 'الفروع المتوازية غير مفتوحة بهالمستوى بعد.')); return; }
      mutate(() => {
        const rg = ed.program.rungs[ri];
        if (g + 1 >= MAXR) { U.toast(tr('A rung can have at most 4 rows.', 'الـ rung فيه 4 صفوف كحد أقصى.')); return false; }
        const i = rg.vb.findIndex((x) => x[0] === b && x[1] === g);
        if (i >= 0) rg.vb.splice(i, 1); else rg.vb.push([b, g]);
      });
    }
    function makeBranch(ri, r, c) {
      const pal = host.palette();
      if (pal && pal.indexOf('BRANCH') < 0) { U.toast(tr('Parallel branches are not unlocked in this level yet.', 'الفروع المتوازية غير مفتوحة بهالمستوى بعد.')); return; }
      mutate(() => {
        const rg = ed.program.rungs[ri];
        if (r + 1 >= MAXR) { U.toast(tr('A rung can have at most 4 rows.', 'الـ rung فيه 4 صفوف كحد أقصى.')); return false; }
        for (const bc of [c, c + 1]) if (!rg.vb.some((x) => x[0] === bc && x[1] === r)) rg.vb.push([bc, r]);
        ed.sel = { ri, r: r + 1, c };
      });
    }
    function moveEl(ri, from, to) {
      mutate(() => {
        const rg = ed.program.rungs[ri];
        const e = findEl(rg, from.r, from.c);
        if (!e || findEl(rg, to.r, to.c) || to.r >= MAXR) return false;
        e.r = to.r; e.c = to.c;
        ed.sel = { ri, r: to.r, c: to.c };
      });
    }
    function addRung(at) {
      mutate(() => { ed.program.rungs.splice(at, 0, emptyRung()); ed.sel = { ri: at, r: 0, c: 0 }; });
    }
    function delRung(ri) {
      if (ed.program.rungs.length <= 1) {
        if (!ed.program.rungs[0].els.length && !ed.program.rungs[0].vb.length) return;
        mutate(() => { ed.program.rungs[0] = emptyRung(); });
        return;
      }
      mutate(() => { ed.program.rungs.splice(ri, 1); ed.sel = { ri: Math.max(0, ri - 1), r: 0, c: 0 }; });
    }
    function moveRung(ri, d) {
      const j = ri + d;
      if (j < 0 || j >= ed.program.rungs.length) return;
      mutate(() => { const a = ed.program.rungs; [a[ri], a[j]] = [a[j], a[ri]]; ed.sel.ri = j; });
    }
    function setNote(ri, txt) { // no re-render: the note input keeps focus and value
      if ((ed.program.rungs[ri].note || '') === txt) return;
      const before = snap();
      ed.program.rungs[ri].note = txt;
      ed.undo.push(before); ed.redo = [];
      host.setProgram(ed.program, ed.userTags);
    }

    // ------------------------------------------------------------ dialogs / palette
    function openFor(ri, r, c, anchor) {
      const rg = ed.program.rungs[ri];
      const el = findEl(rg, r, c);
      const acts = {
        pick: (t) => U.openParams(ctx, t, null, (e, created) => place(ri, r, c, e, created)),
        edit: () => U.openParams(ctx, el.t, el, (e, created) => place(ri, r, c, e, created)),
        del: () => removeEl(ri, r, c),
        branch: () => makeBranch(ri, r, c),
        barLeft: () => toggleBar(ri, c, r),
        barRight: () => toggleBar(ri, c + 1, r),
      };
      U.openPalette(anchor, ctx, { ri, r, c, hasEl: !!el }, acts);
    }
    ed.openFor = openFor;
    function quickPlace(ri, r, c, t) {
      const el = findEl(ed.program.rungs[ri], r, c);
      U.openParams(ctx, t, el && el.t === t ? el : null, (e, created) => place(ri, r, c, e, created));
    }

    // ------------------------------------------------------------ rendering
    let checkCache = null;
    function check() {
      const tags = ctx.tags();
      const compiled = SC.compile(ed.program, { tags, palette: host.palette() });
      const lint = SC.lint(ed.program, tags);
      const cellMsg = new Map();
      const addMsg = (ri, r, c, sev, msg) => {
        if (r === undefined) return;
        const k = ri + ':' + r + ':' + c;
        if (!cellMsg.has(k)) cellMsg.set(k, []);
        cellMsg.get(k).push({ sev, msg });
      };
      for (const e of compiled.errors) addMsg(e.rung, e.r, e.c, 'error', e.msg);
      for (const l of lint) addMsg(l.rung, l.r, l.c, l.sev, l.msg);
      checkCache = { compiled, lint, cellMsg };
      return checkCache;
    }
    ed.check = () => checkCache || check();

    function render() {
      const nr = ed.program.rungs.length;
      ed.sel.ri = Math.max(0, Math.min(nr - 1, ed.sel.ri));
      const rg0 = ed.program.rungs[ed.sel.ri];
      ed.sel.r = Math.max(0, Math.min(rg0.rows - 1, ed.sel.r)); ed.sel.c = Math.max(0, Math.min(rg0.cols - 1, ed.sel.c));
      const chk = check();
      const keep = container.scrollTop;
      container.innerHTML = '';
      ed.refs = [];
      const tb = h('div', { class: 'ld-tb' },
        h('button', { type: 'button', class: 'btn small', onclick: () => addRung(ed.program.rungs.length) }, '＋ ' + tr('Rung', 'Rung')),
        h('button', { type: 'button', class: 'btn small', disabled: !ed.undo.length, onclick: ed.doUndo, title: 'Ctrl+Z' }, '↶ ' + tr('Undo', 'تراجع')),
        h('button', { type: 'button', class: 'btn small', disabled: !ed.redo.length, onclick: ed.doRedo, title: 'Ctrl+Y' }, '↷ ' + tr('Redo', 'إعادة')),
        h('span', { class: 'grow' }),
        statusChip(chk),
        h('button', { type: 'button', class: 'btn small ghost', onclick: () => { U.useCodesys = !U.useCodesys; U.store.set('codesys', U.useCodesys); render(); if (U.refreshTags) U.refreshTags(); } }, U.useCodesys ? 'CODESYS %IX' : 'Siemens I0.0'));
      container.append(tb);
      const list = h('div', { class: 'ld-rungs', role: 'group', 'aria-label': tr('Ladder program', 'برنامج الـ ladder') });
      ed.program.rungs.forEach((rg, ri) => list.append(renderRung(rg, ri, chk)));
      container.append(list);
      container.append(renderIssues(chk));
      container.append(h('details', { class: 'ld-keys' }, h('summary', null, tr('Keyboard shortcuts', 'اختصارات لوحة المفاتيح')),
        h('p', { class: 'small muted' }, 'Arrows: move · Enter/F2: edit · N: NO · C: NC · O: coil · S: set · R: reset · P: edge · T: timer · U: counter · =: compare · M: move · B: branch bar · Shift+↓: toggle bar · Delete: clear · Ctrl+Z / Ctrl+Y: undo / redo · Esc: close')));
      container.scrollTop = keep;
    }

    function statusChip(chk) {
      const ne = chk.compiled.errors.length, nw = chk.lint.length;
      if (ne) return h('span', { class: 'chip-st bad', role: 'status' }, '✖ ' + ne + ' ' + tr('errors — fix them to run', 'أخطاء — صلّحها عشان يشتغل'));
      if (nw) return h('span', { class: 'chip-st warn', role: 'status' }, '⚠ ' + nw + ' ' + tr('warnings', 'تحذيرات'));
      return h('span', { class: 'chip-st ok', role: 'status' }, '✔ ' + tr('Compiled', 'تم التجميع'));
    }

    function renderIssues(chk) {
      const box = h('div', { class: 'ld-issues' });
      const row = (sev, ri, r, c, msg) => h('button', { type: 'button', class: 'iss ' + sev, onclick: () => { if (ri >= 0) { ed.sel = { ri, r: r || 0, c: c || 0 }; focusSel(); } } },
        (sev === 'error' ? '✖ ' : '⚠ '), ri >= 0 ? `Rung ${ri + 1}: ` : '', (U.lang === 'ar' ? msg.ar : msg.en));
      chk.compiled.errors.forEach((e) => box.append(row('error', e.rung, e.r, e.c, e.msg)));
      chk.lint.forEach((l) => box.append(row(l.sev === 'error' ? 'error' : 'warn', l.rung, l.r, l.c, l.msg)));
      return box;
    }

    function renderRung(rg, ri, chk) {
      const wire = SC.compile.buildWire(rg.rows, rg.cols, new Set(rg.vb.map((b) => b[0] + ',' + b[1]))).wire;
      const refs = { cells: new Map(), bars: [], el: null, rung: rg };
      ed.refs[ri] = refs;
      const stage = h('div', { class: 'rung-stage', style: { width: (RAIL * 2 + rg.cols * W) + 'px', height: (rg.rows * H) + 'px' } });
      const grid = h('div', { class: 'rung-grid', role: 'grid', 'aria-label': 'Rung ' + (ri + 1) });
      const overlay = h('div', { class: 'rung-overlay', 'aria-hidden': 'true' }, h('div', { class: 'rail left' }), h('div', { class: 'rail right' }));
      stage.append(grid, overlay);
      for (let r = 0; r < rg.rows; r++) {
        const row = h('div', { role: 'row', class: 'rowwrap' });
        for (let c = 0; c < rg.cols; c++) {
          const el = findEl(rg, r, c);
          const cell = makeCell(ri, rg, r, c, el, wire[r][c], chk);
          refs.cells.set(r + ',' + c, { el: cell, e: el, pin: -1, pout: -1 });
          row.append(cell);
        }
        grid.append(row);
      }
      // vertical bars + handles
      const barSet = new Set(rg.vb.map((b) => b[0] + ',' + b[1]));
      for (let b = 0; b <= rg.cols; b++) {
        for (let g = 0; g < Math.min(rg.rows, MAXR - 1); g++) {
          const on = barSet.has(b + ',' + g);
          if (!on && rg.rows < 2 && !(g === 0 && rg.rows === 1 && false)) continue;
          if (!on && g > rg.rows - 2) continue;
          const x = RAIL + b * W, y1 = g * H + 40, y2 = (g + 1) * H + 40;
          if (on) {
            const bar = h('div', { class: 'vbar', style: { left: (x - 2) + 'px', top: y1 + 'px', height: (y2 - y1) + 'px' } });
            overlay.append(bar);
            refs.bars.push({ el: bar, b, g, on: -1 });
          }
          overlay.append(h('button', { type: 'button', class: 'bh' + (on ? ' on' : ''), tabindex: '-1', 'aria-label': tr(on ? 'Remove vertical bar' : 'Add vertical bar', on ? 'حذف الخط العمودي' : 'إضافة خط عمودي'),
            style: { left: (x - 11) + 'px', top: ((y1 + y2) / 2 - 11) + 'px' }, onclick: () => toggleBar(ri, b, g) }, on ? '' : '+'));
        }
      }
      const head = h('div', { class: 'rung-head' },
        h('span', { class: 'rung-n' }, 'Rung ' + (ri + 1)),
        h('input', { class: 'rung-note', type: 'text', value: rg.note || '', placeholder: tr('Comment…', 'تعليق…'), 'aria-label': 'Rung ' + (ri + 1) + ' comment', onchange: (e) => setNote(ri, e.target.value) }),
        h('button', { type: 'button', class: 'btn small ghost', 'aria-label': 'Move rung up', disabled: ri === 0, onclick: () => moveRung(ri, -1) }, '↑'),
        h('button', { type: 'button', class: 'btn small ghost', 'aria-label': 'Move rung down', disabled: ri === ed.program.rungs.length - 1, onclick: () => moveRung(ri, 1) }, '↓'),
        h('button', { type: 'button', class: 'btn small ghost', 'aria-label': 'Delete rung', onclick: () => delRung(ri) }, '✕'));
      const out = h('div', { class: 'rung', dataset: { ri } }, head, h('div', { class: 'rung-scroll' }, stage));
      refs.el = out;
      return out;
    }

    function makeCell(ri, rg, r, c, el, isWire, chk) {
      const lab = el ? U.cellLabels(el, addrOf) : { top: '', bottom: '' };
      const msgs = chk.cellMsg.get(ri + ':' + r + ':' + c) || [];
      const sel = ed.sel.ri === ri && ed.sel.r === r && ed.sel.c === c;
      const name = el ? (U.ELMAP[el.t] ? U.ELMAP[el.t].en : el.t) : tr('empty', 'فاضي');
      const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`
        + (lab.top ? `<text class="c-tag" x="42" y="11" text-anchor="middle">${U.esc(lab.top.length > 12 ? lab.top.slice(0, 11) + '…' : lab.top)}</text>` : '')
        + U.symbolSvg(el, isWire)
        + (lab.bottom ? `<text class="c-addr" x="42" y="65" text-anchor="middle">${U.esc(lab.bottom)}</text>` : '')
        + (el ? '<text class="c-state" x="82" y="65" text-anchor="end"></text>' : '')
        + (msgs.length ? `<text class="c-warn ${msgs.some((m) => m.sev === 'error') ? 'err' : ''}" x="3" y="11">${msgs.some((m) => m.sev === 'error') ? '✖' : '⚠'}</text>` : '')
        + '</svg>';
      const label = `Rung ${ri + 1}, row ${r + 1}, column ${c + 1}: ${name}${el && lab.top ? ' ' + lab.top : ''}${msgs.length ? '. ' + msgs.map((m) => (U.lang === 'ar' ? m.msg.ar : m.msg.en)).join(' ') : ''}`;
      const cell = h('div', { class: 'cell' + (el ? ' filled' : '') + (sel ? ' sel' : '') + (msgs.length ? ' has-msg' : ''), role: 'gridcell', tabindex: sel ? '0' : '-1',
        'aria-label': label, title: msgs.length ? msgs.map((m) => (U.lang === 'ar' ? m.msg.ar : m.msg.en)).join('\n') : (el ? lab.top : ''),
        dataset: { ri, r, c }, style: { left: (RAIL + c * W) + 'px', top: (r * H) + 'px', width: W + 'px', height: H + 'px' }, html: svg });
      cell.addEventListener('focus', () => {
        ed.sel = { ri, r, c };
        container.querySelectorAll('.cell[tabindex="0"]').forEach((n) => { n.tabIndex = -1; });
        cell.tabIndex = 0;
      });
      cell.addEventListener('pointerdown', (e) => onPointerDown(e, ri, r, c, cell));
      cell.addEventListener('keydown', (e) => onKey(e, ri, r, c, cell));
      return cell;
    }

    function focusSel() {
      const refs = ed.refs[ed.sel.ri];
      if (!refs) return;
      const k = refs.cells.get(ed.sel.r + ',' + ed.sel.c);
      if (k) { k.el.tabIndex = 0; if (ed.focusAfter !== false) k.el.focus({ preventScroll: false }); }
    }

    // ------------------------------------------------------------ pointer: click / drag to move
    function onPointerDown(e, ri, r, c, cell) {
      if (e.button !== undefined && e.button !== 0) return;
      const rg = ed.program.rungs[ri];
      const el = findEl(rg, r, c);
      const canDrag = e.pointerType !== 'touch'; // on touch a swipe must scroll the rung, never drag an element
      const st = { ri, r, c, x: e.clientX, y: e.clientY, moved: false, el, ghost: null, target: null, id: e.pointerId };
      ed.drag = st;
      const move = (ev) => {
        if (!st.el || !canDrag) return;
        const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
        if (!st.moved && Math.hypot(dx, dy) > 8) {
          st.moved = true;
          cell.classList.add('dragging');
          try { cell.setPointerCapture(st.id); } catch (er) { /* ignore */ }
          st.ghost = h('div', { class: 'drag-ghost', html: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${U.symbolSvg(st.el, false)}</svg>` });
          document.body.append(st.ghost);
        }
        if (st.moved) {
          st.ghost.style.left = (ev.clientX - W / 2) + 'px'; st.ghost.style.top = (ev.clientY - H / 2) + 'px';
          const under = document.elementsFromPoint(ev.clientX, ev.clientY).find((n) => n.classList && n.classList.contains('cell'));
          document.querySelectorAll('.cell.drop').forEach((n) => n.classList.remove('drop'));
          st.target = under && +under.dataset.ri === ri ? { r: +under.dataset.r, c: +under.dataset.c } : null;
          if (under && st.target) under.classList.add('drop');
        }
      };
      const cancel = () => {
        document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', cancel);
        cell.classList.remove('dragging'); if (st.ghost) st.ghost.remove();
        document.querySelectorAll('.cell.drop').forEach((n) => n.classList.remove('drop'));
        ed.drag = null;
      };
      const up = () => {
        document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', cancel);
        cell.classList.remove('dragging');
        if (st.ghost) st.ghost.remove();
        document.querySelectorAll('.cell.drop').forEach((n) => n.classList.remove('drop'));
        ed.drag = null;
        if (st.moved) {
          if (st.target && (st.target.r !== r || st.target.c !== c)) moveEl(ri, { r, c }, st.target);
        } else {
          ed.sel = { ri, r, c };
          cell.focus();
          openFor(ri, r, c, cell);
        }
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', cancel);
    }

    // ------------------------------------------------------------ keyboard
    function moveFocus(ri, r, c, dr, dc) {
      const rungs = ed.program.rungs;
      let nr = r + dr, nc = c + dc, nri = ri;
      if (nc < 0) nc = 0;
      if (nc >= rungs[nri].cols) nc = rungs[nri].cols - 1;
      if (nr < 0) { if (nri > 0) { nri--; nr = rungs[nri].rows - 1; } else nr = 0; }
      else if (nr >= rungs[nri].rows) { if (nri < rungs.length - 1) { nri++; nr = 0; } else nr = rungs[nri].rows - 1; }
      nc = Math.min(nc, rungs[nri].cols - 1);
      ed.sel = { ri: nri, r: nr, c: nc };
      focusSel();
    }

    function onKey(e, ri, r, c, cell) {
      if (e.target !== cell) return;
      const k = e.key;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); e.shiftKey ? ed.doRedo() : ed.doUndo(); return; }
      if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); ed.doRedo(); return; }
      if (mod || e.altKey) return;
      if (e.shiftKey && k === 'ArrowDown') { e.preventDefault(); toggleBar(ri, c, r); return; }
      if (k === 'ArrowUp') { e.preventDefault(); moveFocus(ri, r, c, -1, 0); return; }
      if (k === 'ArrowDown') { e.preventDefault(); moveFocus(ri, r, c, 1, 0); return; }
      if (k === 'ArrowLeft') { e.preventDefault(); moveFocus(ri, r, c, 0, -1); return; }
      if (k === 'ArrowRight') { e.preventDefault(); moveFocus(ri, r, c, 0, 1); return; }
      if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); removeEl(ri, r, c); return; }
      const rg = ed.program.rungs[ri];
      const el = findEl(rg, r, c);
      if (k === 'Enter' || k === 'F2' || k === ' ') {
        e.preventDefault();
        if (el) U.openParams(ctx, el.t, el, (ne, created) => place(ri, r, c, ne, created));
        else openFor(ri, r, c, cell);
        return;
      }
      if (k === 'b' || k === 'B') { e.preventDefault(); e.shiftKey ? toggleBar(ri, c + 1, r) : makeBranch(ri, r, c); return; }
      const map = { n: 'NO', c: 'NC', o: 'OUT', s: 'SET', r: 'RST', p: 'POS', t: 'TON', u: 'CTU', '=': 'CMP', m: 'MOVE' };
      const t = map[k.toLowerCase()];
      if (t) {
        e.preventDefault();
        const allowed = host.palette();
        if (allowed && allowed.indexOf(t) < 0) { U.toast(tr(`${t} is not unlocked in this level yet.`, `${t} غير مفتوح بهالمستوى بعد.`)); return; }
        quickPlace(ri, r, c, t);
      }
    }

    // ------------------------------------------------------------ run mode: power flow
    let lastRec = null;
    ed.paint = function (sim) {
      if (!sim || !sim.compiled.ok || !sim.rec || sim.compiled.rungs.length !== ed.program.rungs.length) { if (lastRec) { clearPaint(); lastRec = null; } return; }
      lastRec = sim.rec;
      sim.rec.forEach((rec, ri) => {
        const refs = ed.refs[ri];
        if (!rec || !refs || !rec.pin || rec.pin.length !== refs.rung.cols) return; // rec from a program version that is no longer on screen
        for (const [key, k] of refs.cells) {
          const [r, c] = key.split(',').map(Number);
          const pin = rec.pin[c] ? rec.pin[c][r] : 0, pout = rec.pout[c] ? rec.pout[c][r] : 0;
          if (k.pin !== pin) { k.pin = pin; k.el.dataset.pin = pin; }
          if (k.pout !== pout) {
            k.pout = pout; k.el.dataset.pout = pout;
            const st = k.el.querySelector('.c-state');
            if (st) st.textContent = pout ? 'ON' : 'OFF';
          }
          if (k.e && k.e.i) {
            const s = sim.st.inst[k.e.i];
            const live = k.el.querySelector('.blk-live');
            if (s && live) {
              const t = /^T/.test(k.e.t) ? (s.ET / 1000).toFixed(2) + ' s' : 'CV ' + s.CV;
              if (k.live !== t) { k.live = t; live.textContent = t; }
            }
          }
        }
        for (const b of refs.bars) {
          const on = (b.b < refs.rung.cols ? ((rec.pin[b.b][b.g] || rec.pin[b.b][b.g + 1]) ? 1 : 0) : ((rec.edge[b.g] || rec.edge[b.g + 1]) ? 1 : 0));
          if (b.on !== on) { b.on = on; b.el.dataset.on = on; }
        }
      });
    };
    function clearPaint() {
      container.querySelectorAll('.cell').forEach((n) => { delete n.dataset.pin; delete n.dataset.pout; const st = n.querySelector('.c-state'); if (st) st.textContent = ''; });
      container.querySelectorAll('.vbar').forEach((n) => { delete n.dataset.on; });
      ed.refs.forEach((rf) => { if (rf) { for (const k of rf.cells.values()) { k.pin = -1; k.pout = -1; } rf.bars.forEach((b) => { b.on = -1; }); } });
    }

    // programmatic API (also used by the self-test and the tag table)
    ed.ops = { place, removeEl, toggleBar, makeBranch, moveEl, addRung, delRung, moveRung, setNote };
    const FIELDS = ['a', 'b', 'o', 'w', 'rs', 'ld', 'cd'];
    ed.renameTag = (from, to) => {
      ed.skipFocus = true;
      mutate(() => {
        const t = ed.userTags.find((x) => x.name === from);
        if (!t) return false;
        t.name = to;
        ed.program.rungs.forEach((rg) => rg.els.forEach((e) => {
          for (const k of FIELDS) if (typeof e[k] === 'string' && e[k] === from) e[k] = to;
        }));
      });
    };
    ed.usedTags = () => {
      const used = new Set();
      ed.program.rungs.forEach((rg) => rg.els.forEach((e) => FIELDS.forEach((k) => { if (typeof e[k] === 'string') used.add(e[k]); })));
      return used;
    };
    ed.deleteTag = (name) => {
      if (ed.usedTags().has(name)) return false;
      ed.skipFocus = true;
      mutate(() => { ed.userTags = ed.userTags.filter((t) => t.name !== name); });
      return true;
    };
    ed.setTagDesc = (name, en, ar) => {
      const t = ed.userTags.find((x) => x.name === name);
      if (!t) return;
      ed.skipFocus = true;
      mutate(() => { t.desc = { en, ar }; });
    };
    ed.focus = (ri, r, c) => { ed.sel = { ri, r, c }; focusSel(); };
    ed.close = () => { U.closePalette(); };
    render();
    host.setProgram(ed.program, ed.userTags, true);
    ed.focusAfter = true;
    return ed;
  }

  U.Ladder = Ladder;
  U.ladderNorm = normRung;
})();

</script>
<script>
/* ==== src/ui/tagtable.js ==== */
/* Tag table, "same program in TIA Portal / CODESYS" transfer panel. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const tr = (en, ar) => (U.lang === 'ar' ? ar : en);

  // ---- schematic device names (-S1, -B2, -Q1 ...) assigned per role in master order
  const DEV = Object.create(null);
  (function () {
    const cnt = {};
    const pre = (t) => {
      switch (t.role) {
        case 'start': case 'stop': case 'ack': case 'reset': case 'release': case 'key': case 'mode': case 'setpoint': case 'process': return '-S';
        case 'estop': return '-K'; case 'guard': return '-S';
        case 'sensor': case 'feedback': case 'encoder': case 'alarm': case 'analog': return '-B';
        case 'actuator': return /Valve|SOL|Pusher|Pump/.test(t.name) ? '-Y' : '-Q';
        case 'signal': return '-H';
      }
      return '-X';
    };
    for (const t of SC.IO) {
      const p = pre(t);
      cnt[p] = (cnt[p] || 0) + 1;
      DEV[t.name] = p + cnt[p];
    }
  })();
  U.deviceName = (name) => DEV[name] || name;

  // ---------------------------------------------------------------- tag table
  function mountTags(box) {
    const ST = U.state;
    box.innerHTML = '';
    const ed = ST.ladder;
    const base = SC.levelTags(ST.level).filter((t) => !t.user);
    const user = ed ? ed.userTags : ST.userTags;
    const used = ed ? ed.usedTags() : new Set();
    const only = (t) => /^(I|Q|M)/.test(t.addr);
    const rows = base.concat(user).filter(only);
    const head = h('thead', null, h('tr', null, ['Name', 'Address', 'Type', 'Comment (EN)', 'Comment (AR)', ''].map((x) => h('th', null, x))));
    const body = h('tbody');
    for (const t of rows) {
      const isUser = !!t.user;
      const addr = U.useCodesys ? SC.addr.toCodesys(t.addr) : t.addr;
      const tr1 = h('tr', { class: isUser ? 'user' : '' });
      if (isUser && ed) {
        const nm = h('input', { type: 'text', value: t.name, 'aria-label': 'Tag name', spellcheck: 'false', onchange: (e) => {
          const v = e.target.value.trim();
          if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(v) || SC.addr.parseAddr(v) || (SC.levelTags(ST.level).concat(ed.userTags)).some((x) => x.name === v && x !== t)) { U.toast(tr('Bad or duplicate name', 'اسم غير صالح أو مكرر')); e.target.value = t.name; return; }
          ed.renameTag(t.name, v); mountTags(box);
        } });
        const en = h('input', { type: 'text', value: (t.desc && t.desc.en) || '', 'aria-label': 'Comment EN', placeholder: '…', onchange: (e) => ed.setTagDesc(t.name, e.target.value, (t.desc && t.desc.ar) || '') });
        const ar = h('input', { type: 'text', value: (t.desc && t.desc.ar) || '', 'aria-label': 'Comment AR', placeholder: '…', dir: 'rtl', lang: 'ar', onchange: (e) => ed.setTagDesc(t.name, (t.desc && t.desc.en) || '', e.target.value) });
        const del = h('button', { type: 'button', class: 'btn small ghost', disabled: used.has(t.name), title: used.has(t.name) ? tr('In use', 'مستخدم') : tr('Delete tag', 'احذف'), onclick: () => { ed.deleteTag(t.name); mountTags(box); } }, '✕');
        tr1.append(h('th', { scope: 'row' }, nm), h('td', { class: 'mono' }, addr), h('td', null, t.type), h('td', null, en), h('td', null, ar), h('td', null, del));
      } else {
        tr1.append(h('th', { scope: 'row', class: 'mono' }, t.name, t.wiring === 'NC' ? h('small', { class: 'muted' }, ' NC') : ''), h('td', { class: 'mono' }, addr), h('td', null, t.type),
          h('td', null, (t.desc && t.desc.en) || ''), h('td', { lang: 'ar', dir: 'rtl' }, (t.desc && t.desc.ar) || ''), h('td'));
      }
      body.append(tr1);
    }
    box.append(h('div', { class: 'tbl-wrap' }, h('table', { class: 'tags' }, head, body)),
      h('p', { class: 'muted small' }, tr('New tags you type in a dialog are added here automatically as memory bits (M).', 'أي {{tag}} جديد بتكتبه بالنافذة بينضاف هون لحاله كبت ذاكرة (M).').replace(/\{\{|\}\}/g, '')));
  }
  U.mountTags = mountTags;
  U.refreshTags = () => { const b = document.getElementById('tags-mount'); if (b && U.state.level) mountTags(b); };

  // ---------------------------------------------------------------- transfer panel
  // read-only rung. opts: {labelOf(name)->text, rec:{pin,pout,edge} (power flow), addrOf(name)}
  function staticRung(rg, labelOf, opts) {
    opts = opts || {};
    const rec = opts.rec || null;
    const wire = SC.compile.buildWire(rg.rows, rg.cols, new Set(rg.vb.map((b) => b[0] + ',' + b[1]))).wire;
    const W = U.CELL_W, H = U.CELL_H, RAIL = 12;
    const grid = h('div', { class: 'rung-grid static', style: { width: (RAIL * 2 + rg.cols * W) + 'px', height: (rg.rows * H) + 'px' } }, h('div', { class: 'rail left' }), h('div', { class: 'rail right' }));
    for (let r = 0; r < rg.rows; r++) for (let c = 0; c < rg.cols; c++) {
      const el = rg.els.find((e) => e.r === r && e.c === c) || null;
      const lab = el ? U.cellLabels(el, opts.addrOf || (() => '')) : { top: '', bottom: '' };
      const top = el && lab.top ? labelOf(lab.top) : '';
      const pin = rec && rec.pin[c] ? rec.pin[c][r] : undefined, pout = rec && rec.pout[c] ? rec.pout[c][r] : undefined;
      grid.append(h('div', { class: 'cell', dataset: rec ? { pin: pin ? 1 : 0, pout: pout ? 1 : 0 } : null, style: { left: (RAIL + c * W) + 'px', top: (r * H) + 'px', width: W + 'px', height: H + 'px' },
        html: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${top ? `<text class="c-tag" x="42" y="11" text-anchor="middle">${U.esc(top)}</text>` : ''}${U.symbolSvg(el, wire[r][c])}${el && lab.bottom ? `<text class="c-addr" x="42" y="65" text-anchor="middle">${U.esc(lab.bottom)}</text>` : ''}${el && rec ? `<text class="c-state" x="82" y="65" text-anchor="end">${pout ? 'ON' : 'OFF'}</text>` : ''}</svg>` }));
    }
    for (const [b, g] of rg.vb) {
      let on;
      if (rec) on = (b < rg.cols ? (rec.pin[b][g] || rec.pin[b][g + 1]) : (rec.edge[g] || rec.edge[g + 1])) ? 1 : 0;
      grid.append(h('div', { class: 'vbar', dataset: rec ? { on } : null, style: { left: (RAIL + b * W - 2) + 'px', top: (g * H + 40) + 'px', height: H + 'px' } }));
    }
    return h('div', { class: 'rung' }, opts.title ? h('div', { class: 'rung-head' }, h('span', { class: 'rung-n' }, opts.title), opts.note ? h('span', { class: 'small muted' }, opts.note) : null) : null, h('div', { class: 'rung-scroll' }, grid));
  }
  U.staticRung = staticRung;

  function codesysDecls(program, tags) {
    const tm = SC.addr.makeTagMap(tags);
    const used = new Set(), insts = {};
    for (const rg of program.rungs) for (const e of rg.els) {
      for (const k of ['a', 'b', 'o', 'w', 'rs', 'ld', 'cd']) if (typeof e[k] === 'string' && tm.byName[e[k]]) used.add(e[k]);
      if (e.i) insts[e.i] = e.t;
    }
    const lines = ['VAR_GLOBAL'];
    for (const n of used) {
      const t = tm.byName[n];
      lines.push(`  ${n} AT ${SC.addr.toCodesys(t.addr)} : ${t.type === 'Int' ? 'INT' : 'BOOL'};`);
    }
    lines.push('END_VAR', '', 'VAR');
    for (const n in insts) lines.push(`  ${n} : ${insts[n]};`);
    lines.push('END_VAR');
    return lines.join('\n');
  }

  function mountTransfer(box) {
    const ST = U.state;
    box.innerHTML = '';
    const ed = ST.ladder;
    const program = ed ? ed.program : ST.program;
    const tags = SC.mergeTags(SC.levelTags(ST.level), ed ? ed.userTags : ST.userTags);
    let mode = U.store.get('xfer', 'tia');
    const tabs = h('div', { class: 'tabs', role: 'tablist' });
    const out = h('div', { class: 'xfer-out' });
    function draw() {
      out.innerHTML = '';
      tabs.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.m === mode)));
      if (mode === 'tia') {
        program.rungs.forEach((rg, i) => out.append(h('div', { class: 'small muted' }, 'Network ' + (i + 1) + (rg.note ? ' — ' + rg.note : '')), staticRung(rg, (n) => (DEV[n] ? DEV[n] : n))));
        out.append(h('p', { class: 'small muted' }, tr('In TIA Portal the symbols show the tag name and the device ID from the schematic (-S1 = push button, -B = sensor, -Q/-Y = actuator).', 'بـ {{TIA Portal}} الرموز بتعرض اسم الـ {{tag}} ورقم الجهاز من المخطط (‎-S1 = زر، ‎-B = حساس، ‎-Q/-Y = مشغّل).').replace(/\{\{|\}\}/g, '')));
      } else {
        out.append(h('pre', { class: 'mono code' }, codesysDecls(program, tags)),
          h('p', { class: 'small muted' }, tr('CODESYS: global variables bound to %IX/%QX/%MX addresses, and one function-block instance per timer or counter.', 'بـ {{CODESYS}}: متغيرات عامة مربوطة بعناوين %IX/%QX/%MX، و{{instance}} واحد لكل مؤقت أو عدّاد.').replace(/\{\{|\}\}/g, '')));
      }
    }
    for (const [m, label] of [['tia', 'TIA Portal'], ['codesys', 'CODESYS']]) {
      tabs.append(h('button', { type: 'button', role: 'tab', class: 'tab', dataset: { m }, onclick: () => { mode = m; U.store.set('xfer', m); draw(); } }, label));
    }
    box.append(tabs, out);
    draw();
  }
  U.mountTransfer = mountTransfer;
  U.refreshTransfer = () => { const b = document.getElementById('xfer-mount'); if (b && b.closest('details') && b.closest('details').open && U.state.level) mountTransfer(b); };
})();

</script>
<script>
/* ==== src/ui/report.js ==== */
/* Datasheet timing diagrams and the FAT failure report (timeline + active rungs + self-regulation question + replay). */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const tr = (en, ar) => (U.lang === 'ar' ? ar : en);

  // ---------------------------------------------------------------- datasheet timing diagram
  // timing: {step (ms per slot), unit, signals:[{name, wave:'0011'}]}
  U.timingSvg = function (timing) {
    const slot = 34, labelW = 104, rowH = 28, n = Math.max(...timing.signals.map((s) => s.wave.length));
    const W = labelW + n * slot + 8, H = timing.signals.length * rowH + 22;
    let s = `<svg class="timing" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Timing diagram">`;
    timing.signals.forEach((sg, i) => {
      const y0 = i * rowH + 6, hi = y0 + 4, lo = y0 + 18;
      s += `<text class="tm-l" x="2" y="${y0 + 16}">${U.esc(sg.name)}</text>`;
      let d = '';
      let prev = null;
      for (let k = 0; k < sg.wave.length; k++) {
        const v = sg.wave[k] === '1' ? 1 : 0, x = labelW + k * slot, y = v ? hi : lo;
        if (prev === null) d += `M${x} ${y}`;
        else if (v !== prev) d += `L${x} ${prev ? hi : lo}L${x} ${y}`;
        d += `L${x + slot} ${y}`;
        prev = v;
      }
      s += `<path class="tm-w" d="${d}" fill="none"/>`;
      s += `<text class="tm-v" x="${labelW - 6}" y="${hi + 7}" text-anchor="end">1</text><text class="tm-v" x="${labelW - 6}" y="${lo + 4}" text-anchor="end">0</text>`;
    });
    const ay = timing.signals.length * rowH + 14;
    for (let k = 0; k <= n; k += 2) {
      const x = labelW + k * slot;
      s += `<path class="tm-g" d="M${x} 2V${ay - 10}"/><text class="tm-v" x="${x}" y="${ay + 4}" text-anchor="middle">${(k * (timing.step || 500) / (timing.unit === 's' ? 1 : 1000)).toFixed(1)}s</text>`;
    }
    return s + '</svg>';
  };

  // ---------------------------------------------------------------- failure timeline
  const fmtVal = (v) => (v === true || v === 1 ? 'ON' : v === false || v === 0 ? 'OFF' : String(v));
  const sec = (ms) => (ms / 1000).toFixed(2) + ' s';

  function timelineSvg(sigs, t0, t1, tFail) {
    const labelW = 120, W = 640, pw = W - labelW - 10, rowH = 26, H = sigs.length * rowH + 28;
    const X = (t) => labelW + (Math.max(t0, Math.min(t1, t)) - t0) / (t1 - t0) * pw;
    let s = `<svg class="timing tl" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="I/O timeline before the failure">`;
    sigs.forEach((sg, i) => {
      const y0 = i * rowH + 4, hi = y0 + 4, lo = y0 + 18;
      s += `<text class="tm-l ${sg.key ? 'tm-key' : ''}" x="2" y="${y0 + 16}">${U.esc(sg.name)}</text>`;
      if (!sg.analog) {
        let d = '';
        sg.segs.forEach((seg, k) => {
          const x = X(seg[0]), y = seg[1] ? hi : lo;
          if (k === 0) d += `M${x} ${y}`;
          else d += `L${x} ${sg.segs[k - 1][1] ? hi : lo}L${x} ${y}`;
        });
        const last = sg.segs[sg.segs.length - 1];
        d += `L${X(t1)} ${last[1] ? hi : lo}`;
        s += `<path class="tm-w" d="${d}" fill="none"/>`;
      } else {
        sg.segs.forEach((seg, k) => { const x = X(seg[0]); s += `<text class="tm-v" x="${x + 2}" y="${y0 + 14}">${seg[1]}</text>`; });
      }
      if (sg.expect !== undefined && !sg.analog) {
        const y = (sg.expect === true || sg.expect === 1) ? hi : lo;
        s += `<circle class="tm-exp" cx="${X(tFail)}" cy="${y}" r="5" fill="none"/>`;
      }
    });
    const ay = sigs.length * rowH + 12;
    const step = (t1 - t0) > 3000 ? 1000 : 500;
    for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
      s += `<path class="tm-g" d="M${X(t)} 2V${ay - 8}"/><text class="tm-v" x="${X(t)}" y="${ay + 6}" text-anchor="middle">${(t / 1000).toFixed(1)}s</text>`;
    }
    s += `<path class="tm-fail" d="M${X(tFail)} 0V${ay - 6}"/><text class="tm-failt" x="${X(tFail) - 3}" y="${ay + 6}" text-anchor="end">✖ ${(tFail / 1000).toFixed(2)}s</text>`;
    return s + '</svg>';
  }

  // changes of `tag` over the whole trace: [[t, v], ...] sorted
  function changesOf(trace, tag) { return trace.filter((x) => x.tag === tag).map((x) => [x.t, x.v]); }
  function segsFor(chg, t0) {
    let v0 = 0;
    const inside = [];
    for (const c of chg) { if (c[0] <= t0) v0 = c[1]; else inside.push(c); }
    return [[t0, v0]].concat(inside);
  }

  // ---------------------------------------------------------------- the report
  // ctx: {level, program, userTags, scenario, failure, hidden, replay(fn)}
  U.renderReport = function (box, ctx) {
    box.innerHTML = '';
    const { level, program, userTags, scenario, failure } = ctx;
    const tags = SC.mergeTags(SC.levelTags(level), userTags);
    const lv = Object.assign({}, level, { tags: (level.tags || []).concat(userTags) });
    const tFail = failure.t;
    const t0 = Math.max(0, tFail - 2000), t1 = tFail + 150;
    const title = scenario.title ? (U.lang === 'ar' ? scenario.title.ar : scenario.title.en) : scenario.id;
    const msg = failure.msg || { en: '', ar: '' };

    // replay up to the failure to get the trace
    const res = SC.scenario.runScenario(lv, program, scenario, { trace: true, keepSim: true, upTo: t1, userTags });
    const sim = res.sim;
    const trace = sim.trace;

    // signals to plot
    const keyNames = Object.keys(failure.expected || {}).filter((k) => sim.tagByName[k] && sim.tagByName[k]._a);
    const changed = {};
    for (const x of trace) if (x.t >= t0 && x.t <= tFail + 10) changed[x.tag] = true;
    const levelNames = SC.levelTags(level).filter((t) => /^[IQ]/.test(t.addr) && !/^IW|^QW/.test(t.addr)).map((t) => t.name);
    const others = levelNames.filter((n) => changed[n] && keyNames.indexOf(n) < 0);
    others.sort((a, b) => (/^Q/.test(sim.tagByName[a].addr) ? 0 : 1) - (/^Q/.test(sim.tagByName[b].addr) ? 0 : 1));
    const names = keyNames.concat(others).slice(0, 9);
    const sigs = names.map((n) => ({ name: n, key: keyNames.indexOf(n) >= 0, segs: segsFor(changesOf(trace, n), t0), expect: failure.expected ? failure.expected[n] : undefined }));

    const head = h('div', { class: 'rp-head' }, h('h3', { class: 'warn' }, '✖ ', tr('FAT failed', 'فشل فحص {{FAT}}').replace(/\{\{|\}\}/g, ''), ': ', title, ctx.hidden ? h('small', null, ' · ' + tr('hidden variant', 'نسخة مخفية')) : null));
    const lines = h('div', { class: 'rp-msg' },
      h('p', { lang: 'en' }, msg.en),
      h('p', { lang: 'ar', dir: 'rtl', html: U.arHtml(msg.ar || '') }));

    const exp = failure.expected || {};
    const act = failure.actual || {};
    const expTxt = Object.keys(exp).map((k) => `${k} = ${typeof exp[k] === 'object' ? JSON.stringify(exp[k]) : fmtVal(exp[k])}`).join(', ');
    const actTxt = Object.keys(exp).map((k) => `${k} = ${fmtVal(act[k])}`).join(', ');
    const where = failure.kind === 'bad_scenario' ? '' : h('p', { class: 'rp-diff mono' },
      tr('Expected', 'المتوقع'), ' ', h('b', null, expTxt), ' ', tr('at', 'عند'), ' t = ', sec(failure.at !== undefined && failure.kind === 'at' ? failure.at : tFail), h('br'),
      tr('Actual', 'الفعلي'), ' ', h('b', { class: 'warn' }, actTxt), ' ', tr('at', 'عند'), ' t = ', sec(tFail));

    // timeline + table
    const tl = h('details', { open: true, class: 'rp-sec' }, h('summary', null, tr('I/O timeline (last 2 seconds)', 'خط زمني للمداخل والمخارج (آخر ثانيتين)')),
      h('div', { class: 'tl-wrap', html: names.length ? timelineSvg(sigs, t0, t1, tFail) : '' }),
      h('p', { class: 'small muted' }, tr('Filled line = bit 1, low line = bit 0. The circle marks what the test expected at the failure time.', 'الخط العالي = البت 1، والواطي = 0. الدائرة بتبيّن شو كان متوقع بوقت الفشل.')));
    const rows = trace.filter((x) => x.t >= t0 && x.t <= tFail + 10 && (names.indexOf(x.tag) >= 0)).slice(-24);
    if (rows.length) {
      tl.append(h('table', { class: 'tags small' }, h('thead', null, h('tr', null, h('th', null, 't'), h('th', null, 'tag'), h('th', null, '→'))),
        h('tbody', null, rows.map((x) => h('tr', null, h('td', { class: 'mono' }, sec(x.t)), h('td', { class: 'mono' }, x.tag), h('td', { class: 'mono' }, fmtVal(x.v)))))));
    }

    // rungs at the failing scan
    const sim2 = SC.sim.create({ level: lv, program, scenario, seed: scenario.seed, userTags });
    sim2.runUntil(tFail);
    sim2.step(true);
    const rungsBox = h('details', { open: true, class: 'rp-sec' }, h('summary', null, tr('Your rungs at the failing scan', 'الـ rungs تبعك بلحظة الفشل')));
    if (sim2.compiled.ok && sim2.rec) {
      program.rungs.forEach((rg, ri) => {
        const rec = sim2.rec[ri];
        if (rec) rungsBox.append(U.staticRung(rg, (n) => n, { rec, title: 'Rung ' + (ri + 1), note: rg.note || '', addrOf: (n) => (sim2.tagByName[n] ? sim2.tagByName[n].addr : '') }));
      });
      rungsBox.append(h('p', { class: 'small muted' }, tr('Bold line + filled symbol + ON = power flows. Thin line + hollow + OFF = no power.', 'خط عريض + رمز معبّى + ON = في power. خط رفيع + فاضي + OFF = ما في power.')));
    } else rungsBox.append(h('p', { class: 'warn' }, tr('The program has errors, so it did not run.', 'البرنامج فيه أخطاء فما اشتغل.')));

    // self-regulation question
    const q = (() => {
      const k = keyNames[0];
      if (!k) return tr('What did you expect to happen at this time, and which rung controls it?', 'شو كنت متوقع يصير بهالوقت، وأي rung بيتحكم فيه؟');
      const wr = program.rungs.map((rg, ri) => ({ ri, w: rg.els.some((e) => (e.t === 'OUT' || e.t === 'SET' || e.t === 'RST') && e.a === k) })).find((x) => x.w);
      const want = exp[k];
      if (wr) return tr(`Which condition in rung ${wr.ri + 1} was ${want === true || want === 1 ? 'FALSE' : 'TRUE'} at t = ${sec(tFail)}? Why?`, `أي شرط بالـ rung ${wr.ri + 1} كان ${want === true || want === 1 ? 'FALSE' : 'TRUE'} عند t = ${sec(tFail)}؟ ليش؟`);
      return tr(`${k} should be ${typeof exp[k] === 'object' ? 'different' : fmtVal(exp[k])} at t = ${sec(tFail)}. Which rung writes ${k}? What decides it?`, `الـ ${k} لازم يكون ${typeof exp[k] === 'object' ? 'مختلف' : fmtVal(exp[k])} عند t = ${sec(tFail)}. أي rung بيكتب ${k}؟ شو اللي بيقرر؟`);
    })();
    const qBox = h('div', { class: 'rp-q' }, h('b', null, '❓ '), q);

    // classic mistakes
    const diags = SC.diag.run(level, program, { failure, tags });
    const dBox = diags.length ? h('div', { class: 'rp-diag' }, diags.slice(0, 2).map((d) => h('p', null, h('b', null, '💡 '), h('span', { lang: 'en' }, d.msg.en), h('br'), h('span', { lang: 'ar', dir: 'rtl', html: U.arHtml(d.msg.ar) })))) : null;

    const btns = h('div', { class: 'rp-btns' },
      h('button', { type: 'button', class: 'btn primary', onclick: () => ctx.replay && ctx.replay(scenario, tFail) }, '▶ ' + tr('Replay to t − 2 s', 'إعادة تشغيل حتى t − 2 s')),
      h('button', { type: 'button', class: 'btn', onclick: () => { box.innerHTML = ''; } }, tr('Close report', 'سكّر التقرير')));

    box.append(h('div', { class: 'report' }, head, lines, where, qBox, dBox, tl, rungsBox, btns, h('p', { class: 'small muted' }, tr('Your program was not changed. Fix it and run the FAT again.', 'برنامجك ما تغيّر. صلّحه وشغّل الـ {{FAT}} مرة ثانية.').replace(/\{\{|\}\}/g, ''))));
    box.scrollIntoView({ behavior: U.motion(), block: 'nearest' });
  };
})();
