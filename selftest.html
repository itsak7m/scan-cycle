<script>
/* ==== src/core/plant.js ==== */
/* Plant model: the oral-syrup bottling line. Deterministic (seeded PRNG kept in the state), 10 ms steps.
 *
 * Units: mm along the conveyor, ms of simulated time. Numbers are "game values", chosen for playability.
 * Hardwired layer: when the E-stop is pressed or the guard door is open, motor / valve / solenoid power
 * is cut regardless of what the ladder does. The PLC only receives EStop_OK and is graded on its own outputs.
 *
 * Bottle slots are numbered 0,1,2... in generation order (cfg.badIdx etc. refer to those numbers).
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const prng = SC.prng;

  const DEFAULTS = {
    stations: ['infeed', 'filler', 'exit'],
    convLen: 1850, v: 150, speedPct: 100,
    bottlesPerMin: 24, jitterMs: 200, genDelayMs: 0, genOn: true,
    R: 30, minGap: 100, spawnX: 0, beam: 3,
    x: { infeed: 150, nozzle: 500, stopper: 530, fillPE: 530, level: 500, cap: 760, capCheck: 860, foil: 900, seal: 1000, label: 1180, reject: 1320, exit: 1700, backup: 1760, blockX: 1800 },
    capacity: 1.0, target: 0.9, okLevel: 0.88, fillSeconds: 3.0, nozzleTol: 40, fillMode: 'timed',
    stopperTravelMs: 400, pusherTravelMs: 150, pusherReach: 40, pumpTravelMs: 1500,
    capperStrokeMs: 300, capperTol: 35, labelerTol: 40, sealExposureMs: 300, meltMs: 2000,
    encPitch: 50,
    tankPct: 80, tankPerFillPct: 0.5,
    badIdx: [], badFlow: 0.6, missingCapIdx: [], noFoilIdx: [], challengeIdx: [], missingBottleIdx: [], doubleIdx: [], fallenIdx: [],
    preload: [],
  };

  const OUT_NAMES = ['Conveyor_Motor', 'Fill_Valve', 'Stopper_SOL', 'Capper_Run', 'Sealer_Enable', 'Labeler_Trig', 'Reject_Pusher', 'Pump_Fwd', 'Pump_Rev'];

  function makeCfg(over) {
    const cfg = JSON.parse(JSON.stringify(DEFAULTS));
    over = over || {};
    for (const k in over) {
      if (k === 'x' || k === 'layout') Object.assign(cfg.x, over[k]);
      else if (k === 'startLevelPct') cfg.tankPct = over[k];
      else cfg[k] = JSON.parse(JSON.stringify(over[k]));
    }
    return cfg;
  }

  const has = (cfg, s) => cfg.stations.indexOf(s) >= 0;

  function init(over, seed) {
    const cfg = makeCfg(over);
    const P = {
      cfg, t: 0, rng: prng.seedOf(seed | 0), nextId: 1, seq: 0,
      nextSpawn: cfg.genDelayMs, pendingDouble: false,
      bottles: [],
      hw: { estop: false, doorOpen: false }, relayOpen: false,
      stopper: { pos: 0 }, pusher: { pos: 0, hit: false }, pump: { pos: 0 },
      tank: { pct: cfg.tankPct },
      faults: { peStuckOn: {}, peStuckOff: {}, peMisaligned: {}, peChatter: {}, valveWornSeal: false, airLow: false, airLost: false, capFeederEmpty: false, encoderSlip: false },
      flags: { outfeedBlocked: false, genOn: cfg.genOn !== false },
      enc: { acc: cfg.encPitch / 2, n: 0, mute: false },
      capper: { prev: 0, timer: -1, applied: false }, labeler: { prev: 0 }, fill: { dryOpen: false },
      counts: { spawned: 0, out: 0, good: 0, rejected: 0, spills: 0, wastedCaps: 0, wastedLabels: 0, goodLost: 0, melted: 0, badShipped: 0, filled: 0, runMs: 0, stopMs: 0, dist: 0 },
      outs: {}, sens: {},
    };
    for (const pb of cfg.preload) {
      P.bottles.push(newBottle(P, -1, Object.assign({ level: 0 }, pb)));
    }
    P.bottles.sort((a, b) => b.x - a.x);
    P.sens = computeSensors(P);
    return P;
  }

  function newBottle(P, k, over) {
    const c = P.cfg;
    const bad = c.badIdx.indexOf(k) >= 0;
    const b = {
      id: P.nextId++, seq: k, x: c.spawnX, level: 0, capped: false, sealed: false, labeled: false,
      bad, flowMul: bad ? c.badFlow : 1, noCap: c.missingCapIdx.indexOf(k) >= 0, noFoil: c.noFoilIdx.indexOf(k) >= 0,
      challenge: c.challengeIdx.indexOf(k) >= 0, fallen: c.fallenIdx.indexOf(k) >= 0,
      sealMs: 0, melted: false, spilled: false, filledFlag: false, miss: {}, px: c.spawnX,
    };
    if (b.challenge) b.bad = true;
    Object.assign(b, over || {});
    if (over && over.x !== undefined) b.px = over.x;
    return b;
  }

  function isDefective(P, b) {
    const c = P.cfg;
    if (b.challenge || b.fallen || b.melted) return true;
    if (has(c, 'filler') && (b.level < c.okLevel - 1e-9)) return true;
    if (has(c, 'capper') && !b.capped) return true;
    if (has(c, 'sealer') && !b.sealed) return true;
    if (has(c, 'labeler') && !b.labeled) return true;
    return false;
  }

  // ------------------------------------------------------------------ sensors
  function eyeBlocked(P, name, ex) {
    const c = P.cfg;
    const reach = c.R + c.beam;
    let blocked = false;
    for (const b of P.bottles) {
      if (Math.abs(b.x - ex) > reach) continue;
      if (P.faults.peMisaligned[name]) {
        if (b.miss[name] === undefined) b.miss[name] = prng.next(P) < 0.3;
        if (b.miss[name]) continue;
      }
      blocked = true;
      break;
    }
    if (P.faults.peStuckOn[name]) return 1;
    if (P.faults.peStuckOff[name]) return 0;
    if (P.faults.peChatter[name]) return prng.next(P) < 0.5 ? 1 : 0;
    return blocked ? 1 : 0;
  }

  function near(P, x, tol, pred) {
    let best = null, bd = 1e9;
    for (const b of P.bottles) {
      const d = Math.abs(b.x - x);
      if (d <= tol && d < bd && (!pred || pred(b))) { best = b; bd = d; }
    }
    return best;
  }

  function computeSensors(P) {
    const c = P.cfg, x = c.x, s = {};
    s.PE_Infeed = eyeBlocked(P, 'PE_Infeed', x.infeed);
    s.PE_Fill = eyeBlocked(P, 'PE_Fill', x.fillPE);
    s.PE_Cap = eyeBlocked(P, 'PE_Cap', x.cap);
    s.PE_Reject = eyeBlocked(P, 'PE_Reject', x.reject);
    s.PE_Exit = eyeBlocked(P, 'PE_Exit', x.exit);
    s.PE_Backup = eyeBlocked(P, 'PE_Backup', x.backup);
    s.Level_OK = near(P, x.level, 40, (b) => b.level >= c.okLevel) ? 1 : 0;
    s.Cap_Present = near(P, x.capCheck, 35, (b) => b.capped) ? 1 : 0;
    s.Foil_Present = near(P, x.foil, 35, (b) => b.capped && !b.noFoil) ? 1 : 0;
    s.Challenge_Bottle = near(P, x.reject, 40, (b) => b.challenge) ? 1 : 0;
    s.Stopper_Ext = P.stopper.pos >= 0.97 ? 1 : 0;
    s.Stopper_Ret = P.stopper.pos <= 0.03 ? 1 : 0;
    s.Air_OK = P.faults.airLost ? 0 : 1;
    s.Tank_LSL = P.tank.pct < 15 ? 1 : 0;
    s.Tank_LSLL = P.tank.pct < 5 ? 1 : 0;
    s.Tank_Level = Math.round(Math.max(0, Math.min(100, P.tank.pct)) * 276.48);
    s.Pump_Home = P.pump.pos <= 0.02 ? 1 : 0;
    s.Pump_Full = P.pump.pos >= 0.98 ? 1 : 0;
    s.Conv_Encoder = !P.enc.mute && P.enc.acc < c.encPitch / 2 ? 1 : 0;
    s.EStop_OK = P.hw.estop || P.hw.doorOpen ? 0 : 1;
    s.Door_Closed = P.hw.doorOpen ? 0 : 1;
    return s;
  }

  // ------------------------------------------------------------------ step
  function pushOff(P, b) {
    const i = P.bottles.indexOf(b);
    if (i >= 0) P.bottles.splice(i, 1);
  }

  function addFill(P, b, amount) {
    const c = P.cfg;
    if (b.fallen) { if (!b.spilled) { b.spilled = true; P.counts.spills++; } return; }
    b.level += amount;
    if (b.level > c.capacity) {
      b.level = c.capacity;
      if (!b.spilled) { b.spilled = true; P.counts.spills++; }
    }
    if (!b.filledFlag && b.level >= c.okLevel) {
      b.filledFlag = true;
      P.counts.filled++;
      P.tank.pct = Math.max(0, P.tank.pct - c.tankPerFillPct);
    }
  }

  function stepMut(P, out, dt) {
    const c = P.cfg, x = c.x;
    P.t += dt;
    P.relayOpen = P.hw.estop || P.hw.doorOpen;
    const pw = !P.relayOpen;
    const o = {};
    for (const n of OUT_NAMES) o[n] = pw && out && out[n] ? 1 : 0;
    P.outs = {};
    if (out) for (const k in out) P.outs[k] = out[k] ? 1 : 0;

    // ---- generator
    if (P.flags.genOn !== false) {
      const last = P.bottles.length ? P.bottles[P.bottles.length - 1] : null; // lowest x
      const gapOk = !last || last.x >= c.minGap;
      if (P.pendingDouble && gapOk) {
        P.pendingDouble = false;
        P.bottles.push(newBottle(P, P.seq - 1, { seq: P.seq - 1, double: true }));
        P.counts.spawned++;
      } else if (P.t >= P.nextSpawn && gapOk) {
        const k = P.seq++;
        const period = 60000 / Math.max(1, c.bottlesPerMin);
        P.nextSpawn += Math.max(period * 0.5, period + prng.range(P, -c.jitterMs, c.jitterMs));
        if (c.missingBottleIdx.indexOf(k) < 0) {
          P.bottles.push(newBottle(P, k));
          P.counts.spawned++;
          if (c.doubleIdx.indexOf(k) >= 0) P.pendingDouble = true;
        }
      }
    }

    // ---- air / cylinders
    const air = !P.faults.airLost;
    const slow = P.faults.airLow ? 3 : 1;
    if (air) {
      const sd = dt / (c.stopperTravelMs * slow);
      P.stopper.pos = Math.max(0, Math.min(1, P.stopper.pos + (o.Stopper_SOL ? sd : -sd)));
      const pd = dt / (c.pusherTravelMs * slow);
      P.pusher.pos = Math.max(0, Math.min(1, P.pusher.pos + (o.Reject_Pusher ? pd : -pd)));
    }
    if (P.pusher.pos < 0.2) P.pusher.hit = false;
    if (P.pusher.pos >= 0.8 && !P.pusher.hit) {
      const b = near(P, x.reject, c.pusherReach);
      if (b) {
        P.pusher.hit = true;
        pushOff(P, b);
        P.counts.rejected++;
        if (!isDefective(P, b)) P.counts.goodLost++;
      }
    }

    // ---- conveyor
    const dx = o.Conveyor_Motor ? (c.v * c.speedPct / 100) * dt / 1000 : 0;
    if (o.Conveyor_Motor) { P.counts.runMs += dt; P.counts.dist += dx; } else P.counts.stopMs += dt;
    const holdX = x.stopper - c.R;
    P.bottles.sort((a, b) => b.x - a.x);
    let ahead = null;
    const gone = [];
    for (const b of P.bottles) {
      b.px = b.x; // previous position, for smooth rendering
      let nx = b.x + dx;
      if (ahead) nx = Math.min(nx, ahead.x - c.minGap);
      if (P.stopper.pos > 0.5 && b.x <= holdX + 1e-9) nx = Math.min(nx, holdX);
      if (P.flags.outfeedBlocked) nx = Math.min(nx, x.blockX);
      b.x = Math.max(b.x, nx);
      ahead = b;
      if (b.x > c.convLen) gone.push(b);
    }
    for (const b of gone) {
      pushOff(P, b);
      P.counts.out++;
      if (isDefective(P, b)) P.counts.badShipped++; else P.counts.good++;
    }

    // ---- encoder
    P.enc.acc += dx;
    while (P.enc.acc >= c.encPitch) {
      P.enc.acc -= c.encPitch;
      P.enc.n++;
      P.enc.mute = P.faults.encoderSlip && P.enc.n % 50 === 49;
    }

    // ---- filling
    const under = near(P, x.nozzle, c.nozzleTol);
    if (c.fillMode === 'timed') {
      if (o.Fill_Valve) {
        if (under) {
          let flow = c.target / c.fillSeconds * under.flowMul * (P.faults.valveWornSeal ? 0.75 : 1);
          if (P.tank.pct <= 0) flow = 0;
          addFill(P, under, flow * dt / 1000);
        } else if (!P.fill.dryOpen) { P.fill.dryOpen = true; P.counts.spills++; }
      } else P.fill.dryOpen = false;
    } else {
      // piston filler: the pump moves the product, the valve routes it to the nozzle
      const pf = o.Pump_Fwd, pr = o.Pump_Rev;
      const pd = dt / c.pumpTravelMs;
      if (pr && !pf) P.pump.pos = Math.min(1, P.pump.pos + pd);
      else if (pf && !pr) {
        const d = Math.min(P.pump.pos, pd);
        P.pump.pos -= d;
        if (o.Fill_Valve && d > 0) {
          if (under) addFill(P, under, d * c.target * under.flowMul);
          else if (!P.fill.dryOpen) { P.fill.dryOpen = true; P.counts.spills++; }
        }
      }
      if (!o.Fill_Valve) P.fill.dryOpen = false;
    }

    // ---- capper (rising edge = one stroke)
    const cr = o.Capper_Run;
    if (cr && !P.capper.prev && P.capper.timer < 0) { P.capper.timer = 0; P.capper.applied = false; }
    P.capper.prev = cr;
    if (P.capper.timer >= 0) {
      P.capper.timer += dt;
      if (!P.capper.applied && P.capper.timer >= c.capperStrokeMs / 2) {
        P.capper.applied = true;
        const b = near(P, x.cap, c.capperTol);
        if (b) { if (!(b.noCap || P.faults.capFeederEmpty)) b.capped = true; }
        else P.counts.wastedCaps++;
      }
      if (P.capper.timer >= c.capperStrokeMs) P.capper.timer = -1;
    }

    // ---- sealer
    for (const b of P.bottles) {
      if (Math.abs(b.x - x.seal) <= 40 && o.Sealer_Enable && b.capped) {
        b.sealMs += dt;
        if (b.sealMs >= c.sealExposureMs && !b.noFoil && !b.melted) b.sealed = true;
        if (b.sealMs > c.meltMs && !b.melted) { b.melted = true; b.sealed = false; P.counts.melted++; }
      }
    }

    // ---- labeler (rising edge)
    const lt = o.Labeler_Trig;
    if (lt && !P.labeler.prev) {
      const b = near(P, x.label, c.labelerTol);
      if (b) b.labeled = true; else P.counts.wastedLabels++;
    }
    P.labeler.prev = lt;

    P.sens = computeSensors(P);
  }

  function clone(P) { return JSON.parse(JSON.stringify(P)); }
  function step(P, out, dt) { const n = clone(P); stepMut(n, out, dt); return n; }

  // ------------------------------------------------------------------ events / faults
  function applyEvent(P, ev) {
    if (ev.estop !== undefined) P.hw.estop = !!ev.estop;
    if (ev.door !== undefined) P.hw.doorOpen = ev.door === 'open' || ev.door === true;
    if (ev.fault) setFault(P, ev.fault, ev.arg, true);
    if (ev.clear) setFault(P, ev.clear, ev.arg, false);
    if (ev.plantSet) {
      for (const k in ev.plantSet) {
        const v = ev.plantSet[k];
        if (k === 'tankPct') P.tank.pct = v;
        else if (k === 'outfeedBlocked') P.flags.outfeedBlocked = !!v;
        else if (k === 'genOn') P.flags.genOn = !!v;
        else if (k === 'bottlesPerMin' || k === 'speedPct' || k === 'jitterMs' || k === 'fillSeconds') P.cfg[k] = v;
        else if (k === 'pumpTravelMs' || k === 'stopperTravelMs') P.cfg[k] = v;
        else if (k === 'spawnBottle') P.bottles.push(newBottle(P, -1, typeof v === 'object' ? v : {}));
      }
    }
  }

  function setFault(P, name, arg, on) {
    const f = P.faults;
    if (['peStuckOn', 'peStuckOff', 'peMisaligned', 'peChatter'].indexOf(name) >= 0) {
      if (on) f[name][arg] = true; else delete f[name][arg];
    } else if (name in f) f[name] = !!on;
  }

  // ------------------------------------------------------------------ KPIs
  function kpis(P) {
    const c = P.cfg, n = P.counts;
    const tmin = Math.max(P.t, 1) / 60000;
    const runS = n.runMs / 1000;
    const availability = P.t > 0 ? n.runMs / P.t : 0;
    const performance = runS > 0 ? Math.min(1, n.dist / (c.v * runS)) : 0;
    const total = n.out + n.rejected;
    const quality = total > 0 ? n.good / total : 1;
    return {
      out: n.out, good: n.good, rejected: n.rejected, spills: n.spills, wastedCaps: n.wastedCaps, goodLost: n.goodLost,
      melted: n.melted, badShipped: n.badShipped, filledCount: n.filled, bottlesPerMin: n.out / tmin,
      availability, performance, quality, oee: availability * performance * quality,
      overflow: n.spills > 0,
    };
  }

  SC.plant = { DEFAULTS, makeCfg, init, stepMut, step, clone, applyEvent, setFault, kpis, isDefective, OUT_NAMES, has };
})();

</script>
<script>
/* ==== src/core/sim.js ==== */
/* Simulation = PLC (compiled program + memory) + plant + operator panel + forces + scenario events.
 * The same object drives the interactive game loop and the headless FAT runner, so replays are identical.
 *
 * One step():  events -> sensor snapshot into the input image -> scan -> outputs to plant -> plant step.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const A = SC.addr;

  const INPUT_IO = SC.IO.filter((t) => t.addr[0] === 'I').map((t) => Object.assign({ _a: A.parseAddr(t.addr) }, t));
  const OUTPUT_IO = SC.IO.filter((t) => t.src === 'out').map((t) => Object.assign({ _a: A.parseAddr(t.addr) }, t));

  // press events -> set events (NC buttons idle at 1)
  function prepareEvents(events) {
    const out = [];
    for (const ev of events || []) {
      if (ev.press) {
        const io = SC.ioByName[ev.press];
        const idle = io ? io.def : 0;
        out.push({ t: ev.t, set: { [ev.press]: idle ? 0 : 1 } });
        out.push({ t: ev.t + (ev.ms || 200), set: { [ev.press]: idle } });
      } else out.push(ev);
    }
    return out.map((e, i) => Object.assign({ _i: i }, e)).sort((a, b) => a.t - b.t || a._i - b._i);
  }

  const METRIC_KEYS = ['out', 'good', 'rejected', 'spills', 'wastedCaps', 'goodLost', 'melted', 'badShipped', 'filledCount', 'overflow', 'bottlesPerMin', 'availability', 'performance', 'quality', 'oee', 'wastedLabels', 'spawned', 'estopTrips'];

  function create(opts) {
    const level = opts.level || {};
    const scenario = opts.scenario || {};
    const seed = opts.seed !== undefined ? opts.seed : (scenario.seed || 1);
    const tags = SC.mergeTags(SC.levelTags(level), opts.userTags || []);
    const allTags = SC.IO.map((t) => t).concat(tags.filter((t) => !SC.ioByName[t.name]));
    const tagByName = Object.create(null);
    for (const t of allTags) tagByName[t.name] = Object.assign({ _a: A.parseAddr(t.addr) }, t);
    for (const t of tags) tagByName[t.name] = Object.assign({ _a: A.parseAddr(t.addr) }, tagByName[t.name] || {}, t);

    const compiled = SC.compile(opts.program || { v: 1, rungs: [] }, { tags, palette: level.palette || null });
    const st = SC.newState();
    for (const addr in level.init || {}) {
      const a = A.parseAddr(addr);
      if (a) st[a.arr][a.idx] = level.init[addr];
    }
    const plantCfg = Object.assign({}, level.plant || {}, scenario.plant || {});
    const P = SC.plant.init(plantCfg, seed);

    const panel = Object.create(null);
    for (const io of INPUT_IO) if (io.src === 'panel') panel[io.name] = io.def | 0;
    const events = prepareEvents(scenario.events);

    const sim = {
      level, scenario, compiled, st, P, panel, forces: Object.create(null), events, evIdx: 0,
      t: 0, dt: SC.SCAN_MS, trace: null, prevVals: null, tagByName, rec: null, steps: 0, audit: [], watch: {},
    };
    if (opts.trace) { sim.trace = []; sim.prevVals = Object.create(null); }
    for (const nm of level.watchLog || []) sim.watch[nm] = undefined;

    function resolveInput(key) {
      if (SC.ioByName[key] && SC.ioByName[key].addr[0] === 'I') return SC.ioByName[key];
      const a = A.parseAddr(key);
      if (a) return INPUT_IO.find((io) => io._a.canon === a.canon) || null;
      return null;
    }
    sim.resolveInput = resolveInput;

    function applyEvent(ev) {
      if (ev.set) {
        for (const k in ev.set) {
          const io = resolveInput(k);
          if (io) panel[io.name] = ev.set[k] === true ? 1 : ev.set[k] === false ? 0 : ev.set[k];
        }
      }
      SC.plant.applyEvent(P, ev);
      if (ev.audit) sim.audit.push({ t: sim.t, note: ev.audit });
    }

    sim.setPanel = (name, v) => {
      const io = resolveInput(name);
      if (io && io.src === 'panel') panel[io.name] = v === true ? 1 : v === false ? 0 : v;
    };

    sim.force = (key, v) => {
      const a = A.parseAddr(SC.ioByName[key] ? SC.ioByName[key].addr : key);
      if (!a || a.arr !== 'I' && a.arr !== 'IW') return false;
      if (v === null || v === undefined) delete sim.forces[a.canon];
      else sim.forces[a.canon] = v === true ? 1 : v === false ? 0 : v;
      return true;
    };
    sim.forcesActive = () => Object.keys(sim.forces).length > 0;
    sim.clearForces = () => { sim.forces = Object.create(null); };

    sim.read = (key) => {
      const t = tagByName[key];
      let a = t ? t._a : A.parseAddr(key);
      if (a) return st[a.arr][a.idx];
      const m = /^([A-Za-z_]\w*)\.(Q|QU|QD|ET|CV|PT)$/.exec(key);
      if (m) { const s = st.inst[m[1]]; return s ? s[m[2]] : 0; }
      return sim.metric(key);
    };

    sim.metric = (key) => {
      const n = P.counts;
      switch (key) {
        case 'out': case 'good': case 'rejected': case 'spills': case 'wastedCaps': case 'goodLost': case 'melted': case 'badShipped': case 'wastedLabels': case 'spawned': return n[key];
        case 'filledCount': return n.filled;
        case 'overflow': return n.spills > 0 ? 1 : 0;
        case 'bottlesPerMin': case 'availability': case 'performance': case 'quality': case 'oee': return SC.plant.kpis(P)[key];
      }
      return undefined;
    };
    sim.isKnownKey = (key) => !!(tagByName[key] || A.parseAddr(key) || /^([A-Za-z_]\w*)\.(Q|QU|QD|ET|CV|PT)$/.test(key) || METRIC_KEYS.indexOf(key) >= 0);

    function recordTrace() {
      const cur = sim.prevVals;
      for (const nm in tagByName) {
        const t = tagByName[nm];
        if (!t._a) continue;
        const v = st[t._a.arr][t._a.idx];
        if (cur[nm] !== v) { cur[nm] = v; sim.trace.push({ t: sim.t, tag: nm, v }); }
      }
    }

    sim.step = (withRec) => {
      while (sim.evIdx < events.length && events[sim.evIdx].t <= sim.t) applyEvent(events[sim.evIdx++]);
      // sensor snapshot -> input image
      for (const io of INPUT_IO) {
        const f = sim.forces[io._a.canon];
        let v;
        if (f !== undefined) v = f;
        else if (io.src === 'panel') v = panel[io.name];
        else v = P.sens[io.name];
        if (v === undefined) v = 0;
        if (io._a.kind === 'bit') st.I[io._a.idx] = v ? 1 : 0;
        else st[io._a.arr][io._a.idx] = v | 0;
      }
      if (compiled.ok) {
        if (withRec) { sim.rec = []; SC.scanMut(compiled, st, sim.dt, sim.rec); } else SC.scanMut(compiled, st, sim.dt);
      } else { st.t += sim.dt; st.scans++; }
      const out = {};
      for (const io of OUTPUT_IO) out[io.name] = st.Q[io._a.idx];
      for (const nm in sim.watch) {
        const v = sim.read(nm);
        if (sim.watch[nm] !== undefined && sim.watch[nm] !== v) sim.audit.push({ t: sim.t, tag: nm, from: sim.watch[nm], to: v, key: panel.Supervisor_Key ? 1 : 0 });
        sim.watch[nm] = v;
      }
      if (sim.trace) recordTrace();
      SC.plant.stepMut(P, out, sim.dt);
      sim.t += sim.dt;
      sim.steps++;
    };

    sim.runUntil = (ms) => { while (sim.t < ms) sim.step(); };
    return sim;
  }

  SC.sim = { create, INPUT_IO, OUTPUT_IO, prepareEvents, METRIC_KEYS };
})();

</script>
<script>
/* ==== src/core/scenario.js ==== */
/* FAT scenario runner: runs a scenario against a program and checks the assertions.
 *
 * scenario: {id, seed, durationMs, plant?:{...}, events:[...], asserts:[...], title?:{en,ar}}
 *   events:  {t, set:{tag:value}} | {t, press:"Start_PB", ms} | {t, estop:bool} | {t, door:"open"|"closed"}
 *            {t, fault:name, arg} | {t, clear:name, arg} | {t, plantSet:{...}}
 *   asserts: {t, expect:{key:value}, tol?, msg?}          value must hold at some sample in [t-tol, t+tol]
 *            {window:[a,b], never:{...}} / {window:[a,b], always:{...}}
 *            {when:{...}, within:ms, expect:{...}, tol?}  after every rising edge of `when`
 *   keys: tag names, addresses (Q0.0), instance fields (DB_T.ET), plant metrics (filledCount, spills, ...)
 *   values: true/false/number or {gte,gt,lte,lt,eq,ne}
 * Sample time = the time at which the scan read its inputs; outputs are the result of that scan.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const DEFAULT_TOL = 20;

  function matchVal(v, exp) {
    if (v === undefined) return false;
    if (typeof exp === 'boolean') return (v ? true : false) === exp;
    if (typeof exp === 'number') return v === exp;
    if (exp && typeof exp === 'object') {
      for (const op in exp) {
        const e = exp[op];
        if (op === 'gte' && !(v >= e)) return false;
        if (op === 'gt' && !(v > e)) return false;
        if (op === 'lte' && !(v <= e)) return false;
        if (op === 'lt' && !(v < e)) return false;
        if (op === 'eq' && !(v === e)) return false;
        if (op === 'ne' && !(v !== e)) return false;
      }
      return true;
    }
    return false;
  }

  function matchCond(sim, cond) {
    for (const k in cond) if (!matchVal(sim.read(k), cond[k])) return false;
    return true;
  }

  function actualOf(sim, cond) {
    const o = {};
    for (const k in cond) { const v = sim.read(k); o[k] = typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 1000) / 1000 : v; }
    return o;
  }

  const fmtVal = (e) => (typeof e === 'boolean' ? (e ? 'ON' : 'OFF') : typeof e === 'object' ? Object.keys(e).map((k) => `${k} ${e[k]}`).join(', ') : String(e));
  const fmtCond = (c) => Object.keys(c).map((k) => `${k} = ${fmtVal(c[k])}`).join(' and ');
  const sec = (ms) => (ms / 1000).toFixed(2) + ' s';

  function defaultMsg(a, kind) {
    if (kind === 'at') return { en: `Expected ${fmtCond(a.expect)} at t = ${sec(a.t)}`, ar: `المتوقع ${fmtCond(a.expect)} عند t = ${sec(a.t)}` };
    if (kind === 'never') return { en: `${fmtCond(a.never)} must never happen between ${sec(a.window[0])} and ${sec(a.window[1])}`, ar: `ممنوع يصير ${fmtCond(a.never)} بين ${sec(a.window[0])} و ${sec(a.window[1])}` };
    if (kind === 'always') return { en: `${fmtCond(a.always)} must hold between ${sec(a.window[0])} and ${sec(a.window[1])}`, ar: `لازم يضل ${fmtCond(a.always)} بين ${sec(a.window[0])} و ${sec(a.window[1])}` };
    return { en: `After ${fmtCond(a.when)}, expected ${fmtCond(a.expect)} within ${a.within} ms`, ar: `بعد ${fmtCond(a.when)} المتوقع ${fmtCond(a.expect)} خلال ${a.within} ms` };
  }

  // opts: {seed, failFast, trace, forces, userTags, upTo (ms, stop early), rec}
  function runScenario(level, program, scenario, opts) {
    opts = opts || {};
    const t0 = Date.now();
    const sim = SC.sim.create({ level, program, scenario, seed: opts.seed !== undefined ? opts.seed : scenario.seed, trace: !!opts.trace, userTags: opts.userTags });
    if (opts.forces) for (const k in opts.forces) sim.force(k, opts.forces[k]);
    const dur = scenario.durationMs || 10000;
    const asserts = (scenario.asserts || []).map((a, i) => {
      const kind = a.never ? 'never' : a.always ? 'always' : a.when ? 'within' : 'at';
      const tol = a.tol === undefined ? DEFAULT_TOL : a.tol;
      const o = { a, i, kind, tol, done: false, ok: false, obligations: [], prevWhen: false };
      if (kind === 'at') { o.from = a.t - tol; o.to = a.t + tol; }
      return o;
    });
    const failures = [];
    const fail = (o, tFail, extra) => {
      const a = o.a;
      const cond = o.kind === 'never' ? a.never : o.kind === 'always' ? a.always : a.expect;
      failures.push(Object.assign({
        idx: o.i, kind: o.kind, t: tFail, at: a.t !== undefined ? a.t : (a.window ? a.window[0] : tFail),
        msg: a.msg || defaultMsg(a, o.kind), expected: cond, actual: actualOf(sim, cond), assertId: a.id || ('#' + (o.i + 1)),
      }, extra || {}));
    };
    const unknownKeys = [];
    for (const o of asserts) {
      const a = o.a;
      for (const c of [a.expect, a.never, a.always, a.when]) if (c) for (const k in c) if (!sim.isKnownKey(k)) unknownKeys.push(k);
    }
    if (unknownKeys.length) failures.push({ idx: -1, kind: 'bad_scenario', t: 0, at: 0, msg: { en: 'Scenario uses unknown key ' + unknownKeys[0], ar: 'السيناريو فيه مفتاح غير معروف' }, expected: {}, actual: {}, assertId: 'scenario' });

    const stopAt = opts.upTo !== undefined ? opts.upTo : dur;
    while (sim.t < stopAt) {
      sim.step();
      const ts = sim.t - sim.dt;
      for (const o of asserts) {
        if (o.done) continue;
        const a = o.a;
        if (o.kind === 'at') {
          if (ts >= o.from && ts <= o.to) {
            if (!o.ok && matchCond(sim, a.expect)) o.ok = true;
            if (ts >= o.to && !o.ok) { o.done = true; fail(o, ts); }
          }
          if (ts >= o.to) o.done = true;
        } else if (o.kind === 'never' || o.kind === 'always') {
          if (ts >= a.window[0] && ts <= a.window[1]) {
            const m = matchCond(sim, o.kind === 'never' ? a.never : a.always);
            if ((o.kind === 'never' && m) || (o.kind === 'always' && !m)) { o.done = true; fail(o, ts); }
          }
          if (ts > a.window[1]) o.done = true;
        } else {
          const w = matchCond(sim, a.when);
          if (w && !o.prevWhen) o.obligations.push({ t0: ts, deadline: ts + (a.within || 0) + o.tol });
          o.prevWhen = w;
          if (o.obligations.length) {
            const ok = matchCond(sim, a.expect);
            const keep = [];
            for (const ob of o.obligations) {
              if (ok) continue;
              if (ts >= ob.deadline) { fail(o, ts, { at: ob.t0 }); o.done = true; break; }
              keep.push(ob);
            }
            o.obligations = keep;
          }
        }
      }
      if (opts.failFast && failures.length) break;
    }
    // flush obligations whose deadline is inside the run but never evaluated (end of run)
    if (stopAt >= dur) {
      for (const o of asserts) {
        if (o.done) continue;
        if (o.kind === 'at' && !o.ok && o.to <= dur) fail(o, dur);
        if (o.kind === 'within') for (const ob of o.obligations) if (ob.deadline <= dur) { fail(o, dur, { at: ob.t0 }); break; }
      }
    }
    failures.sort((x, y) => x.t - y.t || x.idx - y.idx);
    return {
      id: scenario.id, pass: failures.length === 0, failures, firstFailure: failures[0] || null,
      metrics: SC.plant.kpis(sim.P), audit: sim.audit, sim: opts.keepSim ? sim : null, ms: Date.now() - t0, forcesActive: sim.forcesActive(),
    };
  }

  // ------------------------------------------------------------------ hidden variants
  // level.hidden = {count, seedBase, base?:[scenarioIds], vary:{plant:{key:[loPct,hiPct]}, jitterMs:[lo,hi], shiftMs:[lo,hi], bottlesPerMinPct:[lo,hi]}}
  function makeHidden(level, k) {
    const h = level.hidden || {};
    const vis = (level.scenarios || []).filter((s) => !h.base || h.base.indexOf(s.id) >= 0);
    if (!vis.length) return null;
    const base = vis[k % vis.length];
    const seed = (h.seedBase || 1000) + k;
    const o = { rng: SC.prng.seedOf(seed * 7919 + 13) };
    const sc = SC.util.clone(base);
    sc.id = `${base.id}~h${k}`;
    sc.seed = seed;
    sc.hidden = true;
    const v = h.vary || {};
    sc.plant = sc.plant || {};
    if (v.jitterMs) sc.plant.jitterMs = Math.round(SC.prng.range(o, v.jitterMs[0], v.jitterMs[1]));
    if (v.genDelayMs) sc.plant.genDelayMs = Math.round(SC.prng.range(o, v.genDelayMs[0], v.genDelayMs[1]));
    if (v.bottlesPerMinPct) {
      const b = sc.plant.bottlesPerMin || (level.plant && level.plant.bottlesPerMin) || SC.plant.DEFAULTS.bottlesPerMin;
      sc.plant.bottlesPerMin = Math.round(b * (1 + SC.prng.range(o, v.bottlesPerMinPct[0], v.bottlesPerMinPct[1]) / 100) * 10) / 10;
    }
    for (const key in v.plant || {}) {
      const range = v.plant[key];
      const baseV = sc.plant[key] !== undefined ? sc.plant[key] : (level.plant && level.plant[key] !== undefined ? level.plant[key] : SC.plant.DEFAULTS[key]);
      if (typeof baseV === 'number') sc.plant[key] = Math.round(baseV * (1 + SC.prng.range(o, range[0], range[1]) / 100) * 1000) / 1000;
    }
    if (v.shiftMs) {
      const sh = Math.round(SC.prng.range(o, v.shiftMs[0], v.shiftMs[1]) / 10) * 10;
      for (const e of sc.events || []) e.t += sh;
      for (const a of sc.asserts || []) {
        if (a.t !== undefined) a.t += sh;
        if (a.window) a.window = [a.window[0] + sh, a.window[1] + sh];
      }
      sc.durationMs += sh;
    }
    return sc;
  }

  // runs visible scenarios, then hidden variants. opts: {failFast, skipHidden, userTags, forces}
  function runLevel(level, program, opts) {
    opts = opts || {};
    const results = [];
    let firstFail = null;
    const push = (sc, hidden) => {
      const r = runScenario(level, program, sc, { failFast: true, userTags: opts.userTags, forces: opts.forces });
      r.hidden = !!hidden;
      r.scenario = sc;
      results.push(r);
      if (!r.pass && !firstFail) firstFail = r;
      return r.pass;
    };
    for (const sc of level.scenarios || []) { if (!push(sc, false) && opts.stopAtFirst) break; }
    if (!opts.skipHidden && !(opts.stopAtFirst && firstFail)) {
      const n = (level.hidden && level.hidden.count) || 0;
      for (let k = 0; k < n; k++) {
        const sc = makeHidden(level, k);
        if (sc && !push(sc, true) && opts.stopAtFirst) break;
      }
    }
    return { pass: results.every((r) => r.pass) && !(opts.forces && Object.keys(opts.forces).length), results, firstFail };
  }

  SC.scenario = { runScenario, runLevel, makeHidden, matchCond, DEFAULT_TOL };
})();

</script>

<script>
/* ==== src/ui/dom.js ==== */
/* Tiny DOM helpers + bilingual text helpers + safe storage. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  SC.ui = SC.ui || {};

  // h('div', {class:'a', onclick:fn, dataset:{x:1}}, child, 'text', [more])
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'dataset') for (const d in v) el.dataset[d] = v[d];
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) c.forEach((x) => add(el, x));
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Arabic text may contain {{English terms}} -> <bdi lang="en">
  function arHtml(s) { return esc(s).replace(/\{\{(.+?)\}\}/g, '<bdi lang="en">$1</bdi>'); }
  function arEl(s, tag) { return h(tag || 'span', { lang: 'ar', dir: 'rtl', html: arHtml(s) }); }
  function enEl(s, tag) { return h(tag || 'span', { lang: 'en', dir: 'ltr' }, s); }

  // storage that never throws
  const store = {
    mem: Object.create(null),
    get(k, def) {
      try { const v = globalThis.localStorage.getItem('scancycle.' + k); return v === null ? (k in store.mem ? store.mem[k] : def) : JSON.parse(v); } catch (e) { return k in store.mem ? store.mem[k] : def; }
    },
    set(k, v) {
      store.mem[k] = v;
      try { globalThis.localStorage.setItem('scancycle.' + k, JSON.stringify(v)); return true; } catch (e) { store.failed = true; return false; }
    },
    failed: false,
  };

  SC.ui.h = h;
  SC.ui.esc = esc;
  SC.ui.arHtml = arHtml;
  SC.ui.arEl = arEl;
  SC.ui.enEl = enEl;
  SC.ui.store = store;
})();

</script>

    { t: 'ADD', group: 'outputs', key: '', en: 'Add', ar: 'جمع {{Add}}', tip: { en: 'When powered, on EVERY scan: OUT := IN1 + IN2. Put an edge contact before it!', ar: 'لما في power، بكل {{scan}}: OUT := IN1 + IN2. حط {{edge}} قبله!' } },

    { t: 'SHL', group: 'outputs', key: '', en: 'Shift left', ar: 'إزاحة يسار', tip: { en: 'When powered: shift the word left by 1, bit 0 := the IN bit.', ar: 'لما في power: إزاحة الـ {{word}} لليسار بمقدار 1، والبت 0 := بت الـ IN.' } },
    { t: 'SHR', group: 'outputs', key: '', en: 'Shift right', ar: 'إزاحة يمين', tip: { en: 'When powered: shift the word right by 1, bit 15 := the IN bit.', ar: 'لما في power: إزاحة الـ {{word}} لليمين بمقدار 1، والبت 15 := بت الـ IN.' } },
    { t: 'TON', group: 'blocks', key: 't', en: 'TON on-delay', ar: 'مؤقّت {{TON}}', tip: { en: 'Q turns on after IN has been on for PT. IN off resets it.', ar: 'الـ Q بيشتغل بعد ما الـ IN يضل شغّال مدة PT. لما الـ IN ينطفي بيرجع للصفر.' } },
    { t: 'TOF', group: 'blocks', key: '', en: 'TOF off-delay', ar: 'مؤقّت {{TOF}}', tip: { en: 'Q follows IN on; after IN drops, Q stays on for PT.', ar: 'الـ Q بيتبع الـ IN؛ بعد ما الـ IN ينطفي، الـ Q بيضل شغّال مدة PT.' } },
    { t: 'TP', group: 'blocks', key: '', en: 'TP pulse', ar: 'مؤقّت {{TP}} نبضة', tip: { en: 'A rising edge on IN gives a pulse of exactly PT. Not retriggerable while running.', ar: 'حافة صاعدة على IN بتعطي نبضة مدتها PT بالضبط. ما بتنعاد وهي شغّالة.' } },
    { t: 'TONR', group: 'blocks', key: '', en: 'TONR retentive', ar: 'مؤقّت {{TONR}} محتفظ', tip: { en: 'Like TON, but the elapsed time is kept when IN drops. R resets it.', ar: 'زي {{TON}} بس بيحتفظ بالوقت لما الـ IN ينطفي. الـ R بيصفّره.' } },
    { t: 'CTU', group: 'blocks', key: 'u', en: 'CTU count up', ar: 'عدّاد {{CTU}}', tip: { en: 'Counts rising edges on CU. Q = CV ≥ PV. R resets.', ar: 'بيعدّ الحواف الصاعدة على CU. الـ Q = CV ≥ PV. الـ R بيصفّر.' } },
    { t: 'CTD', group: 'blocks', key: '', en: 'CTD count down', ar: 'عدّاد {{CTD}}', tip: { en: 'LD loads PV; counts down on rising edges. Q = CV ≤ 0.', ar: 'الـ LD بيحمّل PV؛ بيعدّ تنازليًا. الـ Q = CV ≤ 0.' } },
    { t: 'CTUD', group: 'blocks', key: '', en: 'CTUD up/down', ar: 'عدّاد {{CTUD}}', tip: { en: 'Up on CU edges, down on CD edges.', ar: 'بيزيد على حواف CU وبينقص على حواف CD.' } },
  ];
  const ELMAP = Object.create(null);
  EL.forEach((e) => { ELMAP[e.t] = e; });

  const trunc = (s, n) => { s = String(s === undefined ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const X = (s) => U.esc(s);

  // label shown above the symbol and small text below it
  function labels(el, addrOf) {
    switch (el.t) {
      case 'NO': case 'NC': case 'OUT': case 'SET': case 'RST': case 'POS': case 'NEG':
        return { top: el.a || '?', bottom: el.a ? addrOf(el.a) : '' };
      case 'TON': case 'TOF': case 'TP': case 'TONR': case 'CTU': case 'CTD': case 'CTUD':
        return { top: el.i || '?', bottom: '' };
      default: return { top: '', bottom: '' };
    }
  }

  // inner SVG markup for a cell. `el` null = empty wire cell (only when `wire`)
  function symbolSvg(el, wire) {
    const w = '<path class="w-in" d="M0 40 H%a"/><path class="w-out" d="M%b 40 H84"/>';
    const wires = (a, b) => `<path class="w-in" d="M0 ${WIRE_Y} H${a}"/><path class="w-out" d="M${b} ${WIRE_Y} H${CELL_W}"/>`;
    if (!el) return wire ? `<path class="w-in" d="M0 ${WIRE_Y} H42"/><path class="w-out" d="M42 ${WIRE_Y} H${CELL_W}"/>` : '';
    switch (el.t) {
      case 'NO': return wires(33, 51) + '<path class="sym" d="M33 26 V54 M51 26 V54"/><rect class="sym-fill" x="34.5" y="27" width="15" height="26"/>';
      case 'NC': return wires(33, 51) + '<path class="sym" d="M33 26 V54 M51 26 V54"/><rect class="sym-fill" x="34.5" y="27" width="15" height="26"/><path class="sym" d="M30 55 L54 25"/>';
      case 'POS': case 'NEG': return wires(33, 51) + '<path class="sym" d="M33 26 V54 M51 26 V54"/><rect class="sym-fill" x="34.5" y="27" width="15" height="26"/>' + `<text class="sym-t" x="42" y="45" text-anchor="middle">${el.t === 'POS' ? 'P' : 'N'}</text>`;
      case 'OUT': return wires(30, 54) + '<path class="sym" d="M34 26 Q25 40 34 54 M50 26 Q59 40 50 54"/><ellipse class="sym-fill" cx="42" cy="40" rx="8" ry="12"/>';
      case 'SET': case 'RST': return wires(30, 54) + '<path class="sym" d="M34 26 Q25 40 34 54 M50 26 Q59 40 50 54"/><ellipse class="sym-fill" cx="42" cy="40" rx="8" ry="12"/>' + `<text class="sym-t" x="42" y="45" text-anchor="middle">${el.t === 'SET' ? 'S' : 'R'}</text>`;
      case 'TON': case 'TOF': case 'TP': case 'TONR':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="15" width="72" height="50" rx="3"/>'
          + `<text class="blk-h" x="42" y="29" text-anchor="middle">${el.t}</text>`
          + `<text class="blk-p" x="10" y="43">IN</text><text class="blk-p" x="74" y="43" text-anchor="end">Q</text>`
          + `<text class="blk-p blk-pt" x="42" y="57" text-anchor="middle">PT ${X(trunc(el.pt, 9))}</text>`
          + '<text class="blk-live" x="42" y="12" text-anchor="middle"></text>';
      case 'CTU': case 'CTD': case 'CTUD':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="15" width="72" height="50" rx="3"/>'
          + `<text class="blk-h" x="42" y="29" text-anchor="middle">${el.t}</text>`
          + `<text class="blk-p" x="10" y="43">${el.t === 'CTD' ? 'CD' : 'CU'}</text><text class="blk-p" x="74" y="43" text-anchor="end">Q</text>`
          + `<text class="blk-p blk-pt" x="42" y="57" text-anchor="middle">PV ${X(trunc(el.pv, 6))}${el.rs ? ' R' : el.ld ? ' LD' : ''}</text>`
          + '<text class="blk-live" x="42" y="12" text-anchor="middle"></text>';
      case 'CMP':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="20" width="72" height="42" rx="3"/>'
          + `<text class="blk-p" x="42" y="34" text-anchor="middle">${X(trunc(el.a, 10))}</text>`
          + `<text class="blk-h" x="42" y="47" text-anchor="middle">${X(el.op === '<>' ? '≠' : el.op === '>=' ? '≥' : el.op === '<=' ? '≤' : el.op || '?')}</text>`
          + `<text class="blk-p" x="42" y="59" text-anchor="middle">${X(trunc(el.b, 10))}</text>`;
      case 'MOVE': case 'ADD': case 'SUB':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="15" width="72" height="50" rx="3"/>'
          + `<text class="blk-h" x="42" y="29" text-anchor="middle">${el.t}</text>`
          + (el.t === 'MOVE'
            ? `<text class="blk-p" x="42" y="44" text-anchor="middle">${X(trunc(el.a, 10))}</text><text class="blk-p" x="42" y="58" text-anchor="middle">→ ${X(trunc(el.o, 8))}</text>`
            : `<text class="blk-p" x="42" y="43" text-anchor="middle">${X(trunc(el.a, 5))} ${el.t === 'ADD' ? '+' : '−'} ${X(trunc(el.b, 5))}</text><text class="blk-p" x="42" y="58" text-anchor="middle">→ ${X(trunc(el.o, 8))}</text>`);
      case 'SHL': case 'SHR':
        return wires(6, 78) + '<rect class="sym blk" x="6" y="15" width="72" height="50" rx="3"/>'
          + `<text class="blk-h" x="42" y="29" text-anchor="middle">${el.t}</text>`
          + `<text class="blk-p" x="42" y="44" text-anchor="middle">${X(trunc(el.w, 10))}</text><text class="blk-p" x="42" y="58" text-anchor="middle">in: ${X(trunc(el.b, 7))}</text>`;
    }
    return '';
  }

  // palette icon (smaller, no wire power classes)
  function iconSvg(t) {
    const demo = { NO: { t: 'NO' }, NC: { t: 'NC' }, POS: { t: 'POS' }, NEG: { t: 'NEG' }, OUT: { t: 'OUT' }, SET: { t: 'SET' }, RST: { t: 'RST' } }[t];
    const el = demo || { t, pt: 'T#3s', pv: 5, op: '>=', a: 'A', b: 'B', o: 'O', w: 'W', i: '' };
    return `<svg class="ico" viewBox="0 0 ${CELL_W} ${CELL_H}" width="56" height="45" aria-hidden="true">${symbolSvg(el, false)}</svg>`;
  }

  U.CELL_W = CELL_W; U.CELL_H = CELL_H; U.WIRE_Y = WIRE_Y;
  U.EL = EL; U.ELMAP = ELMAP;
  U.symbolSvg = symbolSvg; U.iconSvg = iconSvg; U.cellLabels = labels;
})();

</script>
<script>
/* ==== src/ui/plantView.js ==== */
/* Canvas 2D side view of the bottling line. Reads sim.P, never changes it. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  SC.ui = SC.ui || {};

  const W = 960, H = 280, X0 = 10, K = 0.5;       // px = X0 + mm * K
  const BELT_Y = 206, BELT_H = 12;               // top of the belt = bottle base
  const BW = 28, BH = 40, NECK_H = 11;           // bottle drawing size (px)
  const px = (x) => X0 + x * K;

  function PlantView(canvas) {
    const ctx = canvas.getContext('2d');
    const stat = document.createElement('canvas');
    const view = { canvas, sim: null, colors: {}, reduced: false, ghosts: [], seen: Object.create(null), lastReject: 0, dpr: 1 };
    const mq = globalThis.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
    view.reduced = !!(mq && mq.matches);

    function cssVar(n, fb) { const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v || fb; }
    view.refreshTheme = function () {
      view.colors = {
        ground: cssVar('--ground', '#E9ECEC'), surface: cssVar('--surface', '#F7F8F8'), ink: cssVar('--ink', '#14262D'),
        muted: cssVar('--muted', '#5E7279'), line: cssVar('--line', '#C6D0D2'), power: cssVar('--power', '#0B6E78'),
        alarm: cssVar('--alarm', '#B3461E'), ok: cssVar('--ok', '#2F6B4C'), amber: cssVar('--amber', '#9A6B12'),
      };
      view.staticDirty = true;
    };
    view.setSim = function (sim) { view.sim = sim; view.ghosts = []; view.seen = Object.create(null); view.staticDirty = true; };

    view.resize = function () {
      const cssW = Math.max(320, canvas.clientWidth || W);
      const dpr = Math.min(3, globalThis.devicePixelRatio || 1);
      view.dpr = dpr;
      view.scale = cssW / W;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssW * (H / W) * dpr);
      stat.width = canvas.width; stat.height = canvas.height;
      view.staticDirty = true;
    };

    // ---------------------------------------------------------------- helpers
    function rr(c, x, y, w, h, r) {
      c.beginPath();
      if (c.roundRect) c.roundRect(x, y, w, h, r);
      else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
    }
    function text(c, s, x, y, size, color, align, weight) {
      c.font = `${weight || 500} ${size}px ui-monospace, Consolas, Menlo, monospace`;
      c.fillStyle = color; c.textAlign = align || 'center'; c.textBaseline = 'alphabetic';
      c.fillText(s, x, y);
    }
    const has = (s) => view.sim.P.cfg.stations.indexOf(s) >= 0;

    // ---------------------------------------------------------------- static layer
    function drawStatic() {
      const c = stat.getContext('2d');
      const k = view.scale * view.dpr;
      c.setTransform(k, 0, 0, k, 0, 0);
      c.clearRect(0, 0, W, H);
      const col = view.colors, P = view.sim.P, cfg = P.cfg, x = cfg.x;
      c.fillStyle = col.surface; c.fillRect(0, 0, W, H);
      // belt
      const bx0 = px(0) - 6, bx1 = px(cfg.convLen) + 6;
      c.fillStyle = col.line; rr(c, bx0, BELT_Y, bx1 - bx0, BELT_H, 5); c.fill();
      c.strokeStyle = col.muted; c.lineWidth = 1.5; rr(c, bx0, BELT_Y, bx1 - bx0, BELT_H, 5); c.stroke();
      c.fillStyle = col.muted;
      for (let lx = bx0 + 30; lx < bx1; lx += 150) c.fillRect(lx, BELT_Y + BELT_H, 5, 22);
      c.fillRect(bx0, BELT_Y + BELT_H + 22, bx1 - bx0, 3);
      // infeed funnel
      if (has('infeed')) {
        c.strokeStyle = col.muted; c.lineWidth = 1.5; c.setLineDash([4, 3]);
        c.beginPath(); c.moveTo(X0 - 4, BELT_Y - 60); c.lineTo(X0 - 4, BELT_Y - 1); c.stroke(); c.setLineDash([]);
        text(c, 'INFEED', px(60), BELT_Y + 40, 10, col.muted);
      }
      // filler head + nozzle housing
      if (has('filler')) {
        const fx = px(x.nozzle);
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, fx - 34, 70, 68, 34, 4); c.fill(); c.stroke();
        c.fillStyle = col.ink; c.fillRect(fx - 4, 104, 8, 22);
        text(c, 'FILLER', fx, 62, 11, col.ink, 'center', 700);
      }
      // capper
      if (has('capper')) {
        const cx = px(x.cap);
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, cx - 30, 70, 60, 34, 4); c.fill(); c.stroke();
        text(c, 'CAPPER', cx, 62, 11, col.ink, 'center', 700);
      }
      if (has('sealer')) {
        const sx = px(x.seal);
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, sx - 30, 80, 60, 24, 12); c.fill(); c.stroke();
        c.beginPath(); c.arc(sx, 92, 6, 0, 6.3); c.stroke();
        text(c, 'SEALER', sx, 72, 11, col.ink, 'center', 700);
      }
      if (has('labeler')) {
        const lx = px(x.label);
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, lx - 30, 70, 60, 34, 4); c.fill(); c.stroke();
        text(c, 'LABELER', lx, 62, 11, col.ink, 'center', 700);
      }
      if (has('reject')) {
        const rx = px(x.reject);
        c.strokeStyle = col.ink; c.lineWidth = 1.5; c.fillStyle = col.surface;
        rr(c, rx - 20, 36, 40, 24, 3); c.fill(); c.stroke();
        text(c, 'REJECT', rx, 28, 11, col.ink, 'center', 700);
        // chute below the belt
        c.setLineDash([3, 3]); c.beginPath(); c.moveTo(rx - 18, BELT_Y + BELT_H + 4); c.lineTo(rx - 26, BELT_Y + BELT_H + 40); c.lineTo(rx + 26, BELT_Y + BELT_H + 40); c.lineTo(rx + 18, BELT_Y + BELT_H + 4); c.stroke(); c.setLineDash([]);
      }
      if (has('exit')) text(c, 'OUTFEED →', px(cfg.convLen) - 40, BELT_Y + 40, 10, col.muted);
      // tank
      if (has('tank')) {
        c.strokeStyle = col.ink; c.lineWidth = 1.5; c.fillStyle = col.surface;
        rr(c, 12, 8, 54, 64, 5); c.fill(); c.stroke();
        text(c, 'TANK', 39, 84, 10, col.muted);
      }
      view.staticDirty = false;
    }

    // ---------------------------------------------------------------- dynamic parts
    function drawBottle(c, cx, b, alpha) {
      const col = view.colors, cfg = view.sim.P.cfg;
      const y0 = BELT_Y;
      c.lineWidth = 1.5;
      // glass
      c.fillStyle = 'rgba(201,139,43,0.14)'; c.strokeStyle = col.ink;
      rr(c, cx - BW / 2, y0 - BH, BW, BH, 5); c.fill();
      // liquid
      const lh = Math.max(0, Math.min(1, b.level / cfg.capacity)) * (BH - 4);
      if (lh > 0.5) { c.fillStyle = '#C98B2B'; rr(c, cx - BW / 2 + 1.5, y0 - 2 - lh, BW - 3, lh, 3); c.fill(); }
      c.strokeStyle = col.ink; rr(c, cx - BW / 2, y0 - BH, BW, BH, 5); c.stroke();
      // neck
      c.fillStyle = 'rgba(201,139,43,0.14)'; c.strokeStyle = col.ink;
      rr(c, cx - 6, y0 - BH - NECK_H, 12, NECK_H + 1, 2); c.fill(); c.stroke();
      if (b.capped) { c.fillStyle = col.power; rr(c, cx - 8, y0 - BH - NECK_H - 6, 16, 7, 2); c.fill(); }
      if (b.sealed) { c.strokeStyle = col.surface; c.lineWidth = 2; c.beginPath(); c.moveTo(cx - 6, y0 - BH - NECK_H + 2); c.lineTo(cx + 6, y0 - BH - NECK_H + 2); c.stroke(); }
      if (b.labeled) { c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1; rr(c, cx - 10, y0 - 28, 20, 16, 2); c.fill(); c.stroke(); c.fillStyle = col.ink; c.fillRect(cx - 7, y0 - 23, 14, 1.5); c.fillRect(cx - 7, y0 - 19, 9, 1.5); }
      if (b.challenge) { c.fillStyle = col.alarm; c.beginPath(); c.moveTo(cx, y0 - BH - NECK_H - 16); c.lineTo(cx - 6, y0 - BH - NECK_H - 6); c.lineTo(cx + 6, y0 - BH - NECK_H - 6); c.closePath(); c.fill(); text(c, 'T', cx, y0 - BH - NECK_H - 19, 9, col.alarm, 'center', 700); }
      if (b.melted) { c.strokeStyle = col.alarm; c.lineWidth = 2; c.setLineDash([3, 2]); rr(c, cx - BW / 2 - 2, y0 - BH - 2, BW + 4, BH + 4, 6); c.stroke(); c.setLineDash([]); }
    }

    function eyeList(P) {
      const x = P.cfg.x, out = [];
      const add = (name, ex, st) => { if (has(st)) out.push({ name, x: ex }); };
      add('PE_Infeed', x.infeed, 'infeed');
      add('PE_Fill', x.fillPE, 'filler');
      add('PE_Cap', x.cap, 'capper');
      add('PE_Reject', x.reject, 'reject');
      add('PE_Exit', x.exit, 'exit');
      add('PE_Backup', x.backup, 'backup');
      return out;
    }

    function trackRejects(P) {
      // bottles that vanish before reaching the end of the line were pushed off by the reject pusher
      const now = Object.create(null);
      for (const b of P.bottles) now[b.id] = b;
      for (const id in view.seen) {
        if (!now[id]) {
          const b = view.seen[id];
          if (b.x < P.cfg.convLen - 5) view.ghosts.push({ b, t0: P.t, x: b.x });
        }
      }
      view.seen = now;
    }

    view.draw = function (alpha) {
      const sim = view.sim;
      if (!sim) return;
      if (view.staticDirty) drawStatic();
      const k = view.scale * view.dpr;
      const c = ctx;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(stat, 0, 0);
      c.setTransform(k, 0, 0, k, 0, 0);
      const col = view.colors, P = sim.P, cfg = P.cfg, x = cfg.x;
      alpha = alpha || 0;
      trackRejects(P);

      // belt chevrons: they move exactly with the conveyor
      c.strokeStyle = col.muted; c.lineWidth = 1;
      const off = (P.counts.dist % 40) * K;
      for (let lx = X0 + off - 20; lx < px(cfg.convLen); lx += 20) {
        if (lx < X0) continue;
        c.beginPath(); c.moveTo(lx, BELT_Y + 3); c.lineTo(lx + 4, BELT_Y + BELT_H / 2); c.lineTo(lx, BELT_Y + BELT_H - 3); c.stroke();
      }

      // photo-eyes (blocked = thick solid beam + filled receiver + "ON"; clear = thin dashed + hollow)
      for (const e of eyeList(P)) {
        const ex = px(e.x), on = !!P.sens[e.name];
        c.strokeStyle = on ? col.alarm : col.muted; c.lineWidth = on ? 3 : 1;
        c.setLineDash(on ? [] : [3, 3]);
        c.beginPath(); c.moveTo(ex, 128); c.lineTo(ex, BELT_Y - 1); c.stroke(); c.setLineDash([]);
        c.fillStyle = col.surface; c.strokeStyle = on ? col.alarm : col.muted; c.lineWidth = 1.5;
        rr(c, ex - 4, 120, 8, 8, 1); c.fill(); c.stroke();
        if (on) { c.fillStyle = col.alarm; rr(c, ex - 4, 120, 8, 8, 1); c.fill(); }
        text(c, e.name.replace('PE_', 'PE ') + (on ? ' ●' : ' ○'), ex, 118 + ((e.name === 'PE_Fill' || e.name === 'PE_Backup') ? -10 : 0), 9, on ? col.alarm : col.muted, 'center', on ? 700 : 500);
      }

      // stopper rod
      if (has('stopper')) {
        const sx = px(x.stopper), y = 100 + P.stopper.pos * 88;
        c.fillStyle = col.surface; c.strokeStyle = col.ink; c.lineWidth = 1.5;
        rr(c, sx - 5, 88, 10, 22, 2); c.fill(); c.stroke();
        c.fillStyle = col.ink; c.fillRect(sx - 2, 108, 4, Math.max(0, y - 108)); c.fillRect(sx - 6, y - 2, 12, 5);
        text(c, P.stopper.pos >= 0.97 ? 'EXT' : P.stopper.pos <= 0.03 ? 'RET' : '…', sx, 84, 9, col.muted);
      }

      // nozzle stream
      const valveOn = P.outs.Fill_Valve && !P.relayOpen || (P.cfg.fillMode === 'piston' && P.outs.Fill_Valve && !P.relayOpen);
      if (has('filler') && valveOn) {
        const fx = px(x.nozzle);
        c.strokeStyle = '#C98B2B'; c.lineWidth = 3; c.beginPath(); c.moveTo(fx, 126); c.lineTo(fx, BELT_Y - 20); c.stroke();
      }
      // piston pump
      if (has('pump')) {
        const fx = px(x.nozzle) - 70;
        c.strokeStyle = col.ink; c.lineWidth = 1.5; c.fillStyle = col.surface;
        rr(c, fx - 12, 70, 24, 56, 3); c.fill(); c.stroke();
        c.fillStyle = col.ink; c.fillRect(fx - 10, 72 + (1 - P.pump.pos) * 40, 20, 5);
        text(c, 'PUMP', fx, 64, 10, col.ink, 'center', 700);
        text(c, P.pump.pos <= 0.02 ? 'HOME' : P.pump.pos >= 0.98 ? 'FULL' : '…', fx, 138, 9, col.muted);
      }
      // reject pusher arm
      if (has('reject')) {
        const rx = px(x.reject), y = 60 + P.pusher.pos * 100;
        c.fillStyle = col.ink; c.fillRect(rx - 3, 60, 6, Math.max(0, y - 60)); c.fillRect(rx - 14, y, 28, 5);
      }
      // capper / sealer / labeler activity flags
      if (has('capper') && P.capper.timer >= 0) { c.fillStyle = col.power; c.fillRect(px(x.cap) - 4, 104, 8, 6 + Math.sin(P.capper.timer / 300 * Math.PI) * 18); }
      if (has('sealer') && P.outs.Sealer_Enable && !P.relayOpen) { c.strokeStyle = col.alarm; c.lineWidth = 2; c.beginPath(); c.arc(px(x.seal), 92, 10, 0, 6.3); c.stroke(); text(c, 'ON', px(x.seal), 120, 9, col.alarm, 'center', 700); }
      if (has('labeler') && P.outs.Labeler_Trig && !P.relayOpen) text(c, 'LABEL', px(x.label), 120, 9, col.power, 'center', 700);

      // tank level
      if (has('tank')) {
        const lh = Math.max(0, Math.min(1, P.tank.pct / 100)) * 52;
        c.fillStyle = '#C98B2B'; c.fillRect(15, 68 - lh, 48, lh);
        c.strokeStyle = col.alarm; c.lineWidth = 1; c.setLineDash([2, 2]);
        const y15 = 68 - 0.15 * 52, y5 = 68 - 0.05 * 52;
        c.beginPath(); c.moveTo(12, y15); c.lineTo(66, y15); c.moveTo(12, y5); c.lineTo(66, y5); c.stroke(); c.setLineDash([]);
        text(c, Math.round(P.tank.pct) + '%', 39, 46, 11, col.ink, 'center', 700);
        if (P.sens.Tank_LSL) text(c, P.sens.Tank_LSLL ? '▲ LSLL' : '▲ LSL', 39, 100, 10, col.alarm, 'center', 700);
      }

      // bottles
      for (const b of P.bottles) {
        const bx = b.x + (b.x - (b.px === undefined ? b.x : b.px)) * alpha;
        drawBottle(c, px(bx), b, alpha);
      }
      // rejected bottles fall off the line
      for (let i = view.ghosts.length - 1; i >= 0; i--) {
        const g = view.ghosts[i], age = P.t - g.t0;
        if (age > 700) { view.ghosts.splice(i, 1); continue; }
        c.save(); c.globalAlpha = 1 - age / 700; c.translate(0, age * 0.12);
        drawBottle(c, px(g.x), g.b, 0); c.restore();
      }

      // stack light + lamps
      const sx = W - 40;
      const lamp = (yy, on, letter, color) => {
        c.fillStyle = on ? color : col.surface; c.strokeStyle = color; c.lineWidth = 2;
        c.beginPath(); c.arc(sx, yy, 10, 0, 6.3); c.fill(); c.stroke();
        text(c, letter, sx, yy + 3.5, 11, on ? col.surface : color, 'center', 700);
      };
      lamp(26, P.outs.Stack_Red, 'R', col.alarm); lamp(52, P.outs.Stack_Amber, 'A', col.amber); lamp(78, P.outs.Stack_Green, 'G', col.ok);
      const lx = W - 92;
      if (P.outs.Alarm_Lamp) { c.fillStyle = col.alarm; c.beginPath(); c.moveTo(lx, 16); c.lineTo(lx - 10, 34); c.lineTo(lx + 10, 34); c.closePath(); c.fill(); text(c, '!', lx, 32, 12, col.surface, 'center', 700); }
      if (P.outs.Horn) text(c, 'HORN', lx, 52, 10, col.alarm, 'center', 700);
      if (P.outs.Batch_Lamp) text(c, 'BATCH ✓', lx, 70, 10, col.ok, 'center', 700);
      if (P.outs.CIP_Done) text(c, 'CIP ✓', lx, 84, 10, col.ok, 'center', 700);

      // hardwired safety relay lamp
      if (P.relayOpen) {
        c.fillStyle = col.alarm; rr(c, W / 2 - 150, 6, 300, 22, 4); c.fill();
        text(c, '⚠ SAFETY RELAY OPEN — power cut (hardwired)', W / 2, 21, 12, col.surface, 'center', 700);
      } else {
        text(c, 'safety relay: closed', 96, 272, 10, col.muted, 'left');
      }
      // line label
      text(c, 't = ' + (sim.t / 1000).toFixed(2) + ' s', W - 10, 272, 10, col.muted, 'right');
    };

    view.refreshTheme();
    view.resize();
    if (globalThis.ResizeObserver) new ResizeObserver(() => view.resize()).observe(canvas);
    return view;
  }

  SC.ui.PlantView = PlantView;
})();

</script>
<script>
/* ==== src/ui/palette.js ==== */
/* Palette popover, parameter dialogs and tag helpers for the ladder editor. */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const A = SC.addr;

  // ---------------------------------------------------------------- modal
  function modal(title, body, buttons, opts) {
    opts = opts || {};
    const back = h('div', { class: 'modal-back' });
    const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
    const close = (v) => { back.remove(); document.removeEventListener('keydown', onKey, true); if (opts.onClose) opts.onClose(v); };
    function onKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); close(null); }
      if (e.key === 'Enter' && opts.enterSubmits !== false && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); if (opts.onEnter) opts.onEnter(); }
    }
    box.append(h('h3', { class: 'modal-t' }, title), body, h('div', { class: 'modal-btns' }, buttons(close)));
    back.append(box);
    back.addEventListener('pointerdown', (e) => { if (e.target === back) close(null); });
    document.addEventListener('keydown', onKey, true);
    document.body.append(back);
    const first = box.querySelector('input,select,button.primary');
    if (first) setTimeout(() => first.focus(), 0);
    return { close, box };
  }
  U.modal = modal;

  // ---------------------------------------------------------------- tags
  function allTags(ctx) { return ctx.tags(); }
  function tagKind(t) { const a = A.parseAddr(t.addr); return a ? a.kind : null; }

  // Resolve text typed into a tag field. kind: 'bit' | 'bitw' | 'edge' | 'int' | 'intw' | 'intval'
  // returns {ok, value, created?, error?}
  function resolveTag(text, kind, ctx) {
    text = String(text === undefined ? '' : text).trim();
    if (!text) return { ok: false, error: { en: 'Required', ar: 'مطلوب' } };
    const want = kind === 'bit' || kind === 'bitw' || kind === 'edge' ? 'bit' : 'word';
    const write = kind === 'bitw' || kind === 'edge' || kind === 'intw';
    if (kind === 'intval' && /^-?\d+$/.test(text)) return { ok: true, value: text };
    if (kind === 'intval' && /^T#/i.test(text)) return A.parseTime(text) !== null ? { ok: true, value: text } : { ok: false, error: { en: 'Not a valid time literal', ar: 'قيمة وقت غير صالحة' } };
    const tags = allTags(ctx);
    const tm = A.makeTagMap(tags);
    let a = null, tag = tm.byName[text];
    if (tag) a = A.parseAddr(tag.addr);
    else a = A.parseAddr(text);
    if (a) {
      if (a.kind !== want) return { ok: false, error: want === 'bit' ? { en: 'This is not a bit (Bool) tag', ar: 'هاد مش tag من نوع Bool' } : { en: 'This is not an Int (word) tag', ar: 'هاد مش tag من نوع Int' } };
      if (write && (a.arr === 'I' || a.arr === 'IW')) return { ok: false, error: { en: 'Inputs cannot be written', ar: 'ما بصير نكتب على مدخل' } };
      if (kind === 'edge' && a.arr !== 'M') return { ok: false, error: { en: 'Edge memory must be an M bit', ar: 'ذاكرة الـ edge لازم تكون بت M' } };
      return { ok: true, value: text };
    }
    const m = /^([A-Za-z_]\w*)\.(Q|QU|QD|ET|CV|PT)$/.exec(text);
    if (m && ctx.insts().indexOf(m[1]) >= 0) {
      if (write) return { ok: false, error: { en: 'Block outputs cannot be written', ar: 'مخارج البلوكات ما بتنكتب' } };
      if (want === 'bit' && /^Q/.test(m[2])) return { ok: true, value: text };
      if (want === 'word' && !/^Q/.test(m[2])) return { ok: true, value: text };
      return { ok: false, error: { en: 'Wrong type for this field', ar: 'نوع غير مناسب لهالحقل' } };
    }
    if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(text)) {
      if (A.parseAddr(text)) return { ok: false, error: { en: 'Bad name', ar: 'اسم غير صالح' } };
      const addr = A.nextFreeAddr(tags, want);
      if (!addr) return { ok: false, error: { en: 'No free memory addresses left', ar: 'ما ضل عناوين ذاكرة فاضية' } };
      return { ok: true, value: text, created: { name: text, addr, type: want === 'bit' ? 'Bool' : 'Int', user: true, src: 'mem', desc: { en: '', ar: '' } } };
    }
    return { ok: false, error: { en: 'Use letters, digits and _ (start with a letter)', ar: 'استخدم حروف وأرقام و _ (وابدأ بحرف)' } };
  }

  function describeTag(text, ctx) {
    const t = A.makeTagMap(allTags(ctx)).byName[String(text).trim()];
    if (!t) return null;
    const d = t.desc || {};
    return { name: t.name, addr: U.useCodesys ? A.toCodesys(t.addr) : t.addr, type: t.type, en: d.en || '', ar: d.ar || '', wiring: t.wiring };
  }

  // ---------------------------------------------------------------- field definitions
  const LAB = {
    a: { en: 'Tag', ar: 'الـ {{Tag}}' }, inst: { en: 'Instance name', ar: 'اسم الـ {{instance}}' },
    pt: { en: 'PT (preset time)', ar: 'PT (الوقت المحدد)' }, pv: { en: 'PV (preset value)', ar: 'PV (القيمة المحددة)' },
    rs: { en: 'R (reset) — optional', ar: 'R (تصفير) — اختياري' }, ld: { en: 'LD (load) — optional', ar: 'LD (تحميل) — اختياري' },
    cd: { en: 'CD (count down) — optional', ar: 'CD (عدّ تنازلي) — اختياري' },
    op: { en: 'Operator', ar: 'العملية' }, a1: { en: 'IN1', ar: 'IN1' }, b1: { en: 'IN2', ar: 'IN2' },
    inp: { en: 'IN', ar: 'IN' }, out: { en: 'OUT', ar: 'OUT' }, w: { en: 'Word (Int tag)', ar: 'الـ {{Word}} (Int tag)' }, bit: { en: 'Bit shifted in', ar: 'البت الداخل' },
    edge: { en: 'Edge memory (own M bit)', ar: 'ذاكرة الـ {{edge}} (بت M خاص)' },
  };

  function fieldsFor(t) {
    switch (t) {
      case 'NO': case 'NC': return [{ k: 'a', kind: 'bit', lab: LAB.a }];
      case 'OUT': case 'SET': case 'RST': return [{ k: 'a', kind: 'bitw', lab: LAB.a }];
      case 'POS': case 'NEG': return [{ k: 'a', kind: 'edge', lab: LAB.edge }];
      case 'TON': case 'TOF': case 'TP': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pt', kind: 'time', lab: LAB.pt }];
      case 'TONR': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pt', kind: 'time', lab: LAB.pt }, { k: 'rs', kind: 'bit?', lab: LAB.rs }];
      case 'CTU': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pv', kind: 'intval', lab: LAB.pv }, { k: 'rs', kind: 'bit?', lab: LAB.rs }];
      case 'CTD': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pv', kind: 'intval', lab: LAB.pv }, { k: 'ld', kind: 'bit?', lab: LAB.ld }];
      case 'CTUD': return [{ k: 'i', kind: 'inst', lab: LAB.inst }, { k: 'pv', kind: 'intval', lab: LAB.pv }, { k: 'cd', kind: 'bit?', lab: LAB.cd }, { k: 'rs', kind: 'bit?', lab: LAB.rs }, { k: 'ld', kind: 'bit?', lab: LAB.ld }];
      case 'CMP': return [{ k: 'a', kind: 'intval', lab: LAB.a1 }, { k: 'op', kind: 'op', lab: LAB.op }, { k: 'b', kind: 'intval', lab: LAB.b1 }];
      case 'MOVE': return [{ k: 'a', kind: 'intval', lab: LAB.inp }, { k: 'o', kind: 'intw', lab: LAB.out }];
      case 'ADD': case 'SUB': return [{ k: 'a', kind: 'intval', lab: LAB.a1 }, { k: 'b', kind: 'intval', lab: LAB.b1 }, { k: 'o', kind: 'intw', lab: LAB.out }];
      case 'SHL': case 'SHR': return [{ k: 'w', kind: 'intw', lab: LAB.w }, { k: 'b', kind: 'bit', lab: LAB.bit }];
    }
    return [];
  }

  function suggestInst(t, ctx) {
    const used = ctx.insts();
    for (let n = 1; n < 99; n++) { const nm = `DB_${t}_${n}`; if (used.indexOf(nm) < 0) return nm; }
    return `DB_${t}`;
  }
  function suggestEdge(ctx) {
    const names = allTags(ctx).map((x) => x.name);
    for (let n = 1; n < 99; n++) if (names.indexOf('Edge_' + n) < 0) return 'Edge_' + n;
    return 'Edge';
  }

  // normalise a time typed by the player; returns {value} or {ask:true} / {error}
  function normTime(txt) {
    txt = String(txt).trim();
    if (/^T#/i.test(txt)) return A.parseTime(txt) !== null ? { value: 'T#' + txt.slice(2).toLowerCase() } : { error: { en: 'Not a valid time. Example: T#3s or T#500ms', ar: 'وقت غير صالح. مثال: T#3s أو T#500ms' } };
    if (/^\d+(\.\d+)?\s*(ms|s|m|h)$/i.test(txt)) return { value: 'T#' + txt.replace(/\s+/g, '').toLowerCase(), fixed: true };
    if (/^\d+(\.\d+)?$/.test(txt)) return { ask: txt };
    return { error: { en: 'Not a valid time. Example: T#3s or T#500ms', ar: 'وقت غير صالح. مثال: T#3s أو T#500ms' } };
  }

  // ---------------------------------------------------------------- parameter dialog
  // existing: element object or null.  done(el, createdTags[]) is called on OK.
  function openParams(ctx, type, existing, done) {
    const meta = U.ELMAP[type];
    const fields = fieldsFor(type);
    const inputs = {}, errs = {}, hints = {};
    const lang = U.lang;
    const dlBit = 'dl-bit', dlInt = 'dl-int';
    document.querySelectorAll('#' + dlBit + ',#' + dlInt).forEach((n) => n.remove());
    const tags = allTags(ctx);
    const insts = ctx.instDefs();
    const dl1 = h('datalist', { id: dlBit }), dl2 = h('datalist', { id: dlInt });
    for (const t of tags) {
      const k = tagKind(t);
      (k === 'bit' ? dl1 : dl2).append(h('option', { value: t.name }, t.addr));
    }
    for (const nm in insts) { dl1.append(h('option', { value: nm + '.Q' })); dl2.append(h('option', { value: nm + '.ET' }), h('option', { value: nm + '.CV' })); }
    const body = h('div', { class: 'form' }, dl1, dl2,
      h('p', { class: 'muted small' }, lang === 'ar' ? U.arEl(meta.tip.ar) : U.enEl(meta.tip.en)));
    fields.forEach((f) => {
      let inp;
      const init = existing && existing[f.k] !== undefined ? String(existing[f.k]) : '';
      if (f.kind === 'op') {
        inp = h('select', { id: 'f-' + f.k }, ['>=', '>', '==', '<>', '<', '<='].map((o) => h('option', { value: o, selected: (existing ? existing.op : '>=') === o }, o)));
      } else {
        let val = init;
        if (!existing) {
          if (f.kind === 'inst') val = suggestInst(type, ctx);
          else if (f.kind === 'edge') val = suggestEdge(ctx);
          else if (f.kind === 'time') val = 'T#3s';
          else if (f.k === 'pv') val = '5';
        }
        inp = h('input', { id: 'f-' + f.k, type: 'text', value: val, autocomplete: 'off', spellcheck: 'false', list: f.kind === 'bit' || f.kind === 'bitw' || f.kind === 'bit?' || f.kind === 'edge' ? dlBit : (f.kind === 'intval' || f.kind === 'intw') ? dlInt : null, placeholder: f.kind === 'time' ? 'T#3s' : '' });
      }
      inputs[f.k] = inp;
      errs[f.k] = h('div', { class: 'err small', role: 'alert' });
      hints[f.k] = h('div', { class: 'muted small' });
      const upd = () => {
        if (f.kind === 'op' || f.kind === 'inst' || f.kind === 'time') return;
        const d = describeTag(inp.value, ctx);
        hints[f.k].textContent = d ? `${d.addr} · ${d.type}${d.wiring ? ' · wired ' + d.wiring : ''}${d.en ? ' — ' + d.en : ''}` : '';
      };
      inp.addEventListener('input', upd); upd();
      const row = h('label', { class: 'frow', for: 'f-' + f.k },
        h('span', { class: 'flab' }, lang === 'ar' ? U.arEl(f.lab.ar) : U.enEl(f.lab.en)), inp, hints[f.k], errs[f.k]);
      if (f.kind === 'time') {
        const chips = h('div', { class: 'chips' }, ['T#500ms', 'T#1s', 'T#2s', 'T#3s', 'T#5s', 'T#10s'].map((c) => h('button', { type: 'button', class: 'chip', onclick: () => { inp.value = c; } }, c)));
        row.append(chips);
      }
      body.append(row);
    });
    const askBox = h('div', { class: 'ask', hidden: true });
    body.append(askBox);

    let dlg;
    function submit() {
      Object.values(errs).forEach((e) => { e.textContent = ''; });
      const el = { t: type };
      const created = [];
      let bad = false;
      const setErr = (k, e) => { errs[k].textContent = lang === 'ar' ? e.ar : e.en; bad = true; };
      // work on a ctx that remembers tags created while resolving
      const tmp = { tags: () => ctx.tags().concat(created), insts: ctx.insts };
      for (const f of fields) {
        const raw = inputs[f.k].value;
        if (f.kind === 'op') { el.op = raw; continue; }
        if (f.kind === 'inst') {
          const nm = raw.trim();
          if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(nm)) { setErr(f.k, { en: 'Use letters, digits and _', ar: 'استخدم حروف وأرقام و _' }); continue; }
          const def = insts[nm];
          if (def && def.type !== type && !(existing && existing.i === nm)) { setErr(f.k, { en: `${nm} is already a ${def.type}`, ar: `${nm} مستخدم كـ ${def.type}` }); continue; }
          el.i = nm; continue;
        }
        if (f.kind === 'time') {
          const r = normTime(raw);
          if (r.error) { setErr(f.k, r.error); continue; }
          if (r.ask) {
            askBox.hidden = false; askBox.innerHTML = '';
            askBox.append(h('p', null, lang === 'ar' ? U.arEl(`"${r.ask}" — ثواني ولا ميلي ثانية؟`) : U.enEl(`"${r.ask}" — seconds or milliseconds?`)),
              h('button', { type: 'button', class: 'btn', onclick: () => { inputs[f.k].value = `T#${r.ask}s`; askBox.hidden = true; } }, `T#${r.ask}s`),
              h('button', { type: 'button', class: 'btn', onclick: () => { inputs[f.k].value = `T#${r.ask}ms`; askBox.hidden = true; } }, `T#${r.ask}ms`));
            bad = true; continue;
          }
          el.pt = r.value;
          if (r.fixed) inputs[f.k].value = r.value;
          continue;
        }
        if (f.kind === 'bit?') {
          if (!raw.trim()) continue;
          const r = resolveTag(raw, 'bit', tmp);
          if (!r.ok) { setErr(f.k, r.error); continue; }
          if (r.created) created.push(r.created);
          el[f.k] = r.value; continue;
        }
        const r = resolveTag(raw, f.kind === 'intval' ? 'intval' : f.kind, tmp);
        if (!r.ok && f.kind === 'intval') {
          const r2 = resolveTag(raw, 'int', tmp);
          if (!r2.ok) { setErr(f.k, r2.error); continue; }
          if (r2.created) created.push(r2.created);
          el[f.k] = r2.value; continue;
        }
        if (!r.ok) { setErr(f.k, r.error); continue; }
        if (r.created) created.push(r.created);
        el[f.k] = f.kind === 'intval' && /^-?\d+$/.test(r.value) && (f.k === 'pv' || type === 'CMP' || type === 'MOVE' || type === 'ADD' || type === 'SUB') ? parseInt(r.value, 10) : r.value;
      }
      if (bad) return;
      dlg.close('ok');
      done(el, created);
    }
    dlg = modal((existing ? (lang === 'ar' ? 'تعديل ' : 'Edit ') : '') + (lang === 'ar' ? meta.en : meta.en), body,
      (close) => [h('button', { type: 'button', class: 'btn', onclick: () => close(null) }, lang === 'ar' ? 'إلغاء' : 'Cancel'),
        h('button', { type: 'button', class: 'btn primary', onclick: submit }, 'OK')],
      { onEnter: submit });
    return dlg;
  }

  // ---------------------------------------------------------------- palette popover
  const GROUPS = [
    { id: 'contacts', en: 'Contacts', ar: 'ملامسات' },
    { id: 'outputs', en: 'Outputs & math', ar: 'مخارج وحساب' },
    { id: 'blocks', en: 'Timers & counters', ar: 'مؤقتات وعدّادات' },
  ];

  // actions: {pick(type), edit(), del(), branch(), barLeft(), barRight(), canEdit, hasEl}
  function openPalette(anchor, ctx, info, actions) {
    closePalette();
    const lang = U.lang;
    const allowed = ctx.palette();
    const pop = h('div', { class: 'pal', role: 'dialog', 'aria-label': lang === 'ar' ? 'اختر تعليمة' : 'Choose an instruction' });
    const done = (fn) => (e) => { closePalette(); fn(e); };
    pop.append(h('div', { class: 'pal-head' }, h('span', { class: 'small muted' }, `Rung ${info.ri + 1} · row ${info.r + 1} · col ${info.c + 1}`),
      h('button', { class: 'btn small ghost', type: 'button', 'aria-label': 'Close', onclick: () => closePalette(true) }, '✕')));
    if (info.hasEl) {
      pop.append(h('div', { class: 'pal-actions' },
        h('button', { class: 'btn small', type: 'button', onclick: done(actions.edit) }, '✎ ' + (lang === 'ar' ? 'تعديل' : 'Edit')),
        h('button', { class: 'btn small', type: 'button', onclick: done(actions.del) }, '🗑 ' + (lang === 'ar' ? 'حذف' : 'Delete'))));
    }
    for (const g of GROUPS) {
      const items = U.EL.filter((e) => e.group === g.id && (!allowed || allowed.indexOf(e.t) >= 0));
      if (!items.length) continue;
      pop.append(h('h5', null, lang === 'ar' ? g.ar : g.en),
        h('div', { class: 'pal-grid' }, items.map((e) => h('button', { type: 'button', class: 'pal-btn', title: (lang === 'ar' ? e.tip.ar.replace(/\{\{|\}\}/g, '') : e.tip.en) + (e.key ? ` [${e.key.toUpperCase()}]` : ''), 'aria-label': e.en,
          html: U.iconSvg(e.t) + `<span>${U.esc(e.t)}${e.key ? ` <kbd>${U.esc(e.key.toUpperCase())}</kbd>` : ''}</span>`, onclick: done(() => actions.pick(e.t)) }))));
    }
    if (!allowed || allowed.indexOf('BRANCH') >= 0) {
      pop.append(h('h5', null, lang === 'ar' ? 'فروع متوازية' : 'Parallel branch'),
        h('div', { class: 'pal-actions' },
          h('button', { class: 'btn small', type: 'button', title: 'Open a branch below this cell (OR)', onclick: done(actions.branch) }, '⎇ ' + (lang === 'ar' ? 'فرع حول الخلية' : 'Branch around cell')),
          h('button', { class: 'btn small', type: 'button', onclick: done(actions.barLeft) }, '┃← ' + (lang === 'ar' ? 'خط عمودي يسار' : 'Bar left')),
          h('button', { class: 'btn small', type: 'button', onclick: done(actions.barRight) }, '→┃ ' + (lang === 'ar' ? 'خط عمودي يمين' : 'Bar right'))));
    }
    document.body.append(pop);
    // position
    const r = anchor.getBoundingClientRect();
    const narrow = window.innerWidth < 700;
    if (narrow) { pop.classList.add('sheet'); }
    else {
      const w = pop.offsetWidth, hh = pop.offsetHeight;
      let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
      let top = r.bottom + 6;
      if (top + hh > window.innerHeight - 8) top = Math.max(8, r.top - hh - 6);
      pop.style.left = left + window.scrollX + 'px'; pop.style.top = top + window.scrollY + 'px';
    }
    U._pal = { pop, anchor, onClose: info.onClose };
    const first = pop.querySelector('.pal-btn');
    if (first) first.focus();
    setTimeout(() => { document.addEventListener('pointerdown', outside, true); document.addEventListener('keydown', escKey, true); }, 0);
    function outside(e) { if (!pop.contains(e.target)) closePalette(true); }
    function escKey(e) { if (e.key === 'Escape') { e.stopPropagation(); closePalette(true); } }
    pop._cleanup = () => { document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', escKey, true); };
  }

  function closePalette(refocus) {
    const p = U._pal;
    if (!p) return;
    p.pop._cleanup && p.pop._cleanup();
    p.pop.remove();
    U._pal = null;
    if (refocus && p.anchor && p.anchor.focus) p.anchor.focus();
  }

  U.openPalette = openPalette;
  U.closePalette = closePalette;
  U.openParams = openParams;
  U.resolveTag = resolveTag;
  U.normTime = normTime;
  U.describeTag = describeTag;
})();

</script>
<script>
/* ==== src/ui/grid.js ==== */
/* Ladder editor: grid of focusable cells, parallel branches, undo/redo, power-flow display in run mode.
 *
 * Program JSON (see core/dsl.js):  rung = {rows, cols, els:[{r,c,t,...}], vb:[[boundary,gap],...], note}
 * A vertical bar [b, g] sits on column boundary b between rows g and g+1.
 */
(function () {
  'use strict';
  const SC = globalThis.SC;
  const U = SC.ui;
  const h = U.h;
  const W = 84, H = 68, RAIL = 12, MAXR = 4, MINC = 8, MAXC = 16;

  const tr = (en, ar) => (U.lang === 'ar' ? ar : en);

  U.toast = U.toast || function (msg) {
    let t = document.getElementById('toast');
    if (!t) { t = h('div', { id: 'toast', class: 'toast', role: 'status', 'aria-live': 'polite' }); document.body.append(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(U._toastT); U._toastT = setTimeout(() => t.classList.remove('show'), 2600);
  };

  function normRung(rg) {
    let maxR = 0, maxC = 0;
    for (const e of rg.els) { maxR = Math.max(maxR, e.r); maxC = Math.max(maxC, e.c); }
    for (const b of rg.vb) maxR = Math.max(maxR, b[1] + 1);
    rg.rows = Math.max(1, Math.min(MAXR, maxR + 1));
    rg.cols = Math.max(MINC, Math.min(MAXC, maxC + 2));
    const seen = new Set();
    rg.vb = rg.vb.filter((b) => { const k = b[0] + ',' + b[1]; if (seen.has(k) || b[0] > rg.cols || b[1] > rg.rows - 2) return false; seen.add(k); return true; });
    rg.els.sort((a, b) => a.c - b.c || a.r - b.r);
    return rg;
  }
  const emptyRung = () => normRung({ rows: 1, cols: MINC, els: [], vb: [] });
  const findEl = (rg, r, c) => rg.els.find((e) => e.r === r && e.c === c) || null;

  function Ladder(container, host) {
    const ed = { program: SC.util.clone(host.program), userTags: SC.util.clone(host.userTags || []), undo: [], redo: [], sel: { ri: 0, r: 0, c: 0 }, refs: [], drag: null, lastPaint: [] };
    if (!ed.program.rungs.length) ed.program.rungs.push(emptyRung());
    ed.program.rungs.forEach(normRung);

    // ------------------------------------------------------------ context for dialogs
    const ctx = {
      tags: () => host.baseTags().concat(ed.userTags),
      instDefs: () => {
        const o = {};
        ed.program.rungs.forEach((rg) => rg.els.forEach((e) => { if (e.i && !o[e.i]) o[e.i] = { type: e.t }; }));
        return o;
      },
      insts: () => Object.keys(ctx.instDefs()),
      palette: () => host.palette(),
    };
    ed.ctx = ctx;
    const addrOf = (name) => {
      const t = ctx.tags().find((x) => x.name === name);
      const a = t ? t.addr : name;
      return U.useCodesys ? SC.addr.toCodesys(a) : a;
    };

    // ------------------------------------------------------------ history
    const snap = () => JSON.stringify({ p: ed.program, u: ed.userTags });
    function commit(prevSnap) {
      ed.undo.push(prevSnap);
      if (ed.undo.length > 100) ed.undo.shift();
      ed.redo = [];
      ed.program.rungs.forEach(normRung);
      afterChange();
    }
    function restore(s) {
      const o = JSON.parse(s);
      ed.program = o.p; ed.userTags = o.u;
      ed.sel.ri = Math.min(ed.sel.ri, ed.program.rungs.length - 1);
      afterChange();
    }
    ed.doUndo = () => { if (!ed.undo.length) return; ed.redo.push(snap()); restore(ed.undo.pop()); };
    ed.doRedo = () => { if (!ed.redo.length) return; ed.undo.push(snap()); restore(ed.redo.pop()); };
    function afterChange() {
      render();
      host.setProgram(ed.program, ed.userTags);
      focusSel();
    }
    ed.setProgram = (p, u) => {
      ed.program = SC.util.clone(p); ed.userTags = SC.util.clone(u || ed.userTags);
